<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字幕转换 - Subtitle2HTML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #667eea;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .file-input {
            display: none;
        }

        .selected-file {
            margin-top: 15px;
            padding: 10px;
            background: #f0f2ff;
            border-radius: 6px;
            color: #667eea;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-convert {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-convert:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-convert:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #f0f2ff;
            color: #667eea;
        }

        .btn-reset:hover {
            background: #e8ebff;
        }

        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-title {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .result-link {
            background: #f0f2ff;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .result-link a {
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
            flex: 1;
        }

        .result-link a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .copy-btn.copied {
            background: #48bb78;
        }

        .message {
            padding: 12px 16px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 15px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .features {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .features h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .features ul {
            list-style: none;
            font-size: 13px;
            color: #666;
            line-height: 1.8;
        }

        .features li:before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 字幕转换</h1>
        <p class="subtitle">上传字幕文件，自动生成在线HTML网页</p>

        <div class="features">
            <h3>支持的格式</h3>
            <ul>
                <li>SRT 格式 (.srt)</li>
                <li>VTT 格式 (.vtt)</li>
                <li>ASS/SSA 格式 (.ass, .ssa)</li>
            </ul>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📂</div>
                <div class="upload-text">点击选择或拖入字幕文件</div>
                <div class="upload-hint">支持 .srt, .vtt, .ass, .ssa 格式</div>
            </div>
            <div class="selected-file" id="selectedFile" style="display:none;"></div>
            <input type="file" id="fileInput" class="file-input" accept=".srt,.vtt,.ass,.ssa">
        </div>

        <div class="button-group">
            <button class="btn-convert" id="convertBtn" disabled>转换为HTML</button>
            <button class="btn-reset" id="resetBtn">重置</button>
        </div>

        <div class="loading" id="loading">
            <span class="spinner"></span>正在处理...
        </div>

        <div class="message" id="message"></div>

        <div class="result-section" id="resultSection">
            <div class="result-title">✨ 转换成功</div>
            <div class="result-link">
                <a href="" target="_blank" id="resultLink">打开网页</a>
                <button class="copy-btn" id="copyBtn">复制链接</button>
            </div>
        </div>
    </div>

    <script src="js/parser.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
