const S=[{"s": 0.0, "e": 5.0, "t": "(text softly clacking) (suspenseful music)"}, {"s": 7.43, "e": 11.08, "t": "(suspenseful music drowns out speaker)"}, {"s": 11.08, "e": 16.08, "t": "(bushes rustling) (videographer breathing)"}, {"s": 17.19, "e": 19.84, "t": "- [Gregor] They're just everywhere."}, {"s": 19.84, "e": 22.14, "t": "Whoa, this is really blue."}, {"s": 22.14, "e": 24.24, "t": "You should come look, this is so blue."}, {"s": 24.24, "e": 26.97, "t": "- [Researcher] Look at how many you're finding."}, {"s": 26.97, "e": 30.17, "t": "- [Gregor] I feel like Gollum, my precious!"}, {"s": 30.17, "e": 31.65, "t": "if it weren't so dangerous,"}, {"s": 31.65, "e": 33.42, "t": "it'd be a fun activity to do."}, {"s": 33.42, "e": 35.07, "t": "- [Researcher] These are the big chunks,"}, {"s": 35.07, "e": 38.19, "t": "so what about all the particles you can't see?"}, {"s": 38.19, "e": 39.63, "t": "- This same kind of material"}, {"s": 39.63, "e": 40.92, "t": "was used in the construction"}, {"s": 40.92, "e": 42.72, "t": "of the World Trade Center buildings."}, {"s": 42.72, "e": 44.19, "t": "And when the towers fell,"}, {"s": 44.19, "e": 46.17, "t": "it was pulverized to microscopic size"}, {"s": 46.17, "e": 47.76, "t": "and released into the air."}, {"s": 48.96, "e": 50.94, "t": "The particles remained airborne for days"}, {"s": 50.94, "e": 54.03, "t": "and thousands of people unknowingly breathed them in."}, {"s": 54.03, "e": 56.94, "t": "They buried themselves deep within people's lungs,"}, {"s": 56.94, "e": 59.85, "t": "wreaking havoc and causing all sorts of diseases."}, {"s": 61.41, "e": 62.49, "t": "We've known for decades"}, {"s": 62.49, "e": 64.98, "t": "that these particles are extremely dangerous,"}, {"s": 64.98, "e": 67.35, "t": "but when the towers fell, no one was warned."}, {"s": 69.42, "e": 71.34, "t": "- The concentrations are such"}, {"s": 71.34, "e": 73.56, "t": "that they don't pose a health hazard."}, {"s": 74.67, "e": 77.28, "t": "- [Gregor] And yet today the diseases linked to that dust"}, {"s": 77.28, "e": 79.38, "t": "have killed more than twice as many people"}, {"s": 79.38, "e": 80.82, "t": "as the attacks themselves."}, {"s": 81.84, "e": 83.07, "t": "Once we started looking,"}, {"s": 84.75, "e": 88.62, "t": "we kept finding this material in places we never expected."}, {"s": 88.62, "e": 89.92, "t": "- He was telling the newspapers,"}, {"s": 89.92, "e": 91.11, "t": "\"People aren't just eating it"}, {"s": 91.11, "e": 92.85, "t": "and breathing it, they're mainlining it.\""}, {"s": 92.85, "e": 95.4, "t": "- [Gregor] In popular off-roading spots, in makeup,"}, {"s": 95.4, "e": 97.38, "t": "and even kids toys."}, {"s": 97.38, "e": 99.63, "t": "- [Sean] Say It Ain't So Mickey Mouse crayons."}, {"s": 99.63, "e": 100.86, "t": "- No!"}, {"s": 100.86, "e": 102.45, "t": "It's been detected in the dust"}, {"s": 102.45, "e": 104.07, "t": "around schools and homes."}, {"s": 104.07, "e": 106.29, "t": "- Five generations of people died up there."}, {"s": 106.29, "e": 108.27, "t": "- [Gregor] And instead of banning it outright,"}, {"s": 108.27, "e": 110.11, "t": "we let it spread."}, {"s": 110.11, "e": 112.8, "t": "(camera shutter clicking)"}, {"s": 112.8, "e": 115.56, "t": "Some countries are still importing hundreds of thousands"}, {"s": 115.56, "e": 116.39, "t": "of tons each year,"}, {"s": 116.39, "e": 118.44, "t": "and it's estimated that by 2035,"}, {"s": 118.44, "e": 121.87, "t": "nearly 2.8 million people might die because of it."}, {"s": 121.87, "e": 124.62, "t": "(dramatic music)"}, {"s": 126.36, "e": 128.97, "t": "This is a video about a deadly miracle material"}, {"s": 128.97, "e": 130.71, "t": "we can't stop using."}, {"s": 131.91, "e": 133.23, "t": "This investigation is based"}, {"s": 133.23, "e": 135.48, "t": "on publicly available documents, recordings,"}, {"s": 135.48, "e": 136.95, "t": "and third party sources."}, {"s": 136.95, "e": 138.81, "t": "All of our links are in the description."}, {"s": 138.81, "e": 141.24, "t": "Thank you to Ground News for sponsoring this video."}, {"s": 141.24, "e": 142.44, "t": "More about them later."}, {"s": 144.87, "e": 146.73, "t": "There is this story about the ancient Greeks"}, {"s": 146.73, "e": 149.13, "t": "from around the second century AD."}, {"s": 149.13, "e": 150.99, "t": "They had this golden lantern"}, {"s": 150.99, "e": 154.05, "t": "that would burn for a whole year without going out,"}, {"s": 154.05, "e": 155.76, "t": "all because of a very special wick"}, {"s": 155.76, "e": 157.68, "t": "that just wouldn't burn down."}, {"s": 157.68, "e": 160.8, "t": "So how did they develop this technology?"}, {"s": 160.8, "e": 164.19, "t": "Well, the truth is they didn't, they found it."}, {"s": 166.23, "e": 168.57, "t": "Imagine you're walking around 2,000 years ago"}, {"s": 168.57, "e": 171.78, "t": "and you see this fluffy looking stuff poking out the ground."}, {"s": 171.78, "e": 174.63, "t": "It's got all of these fibers that you can pull apart"}, {"s": 174.63, "e": 176.19, "t": "and twist into shapes."}, {"s": 180.18, "e": 183.15, "t": "- [Sean] First off, let's get a nice bundle."}, {"s": 183.15, "e": 184.74, "t": "So it looks like cotton."}, {"s": 184.74, "e": 186.3, "t": "- [Gregor] It looks like it would burn really well,"}, {"s": 186.3, "e": 187.65, "t": "like it would just- - Yeah,"}, {"s": 187.65, "e": 190.05, "t": "you can start a fire with it, right, alright."}, {"s": 190.05, "e": 191.75, "t": "- [Gregor] Okay, let's see what happens."}, {"s": 193.05, "e": 194.61, "t": "- [Sean] It's not burning."}, {"s": 194.61, "e": 197.07, "t": "- That's because this is actually a rock."}, {"s": 197.07, "e": 198.82, "t": "It's a naturally occurring mineral."}, {"s": 199.89, "e": 201.45, "t": "The core building block is simple."}, {"s": 201.45, "e": 205.11, "t": "It's a silicon atom surrounded by four oxygen atoms."}, {"s": 205.11, "e": 208.35, "t": "Now silicon has four electrons in its outer shell,"}, {"s": 208.35, "e": 209.91, "t": "but it really wants eight."}, {"s": 209.91, "e": 213.78, "t": "So each of the oxygens shares one electron with it,"}, {"s": 213.78, "e": 215.49, "t": "but oxygen doesn't share evenly"}, {"s": 215.49, "e": 217.74, "t": "since it's more electronegative than silicon,"}, {"s": 217.74, "e": 221.04, "t": "it pulls those shared electrons closer to itself."}, {"s": 221.04, "e": 223.68, "t": "This leaves the oxygen side slightly negative"}, {"s": 223.68, "e": 226.41, "t": "and the silicon side slightly positive."}, {"s": 226.41, "e": 229.5, "t": "Now there's an electrostatic attraction between these atoms,"}, {"s": 229.5, "e": 231.36, "t": "which pulls the atoms closer together"}, {"s": 231.36, "e": 233.46, "t": "and strengthens this bond."}, {"s": 233.46, "e": 236.43, "t": "The result is an incredibly stable pyramid shaped unit"}, {"s": 236.43, "e": 238.62, "t": "called as silica tetrahedron."}, {"s": 238.62, "e": 241.86, "t": "But if you look at the oxygens in these corner spots,"}, {"s": 241.86, "e": 243.69, "t": "they've only shared one electron,"}, {"s": 243.69, "e": 247.08, "t": "but they actually want two to complete their outer shells."}, {"s": 247.08, "e": 249.87, "t": "So the corners link up with other silicon atoms"}, {"s": 249.87, "e": 251.46, "t": "to form more tetrahedra."}, {"s": 251.46, "e": 253.96, "t": "And in this way, the structure just keeps growing."}, {"s": 255.33, "e": 258.12, "t": "The bonds inside here are incredibly strong and stable,"}, {"s": 258.12, "e": 260.49, "t": "and because the atoms are already tightly bound"}, {"s": 260.49, "e": 263.01, "t": "to the oxygens inside the silicate structure,"}, {"s": 263.01, "e": 265.68, "t": "the oxygen in the air has nothing to react with,"}, {"s": 265.68, "e": 267.18, "t": "so the material doesn't burn."}, {"s": 269.28, "e": 270.99, "t": "But overall, there's nothing special"}, {"s": 270.99, "e": 272.31, "t": "about these building blocks."}, {"s": 272.31, "e": 274.2, "t": "More than 90% of the Earth's minerals"}, {"s": 274.2, "e": 275.58, "t": "are made from this stuff,"}, {"s": 275.58, "e": 277.53, "t": "everything from quartz to clay."}, {"s": 278.58, "e": 280.53, "t": "What makes this material special is"}, {"s": 280.53, "e": 282.18, "t": "how those units link up."}, {"s": 283.14, "e": 285.45, "t": "Here, the tetrahedra have formed a sheet,"}, {"s": 285.45, "e": 287.85, "t": "and bonded to it there is actually a second sheet"}, {"s": 287.85, "e": 289.47, "t": "made of magnesium atoms"}, {"s": 289.47, "e": 291.99, "t": "and hydroxyl groups, which are just an oxygen"}, {"s": 291.99, "e": 293.7, "t": "and a hydrogen stuck together."}, {"s": 293.7, "e": 295.17, "t": "Now, the atomic spacings"}, {"s": 295.17, "e": 297.66, "t": "of these two layers are slightly different."}, {"s": 297.66, "e": 300.48, "t": "So there's a tiny mismatch, which causes tension"}, {"s": 300.48, "e": 303.42, "t": "between these layers causing them to curl up,"}, {"s": 303.42, "e": 306.03, "t": "and you end up with these tiny scroll-like tubes."}, {"s": 306.03, "e": 308.82, "t": "These tubes don't break down easily under heat."}, {"s": 308.82, "e": 312.63, "t": "The structure stays stable up to around 600 degrees Celsius."}, {"s": 312.63, "e": 314.31, "t": "So like all these individual fibers"}, {"s": 314.31, "e": 315.39, "t": "that you see running through here,"}, {"s": 315.39, "e": 316.94, "t": "those are all like these curls?"}, {"s": 316.94, "e": 317.77, "t": "- Yes."}, {"s": 317.77, "e": 318.66, "t": "- What is that, what was that there?"}, {"s": 318.66, "e": 320.52, "t": "- [Sean] That's just a place"}, {"s": 320.52, "e": 322.96, "t": "where I twisted the fiber with my tweezers."}, {"s": 322.96, "e": 324.33, "t": "- Oh, okay."}, {"s": 324.33, "e": 325.98, "t": "And when you twist these fibers,"}, {"s": 325.98, "e": 327.36, "t": "they actually don't break."}, {"s": 327.36, "e": 329.94, "t": "So it's literally a rock you can weave."}, {"s": 333.0, "e": 333.9, "t": "And when you do,"}, {"s": 333.9, "e": 336.45, "t": "the fibers form a tangled, layered structure."}, {"s": 336.45, "e": 339.15, "t": "So if heat is introduced, it has to pass from fiber"}, {"s": 339.15, "e": 341.55, "t": "to fiber across many contact points"}, {"s": 341.55, "e": 343.62, "t": "with air filling the spaces between them."}, {"s": 343.62, "e": 346.11, "t": "This reduces how quickly heat can spread"}, {"s": 346.11, "e": 347.34, "t": "through the material."}, {"s": 347.34, "e": 349.77, "t": "Because of that, people started weaving it into things"}, {"s": 349.77, "e": 350.88, "t": "like theater curtains"}, {"s": 350.88, "e": 353.46, "t": "and insulation blankets for steam engines,"}, {"s": 353.46, "e": 355.02, "t": "even fireproof clothing,"}, {"s": 355.02, "e": 355.89, "t": "essentially anywhere"}, {"s": 355.89, "e": 357.99, "t": "they didn't want something to catch fire."}, {"s": 357.99, "e": 359.97, "t": "But by far the most important use"}, {"s": 359.97, "e": 362.37, "t": "came around in the 1800s."}, {"s": 362.37, "e": 364.59, "t": "Between 1790 and 1870,"}, {"s": 364.59, "e": 367.68, "t": "the number of people living in urban areas in America"}, {"s": 367.68, "e": 371.28, "t": "jumped from 1 in 20 to around 1 in 4."}, {"s": 371.28, "e": 373.71, "t": "So to accommodate this, people had to tack on"}, {"s": 373.71, "e": 375.72, "t": "extra floors onto existing buildings"}, {"s": 375.72, "e": 377.58, "t": "and courtyards would then be filled"}, {"s": 377.58, "e": 378.93, "t": "with makeshift extensions,"}, {"s": 378.93, "e": 382.32, "t": "effectively tightly packing all of these buildings together."}, {"s": 382.32, "e": 385.32, "t": "Pretty much all these buildings were made out of wood,"}, {"s": 385.32, "e": 388.89, "t": "but the people inside still cooked with open flames."}, {"s": 388.89, "e": 391.29, "t": "They used gas lamps, they lit candles."}, {"s": 391.29, "e": 392.28, "t": "So one accident"}, {"s": 392.28, "e": 395.43, "t": "and an entire neighborhood could go up in flames."}, {"s": 395.43, "e": 399.54, "t": "That reality hit New York City in December, 1835,"}, {"s": 399.54, "e": 401.67, "t": "when within a span of just two days,"}, {"s": 401.67, "e": 404.19, "t": "three separate fires erupted in Manhattan."}, {"s": 405.21, "e": 408.96, "t": "One bystander described what followed as \"An ocean of fire"}, {"s": 408.96, "e": 411.78, "t": "with roaring, rolling, burning waves.\""}, {"s": 413.73, "e": 417.09, "t": "By the end, a third of a mile of Manhattan was engulfed,"}, {"s": 417.09, "e": 421.41, "t": "destroying nearly 700 buildings at a cost of $20 million."}, {"s": 421.41, "e": 425.13, "t": "That's over $730 million of today's money."}, {"s": 425.13, "e": 427.35, "t": "Similar catastrophes were happening in cities"}, {"s": 427.35, "e": 432.09, "t": "all over the world, Chicago, London, Hamburg, Tokyo."}, {"s": 432.09, "e": 433.62, "t": "- [Reporter] When will this appalling rate"}, {"s": 433.62, "e": 435.27, "t": "of destruction come to an end?"}, {"s": 438.46, "e": 440.19, "t": "- [Gregor] The problem was that when a building burned,"}, {"s": 440.19, "e": 442.98, "t": "it spewed up embers into the air."}, {"s": 442.98, "e": 444.54, "t": "These then got carried by the wind"}, {"s": 444.54, "e": 447.48, "t": "and landed onto other roofs, setting them alight."}, {"s": 450.21, "e": 452.94, "t": "So 23 years after the Great Fire of New York,"}, {"s": 452.94, "e": 456.3, "t": "a 21-year-old named Henry Ward Johns set out"}, {"s": 456.3, "e": 460.2, "t": "to break that chain reaction by making roofs fireproof."}, {"s": 460.2, "e": 461.85, "t": "But that's trickier than it sounds."}, {"s": 461.85, "e": 463.08, "t": "Whatever his solution was,"}, {"s": 463.08, "e": 465.36, "t": "it had to be usable across an entire city."}, {"s": 465.36, "e": 468.21, "t": "So cheap and easy enough to mass produce,"}, {"s": 468.21, "e": 470.73, "t": "durable enough to sit exposed on rooftops"}, {"s": 470.73, "e": 473.4, "t": "baking in the summer sun, freezing in the winter,"}, {"s": 473.4, "e": 476.1, "t": "and most importantly, it was not allowed to ignite"}, {"s": 476.1, "e": 478.59, "t": "even when exposed to burning embers."}, {"s": 479.97, "e": 481.71, "t": "Now, Johns knew of a mineral"}, {"s": 481.71, "e": 484.71, "t": "that was already being spun into fireproof fabric,"}, {"s": 484.71, "e": 487.53, "t": "but only the long fibers were useful for thread."}, {"s": 487.53, "e": 490.38, "t": "The shorter ones were actually swept aside as waste."}, {"s": 490.38, "e": 493.89, "t": "Johns realized those scraps were exactly what he needed,"}, {"s": 493.89, "e": 497.1, "t": "fireproof, tough and most importantly, cheap."}, {"s": 497.1, "e": 499.8, "t": "So he set up a makeshift lab in his basement apartment"}, {"s": 499.8, "e": 501.54, "t": "and started experimenting."}, {"s": 501.54, "e": 505.47, "t": "He heated up tar in his tea kettle, smeared that onto cloth,"}, {"s": 505.47, "e": 507.78, "t": "and then pressed in these tiny fibers."}, {"s": 507.78, "e": 509.19, "t": "Then he ringed the whole thing"}, {"s": 509.19, "e": 511.71, "t": "through his wife's brand new clothes ringer,"}, {"s": 511.71, "e": 515.31, "t": "and when he tested it, it worked, it didn't burn."}, {"s": 516.51, "e": 519.87, "t": "In 1868, Henry Ward Johns patented his invention,"}, {"s": 519.87, "e": 521.55, "t": "and by 1927,"}, {"s": 521.55, "e": 525.0, "t": "the company he built was generating $45 million"}, {"s": 525.0, "e": 529.05, "t": "in annual sales, more than 800 million in today's money."}, {"s": 529.05, "e": 531.63, "t": "Soon people were using this fire-resistant stuff"}, {"s": 531.63, "e": 533.7, "t": "in all kinds of building materials,"}, {"s": 533.7, "e": 535.17, "t": "across America, consumption grew"}, {"s": 535.17, "e": 538.53, "t": "from around 20,400 tons in 1900"}, {"s": 538.53, "e": 543.53, "t": "to a peak of 803,000 tons in 1973."}, {"s": 543.59, "e": 545.4, "t": "(upbeat music)"}, {"s": 545.4, "e": 548.19, "t": "Because of that, pretty much every building in the US,"}, {"s": 548.19, "e": 550.53, "t": "public or private, commercial or residential,"}, {"s": 550.53, "e": 552.78, "t": "used some form of this material."}, {"s": 552.78, "e": 555.03, "t": "During that same period, stronger building codes,"}, {"s": 555.03, "e": 556.23, "t": "safer heating systems"}, {"s": 556.23, "e": 559.41, "t": "and other fire-resistant materials were also introduced,"}, {"s": 559.41, "e": 560.46, "t": "and it showed,"}, {"s": 560.46, "e": 564.42, "t": "during that time, fire-related deaths dropped around 80%."}, {"s": 564.42, "e": 565.25, "t": "So this material"}, {"s": 565.25, "e": 568.57, "t": "likely helped save millions of lives worldwide."}, {"s": 568.57, "e": 571.15, "t": "(lively music)"}, {"s": 573.39, "e": 575.46, "t": "Because it couldn't be destroyed by fire,"}, {"s": 575.46, "e": 579.3, "t": "the name the ancient Greeks gave it, it stuck around."}, {"s": 579.3, "e": 582.64, "t": "They called it inextinguishable,"}, {"s": 582.64, "e": 583.89, "t": "or asbestos."}, {"s": 585.84, "e": 588.36, "t": "(bright music)"}, {"s": 588.36, "e": 590.82, "t": "- [Presenter] Asbestos, the remarkable mineral."}, {"s": 590.82, "e": 593.37, "t": "- [Gregor] By the mid 20th century, asbestos was everywhere,"}, {"s": 593.37, "e": 596.85, "t": "inside brake pads, toasters, ironing boards,"}, {"s": 596.85, "e": 600.33, "t": "hair dryers, surgical dressings, and blankets."}, {"s": 600.33, "e": 603.06, "t": "You know, brewers filtered beer through it."}, {"s": 603.06, "e": 607.53, "t": "One brand of toothpaste even used it for extra polish,"}, {"s": 607.53, "e": 609.54, "t": "the fake snow in department store windows"}, {"s": 609.54, "e": 611.76, "t": "and in movies like \"The Wizard of Oz,\""}, {"s": 611.76, "e": 613.26, "t": "all of that's asbestos too."}, {"s": 614.52, "e": 616.77, "t": "- Unusual weather we're having, eh?"}, {"s": 616.77, "e": 618.63, "t": "- [Gregor] Sorry, Dorothy."}, {"s": 618.63, "e": 619.8, "t": "- It was such a big deal,"}, {"s": 619.8, "e": 623.49, "t": "Marvel even had a villain called Asbestos Lady."}, {"s": 623.49, "e": 625.62, "t": "She'd set a fire to escape the police,"}, {"s": 625.62, "e": 626.79, "t": "and she'd easily walk through it,"}, {"s": 626.79, "e": 628.74, "t": "safe inside her asbestos bodysuit."}, {"s": 630.96, "e": 632.13, "t": "To feed this demand,"}, {"s": 632.13, "e": 635.31, "t": "asbestos was pulled out of the ground on an enormous scale."}, {"s": 635.31, "e": 638.31, "t": "Major mining operations spread across Canada, Russia,"}, {"s": 638.31, "e": 639.54, "t": "and South Africa"}, {"s": 639.54, "e": 641.22, "t": "with global production peaking"}, {"s": 641.22, "e": 646.05, "t": "at approximately 4.8 million tons per year in 1977."}, {"s": 649.08, "e": 650.82, "t": "But the reason asbestos ended up"}, {"s": 650.82, "e": 653.16, "t": "in so many different products is"}, {"s": 653.16, "e": 656.31, "t": "because it's actually a group of different minerals,"}, {"s": 657.51, "e": 660.06, "t": "that white, fluffy stuff we tried to burn earlier,"}, {"s": 660.06, "e": 661.47, "t": "it's called chrysotile,"}, {"s": 661.47, "e": 664.89, "t": "and it belongs to a mineral family known as the serpentines."}, {"s": 664.89, "e": 667.69, "t": "But other types of asbestos looked completely different."}, {"s": 668.61, "e": 672.84, "t": "For instance, there is also brown asbestos known as amosite."}, {"s": 672.84, "e": 676.53, "t": "It forms thick fibers that almost look like wood splinters,"}, {"s": 676.53, "e": 679.77, "t": "strong, stable, and highly heat resistant."}, {"s": 679.77, "e": 682.62, "t": "So it was perfect for putting into building materials"}, {"s": 682.62, "e": 683.94, "t": "like cement panels."}, {"s": 684.99, "e": 687.78, "t": "This type belongs to a different mineral family,"}, {"s": 687.78, "e": 692.01, "t": "the amphiboles, here, instead of forming sheets,"}, {"s": 692.01, "e": 695.94, "t": "the silica tetrahedra lock into rigid, ladder-like chains,"}, {"s": 695.94, "e": 698.16, "t": "and amosite, iron and magnesium ions,"}, {"s": 698.16, "e": 700.92, "t": "along with hydroxyl groups embedded in the structure,"}, {"s": 700.92, "e": 702.51, "t": "bind those chains together,"}, {"s": 702.51, "e": 705.21, "t": "forming these long, needle-like fibers,"}, {"s": 706.8, "e": 709.62, "t": "but tweak that chemistry just slightly so that now iron"}, {"s": 709.62, "e": 711.69, "t": "and sodium ions bind the chains,"}, {"s": 711.69, "e": 714.72, "t": "and you get this, blue asbestos or crocidolite."}, {"s": 716.19, "e": 718.65, "t": "These crystals split easily along their length"}, {"s": 718.65, "e": 721.32, "t": "and they create these fine flexible fibers"}, {"s": 721.32, "e": 723.15, "t": "that are still extraordinarily strong"}, {"s": 723.15, "e": 726.72, "t": "with tensile strengths comparable to high grade steel wire."}, {"s": 728.28, "e": 730.95, "t": "This type went into chemical-resistant insulation,"}, {"s": 730.95, "e": 734.7, "t": "shipyards, and even filters inside early gas masks."}, {"s": 734.7, "e": 735.66, "t": "Oh, and there was another use,"}, {"s": 735.66, "e": 738.21, "t": "one that's hard to believe now."}, {"s": 738.21, "e": 741.15, "t": "- In this magic box I have right here"}, {"s": 741.15, "e": 744.36, "t": "is something that was manufactured"}, {"s": 744.36, "e": 745.89, "t": "right here in North Carolina."}, {"s": 746.88, "e": 750.93, "t": "They're cigarettes, produced in the 1950s,"}, {"s": 750.93, "e": 753.36, "t": "and if you look at the filter,"}, {"s": 753.36, "e": 759.0, "t": "you see the filters are blue, asbestos."}, {"s": 759.9, "e": 763.5, "t": "This is Kent with a Micronite filter that was manufactured"}, {"s": 763.5, "e": 766.39, "t": "with crocidolite asbestos in the filter itself."}, {"s": 766.39, "e": 768.75, "t": "- So you're not only smoking, you were smoking it"}, {"s": 768.75, "e": 770.37, "t": "through a blue asbestos filter."}, {"s": 770.37, "e": 772.29, "t": "Yes, what a deal."}, {"s": 772.29, "e": 775.86, "t": "- Only Kent has the revolutionary new Micronite filter"}, {"s": 775.86, "e": 777.12, "t": "you've heard so much about."}, {"s": 777.12, "e": 782.12, "t": "Kent and only Kent filters best, filters best, filters best."}, {"s": 782.13, "e": 787.13, "t": "(tobacco crackling) (suspenseful music)"}, {"s": 790.96, "e": 792.39, "t": "- [Gregor] In the early 1900s,"}, {"s": 792.39, "e": 796.23, "t": "a young woman named Nelly Kershaw worked in a factory"}, {"s": 796.23, "e": 799.11, "t": "that spun asbestos fibers into threads."}, {"s": 799.11, "e": 801.21, "t": "Every day she breathed in the dust"}, {"s": 801.21, "e": 803.88, "t": "that those machines threw into the air."}, {"s": 803.88, "e": 805.83, "t": "So by her early thirties,"}, {"s": 805.83, "e": 808.62, "t": "she was so sick she could barely breathe."}, {"s": 809.94, "e": 813.3, "t": "And when she finally decided to ask the factory for help,"}, {"s": 813.3, "e": 815.82, "t": "they refused, they said helping out workers"}, {"s": 815.82, "e": 818.37, "t": "would set a dangerous precedent."}, {"s": 818.37, "e": 821.88, "t": "Nelly died shortly after at the age of just 33."}, {"s": 823.44, "e": 824.97, "t": "Nelly's case caught the attention"}, {"s": 824.97, "e": 827.64, "t": "of pathologist Dr. William Cook."}, {"s": 827.64, "e": 830.52, "t": "When he opened up her chest, her lungs were gray"}, {"s": 830.52, "e": 832.26, "t": "and scarred, almost blue-black,"}, {"s": 832.26, "e": 834.6, "t": "like they had a huge internal bruise."}, {"s": 834.6, "e": 838.5, "t": "And when his scalpel passed through them, they rasped."}, {"s": 838.5, "e": 840.69, "t": "It was like scraping against sandpaper."}, {"s": 842.19, "e": 843.99, "t": "The tissue was full of mineral grit,"}, {"s": 843.99, "e": 846.96, "t": "and under the microscope the cause was unmistakable,"}, {"s": 846.96, "e": 849.48, "t": "asbestos fibers lodged into the lung tissue."}, {"s": 851.43, "e": 854.25, "t": "- If we were to inhale some type of an asbestos fiber,"}, {"s": 854.25, "e": 855.39, "t": "I kind of won't think of them"}, {"s": 855.39, "e": 857.64, "t": "as like little microscopic straight arrows,"}, {"s": 857.64, "e": 860.94, "t": "they kind of just shoot down through the nose or the mouth"}, {"s": 860.94, "e": 863.46, "t": "and move down through the trachea."}, {"s": 863.46, "e": 866.34, "t": "If we continue on going down here, we get smaller"}, {"s": 866.34, "e": 869.01, "t": "and smaller as we penetrate deeper into the lung tissue."}, {"s": 869.01, "e": 871.38, "t": "And then you get into these alveolar sacs,"}, {"s": 871.38, "e": 874.02, "t": "these asbestos fibers, they lodge in the tissue there,"}, {"s": 874.02, "e": 877.71, "t": "and lung secretions, enzymes, even white blood cells,"}, {"s": 877.71, "e": 880.5, "t": "they have a really hard time breaking those down."}, {"s": 880.5, "e": 882.95, "t": "- You end up with scarring deep inside the lungs."}, {"s": 884.42, "e": 887.67, "t": "In 1924, Dr. Cook published the first medical description"}, {"s": 887.67, "e": 891.0, "t": "of this condition, which became known as asbestosis."}, {"s": 892.14, "e": 895.05, "t": "When these asbestos fibers lodge into the lungs,"}, {"s": 895.05, "e": 897.09, "t": "the body treats them like invaders,"}, {"s": 897.09, "e": 900.12, "t": "specialized cells called macrophages move in,"}, {"s": 900.12, "e": 901.98, "t": "cells whose job it is to engulf"}, {"s": 901.98, "e": 904.83, "t": "and digest bacteria, dust or debris."}, {"s": 904.83, "e": 908.46, "t": "But asbestos fibers are too long and stiff to swallow."}, {"s": 908.46, "e": 911.25, "t": "It's kind of like trying to eat a toothpick sideways."}, {"s": 911.25, "e": 913.98, "t": "The macrophages keep trying and failing,"}, {"s": 913.98, "e": 916.77, "t": "and in the process, they release inflammatory chemicals"}, {"s": 916.77, "e": 919.14, "t": "that damage the surrounding lung tissue."}, {"s": 919.14, "e": 922.08, "t": "So workers breathing in asbestos dust day after day,"}, {"s": 922.08, "e": 924.99, "t": "accumulated more and more damage."}, {"s": 924.99, "e": 926.01, "t": "When doctors sent"}, {"s": 926.01, "e": 928.26, "t": "by the British government examined hundreds"}, {"s": 928.26, "e": 929.67, "t": "of asbestos workers,"}, {"s": 929.67, "e": 931.92, "t": "they found that more than 25%"}, {"s": 931.92, "e": 934.65, "t": "already showed signs of lung disease."}, {"s": 934.65, "e": 937.47, "t": "And for workers with over 20 years of exposure,"}, {"s": 937.47, "e": 940.05, "t": "that number was closer to 80%."}, {"s": 940.05, "e": 943.86, "t": "So in 1931, the government officially classified asbestos"}, {"s": 943.86, "e": 945.48, "t": "as a workplace hazard,"}, {"s": 945.48, "e": 947.52, "t": "making it one of the first industrial materials"}, {"s": 947.52, "e": 949.65, "t": "to be regulated for health risks."}, {"s": 949.65, "e": 951.78, "t": "But the new rules only covered factories"}, {"s": 951.78, "e": 953.94, "t": "where asbestos was manufactured."}, {"s": 953.94, "e": 957.12, "t": "They didn't extend to other workers like ship builders,"}, {"s": 957.12, "e": 960.69, "t": "miners or construction workers who were regularly exposed"}, {"s": 960.69, "e": 962.04, "t": "to asbestos dust."}, {"s": 964.23, "e": 966.45, "t": "Across the Atlantic, things weren't much better."}, {"s": 966.45, "e": 970.05, "t": "There was no binding federal asbestos rules in the States,"}, {"s": 970.05, "e": 971.73, "t": "only a recommendation."}, {"s": 971.73, "e": 973.17, "t": "The US Public Health Service"}, {"s": 973.17, "e": 975.21, "t": "suggested a temporary exposure limit"}, {"s": 975.21, "e": 977.1, "t": "of 5 million asbestos particles"}, {"s": 977.1, "e": 979.32, "t": "for a single cubic foot of air,"}, {"s": 979.32, "e": 981.24, "t": "which meant that a worker breathing normally"}, {"s": 981.24, "e": 985.11, "t": "could inhale over 300 million asbestos particles an hour"}, {"s": 985.11, "e": 987.69, "t": "and still be considered within guidelines."}, {"s": 987.69, "e": 990.39, "t": "This became especially problematic for shipyard workers"}, {"s": 990.39, "e": 991.95, "t": "when World War II broke out,"}, {"s": 991.95, "e": 994.86, "t": "ships were packed with asbestos insulation."}, {"s": 994.86, "e": 996.9, "t": "So workers spent their days cutting"}, {"s": 996.9, "e": 1000.17, "t": "and fitting asbestos in thick clouds of fibers."}, {"s": 1000.17, "e": 1002.03, "t": "And according to the guidelines of the day,"}, {"s": 1002.03, "e": 1004.4, "t": "these levels met the official definition"}, {"s": 1004.4, "e": 1006.53, "t": "of safe working conditions."}, {"s": 1006.53, "e": 1010.19, "t": "In fact, asbestos was still marketed as a magic material."}, {"s": 1010.19, "e": 1011.25, "t": "A few years earlier,"}, {"s": 1011.25, "e": 1014.18, "t": "\"Time\" magazine actually put Johns-Manville's president,"}, {"s": 1014.18, "e": 1017.63, "t": "Lewis H. Brown on its April 3rd, 1939 cover."}, {"s": 1017.63, "e": 1019.58, "t": "But in the early 1960s,"}, {"s": 1019.58, "e": 1023.54, "t": "finally one doctor started connecting the dots on asbestos."}, {"s": 1024.77, "e": 1027.08, "t": "Dr. Irving Selikoff was running a small clinic"}, {"s": 1027.08, "e": 1028.67, "t": "in Patterson, New Jersey,"}, {"s": 1028.67, "e": 1031.25, "t": "when the local asbestos workers Union asked if"}, {"s": 1031.25, "e": 1033.65, "t": "their members could come and see him."}, {"s": 1033.65, "e": 1035.93, "t": "Before long, he'd seen multiple workers"}, {"s": 1035.93, "e": 1038.15, "t": "with either severe lung scarring"}, {"s": 1038.15, "e": 1039.35, "t": "or more concerningly,"}, {"s": 1039.35, "e": 1042.86, "t": "an extremely rare cancer called mesothelioma."}, {"s": 1042.86, "e": 1046.22, "t": "- A mesothelioma is strongly associated"}, {"s": 1046.22, "e": 1047.75, "t": "with asbestos exposure"}, {"s": 1047.75, "e": 1051.53, "t": "and is cancer of those cells lining the inside"}, {"s": 1051.53, "e": 1052.52, "t": "of the chest cavity."}, {"s": 1052.52, "e": 1054.89, "t": "And most commonly, it's this pleural cavity."}, {"s": 1054.89, "e": 1059.0, "t": "These pleural membranes are aligned with mesothelial cells."}, {"s": 1059.0, "e": 1063.02, "t": "Sometimes what happens is the fibers will work their way out"}, {"s": 1063.02, "e": 1066.77, "t": "of the lung tissue and directly get into this cavity here,"}, {"s": 1066.77, "e": 1069.41, "t": "and they can literally pierce out the lungs."}, {"s": 1070.61, "e": 1072.41, "t": "- They cause constant irritation."}, {"s": 1072.41, "e": 1075.29, "t": "And over time, that can trigger cancerous changes"}, {"s": 1075.29, "e": 1077.3, "t": "in the cells that make up those linings."}, {"s": 1080.33, "e": 1082.64, "t": "Selikoff needed more data to understand the scale"}, {"s": 1082.64, "e": 1085.22, "t": "of the problem, but factory owners refused"}, {"s": 1085.22, "e": 1088.43, "t": "to share medical records from their workers with him."}, {"s": 1088.43, "e": 1091.07, "t": "So Selikoff had to get creative."}, {"s": 1091.07, "e": 1094.46, "t": "See, during World War II, many shipyard workers employed"}, {"s": 1094.46, "e": 1097.61, "t": "by the Navy underwent federal background checks."}, {"s": 1097.61, "e": 1100.28, "t": "Thousands of these men had been working with asbestos"}, {"s": 1100.28, "e": 1101.78, "t": "to insulate ships."}, {"s": 1101.78, "e": 1105.68, "t": "So using surviving FBI wartime personnel records,"}, {"s": 1105.68, "e": 1108.23, "t": "Selikoff began tracking them down"}, {"s": 1108.23, "e": 1111.26, "t": "and one by one painstakingly pieced together"}, {"s": 1111.26, "e": 1113.0, "t": "their medical histories."}, {"s": 1113.0, "e": 1117.11, "t": "What emerged wasn't a handful of isolated tragedies,"}, {"s": 1117.11, "e": 1118.97, "t": "it was a pattern,"}, {"s": 1118.97, "e": 1122.39, "t": "that exposure proved deadlier than combat itself."}, {"s": 1123.23, "e": 1127.61, "t": "8.6 out of every 1,000 servicemen were killed in action,"}, {"s": 1127.61, "e": 1130.91, "t": "whereas 14 out of every 1,000 shipyard workers"}, {"s": 1130.91, "e": 1133.64, "t": "later died from asbestos-related cancers."}, {"s": 1135.41, "e": 1137.42, "t": "Selikoff launched a formal investigation"}, {"s": 1137.42, "e": 1140.15, "t": "into hundreds of asbestos insulation workers,"}, {"s": 1140.15, "e": 1142.7, "t": "and what he found confirmed his fears,"}, {"s": 1142.7, "e": 1145.34, "t": "widespread disabling asbestosis,"}, {"s": 1145.34, "e": 1147.41, "t": "dozens of cases of mesothelioma,"}, {"s": 1147.41, "e": 1150.08, "t": "lung cancer rates roughly seven times higher"}, {"s": 1150.08, "e": 1150.91, "t": "than expected"}, {"s": 1150.91, "e": 1154.1, "t": "and a threefold increase in gastrointestinal cancers."}, {"s": 1154.1, "e": 1157.46, "t": "In 1964, he organized a conference at the New York Academy"}, {"s": 1157.46, "e": 1159.8, "t": "of Sciences where for the first time,"}, {"s": 1159.8, "e": 1162.77, "t": "all this evidence was presented publicly in one place,"}, {"s": 1162.77, "e": 1165.71, "t": "and on the record, it marked the moment when asbestos"}, {"s": 1165.71, "e": 1168.5, "t": "stopped being seen as a modern miracle material"}, {"s": 1168.5, "e": 1170.45, "t": "and instead started being recognized"}, {"s": 1170.45, "e": 1172.19, "t": "as a public health crisis."}, {"s": 1175.82, "e": 1177.68, "t": "But the asbestos industry fought back"}, {"s": 1177.68, "e": 1179.45, "t": "trying to discredit Selikoff."}, {"s": 1179.45, "e": 1181.28, "t": "Industry-funded research groups came out"}, {"s": 1181.28, "e": 1183.59, "t": "with papers minimizing the risk of exposure"}, {"s": 1183.59, "e": 1186.8, "t": "and framing Selikoff's findings as overblown."}, {"s": 1186.8, "e": 1190.25, "t": "They started a coordinated PR effort to discredit him,"}, {"s": 1190.25, "e": 1192.23, "t": "trying to call him alarmist,"}, {"s": 1192.23, "e": 1195.02, "t": "and starting a rumor that he wasn't even a real doctor"}, {"s": 1195.02, "e": 1197.77, "t": "just because he got his medical degree out in Scotland."}, {"s": 1198.65, "e": 1200.87, "t": "But Selikoff kept going."}, {"s": 1200.87, "e": 1203.84, "t": "He kept publishing data on the devastating health effects"}, {"s": 1203.84, "e": 1205.19, "t": "of asbestos exposure,"}, {"s": 1205.19, "e": 1209.03, "t": "he worked 18 hour days documenting every patient"}, {"s": 1209.03, "e": 1209.93, "t": "who wrote to him."}, {"s": 1209.93, "e": 1213.11, "t": "He contacted policymakers, even world leaders,"}, {"s": 1213.11, "e": 1215.87, "t": "urging them to take action against asbestos."}, {"s": 1217.34, "e": 1221.3, "t": "- Now Selikoff, the legendary doctor"}, {"s": 1221.3, "e": 1224.69, "t": "who organized this conference in the 1970s"}, {"s": 1224.69, "e": 1227.9, "t": "found that intravenous drugs were being contaminated"}, {"s": 1227.9, "e": 1229.58, "t": "by asbestos filtration."}, {"s": 1229.58, "e": 1230.66, "t": "People aren't just eating it"}, {"s": 1230.66, "e": 1232.0, "t": "and breathing it, they're mainlining it."}, {"s": 1234.41, "e": 1237.26, "t": "- By the 1970s, no one could deny it any longer,"}, {"s": 1237.26, "e": 1240.38, "t": "miners, factory workers, shipyard insulators,"}, {"s": 1240.38, "e": 1242.57, "t": "people who'd been exposed decades earlier"}, {"s": 1242.57, "e": 1245.03, "t": "during the asbestos boom, were now turning up"}, {"s": 1245.03, "e": 1248.0, "t": "with multiple cancers in huge numbers."}, {"s": 1248.0, "e": 1250.01, "t": "- Asbestos exposure is linked"}, {"s": 1250.01, "e": 1251.72, "t": "to all sorts of different cancers."}, {"s": 1251.72, "e": 1254.23, "t": "The lung tissue has lymphatic vessels in it,"}, {"s": 1254.23, "e": 1256.52, "t": "but you have 'em throughout your whole body."}, {"s": 1256.52, "e": 1258.89, "t": "The asbestos fibers sometimes on their own"}, {"s": 1258.89, "e": 1261.95, "t": "can migrate into the lymphatic vessels."}, {"s": 1261.95, "e": 1264.38, "t": "Sometimes the white blood cells will take it"}, {"s": 1264.38, "e": 1265.97, "t": "into the lymphatic system."}, {"s": 1265.97, "e": 1269.06, "t": "Once you hit the lymphatic system, you have the potential"}, {"s": 1269.06, "e": 1271.01, "t": "to go anywhere in the human body."}, {"s": 1272.0, "e": 1273.5, "t": "- [Gregor] Autopsies have found fibers"}, {"s": 1273.5, "e": 1275.81, "t": "in nearly every organ in the body,"}, {"s": 1275.81, "e": 1279.38, "t": "the brain, bone marrow, spleen, intestines, pancreas,"}, {"s": 1279.38, "e": 1282.41, "t": "prostate, ovaries, thyroid, and liver."}, {"s": 1282.41, "e": 1285.2, "t": "And in every tissue those fibers reach,"}, {"s": 1285.2, "e": 1287.57, "t": "they set off the same chain reaction."}, {"s": 1287.57, "e": 1290.33, "t": "- I'm imagining these white blood cells with personalities,"}, {"s": 1290.33, "e": 1291.74, "t": "and they get all mad and frustrated"}, {"s": 1291.74, "e": 1294.38, "t": "because they can't engulf this asbestos fiber."}, {"s": 1294.38, "e": 1296.6, "t": "They've coined this term called essentially,"}, {"s": 1296.6, "e": 1298.61, "t": "frustrated phagocytosis."}, {"s": 1298.61, "e": 1300.29, "t": "They start releasing these things"}, {"s": 1300.29, "e": 1302.18, "t": "like reactive oxygen species."}, {"s": 1302.18, "e": 1304.82, "t": "They can cause damage to surrounding cells,"}, {"s": 1304.82, "e": 1308.72, "t": "and really important is damage to DNA."}, {"s": 1308.72, "e": 1310.94, "t": "Those cells can start dividing out of control"}, {"s": 1310.94, "e": 1312.05, "t": "when they start to clump together,"}, {"s": 1312.05, "e": 1314.81, "t": "and we start to call those clumps of cells cancer."}, {"s": 1315.77, "e": 1317.63, "t": "- US courts were flooded with lawsuits"}, {"s": 1317.63, "e": 1319.4, "t": "against companies like Johns-Manville."}, {"s": 1319.4, "e": 1322.16, "t": "The harm asbestos caused was well documented."}, {"s": 1322.16, "e": 1323.66, "t": "The information was out there."}, {"s": 1323.66, "e": 1326.72, "t": "Companies should have known their products were dangerous."}, {"s": 1326.72, "e": 1329.42, "t": "- They should know what's reasonably available"}, {"s": 1329.42, "e": 1332.9, "t": "in the public domain about the dangers of asbestos."}, {"s": 1332.9, "e": 1335.33, "t": "If they can read asbestos patents,"}, {"s": 1335.33, "e": 1338.18, "t": "they can read asbestos pathology papers."}, {"s": 1338.18, "e": 1339.83, "t": "- But the companies denied it."}, {"s": 1339.83, "e": 1341.9, "t": "What was needed was definitive evidence"}, {"s": 1341.9, "e": 1343.79, "t": "that the companies knew their products"}, {"s": 1343.79, "e": 1345.14, "t": "were killing their workers."}, {"s": 1347.51, "e": 1349.52, "t": "Then an attorney, Carl Ash,"}, {"s": 1349.52, "e": 1352.13, "t": "noticed something strange in the 1974 report"}, {"s": 1352.13, "e": 1355.67, "t": "by this huge asbestos company called Raybestos Manhattan."}, {"s": 1355.67, "e": 1357.95, "t": "See, in this report, the company suggested"}, {"s": 1357.95, "e": 1360.38, "t": "that they had actually been investigating health hazards"}, {"s": 1360.38, "e": 1362.99, "t": "of asbestos since the 1930s."}, {"s": 1362.99, "e": 1364.85, "t": "So Ash started digging."}, {"s": 1364.85, "e": 1367.46, "t": "He filed a request for internal documents,"}, {"s": 1367.46, "e": 1371.21, "t": "and at first, the company claimed it couldn't find much."}, {"s": 1371.21, "e": 1372.77, "t": "Then unexpectedly,"}, {"s": 1372.77, "e": 1376.52, "t": "Ash was handed a banker's box stuffed full of documents,"}, {"s": 1376.52, "e": 1378.92, "t": "meticulously kept by Raybestos Manhattan's,"}, {"s": 1378.92, "e": 1381.23, "t": "former president, Sumner Simpson."}, {"s": 1383.18, "e": 1386.99, "t": "Back in 1935, a journal contacted Simpson"}, {"s": 1386.99, "e": 1389.75, "t": "because they wanted to write an article about asbestosis."}, {"s": 1389.75, "e": 1392.27, "t": "Shortly after, Simpson himself reached out"}, {"s": 1392.27, "e": 1395.73, "t": "to Johns-Manville's lawyer, Vandiver Brown, saying,"}, {"s": 1395.73, "e": 1397.61, "t": "\"I think the less said about asbestos,"}, {"s": 1397.61, "e": 1398.69, "t": "the better off we are.\""}, {"s": 1398.69, "e": 1401.03, "t": "To which Brown replied, \"I quite agree with you"}, {"s": 1401.03, "e": 1402.68, "t": "that our interests are best served"}, {"s": 1402.68, "e": 1406.52, "t": "by having asbestosis receive the minimum of publicity.\""}, {"s": 1406.52, "e": 1409.94, "t": "The same papers also revealed that in the 1930s, Raybestos"}, {"s": 1409.94, "e": 1412.88, "t": "and Johns-Manville hired an external company,"}, {"s": 1412.88, "e": 1416.21, "t": "Saranac Laboratories, to do studies of asbestos on animals."}, {"s": 1416.21, "e": 1418.55, "t": "But the companies insisted on controlling"}, {"s": 1418.55, "e": 1421.07, "t": "what from those studies will be made public."}, {"s": 1421.07, "e": 1423.03, "t": "As a letter from Vandiver points out,"}, {"s": 1423.03, "e": 1424.43, "t": "\"It is our further understanding"}, {"s": 1424.43, "e": 1427.16, "t": "that the results will be considered the property of those"}, {"s": 1427.16, "e": 1429.11, "t": "who are advancing the required funds,"}, {"s": 1429.11, "e": 1431.24, "t": "who will determine whether, to what extent"}, {"s": 1431.24, "e": 1433.82, "t": "and in what manner they shall be made public.\""}, {"s": 1433.82, "e": 1436.85, "t": "A clause to which Saranac Laboratories said, \"Yes.\""}, {"s": 1436.85, "e": 1438.59, "t": "But after their lead researcher"}, {"s": 1438.59, "e": 1441.83, "t": "who was compiling all this evidence died in 1946,"}, {"s": 1441.83, "e": 1444.29, "t": "the companies agreed that nothing should be published"}, {"s": 1444.29, "e": 1446.6, "t": "that contained any objectionable material."}, {"s": 1446.6, "e": 1449.54, "t": "Objectionable meaning any sort of indication"}, {"s": 1449.54, "e": 1451.13, "t": "that asbestos causes cancer."}, {"s": 1451.13, "e": 1453.23, "t": "So when Saranac Laboratories finished their research,"}, {"s": 1453.23, "e": 1455.78, "t": "the companies took the report, edited it,"}, {"s": 1455.78, "e": 1457.19, "t": "and just buried the evidence."}, {"s": 1457.19, "e": 1459.71, "t": "Here's an original copy of that manuscript,"}, {"s": 1459.71, "e": 1463.07, "t": "and you can find whole sections just crossed out."}, {"s": 1463.07, "e": 1464.96, "t": "Other documents were even more damaging."}, {"s": 1464.96, "e": 1467.84, "t": "A Johns-Manville medical official later testified"}, {"s": 1467.84, "e": 1470.96, "t": "that up until 1971, the company had a policy"}, {"s": 1470.96, "e": 1474.29, "t": "of not telling their workers if their physicals showed signs"}, {"s": 1474.29, "e": 1477.92, "t": "of asbestosis or asbestos-related lung cancers."}, {"s": 1477.92, "e": 1479.09, "t": "And in sworn testimony,"}, {"s": 1479.09, "e": 1482.66, "t": "a witness recalled a meeting they had in the early 1940s"}, {"s": 1482.66, "e": 1484.79, "t": "with the president of Johns-Manville,"}, {"s": 1484.79, "e": 1488.36, "t": "asking why they weren't warning workers about asbestos."}, {"s": 1488.36, "e": 1490.38, "t": "As the witness recalls it, they asked,"}, {"s": 1490.38, "e": 1492.5, "t": "\"Do you mean to tell me you would let them work"}, {"s": 1492.5, "e": 1494.09, "t": "until they dropped dead?\""}, {"s": 1494.09, "e": 1495.81, "t": "To which the president replied,"}, {"s": 1495.81, "e": 1498.02, "t": "\"Yes, we save a lot of money that way.\""}, {"s": 1500.54, "e": 1502.13, "t": "Once the Sumner Simpson papers got out,"}, {"s": 1502.13, "e": 1504.65, "t": "they unlocked a new industrial Watergate."}, {"s": 1504.65, "e": 1507.65, "t": "The industry's standard, \"Oh, we didn't know,\" defense,"}, {"s": 1507.65, "e": 1509.09, "t": "it simply fell apart."}, {"s": 1509.09, "e": 1511.61, "t": "Comparisons were made to big tobacco's concealment"}, {"s": 1511.61, "e": 1513.08, "t": "of smoking risks."}, {"s": 1513.08, "e": 1515.09, "t": "And the lawsuits surged,"}, {"s": 1515.09, "e": 1517.07, "t": "each case brought new discovery"}, {"s": 1517.07, "e": 1519.77, "t": "and each round of discovery exposed a wider,"}, {"s": 1519.77, "e": 1521.49, "t": "more coordinated coverup."}, {"s": 1521.49, "e": 1523.73, "t": "(files thunking) (suspenseful music)"}, {"s": 1523.73, "e": 1525.5, "t": "Ever since the word asbestosis"}, {"s": 1525.5, "e": 1528.35, "t": "started showing up in medical journals in the 1920s,"}, {"s": 1528.35, "e": 1531.71, "t": "Johns-Manville went out to secure the market around itself."}, {"s": 1531.71, "e": 1534.92, "t": "First, they acquired the biggest rock wall company,"}, {"s": 1534.92, "e": 1537.77, "t": "then they acquired a firm holding the key patents"}, {"s": 1537.77, "e": 1539.48, "t": "to calcium silicate insulation,"}, {"s": 1539.48, "e": 1541.76, "t": "insulation that could be made without asbestos."}, {"s": 1541.76, "e": 1543.29, "t": "Now, at the same time,"}, {"s": 1543.29, "e": 1545.54, "t": "companies that had non asbestos insulation"}, {"s": 1545.54, "e": 1549.47, "t": "were incentivized into creating asbestos product lines."}, {"s": 1549.47, "e": 1551.63, "t": "With each acquisition or inducement,"}, {"s": 1551.63, "e": 1553.73, "t": "another potential competitor lost the ability"}, {"s": 1553.73, "e": 1555.02, "t": "to denounce asbestos"}, {"s": 1555.02, "e": 1558.2, "t": "and say, \"Oh, we have an asbestos-free product.\""}, {"s": 1558.2, "e": 1560.45, "t": "So each in turn became a member"}, {"s": 1560.45, "e": 1562.76, "t": "of this conspiracy of silence."}, {"s": 1562.76, "e": 1565.94, "t": "That is how the asbestos industry guaranteed its survival,"}, {"s": 1565.94, "e": 1568.94, "t": "by ensuring no one could speak out against it."}, {"s": 1568.94, "e": 1571.79, "t": "- [Narrator] We suggest you consider asbestos"}, {"s": 1571.79, "e": 1574.22, "t": "for the walls of your home."}, {"s": 1574.22, "e": 1575.96, "t": "- Their business decisions"}, {"s": 1575.96, "e": 1578.21, "t": "and the people who make them are businessmen."}, {"s": 1578.21, "e": 1579.47, "t": "I mean, the word morality"}, {"s": 1579.47, "e": 1583.19, "t": "or moral obligation is almost non-existent"}, {"s": 1583.19, "e": 1584.99, "t": "in the corporate documents."}, {"s": 1584.99, "e": 1588.95, "t": "- In 1982, Johns-Manville filed for bankruptcy protection."}, {"s": 1588.95, "e": 1591.83, "t": "- Manville Corporation's board of directors has determined"}, {"s": 1591.83, "e": 1593.51, "t": "that the corporation should file"}, {"s": 1593.51, "e": 1597.35, "t": "for reorganization under chapter 11 of the Bankruptcy Act."}, {"s": 1598.19, "e": 1599.39, "t": "- Not because they were broke,"}, {"s": 1599.39, "e": 1601.25, "t": "but in a move widely seen as a way"}, {"s": 1601.25, "e": 1605.54, "t": "to shield the company from a flood of asbestos lawsuits."}, {"s": 1605.54, "e": 1607.22, "t": "Despite all the evidence against them,"}, {"s": 1607.22, "e": 1608.93, "t": "Johns-Manville survived."}, {"s": 1608.93, "e": 1611.12, "t": "They continue operating to this day,"}, {"s": 1611.12, "e": 1613.17, "t": "although they no longer produce asbestos."}, {"s": 1614.9, "e": 1617.36, "t": "Between 1940 and 1980,"}, {"s": 1617.36, "e": 1620.39, "t": "the asbestos industry, led by Johns-Manville,"}, {"s": 1620.39, "e": 1624.65, "t": "exposed roughly 21 million Americans to these fibers."}, {"s": 1624.65, "e": 1627.23, "t": "Asbestos related deaths amounted to at least 8"}, {"s": 1627.23, "e": 1629.54, "t": "to 10,000 people every year,"}, {"s": 1629.54, "e": 1631.97, "t": "with many more suffering lifelong disease."}, {"s": 1634.19, "e": 1636.59, "t": "In 1989, the EPA issued a rule"}, {"s": 1636.59, "e": 1640.01, "t": "to phase out almost all asbestos use in the United States."}, {"s": 1640.01, "e": 1643.4, "t": "And that should have been the end of the story."}, {"s": 1644.39, "e": 1646.52, "t": "But the industry sued immediately,"}, {"s": 1646.52, "e": 1650.21, "t": "not because anyone disputed asbestos causes cancer,"}, {"s": 1650.21, "e": 1652.16, "t": "that was undeniable by this point,"}, {"s": 1652.16, "e": 1654.26, "t": "but because of a legal technicality,"}, {"s": 1654.26, "e": 1655.61, "t": "see, under the law,"}, {"s": 1655.61, "e": 1658.22, "t": "the EPA had to prove that an outright ban"}, {"s": 1658.22, "e": 1660.05, "t": "of asbestos was the only solution."}, {"s": 1660.05, "e": 1663.02, "t": "And that anything less than that just wouldn't cut it."}, {"s": 1663.02, "e": 1665.42, "t": "This was an almost impossible feat."}, {"s": 1665.42, "e": 1668.03, "t": "Now, the industry argued that they hadn't done that,"}, {"s": 1668.03, "e": 1670.1, "t": "and unfortunately the US courts agreed."}, {"s": 1670.1, "e": 1672.86, "t": "So in 1991, they ruled that the EPA"}, {"s": 1672.86, "e": 1675.14, "t": "just hadn't met this narrow legal standard."}, {"s": 1675.14, "e": 1678.5, "t": "And with that, the asbestos ban was dead in the water."}, {"s": 1679.49, "e": 1682.55, "t": "But by then, asbestos had become so financially"}, {"s": 1682.55, "e": 1685.46, "t": "and legally risky for the companies that manufactured it"}, {"s": 1685.46, "e": 1689.24, "t": "or used it, that its overall use did actually decline."}, {"s": 1689.24, "e": 1692.36, "t": "Yet in the end, after years of trying to define"}, {"s": 1692.36, "e": 1693.86, "t": "and regulate asbestos,"}, {"s": 1693.86, "e": 1695.66, "t": "the only thing that truly stuck around"}, {"s": 1695.66, "e": 1698.12, "t": "was a definition and a narrow one."}, {"s": 1698.12, "e": 1700.28, "t": "Chrysotile and five amphiboles,"}, {"s": 1700.28, "e": 1702.74, "t": "because these were the only ones being mined, sold,"}, {"s": 1702.74, "e": 1704.36, "t": "and used in factories."}, {"s": 1704.36, "e": 1707.57, "t": "But those six became the official asbestos minerals"}, {"s": 1707.57, "e": 1710.0, "t": "and anything else, no matter how fiber-like"}, {"s": 1710.0, "e": 1713.32, "t": "or potentially dangerous, well, that doesn't count."}, {"s": 1713.32, "e": 1716.32, "t": "(suspenseful music)"}, {"s": 1719.12, "e": 1722.48, "t": "- [Reporter] The FDA for the first time in 50 years,"}, {"s": 1722.48, "e": 1725.45, "t": "considering testing for asbestos in cosmetics"}, {"s": 1725.45, "e": 1726.44, "t": "and talc powder."}, {"s": 1726.44, "e": 1727.43, "t": "- [Reporter] Traces of it"}, {"s": 1727.43, "e": 1730.67, "t": "have now been detected in children's play sand."}, {"s": 1730.67, "e": 1732.53, "t": "- Thousands of people are claiming"}, {"s": 1732.53, "e": 1734.96, "t": "that they developed various forms of cancer"}, {"s": 1734.96, "e": 1738.77, "t": "after years of using Johnson and Johnson's baby powder."}, {"s": 1738.77, "e": 1740.27, "t": "- Is this all the stuff that you've collected"}, {"s": 1740.27, "e": 1741.1, "t": "over the years?"}, {"s": 1741.1, "e": 1742.49, "t": "- No, it's not all of it,"}, {"s": 1742.49, "e": 1747.49, "t": "but this box is full of all the Claire's-labeled products"}, {"s": 1748.31, "e": 1749.81, "t": "that I found asbestos in."}, {"s": 1749.81, "e": 1752.54, "t": "Everything little girls could possibly want to have"}, {"s": 1752.54, "e": 1753.37, "t": "their makeup in."}, {"s": 1754.61, "e": 1758.21, "t": "Like, oh, I don't know, how about sparkly boxes, right?"}, {"s": 1758.21, "e": 1760.7, "t": "- Yeah. - And there's a cell phone."}, {"s": 1760.7, "e": 1762.98, "t": "- Yes. - With eye shadows on it."}, {"s": 1762.98, "e": 1765.29, "t": "- Yeah. - There's asbestos in there."}, {"s": 1765.29, "e": 1766.85, "t": "There's asbestos in the unicorn."}, {"s": 1766.85, "e": 1768.97, "t": "- It's in all of that? - Yes."}, {"s": 1768.97, "e": 1771.17, "t": "All of these have asbestos in them."}, {"s": 1773.42, "e": 1775.52, "t": "I started seeing asbestos fibers everywhere."}, {"s": 1775.52, "e": 1777.27, "t": "Everywhere, okay."}, {"s": 1777.27, "e": 1780.65, "t": "The eyeshadows, the blush, they all had asbestos fibers."}, {"s": 1780.65, "e": 1783.74, "t": "Alright, wow. okay."}, {"s": 1785.84, "e": 1788.42, "t": "- What year was this? - 2017."}, {"s": 1788.42, "e": 1789.25, "t": "- [Gregor] What?"}, {"s": 1789.25, "e": 1790.25, "t": "- 2017."}, {"s": 1790.25, "e": 1793.23, "t": "- [Gregor] I thought it was gonna be like 1980 or something."}, {"s": 1793.23, "e": 1794.69, "t": "What, 2017?"}, {"s": 1794.69, "e": 1796.37, "t": "- Yes. - Whoa."}, {"s": 1796.37, "e": 1799.19, "t": "- And the manufacturer came back and said, \"There's no way.\""}, {"s": 1799.19, "e": 1801.89, "t": "And they sponsored another laboratory"}, {"s": 1801.89, "e": 1804.53, "t": "to look at the same samples."}, {"s": 1804.53, "e": 1807.5, "t": "And they said, \"No, none of this counts as asbestos.\""}, {"s": 1807.5, "e": 1809.39, "t": "It's all cleavage fragments,"}, {"s": 1809.39, "e": 1812.3, "t": "or CPLA, clay or something like that."}, {"s": 1812.3, "e": 1814.01, "t": "And it was balderdash, right?"}, {"s": 1814.01, "e": 1816.11, "t": "I called friends all across the States"}, {"s": 1816.11, "e": 1819.2, "t": "and said, \"Hey, do you have a Claire's store near you?\""}, {"s": 1819.2, "e": 1822.2, "t": "Can you find the sparkly box? Right."}, {"s": 1822.2, "e": 1824.6, "t": "And send it to me, pronto."}, {"s": 1824.6, "e": 1827.09, "t": "There's Claire's in all, in all of the malls,"}, {"s": 1827.09, "e": 1828.02, "t": "all across America."}, {"s": 1828.02, "e": 1830.3, "t": "And then I look further and it's all over the world."}, {"s": 1830.3, "e": 1833.03, "t": "I mean, every mall, everywhere."}, {"s": 1833.03, "e": 1834.98, "t": "And I end up testing Claire's from Brazil"}, {"s": 1834.98, "e": 1839.78, "t": "to Japan to London, I found asbestos,"}, {"s": 1839.78, "e": 1841.82, "t": "- No way. - Right."}, {"s": 1841.82, "e": 1844.76, "t": "So that turned into a huge story, right?"}, {"s": 1844.76, "e": 1848.3, "t": "And now I don't think you can buy very much"}, {"s": 1848.3, "e": 1851.75, "t": "talc-based cosmetics at Claire's now,"}, {"s": 1851.75, "e": 1854.78, "t": "but it was a several-years-long battle."}, {"s": 1855.99, "e": 1858.99, "t": "(suspenseful music)"}, {"s": 1867.62, "e": 1872.54, "t": "These are different products that were sold at toy stores."}, {"s": 1872.54, "e": 1875.03, "t": "Like here's the secret spy kit."}, {"s": 1875.03, "e": 1877.91, "t": "And you see there's a fingerprint kit there, right?"}, {"s": 1877.91, "e": 1881.39, "t": "And in that fingerprint kit was a powder"}, {"s": 1881.39, "e": 1884.57, "t": "in which I found asbestos fibers."}, {"s": 1884.57, "e": 1886.97, "t": "Say It Ain't So Mickey Mouse crayons."}, {"s": 1886.97, "e": 1889.31, "t": "No! - I found asbestos in those."}, {"s": 1890.93, "e": 1892.37, "t": "- And this keeps happening."}, {"s": 1892.37, "e": 1895.34, "t": "Just a couple of months ago, around 70 schools in Australia"}, {"s": 1895.34, "e": 1897.02, "t": "and New Zealand had to close down"}, {"s": 1897.02, "e": 1900.65, "t": "because of the asbestos found in children's play sand."}, {"s": 1900.65, "e": 1903.32, "t": "Out of the 60 outlets that reported on this story,"}, {"s": 1903.32, "e": 1906.14, "t": "only 24% were from right-leaning sources."}, {"s": 1906.14, "e": 1907.88, "t": "Depending on where you get your news,"}, {"s": 1907.88, "e": 1910.67, "t": "this might have never crossed your radar, which is a problem"}, {"s": 1910.67, "e": 1912.83, "t": "because public health information like this"}, {"s": 1912.83, "e": 1914.51, "t": "shouldn't fall through the cracks."}, {"s": 1914.51, "e": 1916.28, "t": "And this is why we've asked Ground News"}, {"s": 1916.28, "e": 1917.72, "t": "to sponsor this video."}, {"s": 1917.72, "e": 1920.33, "t": "They compile news from outlets all over the world"}, {"s": 1920.33, "e": 1923.72, "t": "into one place so that you can easily see the partisan split"}, {"s": 1923.72, "e": 1925.25, "t": "and with their color-coded layout,"}, {"s": 1925.25, "e": 1928.76, "t": "it's also easy to sort your news by factuality, ownership"}, {"s": 1928.76, "e": 1930.44, "t": "and source so that you can see"}, {"s": 1930.44, "e": 1933.26, "t": "how a story like this is getting covered side by side"}, {"s": 1933.26, "e": 1934.88, "t": "with all the context you need."}, {"s": 1934.88, "e": 1936.68, "t": "Take these two headlines for example,"}, {"s": 1936.68, "e": 1938.33, "t": "this article from the \"Herald Sun\""}, {"s": 1938.33, "e": 1940.7, "t": "only talks about the fear of asbestos,"}, {"s": 1940.7, "e": 1943.61, "t": "while this very high factuality source firmly states"}, {"s": 1943.61, "e": 1946.73, "t": "that asbestos was found in decorative sand,"}, {"s": 1946.73, "e": 1947.87, "t": "that difference matters,"}, {"s": 1947.87, "e": 1949.67, "t": "I would like to know whether the concern"}, {"s": 1949.67, "e": 1953.6, "t": "is over a mere suspicion or actual asbestos contamination,"}, {"s": 1953.6, "e": 1955.76, "t": "and that's why I find Ground News so useful."}, {"s": 1955.76, "e": 1957.2, "t": "You get the full picture,"}, {"s": 1957.2, "e": 1960.02, "t": "not just one headline sensationalizing for clicks."}, {"s": 1960.02, "e": 1962.3, "t": "And they also have a dedicated blind spot feed"}, {"s": 1962.3, "e": 1964.01, "t": "for stories like these that are, you know,"}, {"s": 1964.01, "e": 1965.96, "t": "disproportionately covered by either side"}, {"s": 1965.96, "e": 1967.4, "t": "of the political spectrum,"}, {"s": 1967.4, "e": 1970.25, "t": "all to help people avoid their echo chambers."}, {"s": 1970.25, "e": 1972.38, "t": "Now, we partnered up with Ground News"}, {"s": 1972.38, "e": 1975.26, "t": "because we share the same mission, getting to the truth,"}, {"s": 1975.26, "e": 1978.59, "t": "and that's why we're offering 40% off their vantage plan"}, {"s": 1978.59, "e": 1981.08, "t": "at ground.news/ve."}, {"s": 1981.08, "e": 1982.97, "t": "So if you wanna support the channel,"}, {"s": 1982.97, "e": 1985.76, "t": "but also want a clearer understanding of the world,"}, {"s": 1985.76, "e": 1987.38, "t": "check out that link in the description,"}, {"s": 1987.38, "e": 1989.72, "t": "or you can also scan this QR code."}, {"s": 1989.72, "e": 1991.04, "t": "So I wanna thank Ground News"}, {"s": 1991.04, "e": 1992.93, "t": "for sponsoring this part of the video,"}, {"s": 1992.93, "e": 1994.58, "t": "and now let's go figure out"}, {"s": 1994.58, "e": 1996.2, "t": "why asbestos is even getting"}, {"s": 1996.2, "e": 1998.21, "t": "into all these consumer products."}, {"s": 1998.21, "e": 2001.36, "t": "Now, no one is intentionally putting asbestos in makeup"}, {"s": 2001.36, "e": 2002.71, "t": "or kids' toys,"}, {"s": 2002.71, "e": 2005.38, "t": "so how did something we know is deadly"}, {"s": 2005.38, "e": 2007.48, "t": "just end up everywhere?"}, {"s": 2007.48, "e": 2009.4, "t": "Well, it's an unfortunate consequence"}, {"s": 2009.4, "e": 2011.23, "t": "of where asbestos forms"}, {"s": 2011.23, "e": 2014.77, "t": "and nowhere makes that more clear than Libby, Montana."}, {"s": 2016.0, "e": 2018.15, "t": "- It kind of breaks my heart to talk about it."}, {"s": 2020.53, "e": 2022.45, "t": "The mine up there is vermiculite mine."}, {"s": 2022.45, "e": 2024.49, "t": "It's about five six miles north."}, {"s": 2024.49, "e": 2025.66, "t": "- Vermiculite is a mineral"}, {"s": 2025.66, "e": 2026.83, "t": "that is used in everything"}, {"s": 2026.83, "e": 2030.28, "t": "from insulation to fireproofing to potting soil."}, {"s": 2030.28, "e": 2032.35, "t": "On its own, it's harmless."}, {"s": 2032.35, "e": 2034.42, "t": "The problem was, Libby's vermiculite"}, {"s": 2034.42, "e": 2038.45, "t": "formed mixed in with affable asbestos fibers."}, {"s": 2038.45, "e": 2041.32, "t": "And the same thing happens with other minerals we mine,"}, {"s": 2041.32, "e": 2043.87, "t": "including stuff like talc."}, {"s": 2043.87, "e": 2045.79, "t": "That's how asbestos ends up in products"}, {"s": 2045.79, "e": 2047.65, "t": "like the ones we saw at Sean's lab."}, {"s": 2049.09, "e": 2051.37, "t": "And the worst part, the company that owned"}, {"s": 2051.37, "e": 2054.91, "t": "and operated the mine, W.R. Grace, they knew,"}, {"s": 2054.91, "e": 2056.83, "t": "they knew the ore contained asbestos."}, {"s": 2056.83, "e": 2058.42, "t": "They knew people were getting sick"}, {"s": 2058.42, "e": 2060.19, "t": "and they didn't warn the town."}, {"s": 2060.19, "e": 2065.02, "t": "In fact, they tried to cover it up for almost 30 years."}, {"s": 2065.02, "e": 2067.27, "t": "- They had hundreds of workers in there."}, {"s": 2067.27, "e": 2069.52, "t": "And of course, when the miners would go home,"}, {"s": 2069.52, "e": 2071.29, "t": "they had dust all over their clothes,"}, {"s": 2071.29, "e": 2074.62, "t": "and their kids and their wives got it and died as well."}, {"s": 2074.62, "e": 2076.36, "t": "But the doctors up around Libby,"}, {"s": 2076.36, "e": 2078.91, "t": "they knew, boy did they know."}, {"s": 2078.91, "e": 2080.05, "t": "- Besides the lung disease"}, {"s": 2080.05, "e": 2083.08, "t": "and cancer's long associated with asbestos exposure,"}, {"s": 2083.08, "e": 2085.0, "t": "researchers were also finding rates"}, {"s": 2085.0, "e": 2088.06, "t": "of some autoimmune diseases were nearly six times higher"}, {"s": 2088.06, "e": 2089.38, "t": "than the national average."}, {"s": 2089.38, "e": 2091.24, "t": "And by the time the Libby situation"}, {"s": 2091.24, "e": 2093.34, "t": "hit the headlines in 1999,"}, {"s": 2093.34, "e": 2096.31, "t": "reporters documented nearly 200 deaths"}, {"s": 2096.31, "e": 2098.47, "t": "in a town of fewer than 3,000."}, {"s": 2098.47, "e": 2100.42, "t": "- And it could take 20 years for it to go,"}, {"s": 2100.42, "e": 2103.21, "t": "but pretty soon you have no breath at all"}, {"s": 2103.21, "e": 2105.1, "t": "and you die of asphyxiation."}, {"s": 2105.1, "e": 2108.67, "t": "I could tell I'm talking on the phone by somebody's voice,"}, {"s": 2108.67, "e": 2110.59, "t": "how far along they were toward death,"}, {"s": 2111.49, "e": 2113.23, "t": "because none of 'em survived."}, {"s": 2113.23, "e": 2114.64, "t": "- Finally, in 2009,"}, {"s": 2114.64, "e": 2117.97, "t": "the EPA declared a public health emergency in Libby,"}, {"s": 2117.97, "e": 2120.28, "t": "calling it \"The worst case of industrial poisoning"}, {"s": 2120.28, "e": 2123.01, "t": "of a community in US history.\""}, {"s": 2123.01, "e": 2125.29, "t": "- But Libby's just the tip of the iceberg,"}, {"s": 2126.55, "e": 2129.85, "t": "- Because for decades, W.R. Grace shipped Libby vermiculite"}, {"s": 2129.85, "e": 2131.02, "t": "around the country,"}, {"s": 2131.02, "e": 2133.99, "t": "and with it, deadly affable asbestos,"}, {"s": 2133.99, "e": 2137.41, "t": "which ended up in millions of homes as attic insulation."}, {"s": 2138.31, "e": 2140.35, "t": "And Grace also made a fireproof spray"}, {"s": 2140.35, "e": 2143.89, "t": "that was used on the steel frames of high-rise buildings."}, {"s": 2143.89, "e": 2146.86, "t": "By 1970, over half of the multi-story buildings"}, {"s": 2146.86, "e": 2150.28, "t": "erected in the United States used this fireproof spray,"}, {"s": 2150.28, "e": 2152.26, "t": "including the World Trade Center."}, {"s": 2153.4, "e": 2157.45, "t": "But this spray was actually marketed as asbestos-free."}, {"s": 2157.45, "e": 2160.6, "t": "According to a later investigation by the \"New York Times,\""}, {"s": 2160.6, "e": 2162.31, "t": "Grace lobbied regulators"}, {"s": 2162.31, "e": 2165.37, "t": "to adopt a threshold under which products containing less"}, {"s": 2165.37, "e": 2168.61, "t": "than 1% of asbestos would not be regulated."}, {"s": 2168.61, "e": 2170.11, "t": "Grace argued that the danger"}, {"s": 2170.11, "e": 2172.69, "t": "of such small amounts had not been proved."}, {"s": 2172.69, "e": 2176.5, "t": "This became known as the 1% rule or the Grace Rule."}, {"s": 2176.5, "e": 2179.02, "t": "That decision didn't just affect the products"}, {"s": 2179.02, "e": 2180.28, "t": "from Libby's mine,"}, {"s": 2180.28, "e": 2183.97, "t": "it reshaped how asbestos was detected, regulated,"}, {"s": 2183.97, "e": 2186.45, "t": "and ignored everywhere."}, {"s": 2186.45, "e": 2190.44, "t": "(building roaring) (sirens wailing)"}, {"s": 2190.44, "e": 2192.53, "t": "- [Speaker] Oh my God! (people chattering)"}, {"s": 2192.53, "e": 2193.72, "t": "- [Speaker] Look at the shadow of death!"}, {"s": 2193.72, "e": 2195.43, "t": "- [Speaker] Oh my God!"}, {"s": 2195.43, "e": 2197.59, "t": "- Okay, when that went down, I knew it."}, {"s": 2197.59, "e": 2200.2, "t": "I knew they had asbestos, and so I started calling."}, {"s": 2200.2, "e": 2201.85, "t": "I said, \"What do you,"}, {"s": 2201.85, "e": 2203.95, "t": "how are you gonna protect people from that"}, {"s": 2203.95, "e": 2205.54, "t": "'cause now that stuff's all over the place."}, {"s": 2205.54, "e": 2207.52, "t": "You saw the dust clouds, right?\""}, {"s": 2207.52, "e": 2210.85, "t": "- [Gregor] September 11th became the largest real world test"}, {"s": 2210.85, "e": 2214.69, "t": "of asbestos detection following a single catastrophic event."}, {"s": 2214.69, "e": 2216.79, "t": "- The dust is so thick you can't see."}, {"s": 2216.79, "e": 2218.74, "t": "- When the EPA began sampling the dust"}, {"s": 2218.74, "e": 2221.74, "t": "and analyzing it, they chose a method we use back at the lab"}, {"s": 2221.74, "e": 2224.58, "t": "called polarized light microscopy or PLM."}, {"s": 2224.58, "e": 2227.47, "t": "But the PLM has two major limitations."}, {"s": 2227.47, "e": 2229.6, "t": "First, it's struggles to detect asbestos"}, {"s": 2229.6, "e": 2232.93, "t": "if it's less than 1% by weight in the sample,"}, {"s": 2232.93, "e": 2235.42, "t": "and second, it can only see the fibers"}, {"s": 2235.42, "e": 2238.33, "t": "that are roughly longer than about five micrometers"}, {"s": 2238.33, "e": 2241.69, "t": "or wider than about a quarter of a micrometer."}, {"s": 2241.69, "e": 2243.31, "t": "As a result, the smallest"}, {"s": 2243.31, "e": 2245.44, "t": "and oftentimes the most dangerous fibers,"}, {"s": 2245.44, "e": 2248.38, "t": "like the ones pulverized during the collapse of the towers,"}, {"s": 2248.38, "e": 2250.7, "t": "are difficult to detect using just the PLM."}, {"s": 2252.03, "e": 2253.12, "t": "To reliably find these,"}, {"s": 2253.12, "e": 2256.09, "t": "you need transmission electron microscopy or TEM."}, {"s": 2257.08, "e": 2258.94, "t": "- [Sean] Where we top out of about a thousand times"}, {"s": 2258.94, "e": 2260.71, "t": "with electro, with light microscopy,"}, {"s": 2260.71, "e": 2264.37, "t": "this tops out at about a million times."}, {"s": 2264.37, "e": 2268.9, "t": "But what we need to see is just what are the finest fibers"}, {"s": 2268.9, "e": 2271.33, "t": "that potentially can go into your lung."}, {"s": 2271.33, "e": 2273.28, "t": "- [Gregor] Without having used a TEM,"}, {"s": 2273.28, "e": 2276.22, "t": "the EPA declared New York's air safe."}, {"s": 2276.22, "e": 2277.87, "t": "- Everything we've tested for,"}, {"s": 2277.87, "e": 2279.79, "t": "which includes asbestos, lead,"}, {"s": 2279.79, "e": 2283.12, "t": "and VOCs have been below any level of concern"}, {"s": 2283.12, "e": 2284.62, "t": "for the general public health."}, {"s": 2286.24, "e": 2288.28, "t": "- [Gregor] But some researchers after 911"}, {"s": 2288.28, "e": 2290.89, "t": "actually did do studies with TEM."}, {"s": 2290.89, "e": 2292.33, "t": "They found asbestos levels"}, {"s": 2292.33, "e": 2294.85, "t": "far above the EPA's own safety thresholds"}, {"s": 2294.85, "e": 2296.44, "t": "in most of their samples."}, {"s": 2296.44, "e": 2298.24, "t": "And the report also warned that"}, {"s": 2298.24, "e": 2299.68, "t": "because many of these fibers"}, {"s": 2299.68, "e": 2301.54, "t": "were actually smaller than normal,"}, {"s": 2301.54, "e": 2303.91, "t": "they were especially dangerous."}, {"s": 2303.91, "e": 2305.08, "t": "They posted the results"}, {"s": 2305.08, "e": 2308.11, "t": "on the American Industrial Hygiene Association website,"}, {"s": 2308.11, "e": 2311.47, "t": "but within hours, their post disappeared."}, {"s": 2311.47, "e": 2313.3, "t": "Less than 24 hours later,"}, {"s": 2313.3, "e": 2316.24, "t": "the researchers were notified they been taken off the job"}, {"s": 2316.24, "e": 2319.21, "t": "and were no longer required at Ground Zero."}, {"s": 2319.21, "e": 2322.6, "t": "One former EPA chief investigator later went on CBS"}, {"s": 2322.6, "e": 2326.02, "t": "saying they believe the agency had deliberately used"}, {"s": 2326.02, "e": 2329.14, "t": "the wrong testing methods and downplayed the danger."}, {"s": 2330.04, "e": 2334.39, "t": "- New York City directly lied about the test results"}, {"s": 2334.39, "e": 2335.89, "t": "for asbestos in air."}, {"s": 2335.89, "e": 2339.04, "t": "When they finally released them, they doctored the result."}, {"s": 2340.36, "e": 2342.55, "t": "- We don't know if that's true, but to be clear,"}, {"s": 2342.55, "e": 2345.13, "t": "PLM is still widely used to detect asbestos"}, {"s": 2345.13, "e": 2348.88, "t": "because it's faster, it's cheaper, it's easier to deploy."}, {"s": 2348.88, "e": 2350.83, "t": "But what we do know is two things."}, {"s": 2350.83, "e": 2353.68, "t": "First, the PLM method was not sensitive enough"}, {"s": 2353.68, "e": 2355.72, "t": "to detect whether there were asbestos fibers"}, {"s": 2355.72, "e": 2357.37, "t": "in the dust at Ground Zero."}, {"s": 2357.37, "e": 2360.04, "t": "And second, the EPA did have other,"}, {"s": 2360.04, "e": 2362.77, "t": "more sensitive methods available to them."}, {"s": 2362.77, "e": 2365.14, "t": "Whatever the motives, the result was the same."}, {"s": 2365.14, "e": 2366.34, "t": "New Yorkers were told"}, {"s": 2366.34, "e": 2369.01, "t": "that the air was safe when it really wasn't."}, {"s": 2369.01, "e": 2371.21, "t": "And as of December, 2023,"}, {"s": 2371.21, "e": 2374.77, "t": "6,781 of those who have been registered"}, {"s": 2374.77, "e": 2377.77, "t": "with the World Trade Center Health Program have died"}, {"s": 2377.77, "e": 2380.17, "t": "either of an illness or a cancer"}, {"s": 2380.17, "e": 2383.21, "t": "linked just to their time being around Ground Zero."}, {"s": 2383.21, "e": 2387.88, "t": "(suspenseful music) (sirens wailing)"}, {"s": 2387.88, "e": 2390.07, "t": "But even if the EPA had used the TEM,"}, {"s": 2390.07, "e": 2392.05, "t": "the answer would still not be simple"}, {"s": 2392.05, "e": 2396.04, "t": "because even then researchers run into a more basic problem."}, {"s": 2396.04, "e": 2399.19, "t": "What actually counts as asbestos?"}, {"s": 2399.19, "e": 2400.51, "t": "- Is there asbestos in the air?"}, {"s": 2400.51, "e": 2401.89, "t": "Is there asbestos in the soil?"}, {"s": 2401.89, "e": 2403.21, "t": "Is there asbestos in the water?"}, {"s": 2403.21, "e": 2405.01, "t": "Is there asbestos in the body?"}, {"s": 2405.01, "e": 2407.98, "t": "All of those counting rules are based on fibers"}, {"s": 2407.98, "e": 2410.11, "t": "that are not super-long,"}, {"s": 2410.11, "e": 2414.58, "t": "but they're way longer than the vast majority of say,"}, {"s": 2414.58, "e": 2416.38, "t": "Libby amphibole fibers"}, {"s": 2416.38, "e": 2420.46, "t": "and the vast majority of fibers that are inhaled."}, {"s": 2420.46, "e": 2423.1, "t": "So they're not even counting those,"}, {"s": 2423.1, "e": 2424.9, "t": "they're not even looking for them."}, {"s": 2425.77, "e": 2428.29, "t": "The ways that we are right now"}, {"s": 2428.29, "e": 2430.96, "t": "telling people whether they're being exposed or not"}, {"s": 2430.96, "e": 2432.46, "t": "is a lie!"}, {"s": 2432.46, "e": 2434.35, "t": "- [Gregor] And when longer fibers break"}, {"s": 2434.35, "e": 2436.73, "t": "forming these so-called cleavage fragments,"}, {"s": 2436.73, "e": 2437.56, "t": "they don't count either."}, {"s": 2437.56, "e": 2439.64, "t": "- Yeah, there's a whole effort to say,"}, {"s": 2439.64, "e": 2443.44, "t": "\"Oh yeah, if it's been broken, it's not dangerous.\""}, {"s": 2443.44, "e": 2445.39, "t": "But there are so many papers out there that show"}, {"s": 2445.39, "e": 2448.03, "t": "that if you put pure cleavage fragments into mice,"}, {"s": 2448.03, "e": 2449.28, "t": "they get very, very sick."}, {"s": 2450.58, "e": 2451.63, "t": "- [Gregor] This really matters"}, {"s": 2451.63, "e": 2453.07, "t": "when you're in a place like this"}, {"s": 2453.07, "e": 2454.15, "t": "and you realize the dust"}, {"s": 2454.15, "e": 2456.43, "t": "could be considered asbestos-contaminated"}, {"s": 2456.43, "e": 2457.78, "t": "under one definition,"}, {"s": 2457.78, "e": 2460.12, "t": "and perfectly safe under another."}, {"s": 2460.12, "e": 2463.72, "t": "- [Researcher] Nobody would've expected to find asbestos here."}, {"s": 2463.72, "e": 2464.77, "t": "- [Gregor] To be clear,"}, {"s": 2464.77, "e": 2467.53, "t": "there were no asbestos mines in Nevada,"}, {"s": 2467.53, "e": 2468.82, "t": "no industrial sites,"}, {"s": 2468.82, "e": 2471.73, "t": "no history of asbestos commercial use at all."}, {"s": 2471.73, "e": 2473.56, "t": "But geologists, Brenda Buck"}, {"s": 2473.56, "e": 2477.07, "t": "and Rod Metcalf found asbestos spread across approximately"}, {"s": 2477.07, "e": 2479.77, "t": "1 million acres outside Las Vegas."}, {"s": 2481.57, "e": 2484.78, "t": "- [Rod] Geologic processes transport these materials."}, {"s": 2484.78, "e": 2487.42, "t": "And you know, before the erosion started,"}, {"s": 2487.42, "e": 2490.87, "t": "they were just in the bedrocks along the mountain front."}, {"s": 2490.87, "e": 2494.89, "t": "Now they're in sediments down they're, in the stream here."}, {"s": 2494.89, "e": 2495.72, "t": "- [Brenda] And the problem"}, {"s": 2495.72, "e": 2497.86, "t": "with the naturally occurring stuff like this is"}, {"s": 2497.86, "e": 2500.95, "t": "it may be only a small percentage in the rock"}, {"s": 2500.95, "e": 2503.56, "t": "and even a smaller percentage in the soil,"}, {"s": 2503.56, "e": 2505.51, "t": "but this stuff gets in the air."}, {"s": 2505.51, "e": 2507.91, "t": "- [Gregor] Entire communities might be breathing it in"}, {"s": 2507.91, "e": 2510.04, "t": "and getting sick without knowing."}, {"s": 2510.04, "e": 2512.77, "t": "So Brenda and Rod tried to warn people."}, {"s": 2512.77, "e": 2515.77, "t": "Back in late 2012, they compiled all of their findings"}, {"s": 2515.77, "e": 2516.67, "t": "for a presentation"}, {"s": 2516.67, "e": 2519.79, "t": "at the Conference of the Geological Society of America."}, {"s": 2519.79, "e": 2521.59, "t": "But before the conference even began,"}, {"s": 2521.59, "e": 2524.35, "t": "the abstract caught the attention of a journalist"}, {"s": 2524.35, "e": 2526.36, "t": "who reported on the story,"}, {"s": 2526.36, "e": 2529.06, "t": "and that's when the pushback started."}, {"s": 2529.06, "e": 2532.51, "t": "Soon the state of Nevada sent a cease and desist letter,"}, {"s": 2532.51, "e": 2535.87, "t": "and officials questioned Brenda and Rod's methods."}, {"s": 2535.87, "e": 2538.24, "t": "- So if you go to Las Vegas, you're gonna get exposed"}, {"s": 2538.24, "e": 2540.34, "t": "to asbestos that they didn't want that out there."}, {"s": 2540.34, "e": 2542.92, "t": "- Every time I drove into Boulder City,"}, {"s": 2542.92, "e": 2546.61, "t": "there was an official tailing me within a minute."}, {"s": 2546.61, "e": 2550.48, "t": "- The message was clear, don't look any further."}, {"s": 2550.48, "e": 2552.49, "t": "Well, we did decide to look further."}, {"s": 2552.49, "e": 2554.5, "t": "So we drove out into the desert"}, {"s": 2554.5, "e": 2556.69, "t": "to a popular off-roading spot"}, {"s": 2556.69, "e": 2559.08, "t": "to test whether there really is asbestos"}, {"s": 2559.08, "e": 2561.73, "t": "in the dust around Las Vegas."}, {"s": 2561.73, "e": 2563.62, "t": "Okay, I'm strapped into a dune buggy here."}, {"s": 2563.62, "e": 2565.08, "t": "I'm going to go down in that basin,"}, {"s": 2565.08, "e": 2568.27, "t": "and Sean's strapped up some dust collectors"}, {"s": 2568.27, "e": 2570.55, "t": "with receivers in my breathing zone"}, {"s": 2570.55, "e": 2571.63, "t": "so we can actually figure out"}, {"s": 2571.63, "e": 2573.43, "t": "how much asbestos I would be inhaling"}, {"s": 2573.43, "e": 2575.6, "t": "through the dust that I kick up."}, {"s": 2575.6, "e": 2579.34, "t": "(dune buggy engine spluttering)"}, {"s": 2579.34, "e": 2584.34, "t": "(tires roaring) (soft rock music)"}, {"s": 2585.82, "e": 2587.67, "t": "(Gregor laughing)"}, {"s": 2587.67, "e": 2588.5, "t": "Woo!"}, {"s": 2594.03, "e": 2594.89, "t": "You see those donuts, huh?"}, {"s": 2594.89, "e": 2597.04, "t": "- [Sean] Yeah, yeah, you were ripping it up down there."}, {"s": 2597.04, "e": 2599.32, "t": "- [Gregor] Yeah, from a geological point of view,"}, {"s": 2599.32, "e": 2600.4, "t": "any notes?"}, {"s": 2600.4, "e": 2601.3, "t": "- It rained today."}, {"s": 2601.3, "e": 2602.65, "t": "I thought about that while I was watching,"}, {"s": 2602.65, "e": 2604.39, "t": "I was like, \"There might not be much dust,\""}, {"s": 2604.39, "e": 2606.07, "t": "but these are the air samples"}, {"s": 2606.07, "e": 2607.33, "t": "that were hanging in your breathing room, right?"}, {"s": 2607.33, "e": 2608.16, "t": "- Yes, yeah, yeah."}, {"s": 2608.16, "e": 2609.0, "t": "- And I looked at them"}, {"s": 2609.0, "e": 2610.48, "t": "and the filters have some tanning on them."}, {"s": 2610.48, "e": 2611.53, "t": "- Oh, that's good."}, {"s": 2611.53, "e": 2613.84, "t": "- Which means we actually did get some dust."}, {"s": 2613.84, "e": 2615.67, "t": "We don't know what's in it yet,"}, {"s": 2615.67, "e": 2617.53, "t": "but there's something in there."}, {"s": 2617.53, "e": 2618.76, "t": "- But the original plan was for us"}, {"s": 2618.76, "e": 2620.92, "t": "to actually do this at the dry lake bed"}, {"s": 2620.92, "e": 2622.27, "t": "just outside Boulder City,"}, {"s": 2622.27, "e": 2624.37, "t": "because this is where people do the majority"}, {"s": 2624.37, "e": 2625.36, "t": "of their off-roading,"}, {"s": 2625.36, "e": 2626.95, "t": "you know, they camp, they do photo shoots,"}, {"s": 2626.95, "e": 2629.17, "t": "even take their wedding photos,"}, {"s": 2629.17, "e": 2631.0, "t": "except not on the day that we were there."}, {"s": 2631.0, "e": 2635.41, "t": "Okay, we're out here on the dry lake bed, supposedly"}, {"s": 2635.41, "e": 2639.31, "t": "in Las Vegas, where on the one day that we're here,"}, {"s": 2639.31, "e": 2641.32, "t": "the lake has decided not to be dry"}, {"s": 2641.32, "e": 2643.24, "t": "in any sort of definition."}, {"s": 2643.24, "e": 2644.07, "t": "Oh my God."}, {"s": 2644.07, "e": 2646.72, "t": "And so what we're gonna go do is suit up,"}, {"s": 2646.72, "e": 2647.65, "t": "get some samples,"}, {"s": 2647.65, "e": 2649.42, "t": "and figure out how much asbestos"}, {"s": 2649.42, "e": 2652.16, "t": "there really is in this stuff."}, {"s": 2652.16, "e": 2657.16, "t": "(suspenseful music) (people softly chattering)"}, {"s": 2657.71, "e": 2658.87, "t": "- [Sean] Okay."}, {"s": 2663.16, "e": 2664.12, "t": "We're gonna do a third."}, {"s": 2664.12, "e": 2666.32, "t": "Let's go out to that island."}, {"s": 2666.32, "e": 2668.98, "t": "(suspenseful music continues)"}, {"s": 2668.98, "e": 2670.48, "t": "Okay."}, {"s": 2670.48, "e": 2672.61, "t": "- Okay, got the samples."}, {"s": 2672.61, "e": 2675.13, "t": "Next step, take 'em to the lab."}, {"s": 2675.98, "e": 2678.04, "t": "(car door thunks)"}, {"s": 2678.04, "e": 2679.84, "t": "(suspenseful music)"}, {"s": 2679.84, "e": 2682.11, "t": "- Great to see you guys again."}, {"s": 2682.11, "e": 2682.94, "t": "- Yeah, good to see you too."}, {"s": 2682.94, "e": 2685.78, "t": "Well, we are here for one thing I suppose,"}, {"s": 2685.78, "e": 2688.3
