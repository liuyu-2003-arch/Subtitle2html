6, "t": "like what kind of results did we get?"}, {"s": 2688.36, "e": 2691.69, "t": "- Now the big reveal, drum roll please."}, {"s": 2693.13, "e": 2695.89, "t": "I did the dune buggy air samples first."}, {"s": 2695.89, "e": 2697.51, "t": "Those samples that you had on your left"}, {"s": 2697.51, "e": 2698.8, "t": "and right shoulders,"}, {"s": 2698.8, "e": 2701.26, "t": "I didn't find any asbestos fibers."}, {"s": 2701.26, "e": 2702.94, "t": "- Okay, well, I guess that's a bit of a relief."}, {"s": 2702.94, "e": 2704.59, "t": "I'm glad we did the demonstration"}, {"s": 2704.59, "e": 2706.57, "t": "and I'm kind of glad we didn't find anything"}, {"s": 2706.57, "e": 2709.09, "t": "because I'm pretty sure I took my mask off at a few points."}, {"s": 2709.09, "e": 2712.24, "t": "- I've been in those shoes, like, we didn't find anything."}, {"s": 2712.24, "e": 2713.95, "t": "Oh, but wait a minute,"}, {"s": 2713.95, "e": 2717.04, "t": "I was breathing that (beep). (laughing)"}, {"s": 2717.04, "e": 2718.75, "t": "- Exactly. (chuckling)"}, {"s": 2718.75, "e": 2721.42, "t": "So what about the samples in the dry lake bed?"}, {"s": 2721.42, "e": 2724.69, "t": "- Ah, another drum roll."}, {"s": 2725.68, "e": 2728.77, "t": "- Okay. - I found amphibole asbestos."}, {"s": 2728.77, "e": 2730.18, "t": "- Wow, okay."}, {"s": 2730.18, "e": 2732.76, "t": "- It's there. It is there."}, {"s": 2732.76, "e": 2735.22, "t": "I counted up a number of fibers,"}, {"s": 2735.22, "e": 2737.56, "t": "the area of the filter they analyzed,"}, {"s": 2737.56, "e": 2741.22, "t": "and I figured out that we had between 30"}, {"s": 2741.22, "e": 2746.22, "t": "and 50 million asbestos structures per gram of mud"}, {"s": 2750.43, "e": 2751.48, "t": "that we were walking through."}, {"s": 2751.48, "e": 2752.31, "t": "- Whoa."}, {"s": 2753.33, "e": 2756.43, "t": "Just to think that we pulled off to the side of the road,"}, {"s": 2756.43, "e": 2759.19, "t": "walked what, 30 meters, took three samples,"}, {"s": 2759.19, "e": 2762.13, "t": "and all of them had these incredibly high concentrations"}, {"s": 2762.13, "e": 2763.22, "t": "of asbestos right there,"}, {"s": 2763.22, "e": 2764.36, "t": "it's not like we had to go out and find."}, {"s": 2764.36, "e": 2765.55, "t": "- Right."}, {"s": 2765.55, "e": 2769.96, "t": "Very wet soil was lucky for us"}, {"s": 2769.96, "e": 2773.29, "t": "because we know there's asbestos in that soil."}, {"s": 2773.29, "e": 2774.7, "t": "Now think about the guys"}, {"s": 2774.7, "e": 2776.59, "t": "that go taking their jeep across there"}, {"s": 2776.59, "e": 2778.69, "t": "when it is a dry lake."}, {"s": 2778.69, "e": 2780.31, "t": "- I mean, that was our initial plan"}, {"s": 2780.31, "e": 2782.41, "t": "to do the dune bugging there."}, {"s": 2782.41, "e": 2783.64, "t": "And I can't like help"}, {"s": 2783.64, "e": 2786.07, "t": "but think about people drive down that road all the time."}, {"s": 2786.07, "e": 2788.14, "t": "They must pull over, they must go down there,"}, {"s": 2788.14, "e": 2790.48, "t": "like just kick dust and rocks and-"}, {"s": 2790.48, "e": 2792.97, "t": "- [Sean] We know they do. We know they do."}, {"s": 2792.97, "e": 2795.04, "t": "- And there's no sign to tell you"}, {"s": 2795.04, "e": 2797.34, "t": "that there's anything wrong with the dry lake."}, {"s": 2799.66, "e": 2801.73, "t": "It's not like we, you know, discovered this,"}, {"s": 2801.73, "e": 2804.25, "t": "this has been available data since-"}, {"s": 2805.3, "e": 2808.93, "t": "- [Sean] October of 2013 is the actual publication date"}, {"s": 2808.93, "e": 2810.82, "t": "of naturally occurring asbestos,"}, {"s": 2810.82, "e": 2812.26, "t": "potential for human exposure"}, {"s": 2812.26, "e": 2815.68, "t": "in Southern Nevada by Brenda Buck et al."}, {"s": 2816.94, "e": 2818.77, "t": "- So 13 years we've had this data."}, {"s": 2818.77, "e": 2820.87, "t": "It's not like we'd rediscovered anything."}, {"s": 2820.87, "e": 2822.25, "t": "- And that's the other thing that's really hard"}, {"s": 2822.25, "e": 2823.63, "t": "about this science."}, {"s": 2823.63, "e": 2825.52, "t": "You need the public to be aware,"}, {"s": 2825.52, "e": 2827.44, "t": "but you don't want to terrify them."}, {"s": 2827.44, "e": 2829.42, "t": "And so how do you find the right way?"}, {"s": 2831.19, "e": 2832.39, "t": "- [Gregor] This will potentially be seen"}, {"s": 2832.39, "e": 2833.74, "t": "by tens of millions of people."}, {"s": 2833.74, "e": 2836.35, "t": "So is there a message you want to get out?"}, {"s": 2836.35, "e": 2839.74, "t": "- This is a natural hazard,"}, {"s": 2839.74, "e": 2841.87, "t": "just like a lot of things in your life,"}, {"s": 2841.87, "e": 2844.15, "t": "it's really good for people to know whether"}, {"s": 2844.15, "e": 2846.61, "t": "or not their house is in a flooding zone, right?"}, {"s": 2846.61, "e": 2849.01, "t": "It's really good to know about earthquake risks."}, {"s": 2849.01, "e": 2852.34, "t": "It's really good to know about hurricanes and tornadoes."}, {"s": 2852.34, "e": 2855.37, "t": "Well, this is just another natural hazard,"}, {"s": 2855.37, "e": 2857.32, "t": "and if you have the information,"}, {"s": 2857.32, "e": 2860.8, "t": "then you can make better decisions to live a healthier life."}, {"s": 2861.67, "e": 2864.25, "t": "(gentle music)"}, {"s": 2875.5, "e": 2876.33, "t": "- [Gregor] One big problem"}, {"s": 2876.33, "e": 2878.11, "t": "is that asbestos in the real world"}, {"s": 2878.11, "e": 2880.48, "t": "doesn't line up with how it's regulated."}, {"s": 2880.48, "e": 2881.71, "t": "Take this fiber,"}, {"s": 2881.71, "e": 2884.47, "t": "it comes from a sample of the same blue asbestos"}, {"s": 2884.47, "e": 2886.24, "t": "from the site outside Las Vegas"}, {"s": 2886.24, "e": 2888.43, "t": "we visited at the start of the video."}, {"s": 2888.43, "e": 2891.16, "t": "- [Sean] I think we have two different phases,"}, {"s": 2891.16, "e": 2894.19, "t": "at least of amphibole here"}, {"s": 2894.19, "e": 2896.92, "t": "because if it's yellow in this orientation,"}, {"s": 2896.92, "e": 2900.28, "t": "but also blue in this orientation in the same fiber bundle,"}, {"s": 2900.28, "e": 2905.11, "t": "then we have a change in the phase from here to here."}, {"s": 2906.1, "e": 2909.91, "t": "- [Gregor] So this one fiber is actually two minerals."}, {"s": 2909.91, "e": 2912.88, "t": "And that complexity shows up in its structure too,"}, {"s": 2912.88, "e": 2914.56, "t": "under the electron microscope,"}, {"s": 2914.56, "e": 2917.17, "t": "one side could meet the definition of asbestos,"}, {"s": 2917.17, "e": 2919.78, "t": "the other may not simply because of its shape."}, {"s": 2919.78, "e": 2923.86, "t": "So one single fiber could fall within one of the six named"}, {"s": 2923.86, "e": 2927.13, "t": "and regulated asbestos minerals if you look at one side,"}, {"s": 2927.13, "e": 2930.91, "t": "but the other would be completely unregulated."}, {"s": 2930.91, "e": 2933.56, "t": "Your lungs don't care about these categories, though."}, {"s": 2934.45, "e": 2937.69, "t": "- [Narrator] The asbestos fiber, you'll find it everywhere."}, {"s": 2937.69, "e": 2941.56, "t": "No ordinary rock, no single rock indeed,"}, {"s": 2941.56, "e": 2943.18, "t": "but a group of related minerals"}, {"s": 2943.18, "e": 2946.57, "t": "with characteristics in common, but in varying degrees,"}, {"s": 2946.57, "e": 2947.99, "t": "- Most experts will say,"}, {"s": 2947.99, "e": 2951.46, "t": "\"Asbestos isn't a mineral or a geologic term,"}, {"s": 2951.46, "e": 2956.26, "t": "it's a commercial one,\" but that's symbolics."}, {"s": 2956.26, "e": 2961.26, "t": "Why do I say that? Because it's not just a commercial term."}, {"s": 2961.39, "e": 2963.85, "t": "We now know that asbestos can kill you."}, {"s": 2963.85, "e": 2965.08, "t": "So if we're gonna say that,"}, {"s": 2965.08, "e": 2968.98, "t": "we have to define it based on health effect, and we don't."}, {"s": 2968.98, "e": 2970.96, "t": "- [Gregor] So what are we actually doing about it?"}, {"s": 2970.96, "e": 2973.3, "t": "The system was so complex, it was so burdensome"}, {"s": 2973.3, "e": 2977.56, "t": "that our country hasn't even been able to uphold a ban"}, {"s": 2977.56, "e": 2981.73, "t": "on asbestos, a known carcinogen that kills as many"}, {"s": 2981.73, "e": 2984.4, "t": "as 10,000 Americans every year."}, {"s": 2984.4, "e": 2985.36, "t": "- [Gregor] Well, in 2016,"}, {"s": 2985.36, "e": 2987.88, "t": "Congress did try to fix this broken system."}, {"s": 2987.88, "e": 2990.46, "t": "They passed an amendment giving the EPA new power"}, {"s": 2990.46, "e": 2993.04, "t": "to evaluate and restrict dangerous chemicals,"}, {"s": 2993.04, "e": 2994.45, "t": "including asbestos."}, {"s": 2995.47, "e": 2998.59, "t": "- I think it's time to sign the Frank R. Ladenburg"}, {"s": 2998.59, "e": 3002.07, "t": "Chemical Safety for the 21st Century Act into law."}, {"s": 3002.07, "e": 3004.98, "t": "- [Gregor] But then progress stalled, again."}, {"s": 3006.36, "e": 3007.95, "t": "Under the Trump administration,"}, {"s": 3007.95, "e": 3011.91, "t": "efforts to strengthen asbestos rules slowed dramatically."}, {"s": 3011.91, "e": 3014.05, "t": "Trump had publicly praised asbestos for years."}, {"s": 3014.05, "e": 3016.35, "t": "- A lot of people in my industry think asbestos"}, {"s": 3016.35, "e": 3020.31, "t": "is the greatest fireproofing material ever, ever made!"}, {"s": 3020.31, "e": 3022.41, "t": "- It wasn't until 2024"}, {"s": 3022.41, "e": 3025.56, "t": "that the US finally banned chrysotile asbestos."}, {"s": 3025.56, "e": 3027.18, "t": "But this ban doesn't cover"}, {"s": 3027.18, "e": 3029.1, "t": "the other five types of asbestos,"}, {"s": 3029.1, "e": 3032.07, "t": "and it still allows some manufacturers up to 12 years"}, {"s": 3032.07, "e": 3033.87, "t": "to phase it out."}, {"s": 3033.87, "e": 3035.67, "t": "It doesn't address what to do with asbestos"}, {"s": 3035.67, "e": 3036.78, "t": "already in schools"}, {"s": 3036.78, "e": 3038.79, "t": "and homes and other buildings,"}, {"s": 3038.79, "e": 3040.56, "t": "nor does it fix any of the numerous"}, {"s": 3040.56, "e": 3042.27, "t": "classification, identification,"}, {"s": 3042.27, "e": 3044.04, "t": "and detection loopholes,"}, {"s": 3044.04, "e": 3046.95, "t": "and it doesn't address the asbestos in the environment."}, {"s": 3047.79, "e": 3050.91, "t": "On top of that, the EPA is already getting sued, again."}, {"s": 3052.47, "e": 3055.65, "t": "- There have been tremendous forces"}, {"s": 3055.65, "e": 3058.05, "t": "from commercial industries"}, {"s": 3058.05, "e": 3061.62, "t": "to make it sound like it's not as bad as it is,"}, {"s": 3061.62, "e": 3065.46, "t": "and to find ways to allow them"}, {"s": 3065.46, "e": 3068.29, "t": "to continue to use the material."}, {"s": 3068.29, "e": 3072.78, "t": "This is a sad, sad fact of our decision-making"}, {"s": 3072.78, "e": 3073.61, "t": "in our country"}, {"s": 3073.61, "e": 3076.17, "t": "and other countries, is that it's driven by money."}, {"s": 3076.17, "e": 3077.94, "t": "- But at least the United States are going"}, {"s": 3077.94, "e": 3079.5, "t": "for some level of moderation."}, {"s": 3079.5, "e": 3081.42, "t": "Other countries are not that lucky."}, {"s": 3081.42, "e": 3086.42, "t": "In 2019, India imported more than 350,000 tons of asbestos,"}, {"s": 3086.58, "e": 3089.31, "t": "and it's predicted that in the upcoming decades,"}, {"s": 3089.31, "e": 3090.48, "t": "6 million people there"}, {"s": 3090.48, "e": 3092.85, "t": "might develop asbestos-related diseases."}, {"s": 3092.85, "e": 3094.32, "t": "And similar things are happening"}, {"s": 3094.32, "e": 3096.48, "t": "in many of the other countries in Asia."}, {"s": 3096.48, "e": 3098.28, "t": "We've actually found this website"}, {"s": 3098.28, "e": 3101.4, "t": "where it looks like you can just buy asbestos cloth"}, {"s": 3101.4, "e": 3104.76, "t": "made in China, but please don't."}, {"s": 3104.76, "e": 3107.28, "t": "And all of the asbestos that we've already mined,"}, {"s": 3107.28, "e": 3110.7, "t": "even after we stop using it, it's still out there."}, {"s": 3110.7, "e": 3114.33, "t": "Asbestos doesn't naturally decay in the environment."}, {"s": 3114.33, "e": 3116.46, "t": "So should you be worried?"}, {"s": 3116.46, "e": 3119.13, "t": "Well, having asbestos in your house"}, {"s": 3119.13, "e": 3121.5, "t": "doesn't automatically mean that it's dangerous."}, {"s": 3121.5, "e": 3123.33, "t": "If you have asbestos in your ceiling"}, {"s": 3123.33, "e": 3126.24, "t": "and you don't drill into it, you're probably gonna be fine."}, {"s": 3126.24, "e": 3129.57, "t": "Asbestos is an issue if the particles go airborne,"}, {"s": 3130.53, "e": 3133.89, "t": "but who knows which house has asbestos,"}, {"s": 3133.89, "e": 3135.63, "t": "where all of that asbestos is,"}, {"s": 3135.63, "e": 3137.55, "t": "who's gonna take care of it and how?"}, {"s": 3137.55, "e": 3139.83, "t": "So a lot of the answers to these questions"}, {"s": 3139.83, "e": 3141.69, "t": "just don't exist yet."}, {"s": 3141.69, "e": 3144.75, "t": "But if you're worried about asbestos exposure for yourself,"}, {"s": 3144.75, "e": 3147.35, "t": "check out the links that we've put in the description."}, {"s": 3148.98, "e": 3150.6, "t": "I think a big part of the problem is"}, {"s": 3150.6, "e": 3153.54, "t": "that people assume asbestos is a solved issue."}, {"s": 3153.54, "e": 3154.65, "t": "And I'll be the first to admit,"}, {"s": 3154.65, "e": 3156.42, "t": "I fell for that line of thinking."}, {"s": 3156.42, "e": 3158.82, "t": "Here's the ending I wrote for our PFAS video."}, {"s": 3158.82, "e": 3162.12, "t": "- We've been here before with lead gasoline, Freon"}, {"s": 3162.12, "e": 3165.21, "t": "and asbestos, and each time we did the research"}, {"s": 3165.21, "e": 3168.45, "t": "and made the right decision to phase these chemicals out."}, {"s": 3168.45, "e": 3170.7, "t": "- Yeah, I was completely oblivious."}, {"s": 3172.83, "e": 3174.63, "t": "- We will look back at our history"}, {"s": 3174.63, "e": 3177.03, "t": "and what do we do with tobacco?"}, {"s": 3177.03, "e": 3178.98, "t": "Everybody was smoking, right?"}, {"s": 3178.98, "e": 3180.57, "t": "It would be improper for me"}, {"s": 3180.57, "e": 3182.1, "t": "to not offer an ashtray"}, {"s": 3182.1, "e": 3184.53, "t": "even if I wasn't a smoker back in the day."}, {"s": 3184.53, "e": 3186.78, "t": "And all the scientists working"}, {"s": 3186.78, "e": 3188.62, "t": "for the big cigarette companies said,"}, {"s": 3188.62, "e": 3190.95, "t": "\"Why, tobacco never hurt anybody.\""}, {"s": 3190.95, "e": 3194.1, "t": "But because of the outcry"}, {"s": 3194.1, "e": 3198.84, "t": "and the recognition that smoking causes disease,"}, {"s": 3198.84, "e": 3200.46, "t": "everybody knows someone who died"}, {"s": 3200.46, "e": 3201.91, "t": "because of cigarettes, right?"}, {"s": 3203.58, "e": 3207.45, "t": "Now, you might find out that asbestos-related diseases"}, {"s": 3207.45, "e": 3210.69, "t": "has touched you in some way, you don't even know yet."}, {"s": 3210.69, "e": 3214.74, "t": "I didn't know my grandfather died because of asbestos,"}, {"s": 3214.74, "e": 3218.28, "t": "that my father is dying more likely than not"}, {"s": 3218.28, "e": 3219.42, "t": "because of asbestos."}, {"s": 3219.42, "e": 3221.7, "t": "Did I know that when I started"}, {"s": 3221.7, "e": 3224.22, "t": "looking at asbestos under a microscope, no."}, {"s": 3224.22, "e": 3227.28, "t": "Did I know that when I changed the brakes on the Jeeps"}, {"s": 3227.28, "e": 3228.99, "t": "that I ran around in, no."}, {"s": 3228.99, "e": 3230.43, "t": "Did I know that when I ran around"}, {"s": 3230.43, "e": 3233.91, "t": "through asbestos-containing dust, no."}, {"s": 3233.91, "e": 3234.74, "t": "Now I do."}, {"s": 3236.13, "e": 3237.51, "t": "- Pretty much every scientist"}, {"s": 3237.51, "e": 3239.31, "t": "and journalist we spoke to for this video"}, {"s": 3239.31, "e": 3240.54, "t": "said the same thing."}, {"s": 3240.54, "e": 3242.76, "t": "This is a hard story to get out there."}, {"s": 3242.76, "e": 3245.67, "t": "They've faced economic pressure, political pressure,"}, {"s": 3245.67, "e": 3247.14, "t": "the research got buried,"}, {"s": 3247.14, "e": 3249.27, "t": "and some people even received death threats"}, {"s": 3249.27, "e": 3250.92, "t": "for reporting on the story."}, {"s": 3250.92, "e": 3253.35, "t": "It is an uncomfortable topic,"}, {"s": 3253.35, "e": 3255.48, "t": "but I think it's these uncomfortable topics"}, {"s": 3255.48, "e": 3256.38, "t": "that matter the most,"}, {"s": 3256.38, "e": 3258.66, "t": "that have the potential to do the most good,"}, {"s": 3258.66, "e": 3260.28, "t": "yet they are also the ones"}, {"s": 3260.28, "e": 3262.65, "t": "that are the most uncomfortable to watch."}, {"s": 3262.65, "e": 3265.53, "t": "So I really appreciate you for sticking around to the end"}, {"s": 3265.53, "e": 3268.2, "t": "and facing the truth, making yourself aware"}, {"s": 3268.2, "e": 3270.39, "t": "and becoming part of the solution."}, {"s": 3270.39, "e": 3274.33, "t": "So perhaps now more than ever, thank you for watching."}, {"s": 3274.33, "e": 3279.33, "t": "(screen chiming) (suspenseful music)"}],DUR=3279.33;
let cur=-1,aF=true,cpt=false,play=false,ct=0,lT=null;
const sl=document.getElementById('sl');
const fr=document.createDocumentFragment();
S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='si';d.id='i'+i;d.onclick=()=>jump(i);
  const ts=document.createElement('span');ts.className='st';ts.textContent=fmt(s.s);
  const tx=document.createElement('span');tx.className='sx';tx.textContent=s.t;
  d.appendChild(ts);d.appendChild(tx);fr.appendChild(d);
});
sl.appendChild(fr);
function fmt(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return h>0?[h,m,s].map(x=>String(x).padStart(2,'0')).join(':'):[m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fmtF(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fi(t){let lo=0,hi=S.length-1,r=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(S[mid].s<=t){r=mid;lo=mid+1;}else hi=mid-1;}return r;}
function act(idx){
  if(idx===cur)return;
  if(cur>=0){const e=document.getElementById('i'+cur);if(e)e.classList.remove('act');}
  cur=idx;
  if(idx>=0){const e=document.getElementById('i'+idx);if(e){e.classList.add('act');if(aF)e.scrollIntoView({behavior:'smooth',block:'center'});}
  document.getElementById('npTx').textContent=S[idx].t;document.getElementById('npIx').textContent=(idx+1)+' / '+S.length;}
}
function jump(i){ct=S[i].s;act(i);upd();}
function upd(){const p=(ct/DUR)*100;document.getElementById('pf').style.width=p+'%';document.getElementById('tL').textContent=fmtF(ct);document.getElementById('sTm').textContent=fmtF(ct);document.getElementById('sPct').textContent=Math.round(p)+'%';}
function seek(e){const r=document.getElementById('pb').getBoundingClientRect();ct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*DUR;act(fi(ct));upd();play=true;lT=null;}
function frame(ts){if(play){if(lT!==null){ct+=(ts-lT)/1000;if(ct>DUR){ct=DUR;play=false;}act(fi(ct));upd();}lT=ts;}else lT=null;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();play=!play;if(play)lT=null;}if(e.code==='ArrowRight'){ct=Math.min(DUR,ct+10);act(fi(ct));upd();}if(e.code==='ArrowLeft'){ct=Math.max(0,ct-10);act(fi(ct));upd();}});
function tA(){aF=!aF;document.getElementById('btnA').classList.toggle('on',aF);}
function tC(){cpt=!cpt;document.getElementById('btnC').classList.toggle('on',cpt);document.querySelectorAll('.si').forEach(l=>{l.style.paddingTop=cpt?'4px':'';l.style.paddingBottom=cpt?'4px':'';l.style.marginBottom=cpt?'0':'';});document.querySelectorAll('.sx').forEach(t=>{t.style.fontSize=cpt?'12.5px':'';});}
function doQ(){const q=document.getElementById('q').value.trim();let cnt=0;document.querySelectorAll('.si').forEach((line,i)=>{const tx=line.querySelector('.sx');if(q&&S[i].t.includes(q)){line.classList.add('sm');const ps=S[i].t.split(q);tx.innerHTML='';ps.forEach((p,pi)=>{tx.appendChild(document.createTextNode(p));if(pi<ps.length-1){const mk=document.createElement('mark');mk.textContent=q;tx.appendChild(mk);}});cnt++;}else{line.classList.remove('sm');tx.textContent=S[i].t;}});const row=document.getElementById('sqR');if(q){row.style.display='flex';document.getElementById('sqC').textContent=cnt+' 处';const f=document.querySelector('.sm');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});}else row.style.display='none';}
</script>
</body>
</html>
