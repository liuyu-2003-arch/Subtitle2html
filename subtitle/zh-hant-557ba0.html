e": 334.03, "t": "斯巴達的制度是雙王制"}, {"s": 334.43, "e": 336.63, "t": "即由來自兩個不同王室"}, {"s": 336.63, "e": 337.83, "t": "阿基亞德家族"}, {"s": 337.83, "e": 339.7, "t": "和歐裡龐提德家族的"}, {"s": 339.8, "e": 342.3, "t": "兩個國王共同統治國家"}, {"s": 343.03, "e": 346.83, "t": "但是斯巴達的國王並不是傳統意義上的君主"}, {"s": 347.1, "e": 348.47, "t": "他們的主要角色"}, {"s": 348.47, "e": 351.7, "t": "其實是軍事指揮官和宙斯的大祭司"}, {"s": 352.27, "e": 356.07, "t": "斯巴達國王幾乎完全沒有專制君主的許可權"}, {"s": 356.07, "e": 357.9, "t": "既不能單獨發動戰爭"}, {"s": 358.03, "e": 360.1, "t": "也不能自行徵召軍隊"}, {"s": 360.53, "e": 364.27, "t": "甚至在國王作為軍事指揮官帶軍出征時"}, {"s": 364.27, "e": 367.93, "t": "也必須由兩名檢察官陪同並監督才行"}, {"s": 368.63, "e": 370.83, "t": "斯巴達國王如果違反了法律"}, {"s": 370.83, "e": 374.33, "t": "還可以被罰款、被流放甚至被廢黜"}, {"s": 374.9, "e": 377.6, "t": "而且國王每個月都必須宣誓"}, {"s": 377.6, "e": 380.0, "t": "按照國家的法律進行統治"}, {"s": 380.0, "e": 382.03, "t": "才能合法保持王權"}, {"s": 382.53, "e": 385.67, "t": "誒好像有點君主立憲內味兒了是吧"}, {"s": 385.7, "e": 386.73, "t": "但是別急"}, {"s": 386.93, "e": 389.5, "t": "這還並不是斯巴達奇葩政體的全部"}, {"s": 390.03, "e": 391.7, "t": "歷史學家通常認為"}, {"s": 391.73, "e": 394.77, "t": "斯巴達的政體其實是一種寡頭政治"}, {"s": 395.1, "e": 400.23, "t": "即國家權力掌握在一個由少數人組成的特權階級手上"}, {"s": 400.67, "e": 403.13, "t": "這個特權階層就是長老會"}, {"s": 403.43, "e": 405.27, "t": "長老會一共30人"}, {"s": 405.27, "e": 409.13, "t": "由28個60歲以上的長老和2個國王組成"}, {"s": 409.53, "e": 411.4, "t": "所以這30寡頭"}, {"s": 411.4, "e": 414.37, "t": "才是斯巴達社會金字塔真正的塔尖"}, {"s": 414.8, "e": 417.67, "t": "斯巴達每年還會選出5名監察官"}, {"s": 418.03, "e": 419.77, "t": "負責監督斯巴達人的行為"}, {"s": 419.83, "e": 421.7, "t": "確保他們遵守法律"}, {"s": 422.43, "e": 424.43, "t": "不過寡頭制的斯巴達"}, {"s": 424.43, "e": 426.23, "t": "其實也有一個民主機構"}, {"s": 426.23, "e": 427.83, "t": "那就是公民大會"}, {"s": 428.4, "e": 431.17, "t": "負責對長老會提出的法案進行投票"}, {"s": 431.7, "e": 434.57, "t": "但是斯巴達公民在公民大會中"}, {"s": 434.83, "e": 436.63, "t": "卻不能既討論法案"}, {"s": 436.63, "e": 438.37, "t": "也不能修改法案"}, {"s": 438.53, "e": 439.73, "t": "大會的作用"}, {"s": 439.73, "e": 443.77, "t": "純粹就是為長老會已經做出的決定蓋上橡皮圖章"}, {"s": 444.03, "e": 446.6, "t": "就類似於“不同意的請舉手"}, {"s": 446.6, "e": 448.5, "t": "沒有沒有沒有”"}, {"s": 448.7, "e": 450.2, "t": "估計在座的很多小夥伴"}, {"s": 450.2, "e": 452.13, "t": "都會有種似曾相識的感覺"}, {"s": 452.6, "e": 454.37, "t": "所以某種意義上來說"}, {"s": 454.4, "e": 456.23, "t": "斯巴達也可以算是一個"}, {"s": 456.23, "e": 458.1, "t": "比雅典更民主的"}, {"s": 458.1, "e": 460.03, "t": "全過程民主國家"}, {"s": 460.83, "e": 463.53, "t": "那這就是斯巴達政體的大致面貌了"}, {"s": 463.53, "e": 465.93, "t": "至於它到底應該算是個什麼政體"}, {"s": 465.93, "e": 468.1, "t": "就交到大家自己判斷了"}, {"s": 471.4, "e": 473.8, "t": "接下來就是最有意思的部分了"}, {"s": 473.8, "e": 477.03, "t": "我們來講講斯巴達人奇葩的生活方式"}, {"s": 477.63, "e": 480.7, "t": "斯巴達式生活是出了名的艱苦"}, {"s": 480.7, "e": 483.9, "t": "以至於今天的人們都直接用斯巴達這個詞"}, {"s": 483.9, "e": 486.97, "t": "作為簡單、樸素或艱苦的代名詞"}, {"s": 487.5, "e": 491.13, "t": "那斯巴達式生活到底有多變態多苦呢"}, {"s": 491.67, "e": 492.5, "t": "在斯巴達"}, {"s": 492.73, "e": 495.7, "t": "教育的目的就是培養優秀的戰士"}, {"s": 496.07, "e": 500.43, "t": "而斯巴達人的教育在受孕之前就已經開始了"}, {"s": 500.67, "e": 504.57, "t": "希臘其他城邦的女人大都在室內從事紡織工作"}, {"s": 504.6, "e": 508.93, "t": "而斯巴達女人則被迫在室外從事高強度體育鍛煉"}, {"s": 509.47, "e": 511.07, "t": "因為斯巴達人相信"}, {"s": 511.53, "e": 514.3, "t": "強壯的母親才能生下“魁梧”的嬰兒"}, {"s": 514.9, "e": 518.0, "t": "斯巴達男人則被要求過禁欲的生活"}, {"s": 518.0, "e": 519.4, "t": "因為斯巴達人相信"}, {"s": 519.4, "e": 522.97, "t": "只有克制欲望才能生出“精力充沛”的後代"}, {"s": 523.8, "e": 527.1, "t": "當一個“魁梧”的、“精力充沛”的嬰兒被生下來之後"}, {"s": 527.1, "e": 530.07, "t": "還要接受部落中最年長的人的檢查"}, {"s": 530.5, "e": 534.67, "t": "他們會把嬰兒浸泡到原漿紅酒中以測試其反應"}, {"s": 534.93, "e": 537.47, "t": "如果他們身體虛弱或帶有殘疾"}, {"s": 537.47, "e": 540.3, "t": "就會被扔到泰格特斯山附近一個棄嬰場裡"}, {"s": 540.83, "e": 542.53, "t": "任其自生自滅"}, {"s": 542.67, "e": 544.43, "t": "非常的叢林法則"}, {"s": 544.93, "e": 546.93, "t": "成功通過篩查的男孩"}, {"s": 546.93, "e": 550.37, "t": "從7歲起就要被強制送到公共訓練營裡"}, {"s": 550.47, "e": 553.5, "t": "接受舉國義務教育體制的洗禮"}, {"s": 553.9, "e": 557.33, "t": "7歲至14歲的斯巴達人被統稱為“男孩”"}, {"s": 557.47, "e": 561.67, "t": "由一名被稱為“男孩牧人”的官員負責他們的教育"}, {"s": 562.03, "e": 564.9, "t": "男孩們會被編成若干組和隊"}, {"s": 565.03, "e": 568.87, "t": "由男孩牧人和執鞭者一起進行管理"}, {"s": 569.07, "e": 571.53, "t": "接受無窮無盡的訓練"}, {"s": 571.53, "e": 576.3, "t": "比如跑步、摔跤、跳躍、投擲、拳擊等等等等"}, {"s": 576.83, "e": 580.07, "t": "而從“執鞭者”的頭銜就能看出來"}, {"s": 580.07, "e": 583.07, "t": "男孩們一旦犯了什麼錯就會被鞭打"}, {"s": 583.43, "e": 584.6, "t": "而且據說"}, {"s": 584.6, "e": 587.83, "t": "如果一個男孩的父親得知孩子被鞭打了"}, {"s": 587.83, "e": 590.9, "t": "那他自己還要再鞭打兒子一次"}, {"s": 591.23, "e": 594.33, "t": "男孩們在外表上也要嚴格遵守規定"}, {"s": 594.33, "e": 595.5, "t": "統一剃光頭"}, {"s": 595.53, "e": 597.03, "t": "穿一種特製的披風"}, {"s": 597.03, "e": 597.9, "t": "光著腳"}, {"s": 598.33, "e": 601.9, "t": "一個中隊的男孩平時全都誰在一張床上"}, {"s": 601.9, "e": 603.13, "t": "而所謂的床"}, {"s": 603.2, "e": 605.67, "t": "不過是他們親手從河裡拔的蘆葦"}, {"s": 606.53, "e": 609.27, "t": "男孩們的飲食也受到嚴格的控制"}, {"s": 609.27, "e": 610.63, "t": "從來不能吃飽"}, {"s": 610.63, "e": 611.57, "t": "以防“變遲鈍”"}, {"s": 611.63, "e": 616.17, "t": "於是饑餓就迫使斯巴達男孩到處偷竊"}, {"s": 616.83, "e": 619.63, "t": "但這其實也是他們日常訓練的一部分"}, {"s": 619.67, "e": 621.23, "t": "因為斯巴達人相信"}, {"s": 621.23, "e": 624.83, "t": "不是優秀小偷的斯巴達人就不是好戰士"}, {"s": 625.43, "e": 628.1, "t": "至於哲學邏輯學之類的教育"}, {"s": 628.1, "e": 630.53, "t": "在斯巴達則完全不被重視"}, {"s": 631.53, "e": 635.53, "t": "當雅典的男孩們衣冠楚楚地在學校裡接受博雅教育時"}, {"s": 635.53, "e": 638.67, "t": "斯巴達男孩們卻一個個光著頭、赤著腳"}, {"s": 638.67, "e": 641.07, "t": "裹著破布在訓練營裡受虐"}, {"s": 641.83, "e": 645.1, "t": "14歲到20歲的斯巴達人被稱為少年"}, {"s": 645.53, "e": 648.3, "t": "當斯巴達男孩成長到少年階段"}, {"s": 648.3, "e": 651.27, "t": "受到的訓練和監控將更加嚴格"}, {"s": 651.7, "e": 653.07, "t": "走在大街上的時候"}, {"s": 653.07, "e": 655.93, "t": "都必須把手放在披風裡默默前進"}, {"s": 656.1, "e": 657.73, "t": "目光不能遊移不定"}, {"s": 657.73, "e": 659.27, "t": "必須盯著地面"}, {"s": 659.9, "e": 661.53, "t": "少年們在訓練之餘"}, {"s": 661.53, "e": 663.97, "t": "通常還會被安排大量的工作"}, {"s": 664.1, "e": 668.3, "t": "因為斯巴達人認為這個年齡段的人容易驕傲自大"}, {"s": 668.3, "e": 671.73, "t": "所以得最大限度地佔據他們所有的時間"}, {"s": 672.13, "e": 673.1, "t": "到了20歲"}, {"s": 673.1, "e": 676.1, "t": "斯巴達人便成為了一名壯年男子"}, {"s": 676.43, "e": 680.23, "t": "在通過一項類似于成年儀式的野外生存考驗之後"}, {"s": 680.23, "e": 683.17, "t": "就會加入成年男性公民的公餐食堂"}, {"s": 683.4, "e": 685.13, "t": "並開始前線作戰了"}, {"s": 685.53, "e": 688.23, "t": "但即便成為了一名壯年男子"}, {"s": 688.23, "e": 690.93, "t": "也還是沒法隨心所欲的生活"}, {"s": 691.53, "e": 696.13, "t": "因為所有斯巴達公民都必須一直服兵役到60歲"}, {"s": 696.5, "e": 697.23, "t": "要知道"}, {"s": 697.23, "e": 699.93, "t": "那個年代人類的壽命可不比現在"}, {"s": 699.93, "e": 702.77, "t": "一個人能活到60歲都謝天謝地了"}, {"s": 702.9, "e": 703.73, "t": "換言之"}, {"s": 703.73, "e": 707.17, "t": "斯巴達人差不多一生都是在集體中度過的"}, {"s": 707.33, "e": 711.07, "t": "即使結了婚也只能偶爾回趟家製造一下後代"}, {"s": 711.47, "e": 713.43, "t": "時間一到就得提提褲子走人"}, {"s": 713.43, "e": 716.27, "t": "回到軍隊裡繼續和兄弟們一起"}, {"s": 716.27, "e": 717.97, "t": "過陽剛的集體生活"}, {"s": 718.5, "e": 721.67, "t": "這就是斯巴達式教育和斯巴達式生活了"}, {"s": 721.9, "e": 722.9, "t": "不過說實在的"}, {"s": 722.9, "e": 726.23, "t": "我覺得現代某東方神秘大國的教育和生活"}, {"s": 726.23, "e": 728.63, "t": "比起斯巴達來也不遑多讓"}, {"s": 728.83, "e": 732.3, "t": "上學的時候一個個都是衡水模式裡的做題家"}, {"s": 732.3, "e": 735.27, "t": "長大了當牛做馬996、007"}, {"s": 735.67, "e": 737.5, "t": "唯一不同的可能就是"}, {"s": 737.5, "e": 739.67, "t": "斯巴達人60歲就能退役了"}, {"s": 739.67, "e": 742.37, "t": "而“神東大”人得挺到65歲"}, {"s": 745.4, "e": 746.3, "t": "照理來說"}, {"s": 746.3, "e": 750.13, "t": "在斯巴達這種“變態”環境下成長起來的斯巴達人"}, {"s": 750.23, "e": 752.77, "t": "應該一個個都是“鋼鐵直男”才對"}, {"s": 753.1, "e": 754.27, "t": "但有趣的是"}, {"s": 754.27, "e": 757.0, "t": "每個斯巴達少年都會在成長過程中"}, {"s": 757.0, "e": 759.87, "t": "和一位成年男子結成伴侶"}, {"s": 759.87, "e": 761.63, "t": "找不到同性伴侶的人"}, {"s": 761.63, "e": 765.27, "t": "甚至會被認為缺乏男性魅力而遭人恥笑"}, {"s": 765.7, "e": 767.5, "t": "所以斯巴達300勇士"}, {"s": 767.5, "e": 769.73, "t": "其實是斯巴達300同志"}, {"s": 770.03, "e": 771.4, "t": "現代人普遍認為"}, {"s": 771.4, "e": 773.53, "t": "同性戀有損男子氣概"}, {"s": 773.67, "e": 775.27, "t": "但斯巴達人卻認為"}, {"s": 775.43, "e": 777.9, "t": "男上加男才是真男人"}, {"s": 778.7, "e": 780.83, "t": "據古希臘史學家普魯塔克記載"}, {"s": 781.0, "e": 783.03, "t": "斯巴達新娘在結婚當天"}, {"s": 783.03, "e": 785.87, "t": "甚至還會剃光頭髮、穿上男性的衣服"}, {"s": 785.87, "e": 789.43, "t": "以便激起那些習慣于男性夥伴的丈夫的激情"}, {"s": 789.87, "e": 790.83, "t": "不止如此"}, {"s": 790.83, let cur=-1,aF=true,cpt=false,play=false,ct=0,lT=null;
const sl=document.getElementById('sl');
const fr=document.createDocumentFragment();
S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='si';d.id='i'+i;d.onclick=()=>jump(i);
  const ts=document.createElement('span');ts.className='st';ts.textContent=fmt(s.s);
  const tx=document.createElement('span');tx.className='sx';tx.textContent=s.t;
  d.appendChild(ts);d.appendChild(tx);fr.appendChild(d);
});
sl.appendChild(fr);
function fmt(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return h>0?[h,m,s].map(x=>String(x).padStart(2,'0')).join(':'):[m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fmtF(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fi(t){let lo=0,hi=S.length-1,r=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(S[mid].s<=t){r=mid;lo=mid+1;}else hi=mid-1;}return r;}
function act(idx){
  if(idx===cur)return;
  if(cur>=0){const e=document.getElementById('i'+cur);if(e)e.classList.remove('act');}
  cur=idx;
  if(idx>=0){const e=document.getElementById('i'+idx);if(e){e.classList.add('act');if(aF)e.scrollIntoView({behavior:'smooth',block:'center'});}
  document.getElementById('npTx').textContent=S[idx].t;document.getElementById('npIx').textContent=(idx+1)+' / '+S.length;}
}
function jump(i){ct=S[i].s;act(i);upd();}
function upd(){const p=(ct/DUR)*100;document.getElementById('pf').style.width=p+'%';document.getElementById('tL').textContent=fmtF(ct);document.getElementById('sTm').textContent=fmtF(ct);document.getElementById('sPct').textContent=Math.round(p)+'%';}
function seek(e){const r=document.getElementById('pb').getBoundingClientRect();ct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*DUR;act(fi(ct));upd();play=true;lT=null;}
function frame(ts){if(play){if(lT!==null){ct+=(ts-lT)/1000;if(ct>DUR){ct=DUR;play=false;}act(fi(ct));upd();}lT=ts;}else lT=null;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();play=!play;if(play)lT=null;}if(e.code==='ArrowRight'){ct=Math.min(DUR,ct+10);act(fi(ct));upd();}if(e.code==='ArrowLeft'){ct=Math.max(0,ct-10);act(fi(ct));upd();}});
function tA(){aF=!aF;document.getElementById('btnA').classList.toggle('on',aF);}
function tC(){cpt=!cpt;document.getElementById('btnC').classList.toggle('on',cpt);document.querySelectorAll('.si').forEach(l=>{l.style.paddingTop=cpt?'4px':'';l.style.paddingBottom=cpt?'4px':'';l.style.marginBottom=cpt?'0':'';});document.querySelectorAll('.sx').forEach(t=>{t.style.fontSize=cpt?'12.5px':'';});}
function doQ(){const q=document.getElementById('q').value.trim();let cnt=0;document.querySelectorAll('.si').forEach((line,i)=>{const tx=line.querySelector('.sx');if(q&&S[i].t.includes(q)){line.classList.add('sm');const ps=S[i].t.split(q);tx.innerHTML='';ps.forEach((p,pi)=>{tx.appendChild(document.createTextNode(p));if(pi<ps.length-1){const mk=document.createElement('mark');mk.textContent=q;tx.appendChild(mk);}});cnt++;}else{line.classList.remove('sm');tx.textContent=S[i].t;}});const row=document.getElementById('sqR');if(q){row.style.display='flex';document.getElementById('sqC').textContent=cnt+' 处';const f=document.querySelector('.sm');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});}else row.style.display='none';}
