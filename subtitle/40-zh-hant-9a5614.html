高的誠意"}, {"s": 550.6, "e": 551.67, "t": "來服務用戶"}, {"s": 551.67, "e": 552.7, "t": "解決問題"}, {"s": 553.0, "e": 554.0, "t": "我們可以看到"}, {"s": 554.0, "e": 556.27, "t": "在規則保持不變的原則下"}, {"s": 556.47, "e": 559.0, "t": "銀行竟然做出了截然相反的選擇"}, {"s": 559.0, "e": 561.27, "t": "無論是搪塞或者是討好"}, {"s": 561.37, "e": 563.63, "t": "這都是出於權力的自我保護性"}, {"s": 563.63, "e": 564.9, "t": "而做出的選擇"}, {"s": 565.0, "e": 567.43, "t": "換言之權力的自我保護"}, {"s": 567.43, "e": 569.3, "t": "不是拒絕做正確的事情"}, {"s": 569.3, "e": 571.5, "t": "而是拒絕承受風險"}, {"s": 571.67, "e": 573.97, "t": "第六個特性責任的稀釋性"}, {"s": 574.4, "e": 576.1, "t": "只要權力還在運行"}, {"s": 576.1, "e": 577.63, "t": "它就要面臨一個問題"}, {"s": 577.87, "e": 579.23, "t": "如果決策失誤"}, {"s": 579.23, "e": 580.9, "t": "誰來對此負責呢"}, {"s": 581.1, "e": 582.4, "t": "也許會有人說"}, {"s": 582.43, "e": 584.1, "t": "誰決策就誰負責呀"}, {"s": 584.17, "e": 586.0, "t": "這是最基本的權責對等"}, {"s": 586.2, "e": 589.0, "t": "那如果這個決策是集體的決策呢"}, {"s": 589.1, "e": 591.5, "t": "如果這個決策是製度的決策呢"}, {"s": 591.8, "e": 593.57, "t": "我們在這以學校為例"}, {"s": 593.8, "e": 596.27, "t": "當學生和家長對某項校規"}, {"s": 596.27, "e": 598.83, "t": "或者對某個具體處分和評價結果"}, {"s": 598.83, "e": 600.0, "t": "提出質疑的時候"}, {"s": 600.27, "e": 603.03, "t": "老師可能會說這是學校的統一規定"}, {"s": 603.2, "e": 604.27, "t": "學校可能會說"}, {"s": 604.27, "e": 606.4, "t": "這是集體討論形成的製度"}, {"s": 606.57, "e": 607.77, "t": "而製度本身呢"}, {"s": 607.77, "e": 608.97, "t": "往往被視為"}, {"s": 608.97, "e": 611.8, "t": "不需要為具體後果負責的中立存在"}, {"s": 611.9, "e": 614.03, "t": "所以決定是真實發生的"}, {"s": 614.03, "e": 616.3, "t": "影響由學生和家長買單"}, {"s": 616.3, "e": 618.9, "t": "但是責任卻被層層的向上轉移"}, {"s": 618.9, "e": 621.67, "t": "最終消失在一個抽象的製度當中"}, {"s": 621.97, "e": 624.57, "t": "當然也許有觀眾可能會反駁"}, {"s": 624.63, "e": 626.3, "t": "在許多的重大事件當中"}, {"s": 626.3, "e": 629.23, "t": "我們都能看到最終會有人為此負責"}, {"s": 629.43, "e": 631.83, "t": "你怎麽能說沒有人對權力負責呢"}, {"s": 632.03, "e": 633.83, "t": "問題恰恰出在這裏"}, {"s": 633.97, "e": 635.0, "t": "你有沒有想過"}, {"s": 635.0, "e": 637.37, "t": "為什麽是這個具體人來負責呢"}, {"s": 637.43, "e": 638.47, "t": "剛才我們所說的"}, {"s": 638.53, "e": 641.47, "t": "製度、流程、集體決策都去哪了"}, {"s": 641.67, "e": 643.0, "t": "如果是製度問題"}, {"s": 643.0, "e": 644.3, "t": "那製定製度的人"}, {"s": 644.3, "e": 646.57, "t": "會對這一次的具體行為負責嗎"}, {"s": 646.87, "e": 648.23, "t": "在現實生活當中"}, {"s": 648.23, "e": 649.87, "t": "答案往往是否定的"}, {"s": 650.03, "e": 651.47, "t": "我們經常能夠看到"}, {"s": 651.47, "e": 654.07, "t": "最終負責的可能是一個實習生"}, {"s": 654.07, "e": 656.57, "t": "又或者是一個一線的執行者"}, {"s": 656.63, "e": 658.87, "t": "當然也有可能是某個中層領導"}, {"s": 658.87, "e": 660.2, "t": "或者是部門主管"}, {"s": 660.43, "e": 661.6, "t": "但他永遠不可能"}, {"s": 661.6, "e": 664.83, "t": "是最接近權力中心樞紐的那個大人物"}, {"s": 665.07, "e": 666.07, "t": "簡而言之"}, {"s": 666.07, "e": 669.27, "t": "權力並不會遵循權責對等的原則"}, {"s": 669.27, "e": 670.63, "t": "公平的承擔責任"}, {"s": 670.63, "e": 673.3, "t": "而是以最小的代價去承擔責任"}, {"s": 673.4, "e": 675.47, "t": "這就是權力的責任稀釋性"}, {"s": 675.87, "e": 678.97, "t": "以上我所提到的權力的6個主要特性"}, {"s": 679.03, "e": 681.5, "t": "其實只是權力的冰山一角"}, {"s": 681.8, "e": 684.0, "t": "在人類漫長的文明史當中"}, {"s": 684.03, "e": 686.27, "t": "為了馴服權力這頭猛獸"}, {"s": 686.3, "e": 688.7, "t": "我們曾經設計過無數的牢籠"}, {"s": 688.8, "e": 691.57, "t": "其中不乏極具革命性的製度創舉"}, {"s": 691.7, "e": 692.9, "t": "而問題在於"}, {"s": 692.9, "e": 694.97, "t": "這些事件一旦展開來講"}, {"s": 694.97, "e": 698.3, "t": "往往會變成一長串的歷史著作、思想家"}, {"s": 698.3, "e": 700.6, "t": "或者是製度革命的時間線"}, {"s": 700.87, "e": 702.07, "t": "如果要深究"}, {"s": 702.07, "e": 704.47, "t": "真不是一個視頻能夠講完的"}, {"s": 704.83, "e": 707.0, "t": "但是我們也可以換一個角度來看"}, {"s": 707.17, "e": 709.0, "t": "當我們去回看近代以來"}, {"s": 709.0, "e": 711.1, "t": "這條限製權力的歷史脈絡"}, {"s": 711.1, "e": 713.67, "t": "我們就會發現一個非常重要的事實"}, {"s": 713.83, "e": 716.07, "t": "這些看似零散的製度嘗試"}, {"s": 716.07, "e": 717.77, "t": "並不是隨機出現的"}, {"s": 717.77, "e": 720.77, "t": "而是一步一步被迫推進的結果"}, {"s": 720.9, "e": 722.27, "t": "從這個意義上來說"}, {"s": 722.27, "e": 724.43, "t": "近代以來的人類限權實踐"}, {"s": 724.47, "e": 725.6, "t": "不是製度清單"}, {"s": 725.6, "e": 727.9, "t": "而是一條逐漸遞進的脈絡"}, {"s": 728.17, "e": 730.07, "t": "今天我在視頻中要做的"}, {"s": 730.07, "e": 732.27, "t": "就是把這條脈絡提煉出來"}, {"s": 732.4, "e": 735.37, "t": "作為一張可以反復查看的限權地圖"}, {"s": 735.6, "e": 737.3, "t": "下面我們就來具體展開"}, {"s": 737.3, "e": 739.07, "t": "聊聊這5個關鍵點"}, {"s": 746.4, "e": 747.53, "t": "第一個關鍵點"}, {"s": 747.53, "e": 749.17, "t": "成立有限政府"}, {"s": 749.77, "e": 750.9, "t": "談論起政府"}, {"s": 750.9, "e": 752.47, "t": "許多人的關註重點"}, {"s": 752.47, "e": 754.43, "t": "往往放在社會福利上"}, {"s": 754.57, "e": 755.63, "t": "在很多人看來"}, {"s": 755.63, "e": 756.9, "t": "一個政府好不好"}, {"s": 756.9, "e": 758.63, "t": "標準是非常簡單的"}, {"s": 758.87, "e": 760.57, "t": "福利高就是好政府"}, {"s": 760.57, "e": 762.23, "t": "福利低就是壞政府"}, {"s": 762.57, "e": 764.3, "t": "吃得飽飯就是好政府"}, {"s": 764.3, "e": 766.5, "t": "吃不飽飯就是不好的政府"}, {"s": 766.83, "e": 768.6, "t": "我並不反對這種判斷"}, {"s": 768.6, "e": 771.0, "t": "因為對於我們絕大多數人而言"}, {"s": 771.07, "e": 772.8, "t": "生活能不能過得下去"}, {"s": 772.8, "e": 774.2, "t": "永遠是第一位的"}, {"s": 774.57, "e": 776.2, "t": "但問題的關鍵在於"}, {"s": 776.27, "e": 777.83, "t": "這個所謂的「好」本身"}, {"s": 777.87, "e": 779.97, "t": "只是一種階段性的評價"}, {"s": 780.3, "e": 782.97, "t": "一個政府在今天被認為是好的"}, {"s": 782.97, "e": 785.63, "t": "並不意味著它明天就不會變壞"}, {"s": 785.97, "e": 787.57, "t": "當這個政府變壞的時候"}, {"s": 787.57, "e": 788.9, "t": "我們應該怎麽辦呢"}, {"s": 789.07, "e": 791.37, "t": "我們就以委內瑞拉來舉例"}, {"s": 791.77, "e": 793.23, "t": "這個國家的財政結構"}, {"s": 793.23, "e": 796.17, "t": "長期以來幾乎是完全依賴石油收入"}, {"s": 796.4, "e": 797.87, "t": "從1999年之後"}, {"s": 797.87, "e": 800.3, "t": "在國際油價持續增高的背景下"}, {"s": 800.43, "e": 803.23, "t": "當地政府就開始利用巨額的石油收益"}, {"s": 803.23, "e": 805.1, "t": "大規模的擴張社會福利"}, {"s": 805.17, "e": 806.0, "t": "全民補貼"}, {"s": 806.0, "e": 807.03, "t": "全民發錢"}, {"s": 807.17, "e": 808.47, "t": "擴大公共支出"}, {"s": 808.77, "e": 811.0, "t": "如果你站在當時的時間點來看"}, {"s": 811.0, "e": 812.83, "t": "那它絕對是一個好政府"}, {"s": 812.9, "e": 814.4, "t": "至少在福利層面"}, {"s": 814.43, "e": 817.6, "t": "它完全符合大多數人對好政府的標準"}, {"s": 817.9, "e": 819.0, "t": "但問題在於"}, {"s": 819.0, "e": 821.7, "t": "這種好是完全缺乏製度約束的"}, {"s": 822.0, "e": 823.37, "t": "從2014年開始"}, {"s": 823.37, "e": 824.67, "t": "國際油價暴跌"}, {"s": 824.67, "e": 826.43, "t": "當地的財政收入驟減"}, {"s": 826.43, "e": 829.27, "t": "委內瑞拉的福利體系瞬間土崩瓦解"}, {"s": 829.3, "e": 831.23, "t": "物價也開始飛速上漲"}, {"s": 831.4, "e": 832.77, "t": "到2016年的時候"}, {"s": 832.77, "e": 835.63, "t": "當地的通貨膨脹率已經高達百萬級別"}, {"s": 835.77, "e": 838.67, "t": "當地的中央銀行開始瘋狂的加印鈔票"}, {"s": 838.67, "e": 840.17, "t": "那結果可想而知"}, {"s": 840.23, "e": 841.6, "t": "截止到2024年"}, {"s": 841.6, "e": 842.47, "t": "數據顯示"}, {"s": 842.5, "e": 844.97, "t": "委內瑞拉至少有86%的人口"}, {"s": 844.97, "e": 846.57, "t": "生活在貧困線以下"}, {"s": 846.57, "e": 849.1, "t": "人均月收入不足210美元"}, {"s": 849.47, "e": 850.37, "t": "那問題來了"}, {"s": 850.4, "e": 853.57, "t": "這個曾經被當地人認為是好政府"}, {"s": 853.6, "e": 856.1, "t": "的體製是怎麽一步步變壞的呢"}, {"s": 856.37, "e": 859.0, "t": "癥結所在就是權力不受約束"}, {"s": 859.5, "e": 862.3, "t": "政府手中的權力幾乎是暢通無阻"}, {"s": 862.3, "e": 865.03, "t": "所謂的監督機製也是形同虛設"}, {"s": 865.2, "e": 867.1, "t": "權貴高官貪腐成風"}, {"s": 867.1, "e": 869.27, "t": "國家財富被少數人把控"}, {"s": 869.4, "e": 870.77, "t": "公共資源私有化"}, {"s": 870.77, "e": 873.3, "t": "發生這樣的問題也就不意外了"}, {"s": 873.7, "e": 875.47, "t": "一個政府好與不好"}, {"s": 875.47, "e": 878.27, "t": "往往只是我們當下的評價和感受"}, {"s": 878.43, "e": 879.87, "t": "真正的決定性因素"}, {"s": 879.87, "e": 881.77, "t": "是權力是否受到限製"}, {"s": 882.0, "e": 884.5, "t": "如果政府的權力是天然無限的"}, {"s": 884.6, "e": 886.57, "t": "那即便它曾經很好"}, {"s": 886.57, "e": 888.57, "t": "變壞也只是時間問題"}, {"s": 888.6, "e": 891.77, "t": "所以政府的權力必須受到約束"}, {"s": 891.77, "e": 893.37, "t": "而成立有限政府"}, {"s": 893.37, "e": 895.23, "t": "就是約束權力的第一步"}, {"s": 895.77, "e": 899.37, "t": "其實最早的有限政府思想很早就誕生了"}, {"s": 899.43, "e": 901.63, "t": "它可以追溯到中世紀的英國"}, {"s": 901.9, "e": 903.23, "t": "1215年左右"}, {"s": 903.23, "e": 904.3, "t": "在長期戰爭"}, {"s": 904.3, "e": 907.2, "t": "沈重的稅賦和王權濫用的背景之下"}, {"s": 907.3, "e": 909.97, "t": "英國的貴族終於意識到一件事"}, {"s": 910.37, "e": 911.77, "t": "現在的種種問題"}, {"s": 911.77, "e": 914.37, "t": "好像不在於國王是不是一個壞人"}, {"s": 914.4, "e": 917.1, "t": "而在於國王的權力是天然無限的"}, {"s": 917.2, "e": 917.8, "t": "於是"}, {"s": 917.8, "e": 920.97, "t": "他們逼迫國王約翰簽署了一份文件"}, {"s": 921.07, "e": 923.83, "t": "這份文件就是赫赫有名的《大憲章》"}, {"s": 924.2, "e": 925.83, "t": "在人類的政治史上"}, {"s": 925.83, "e": 928.9, "t": "《大憲章》第一次明確的寫下了一條原則"}, {"s": 928.9, "e": 930.63, "t": "那就是統治者本身"}, {"s": 930.63, "e": 933.0, "t": "也必須被規則所束縛"}, {"s": 933.47, "e": 934.67, "t": "這也是第一份"}, {"s": 934.67, "e": 937.03, "t": "帶有限權思想的法理性文件"}, {"s": 937.47, "e": 938.2, "t": "所以說"}, {"s": 938.2, "e": 941.5, "t": "有限政府並不是要政府變得軟弱"}, {"s": 941.5, "e": 943.57, "t": "而是要承認一個政治現實"}, {"s": 943.77, "e": 946.7, "t": "權力本身具備自我擴張的傾向"}, {"s": 946.83, "e": 950.0, "t": "而製度的任務就是假設最壞的情景"}, {"s": 950.23, "e": 952.67, "t": "它並不指望國王可以仁慈"}, {"s": 952.67, "e": 954.57, "t": "也不依賴官員的自律"}, {"s": 954.7, "e": 957.67, "t": "它更不會幻想權力會自動克製"}, {"s": 957.87, "e": 959.63, "t": "它要做的只有一件事"}, {"s": 959.63, "e": 962.03, "t": "那就是把權力關進規則的籠子"}, {"s": 962.03, "e": 964.77, "t": "裏這就是所謂的王在法下"}, {"s": 965.37, "e": 966.6, "t": "不過大家要註意"}, {"s": 966.67, "e": 968.27, "t": "不要以為有了《大憲章》"}, {"s": 968.27, "e": 969.7, "t": "就可以一勞永逸了"}, {"s": 969.77, "e": 972.2, "t": "事實上在很長的一段時間裏"}, {"s": 972.27, "e": 975.3, "t": "《大憲章》都像一張廢紙一樣無人在意"}, {"s": 975.4, "e": 976.77, "t": "所謂的王在法下"}, {"s": 976.77, "e": 979.77, "t": "也只是當初的一個美好的政治理想"}, {"s": 980.1, "e": 983.23, "t": "英國經歷了無數的王權與貴族的博弈"}, {"s": 983.23, "e": 985.27, "t": "才逐漸形成了議會權力"}, {"s": 985.47, "e": 986.97, "t": "從簽署《大憲章》"}, {"s": 987.0, "e": 987.97, "t": "到事實上"}, {"s": 987.97, "e": 990.43, "t": "成為一個現代意義的有限政府"}, {"s": 990.43, "e": 992.77, "t": "英國人花費了幾百年的時間"}, {"s": 993.1, "e": 993.9, "t": "也就是說"}, {"s": 993.9, "e": 996.27, "t": "即便所有人都在口頭上承認"}, {"s": 996.27, "e": 998.3, "t": "政府的權力應該被限製"}, {"s": 998.37, "e": 999.4, "t": "而這種限製"}, {"s": 999.4, "e": 1002.07, "t": "只要還沒有變成明確穩定"}, {"s": 1002.07, "e": 1004.07, "t": "不可隨意突破的規則"}, {"s": 1004.17, "e": 1006.2, "t": "它在現實的權力運作當中"}, {"s": 1006.2, "e": 1008.43, "t": "就會一點一滴的被侵蝕掉"}, {"s": 1008.67, "e": 1010.3, "t": "這就是我要說的第二點"}, {"s": 1010.43, "e": 1011.53, "t": "明確憲法"}, {"s": 1011.7, "e": 1014.07, "t": "憲法一詞在中文語境中"}, {"s": 1014.07, "e": 1016.23, "t": "其實有許多不同的稱呼"}, {"s": 1016.27, "e": 1019.8, "t": "比如說基本法、根本法、國法、憲章"}, {"s": 1019.8, "e": 1021.43, "t": "或者是憲製文件"}, {"s": 1021.7, "e": 1024.87, "t": "這些名稱強調的側重點各不相同"}, {"s": 1024.97, "e": 1026.67, "t": "但它們共同指向的"}, {"s": 1026.67, "e": 1029.0, "t": "都是權力運行的根本規則"}, {"s": 1029.0, "e": 1030.3, "t": "而在英文當中"}, {"s": 1030.3, "e": 1033.77, "t": "憲法一詞對應的單詞是constitution"}, {"s": 1033.83, "e": 1037.53, "t": "而它的詞源來自於拉丁文的constitutio"}, {"s": 1037.7, "e": 1039.47, "t": "在羅馬法的語境當中"}, {"s": 1039.6, "e": 1042.97, "t": "這個概念不是指一部單純的法律文本"}, {"s": 1043.1, "e": 1046.5, "t": "而是一種秩序如何被安排的狀態"}, {"s": 1046.7, "e": 1049.2, "t": "其中包含了權力如何被放置"}, {"s": 1049.2, "e": 1050.83, "t": "誰有權力決定什麽"}, {"s": 1050.83, "e": 1053.23, "t": "以及整體的秩序如何運作"}, {"s": 1053.4, "e": 1054.3, "t": "換言之"}, {"s": 1054.3, "e": 1056.9, "t": "這個概念關註的不是價值判斷"}, {"s": 1056.9, "e": 1059.23, "t": "而是權力結構的安置方式"}, {"s": 1059.5, "e": 1060.47, "t": "正因如此"}, {"s": 1060.47, "e": 1062.67, "t": "從概念流變的角度上來看"}, {"s": 1062.77, "e": 1065.87, "t": "憲法這個概念首先是一種製度形式"}, {"s": 1066.0, "e": 1068.4, "t": "它本身並不天然指向正義"}, {"s": 1068.43, "e": 1072.07, "t": "所以憲法本身並不帶有限權思想"}, {"s": 1072.3, "e": 1073.33, "t": "它既可以被用來"}, {"s": 1073.37, "e": 1075.27, "t": "服務於限權的政治目標"}, {"s": 1075.27, "e": 1075.9, "t": "同樣"}, {"s": 1075.9, "e": 1079.17, "t": "也可以被用來服務於集權的政治需要"}, {"s": 1079.5, "e": 1081.6, "t": "真正將限製權力這個使命"}, {"s": 1081.6, "e": 1083.2, "t": "安插到憲法之中的"}, {"s": 1083.2, "e": 1085.5, "t": "是後來發展出來的「憲政主義」"}, {"s": 1085.73, "e": 1088.07, "t": "因此對我們現代公民來說"}, {"s": 1088.07, "e": 1091.57, "t": "我們真正需要的不是一部單純的憲法"}, {"s": 1091.57, "e": 1094.07, "t": "而是一部有明確政治使命"}, {"s": 1094.07, "e": 1096.2, "t": "符合憲政主義精神的憲法"}, {"s": 1096.2, "e": 1097.43, "t": "從表面上看"}, {"s": 1097.43, "e": 1099.4, "t": "無論是過去還是現在"}, {"s": 1099.4, "e": 1101.17, "t": "無論是哪個國家的憲法"}, {"s": 1101.17, "e": 1104.37, "t": "在結構和形式上往往都是大同小異的"}, {"s": 1104.5, "e": 1107.07, "t": "但真正的分野之處不在於文本"}, {"s": 1107.1, "e": 1109.47, "t": "在於憲法背後所服務的目的"}, {"s": 1109.67, "e": 1111.3, "t": "決定一部憲法性質的"}, {"s": 1111.3, "e": 1112.77, "t": "不是它寫了什麽"}, {"s": 1112.77, "e": 1115.4, "t": "而是它試圖防範誰約束誰"}, {"s": 1115.43, "e": 1117.97, "t": "在這裏我們就以日本來舉例"}, {"s": 1120.97, "e": 1122.67, "t": "其實最早在東亞地區"}, {"s": 1122.67, "e": 1124.87, "t": "使用憲法字眼的製憲文件"}, {"s": 1124.87, "e": 1127.27, "t": "就是公布於明治二十二年"}, {"s": 1127.27, "e": 1130.17, "t": "也就是1889年的《大日本帝國憲法》"}, {"s": 1130.77, "e": 1131.47, "t": "這部憲法"}, {"s": 1131.47, "e": 1135.37, "t": "於明治二十三年11月29日開始實行"}, {"s": 1135.43, "e": 1137.67, "t": "直至二戰之後的1947年"}, {"s": 1137.67, "e": 1140.03, "t": "被現行的《日本國憲法》所取代"}, {"s": 1140.23, "e": 1142.37, "t": "所以從嚴格意義上來講"}, {"s": 1142.37, "e": 1145.27, "t": "日本在近代其實經歷過兩部憲法"}, {"s": 1145.63, "e": 1146.23, "t": "第一部"}, {"s": 1146.23, "e": 1149.1, "t": "就是1889年頒布的《大日本帝國憲法》"}, {"s": 1149.1, "e": 1151.4, "t": "通常被稱作為明治憲法"}, {"s": 1151.5, "e": 1153.0, "t": "第二部就是二戰後"}, {"s": 1153.0, "e": 1155.5, "t": "在1947年實行的《日本國憲法》"}, {"s": 1155.5, "e": 1157.43, "t": "通常被稱之為昭和憲法"}, {"s": 1157.7, "e": 1161.17, "t": "這兩部憲法在形式上同樣被稱作憲法"}, {"s": 1161.17, "e": 1163.07, "t": "但它們所承擔的政治使命"}, {"s": 1163.07, "e": 1164.43, "t": "是完全相反的"}, {"s": 1164.77, "e": 1166.43, "t": "明治憲法的核心任務"}, {"s": 1166.43, "e": 1168.3, "t": "是在近代國家體系之中"}, {"s": 1168.3, "e": 1169.6, "t": "為天皇的主權"}, {"s": 1169.6, "e": 1172.63, "t": "提供製度化、法律化的正當性表述"}, {"s": 1172.83, "e": 1174.77, "t": "而戰後憲法（昭和憲法）的根本目的"}, {"s": 1174.77, "e": 1177.63, "t": "則是通過製度設計限製國家權力"}, {"s": 1177.63, "e": 1179.57, "t": "防止權力的再次失控"}, {"s": 1179.8, "e": 1181.9, "t": "二者的差異並不在於文本"}, {"s": 1181.9, "e": 1184.4, "t": "而在於憲法所服務的政治原則"}, {"s": 1184.4, "e": 1185.97, "t": "發生了根本的轉變"}, {"s": 1186.43, "e": 1187.67, "t": "更值得註意的是"}, {"s": 1187.77, "e": 1188.87, "t": "日本明治政府"}, {"s": 1188.87, "e": 1191.4, "t": "在引進近代憲法概念的時候"}, {"s": 1191.5, "e": 1193.67, "t": "對憲法一詞的翻譯和理解"}, {"s": 1193.67, "e": 1196.77, "t": "並沒有區分出憲法作為製度形式"}, {"s": 1196.77, "e": 1199.57, "t": "和憲法作為限權原則之間的差異"}, {"s": 1199.7, "e": 1201.0, "t": "這種翻譯路徑"}, {"s": 1201.1, "e": 1202.63, "t": "對整個漢字文化圈"}, {"s": 1202.63, "e": 1204.43, "t": "都造成了深遠的影響"}, {"s": 1204.5, "e": 1207.5, "t": "所以在相當廣泛的東亞語境之中"}, {"s": 1207.5, "e": 1208.57, "t": "憲法一詞"}, {"s": 1208.57, "e": 1210.2, "t": "常常被直觀的理解成"}, {"s": 1210.2, "e": 1212.6, "t": "一種至高無上的法律文件"}, {"s": 1212.63, "e": 1214.07, "t": "卻很少被人理解成"}, {"s": 1214.07, "e": 1217.1, "t": "一種以限製權力為使命的憲政手段"}, {"s": 1217.5, "e": 1218.27, "t": "這樣的理解"}, {"s": 1218.27, "e": 1220.97, "t": "並非源自於現代的憲政主義本身"}, {"s": 1221.03, "e": 1222.2, "t": "而是根植於"}, {"s": 1222.2, "e": 1225.0, "t": "近代日本對憲法概念的引薦方式"}, {"s": 1232.37, "e": 1234.8, "t": "其實早在1876年的9月6日"}, {"s": 1234.8, "e": 1237.07, "t": "明治天皇就頒布了一個敕文"}, {"s": 1237.43, "e": 1238.57, "t": "敕文的名稱是"}, {"s": 1238.57, "e": 1243.33, "t": "《命令元老院議長有棲川宮熾仁親王起草國憲之敕文》"}, {"s": 1243.57, "e": 1246.9, "t": "大概意思是說朕現據本國國體"}, {"s": 1246.9, "e": 1249.67, "t": "廣泛參照海外各國集成法律"}, {"s": 1249.7, "e": 1250.63, "t": "已定國憲"}, {"s": 1250.77, "e": 1253.27, "t": "因此現命令你等起創草案"}, {"s": 1253.6, "e": 1255.03, "t": "他就是要求官員們"}, {"s": 1255.03, "e": 1256.8, "t": "開始研究各國的憲法"}, {"s": 1256.8, "e": 1258.63, "t": "撰寫本國的憲法草案"}, {"s": 1258.83, "e": 1261.83, "t": "到1880年 也就是明治十三年的時候"}, {"s": 1261.83, "e": 1264.77, "t": "元老院就將完成的草案提交給了天皇"}, {"s": 1264.8, "e": 1268.23, "t": "其中就規定了天皇必須發誓遵守國憲"}, {"s": 1268.37, "e": 1271.07, "t": "並將絕大部分的權力交於議會"}, {"s": 1271.43, "e": 1272.83, "t": "結果可想而知"}, {"s": 1272.83, "e": 1273.57, "t": "這個法案"}, {"s": 1273.57, "e": 1276.1, "t": "遭到了尊皇攘夷派的強烈反對"}, {"s": 1276.27, "e": 1278.67, "t": "其實不能通過的原因也很簡單"}, {"s": 1278.77, "e": 1281.23, "t": "因為這部憲法好像真的在搞憲法"}, {"s": 1281.23, "e": 1283.03, "t": "它就是要製定最高規則"}, {"s": 1283.03, "e": 1284.5, "t": "限製天皇的權力"}, {"s": 1284.63, "e": 1286.03, "t": "所以被否決以後"}, {"s": 1286.03, "e": 1287.47, "t": "製定憲法的重擔"}, {"s": 1287.47, "e": 1289.47, "t": "就落到了伊藤博文身上"}, {"s": 1289.67, "e": 1290.63, "t": "明治10五年"}, {"s": 1290.63, "e": 1291.97, "t": "也就是1882年"}, {"s": 1292.1, "e": 1294.2, "t": "伊藤博文受命前往德國"}, {"s": 1294.2, "e": 1296.03, "t": "考察立憲主義的理論發展"}, {"s": 1296.13, "e": 1298.5, "t": "次年伊藤博文返回日本"}, {"s": 1298.6, "e": 1301.47, "t": "命令井上毅著手憲法草案的起草"}, {"s": 1301.5, "e": 1302.37, "t": "三年以後"}, {"s": 1302.37, "e": 1305.37, "t": "日本天皇就廢止了太政官製"}, {"s": 1305.37, "e": 1306.63, "t": "成立了內閣製度"}, {"s": 1306.63, "e": 1307.63, "t": "而伊藤博文"}, {"s": 1307.63, "e": 1310.47, "t": "就被任命為首任內閣總理大臣"}, {"s": 1310.6, "e": 1311.97, "t": "1888年4月"}, {"s": 1311.97, "e": 1313.3, "t": "明治21年"}, {"s": 1313.6, "e": 1316.3, "t": "井上毅在兩位德國顧問的幫助之下"}, {"s": 1316.3, "e": 1317.8, "t": "基本完成了定稿"}, {"s": 1317.9, "e": 1320.47, "t": "然後伊藤博文設置了一個樞密院"}, {"s": 1320.57, "e": 1322.67, "t": "專門用來審議憲法的內容"}, {"s": 1322.77, "e": 1325.6, "t": "審議一直持續到1889年的1月份"}, {"s": 1325.67, "e": 1326.47, "t": "也就是說"}, {"s": 1326.47, "e": 1329.8, "t": "日本從起心動念到拿出完整的憲法"}, {"s": 1329.8, "e": 1332.4, "t": "總共累積花費了13年的時間"}, {"s": 1332.43, "e": 1333.77, "t": "大家看看這張圖"}, {"s": 1333.77, "e": 1335.8, "t": "我相信就一目了然了"}, {"s": 1335.8, "e": 1338.9, "t": "這一部憲法不但沒有限製天皇的權力"}, {"s": 1338.9, "e": 1340.43, "t": "反而給天皇的權力"}, {"s": 1340.43, "e": 1343.27, "t": "找到了一個不可挑戰的合法性源頭"}, {"s": 1343.63, "e": 1346.2, "t": "伊藤博文的核心任務只有一個"}, {"s": 1346.27, "e": 1348.5, "t": "不是創造日本的民主憲政"}, {"s": 1348.5, "e": 1350.67, "t": "而是在近代國家體系當中"}, {"s": 1350.67, "e": 1352.43, "t": "保存天皇的絕對地位"}, {"s": 1352.47, "e": 1355.9, "t": "同時又讓日本擺脫前現代國家的標簽"}, {"s": 1356.0, "e": 1358.7, "t": "《大日本帝國憲法》第一條確立的就是"}, {"s": 1358.73, "e": 1362.2, "t": "日本國由萬世一系之天皇統治"}, {"s": 1362.4, "e": 1363.37, "t": "也就是說"}, {"s": 1363.43, "e": 1364.9, "t": "不是王在法下"}, {"s": 1364.9, "e": 1366.37, "t": "而是王在法上"}, {"s": 1366.5, "e": 1369.5, "t": "所謂的內閣、議會、國會、司法"}, {"s": 1369.57, "e": 1372.1, "t": "它們都是天皇意誌的代行機關"}, {"s": 1372.3, "e": 1373.77, "t": "法律的終極效力"}, {"s": 1373.83, "e": 1376.07, "t": "仍然來源於天皇的裁決"}, {"s": 1376.43, "e": 1379.07, "t": "形式上看好像是一種分權製度"}, {"s": 1379.07, "e": 1381.07, "t": "實際上就是一個分工製度"}, {"s": 1381.27, "e": 1384.1, "t": "從一開始主權就不在公民手中"}, {"s": 1384.37, "e": 1386.1, "t": "所以從本質上來看"}, {"s": 1386.23, "e": 1387.47, "t": "《大日本帝國憲法》"}, {"s": 1387.47, "e": 1388.97, "t": "就是一個徹頭徹尾的"}, {"s": 1388.97, "e": 1390.63, "t": "反憲政精神的設計"}, {"s": 1391.0, "e": 1392.7, "t": "但是當時的日本國民"}, {"s": 1392.7, "e": 1395.1, "t": "對這部憲法給予了很高的評價"}, {"s": 1395.23, "e": 1396.83, "t": "除了當時的各家報社"}, {"s": 1396.83, "e": 1399.5, "t": "許多的知識分子、自由民權主義者"}, {"s": 1399.5, "e": 1401.1, "t": "也都表示非常認可"}, {"s": 1401.3, "e": 1402.7, "t": "民間的情緒籠罩"}, {"s": 1402.7, "e": 1404.27, "t": "在一片天皇賜憲"}, {"s": 1404.27, "e": 1406.17, "t": "國運昌隆的歡呼之中"}, {"s": 1406.27, "e": 1408.8, "t": "因為當時日本絕大多數的國民"}, {"s": 1408.8, "e": 1410.77, "t": "都是不了解憲政主義的"}, {"s": 1411.0, "e": 1412.6, "t": "包括很多知識分子"}, {"s": 1412.6, "e": 1413.83, "t": "有很大一部分"}, {"s": 1413.83, "e": 1415.97, "t": "都是明治政府的禦用文人"}, {"s": 1416.1, "e": 1417.6, "t": "那肯定是政府做什麽"}, {"s": 1417.6, "e": 1418.87, "t": "他們就吹捧什麽"}, {"s": 1418.87, "e": 1421.2, "t": "而另一群都是一些一知半解"}, {"s": 1421.2, "e": 1422.37, "t": "不學無術的人"}, {"s": 1422.43, "e": 1425.43, "t": "他們也覺得有憲法總比沒有憲法強吧"}, {"s": 1425.43, "e": 1426.87, "t": "這肯定是個好事"}, {"s": 1427.1, "e": 1429.6, "t": "但當時的日本也是有明白人的"}, {"s": 1429.97, "e": 1432.57, "t": "當時的福澤諭吉已經54歲了"}, {"s": 1432.63, "e": 1435.0, "t": "他在自己主編的《時事新報》上"}, {"s": 1435.0, "e": 1436.37, "t": "發表了一個評論"}, {"s": 1436.5, "e": 1437.3, "t": "他說"}, {"s": 1437.37, "e": 1441.27, "t": "追溯西方各國實行的國會製度本源及沿革"}, {"s": 1441.4, "e": 1444.37, "t": "即可發現政府往往與民眾對立"}, {"s": 1444.37, "e": 1446.03, "t": "而人民民智漸開"}, {"s": 1446.03, "e": 1447.57, "t": "反抗君主壓迫"}, {"s": 1447.63, "e": 1449.07, "t": "政府未得民心"}, {"s": 1449.1, "e": 1451.8, "t": "不得已而逐漸將政權分立"}, {"s": 1451.83, "e": 1454.17, "t": "如今日本還缺少這樣的人民"}, {"s": 1454.6, "e": 1457.37, "t": "雖然福澤諭吉有所謂的「未來論」"}, {"s": 1457.47, "e": 1458.4, "t": "但實際上"}, {"s": 1458.43, "e": 1461.67, "t": "他的內心對日本民眾開啟民智這件事"}, {"s": 1461.67, "e": 1463.03, "t": "是非常悲觀的"}, {"s": 1463.23, "e": 1466.2, "t": "當時有一個著名的日本民運人士"}, {"s": 1466.2, "e": 1467.7, "t": "叫做中江兆民"}, {"s": 1467.83, "e": 1470.37, "t": "他因為政府頒布這部憲法獲得了恩赦"}, {"s": 1470.67, "e": 1471.6, "t": "按道理來說"}, {"s": 1471.6, "e": 1473.97, "t": "他應該對天皇賜憲感恩戴德"}, {"s": 1473.97, "e": 1476.2, "t": "出來以後就不要對抗政府了"}, {"s":  "e": 1578.0, "t": "並置於國家權力之上"}, {"s": 1578.77, "e": 1581.3, "t": "第三點具有最高法律效力"}, {"s": 1581.43, "e": 1583.37, "t": "普通法律不得與之沖突"}, {"s": 1583.43, "e": 1586.77, "t": "第四點憲法具備相對穩定的程序"}, {"s": 1586.77, "e": 1587.9, "t": "不得隨意更改"}, {"s": 1588.6, "e": 1590.9, "t": "如果我們用一個嚴格的現代標準"}, {"s": 1590.9, "e": 1592.03, "t": "去看待憲法"}, {"s": 1592.17, "e": 1594.67, "t": "那麽真正意義上的現代成文憲法"}, {"s": 1594.67, "e": 1596.3, "t": "是很晚才誕生的"}, {"s": 1596.47, "e": 1598.6, "t": "也就是 18 世紀末這個時間點"}, {"s": 1598.6, "e": 1599.77, "t": "才正式出現"}, {"s": 1600.03, "e": 1601.4, "t": "最具有標誌性的"}, {"s": 1601.4, "e": 1604.37, "t": "就是1787年美國憲法的頒布"}, {"s": 1604.8, "e": 1607.2, "t": "美國憲法雖然非常的簡短"}, {"s": 1607.2, "e": 1608.97, "t": "全文只有7條正文"}, {"s": 1608.97, "e": 1610.37, "t": "27個修正案"}, {"s": 1610.43, "e": 1612.4, "t": "總共也就4,400字"}, {"s": 1612.57, "e": 1614.3, "t": "但這部憲法的革命性"}, {"s": 1614.3, "e": 1616.23, "t": "並不在於內容的多寡"}, {"s": 1616.27, "e": 1616.8, "t": "而在於"}, {"s": 1616.8, "e": 1620.07, "t": "它第一次系統性的完成了四件事情"}, {"s": 1620.47, "e": 1622.43, "t": "第一它明確的寫出"}, {"s": 1622.47, "e": 1624.67, "t": "政府的權力不是來自於上帝"}, {"s": 1624.67, "e": 1626.57, "t": "傳統或者是血緣"}, {"s": 1626.8, "e": 1628.9, "t": "它來自於人民的授權"}, {"s": 1629.3, "e": 1631.77, "t": "第二它通過成文文本"}, {"s": 1631.77, "e": 1635.43, "t": "系統劃分了立法、行政、司法三種權力"}, {"s": 1635.87, "e": 1638.9, "t": "權力不再依賴於個人君主的節製"}, {"s": 1639.0, "e": 1641.57, "t": "而是用結構防止權力的集中"}, {"s": 1641.97, "e": 1645.0, "t": "第三它確立了憲法的最高法律地位"}, {"s": 1645.2, "e": 1648.27, "t": "這意味著任何的法律政策政府行為"}, {"s": 1648.27, "e": 1650.1, "t": "都必須服從於憲法"}, {"s": 1650.17, "e": 1652.47, "t": "第四它通過修正案機製"}, {"s": 1652.47, "e": 1655.4, "t": "把個人權利寫進了憲法結構當中"}, {"s": 1655.67, "e": 1656.67, "t": "它讓個人權利"}, {"s": 1656.67, "e": 1658.6, "t": "不再是一種道德上的訴求"}, {"s": 1658.6, "e": 1661.4, "t": "而是可以對抗國家權力的法律依據"}, {"s": 1661.77, "e": 1662.57, "t": "到這裏"}, {"s": 1662.6, "e": 1665.43, "t": "憲法的性質發生了一個根本轉變"}, {"s": 1665.63, "e": 1667.9, "t": "憲法不再是像《大憲章》那樣"}, {"s": 1668.0, "e": 1671.0, "t": "只是限製某一個統治者的限製文件"}, {"s": 1671.07, "e": 1 function fmt(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return h>0?[h,m,s].map(x=>String(x).padStart(2,'0')).join(':'):[m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fmtF(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fi(t){let lo=0,hi=S.length-1,r=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(S[mid].s<=t){r=mid;lo=mid+1;}else hi=mid-1;}return r;}
