決定的角色"}, {"s": 304.4, "e": 306.4, "t": "而其他人就要扮演好"}, {"s": 306.4, "e": 308.4, "t": "服從的角色"}, {"s": 308.4, "e": 310.4, "t": "只要人類還在一起生活"}, {"s": 310.4, "e": 312.4, "t": "一起生產,一起抵禦風險"}, {"s": 312.4, "e": 314.4, "t": "這種結構性的分工"}, {"s": 314.4, "e": 316.4, "t": "就無以避免"}, {"s": 316.4, "e": 318.4, "t": "經常有人說政客都是卑鄙的"}, {"s": 318.4, "e": 320.4, "t": "政治都是黑暗的"}, {"s": 320.4, "e": 322.4, "t": "或許這樣的說法有一定的根據"}, {"s": 322.4, "e": 324.4, "t": "但是權力可不是"}, {"s": 324.4, "e": 326.4, "t": "一個道德評判的對象"}, {"s": 326.4, "e": 328.4, "t": "權力是一種既不好"}, {"s": 328.4, "e": 330.4, "t": "也不壞的功能性發明"}, {"s": 330.4, "e": 332.4, "t": "當然,這種說法也不新鮮"}, {"s": 332.4, "e": 334.4, "t": "早在17世紀"}, {"s": 334.4, "e": 336.4, "t": "就有一位思想家用極其尖銳"}, {"s": 336.4, "e": 338.4, "t": "極其冷酷"}, {"s": 338.4, "e": 340.4, "t": "有效的方式把權力的發聲"}, {"s": 340.4, "e": 342.4, "t": "講得十分透徹"}, {"s": 342.4, "e": 344.4, "t": "他就是托馬斯霍普斯"}, {"s": 348.4, "e": 350.4, "t": "在自由主義者看來"}, {"s": 350.4, "e": 352.4, "t": "霍普斯可不是一個值得推崇的人物"}, {"s": 352.4, "e": 354.4, "t": "但是"}, {"s": 354.4, "e": 356.4, "t": "他做了一件前人很少"}, {"s": 356.4, "e": 358.4, "t": "做到的事情"}, {"s": 358.4, "e": 360.4, "t": "霍普斯把人類社會的假設"}, {"s": 360.4, "e": 362.4, "t": "拆解到了最底層"}, {"s": 362.4, "e": 364.4, "t": "還記得我們剛才描述的幾個場景嗎"}, {"s": 364.4, "e": 366.4, "t": "其實都是一種"}, {"s": 366.4, "e": 368.4, "t": "現實情況的邏輯推導"}, {"s": 368.4, "e": 370.4, "t": "但是霍普斯把這些邏輯推導"}, {"s": 370.4, "e": 372.4, "t": "進一步抽象成了一個"}, {"s": 372.4, "e": 374.4, "t": "經典的思想實驗"}, {"s": 374.4, "e": 376.4, "t": "也就是他在利維坦中提到的"}, {"s": 376.4, "e": 378.4, "t": "自然狀態"}, {"s": 378.4, "e": 380.4, "t": "霍普斯認為人類在自然狀態當中"}, {"s": 380.4, "e": 382.4, "t": "是完全平等的"}, {"s": 382.4, "e": 384.4, "t": "但這種平等"}, {"s": 384.4, "e": 386.4, "t": "可不是道德和法律意義上的平等"}, {"s": 386.4, "e": 388.4, "t": "而是一種恐懼的平等"}, {"s": 388.4, "e": 390.4, "t": "在人類的自然狀態當中"}, {"s": 390.4, "e": 392.4, "t": "霍普斯認為"}, {"s": 392.4, "e": 394.4, "t": "人類擁有三種驅動力"}, {"s": 394.4, "e": 396.4, "t": "第一個是為了獲取資源"}, {"s": 396.4, "e": 398.4, "t": "而產生的競爭"}, {"s": 398.4, "e": 400.4, "t": "第二個是為了避免被襲擊"}, {"s": 400.4, "e": 402.4, "t": "而產生的猜忌"}, {"s": 402.4, "e": 404.4, "t": "第三個是為了獲取他人尊重"}, {"s": 404.4, "e": 406.4, "t": "和名聲而產生的榮耀"}, {"s": 406.4, "e": 408.4, "t": "但歸根結底"}, {"s": 408.4, "e": 410.4, "t": "這三種驅動力"}, {"s": 410.4, "e": 412.4, "t": "都只有一個目的"}, {"s": 412.4, "e": 414.4, "t": "那就是想方設法地"}, {"s": 414.4, "e": 416.4, "t": "增加自身的權利"}, {"s": 416.4, "e": 418.4, "t": "以保護自身的利益與安全"}, {"s": 418.4, "e": 420.4, "t": "而當所有人都同時追求"}, {"s": 420.4, "e": 422.4, "t": "權力擴張"}, {"s": 422.4, "e": 424.4, "t": "這是權力對權力的恐懼"}, {"s": 424.4, "e": 426.4, "t": "這就是那句著名的話"}, {"s": 426.4, "e": 428.4, "t": "所有人對所有人的戰爭"}, {"s": 428.4, "e": 430.4, "t": "霍普斯認為"}, {"s": 430.4, "e": 432.4, "t": "在自然狀態當中"}, {"s": 432.4, "e": 434.4, "t": "每一個人都有足夠的動機和能力"}, {"s": 434.4, "e": 436.4, "t": "來傷害或者是威脅"}, {"s": 436.4, "e": 438.4, "t": "甚至是殺死他人"}, {"s": 438.4, "e": 440.4, "t": "強者可能會更有優勢"}, {"s": 440.4, "e": 442.4, "t": "但是弱者"}, {"s": 442.4, "e": 444.4, "t": "也可以聯合起來"}, {"s": 444.4, "e": 446.4, "t": "縱橫百合"}, {"s": 446.4, "e": 448.4, "t": "可以利用時機、工具、陰謀"}, {"s": 448.4, "e": 450.4, "t": "等等手段來聯合"}, {"s": 450.4, "e": 452.4, "t": "或者是分化敵人進行反擊"}, {"s": 452.4, "e": 454.4, "t": "但問題的關鍵在於"}, {"s": 454.4, "e": 456.4, "t": "只要每一個人"}, {"s": 456.4, "e": 458.4, "t": "都可能威脅另一個人"}, {"s": 458.4, "e": 460.4, "t": "那每一個人都處於"}, {"s": 460.4, "e": 462.4, "t": "同樣的不安全之中"}, {"s": 462.4, "e": 464.4, "t": "在沒有共同權威的時候"}, {"s": 464.4, "e": 466.4, "t": "沒有任何的機制"}, {"s": 466.4, "e": 468.4, "t": "可以阻止暴力的發生"}, {"s": 468.4, "e": 470.4, "t": "所以在霍普斯看來"}, {"s": 470.4, "e": 472.4, "t": "人類之所以交出了自己的權力"}, {"s": 472.4, "e": 474.4, "t": "或者說讓渡了"}, {"s": 474.4, "e": 476.4, "t": "自己的自由"}, {"s": 476.4, "e": 478.4, "t": "把自己的決定權交付給某個"}, {"s": 478.4, "e": 480.4, "t": "實體"}, {"s": 480.4, "e": 482.4, "t": "這是因為大家都很清楚"}, {"s": 482.4, "e": 484.4, "t": "我們需要一個能夠終結恐懼的存在"}, {"s": 484.4, "e": 486.4, "t": "於是每個人"}, {"s": 486.4, "e": 488.4, "t": "主動放棄了部分的權力"}, {"s": 488.4, "e": 490.4, "t": "把這些權力交給了一個"}, {"s": 490.4, "e": 492.4, "t": "共同的主權者"}, {"s": 492.4, "e": 494.4, "t": "讓他來壟斷暴力"}, {"s": 494.4, "e": 496.4, "t": "制定規則"}, {"s": 496.4, "e": 498.4, "t": "做出最終的決策"}, {"s": 498.4, "e": 500.4, "t": "這個主權者就是利維坦"}, {"s": 500.4, "e": 502.4, "t": "而關於什麼是利維坦"}, {"s": 502.4, "e": 504.4, "t": "我們暫且不表"}, {"s": 504.4, "e": 506.4, "t": "我們首先來提煉一下霍普斯"}, {"s": 506.4, "e": 508.4, "t": "權力的定義"}, {"s": 508.4, "e": 510.4, "t": "在利維坦的第十章當中"}, {"s": 510.4, "e": 512.4, "t": "霍普斯其實給出了一個非常"}, {"s": 512.4, "e": 514.4, "t": "簡明扼要的定義"}, {"s": 514.4, "e": 516.4, "t": "他說權力就是達成"}, {"s": 516.4, "e": 518.4, "t": "未來預期目標的手段"}, {"s": 518.4, "e": 520.4, "t": "這句話在當時"}, {"s": 520.4, "e": 522.4, "t": "是非常具有革命性的"}, {"s": 522.4, "e": 524.4, "t": "我們可以發現"}, {"s": 524.4, "e": 526.4, "t": "在霍普斯之前"}, {"s": 526.4, "e": 528.4, "t": "權力幾乎總是被理解成一種"}, {"s": 528.4, "e": 530.4, "t": "倫理概念"}, {"s": 530.4, "e": 532.4, "t": "權力總是和正義道德合理"}, {"s": 532.4, "e": 534.4, "t": "進行捆綁"}, {"s": 534.4, "e": 536.4, "t": "所有權力的君主"}, {"s": 536.4, "e": 538.4, "t": "就是道德上的楷模"}, {"s": 538.4, "e": 540.4, "t": "因為天子有德"}, {"s": 540.4, "e": 542.4, "t": "所以他是皇帝"}, {"s": 542.4, "e": 544.4, "t": "因為他品行高尚"}, {"s": 544.4, "e": 546.4, "t": "沒有私心"}, {"s": 546.4, "e": 548.4, "t": "所以他是我們的領袖"}, {"s": 548.4, "e": 550.4, "t": "我們會發現過去的領導者和主權者"}, {"s": 550.4, "e": 552.4, "t": "往往都是一些"}, {"s": 552.4, "e": 554.4, "t": "英明神武的形象"}, {"s": 554.4, "e": 556.4, "t": "但是霍普斯認為"}, {"s": 556.4, "e": 558.4, "t": "權力本身並不具備這些倫理屬性"}, {"s": 558.4, "e": 560.4, "t": "而且權力也不是上帝賦予的"}, {"s": 560.4, "e": 562.4, "t": "所謂上帝的牧羊人這種說法"}, {"s": 562.4, "e": 564.4, "t": "雖然成立"}, {"s": 564.4, "e": 566.4, "t": "其次權力也不是來源於某種君主的血脈"}, {"s": 566.4, "e": 568.4, "t": "權力在本質上"}, {"s": 568.4, "e": 570.4, "t": "就是一種能力"}, {"s": 570.4, "e": 572.4, "t": "一種影響未來"}, {"s": 572.4, "e": 574.4, "t": "或者說確保未來的能力"}, {"s": 574.4, "e": 576.4, "t": "誰掌握了這種能力"}, {"s": 576.4, "e": 578.4, "t": "誰就擁有了更多的權力"}, {"s": 578.4, "e": 580.4, "t": "我們可以發現霍普斯將權力"}, {"s": 580.4, "e": 582.4, "t": "從過去的一種倫理概念"}, {"s": 582.4, "e": 584.4, "t": "或者說宗教概念"}, {"s": 584.4, "e": 586.4, "t": "變成了一個純粹的因果概念"}, {"s": 586.4, "e": 588.4, "t": "權力在霍普斯這裡"}, {"s": 588.4, "e": 590.4, "t": "變成了一種可以被計算"}, {"s": 590.4, "e": 592.4, "t": "可以被積累"}, {"s": 592.4, "e": 594.4, "t": "可以被比較的東西"}, {"s": 594.4, "e": 596.4, "t": "這就是霍普斯理論的先進性"}, {"s": 596.4, "e": 598.4, "t": "他實際上是在"}, {"s": 598.4, "e": 600.4, "t": "隱晦地告訴大家"}, {"s": 600.4, "e": 602.4, "t": "掌權者也沒有什麼了不起的"}, {"s": 602.4, "e": 604.4, "t": "他們的權力並不是與生俱來的"}, {"s": 604.4, "e": 606.4, "t": "好的"}, {"s": 606.4, "e": 608.4, "t": "那我們現在說說利維坦"}, {"s": 608.4, "e": 610.4, "t": "想解釋利維坦其實並不複雜"}, {"s": 610.4, "e": 612.4, "t": "一個關鍵的線索就在"}, {"s": 612.4, "e": 614.4, "t": "利維坦的第十七章中"}, {"s": 614.4, "e": 616.4, "t": "霍普斯說道"}, {"s": 616.4, "e": 618.4, "t": "這就是那個偉大的利維坦的誕生"}, {"s": 618.4, "e": 620.4, "t": "他不過是一個人工造出的巨人"}, {"s": 620.4, "e": 622.4, "t": "主權就是他的靈魂"}, {"s": 622.4, "e": 624.4, "t": "而他就是我們的凡人之神"}, {"s": 626.4, "e": 628.4, "t": "剛才我們說過"}, {"s": 628.4, "e": 630.4, "t": "霍普斯的權力觀是摒棄宗教觀念的"}, {"s": 630.4, "e": 632.4, "t": "但他為什麼要說"}, {"s": 632.4, "e": 634.4, "t": "利維坦是凡人之神呢"}, {"s": 634.4, "e": 636.4, "t": "其實利維坦並不是神學意義上的上帝"}, {"s": 636.4, "e": 638.4, "t": "但是他卻擁有著"}, {"s": 638.4, "e": 640.4, "t": "類似上帝的屬性"}, {"s": 640.4, "e": 642.4, "t": "他就像是神一樣"}, {"s": 642.4, "e": 644.4, "t": "擁有著絕對的權威"}, {"s": 644.4, "e": 646.4, "t": "但他又像凡人一般"}, {"s": 646.4, "e": 648.4, "t": "會死亡、會消解"}, {"s": 648.4, "e": 650.4, "t": "甚至是反噬他的創造者"}, {"s": 650.4, "e": 652.4, "t": "利維坦就是這樣一個"}, {"s": 652.4, "e": 654.4, "t": "人造的巨人"}, {"s": 654.4, "e": 656.4, "t": "在利維坦這本書的封面上"}, {"s": 656.4, "e": 658.4, "t": "我們也可以看到"}, {"s": 658.4, "e": 660.4, "t": "一個巨人的形象"}, {"s": 660.4, "e": 662.4, "t": "如果仔細觀察"}, {"s": 662.4, "e": 664.4, "t": "我們不難發現這個巨人"}, {"s": 664.4, "e": 666.4, "t": "其實是由無數公民的小身影"}, {"s": 666.4, "e": 668.4, "t": "所拼接而成的"}, {"s": 668.4, "e": 670.4, "t": "這意味著權力並不來自於國王"}, {"s": 670.4, "e": 672.4, "t": "而是來自於所有人"}, {"s": 672.4, "e": 674.4, "t": "共同服從的決定"}, {"s": 674.4, "e": 676.4, "t": "但是這個巨人作為主權者"}, {"s": 676.4, "e": 678.4, "t": "有一個非常鮮明的特點"}, {"s": 678.4, "e": 680.4, "t": "就是絕對性"}, {"s": 680.4, "e": 682.4, "t": "什麼叫絕對性呢?"}, {"s": 682.4, "e": 684.4, "t": "就是說一旦主權者被我們創造出來"}, {"s": 684.4, "e": 686.4, "t": "一旦我們把權力讓渡出去"}, {"s": 686.4, "e": 688.4, "t": "主權者的權力便不得被削弱"}, {"s": 688.4, "e": 690.4, "t": "換句話講"}, {"s": 690.4, "e": 692.4, "t": "這種權力具備以下三個"}, {"s": 692.4, "e": 694.4, "t": "重要的特徵"}, {"s": 694.4, "e": 696.4, "t": "第一點"}, {"s": 696.4, "e": 698.4, "t": "不可分割性"}, {"s": 698.4, "e": 700.4, "t": "霍普斯認為主權者的權力"}, {"s": 700.4, "e": 702.4, "t": "絕對不能被分成多個部分"}, {"s": 702.4, "e": 704.4, "t": "比如我們今天較為熟悉的民主憲政"}, {"s": 704.4, "e": 706.4, "t": "三權分立"}, {"s": 706.4, "e": 708.4, "t": "在霍普斯看來"}, {"s": 708.4, "e": 710.4, "t": "這通通都不行"}, {"s": 710.4, "e": 712.4, "t": "為什麼不行呢?因為分權就是削弱權力"}, {"s": 712.4, "e": 714.4, "t": "要知道"}, {"s": 714.4, "e": 716.4, "t": "我們讓渡權力創造利維坦"}, {"s": 716.4, "e": 718.4, "t": "並不是為了讓這個國家變得更民主"}, {"s": 718.4, "e": 720.4, "t": "而是為了躲避混亂"}, {"s": 720.4, "e": 722.4, "t": "避免恐懼的再次發生"}, {"s": 722.4, "e": 724.4, "t": "如果你把權力分散成"}, {"s": 724.4, "e": 726.4, "t": "立法權、行政權、司法權"}, {"s": 726.4, "e": 728.4, "t": "在霍普斯看來"}, {"s": 728.4, "e": 730.4, "t": "你就是把利維坦拆成了"}, {"s": 730.4, "e": 732.4, "t": "三隻互相掐架的小怪物"}, {"s": 732.4, "e": 734.4, "t": "它不僅無法避免恐懼"}, {"s": 734.4, "e": 736.4, "t": "相反還會創造"}, {"s": 736.4, "e": 738.4, "t": "新一輪的恐懼"}, {"s": 738.4, "e": 740.4, "t": "第二點不可挑戰性"}, {"s": 740.4, "e": 742.4, "t": "霍普斯認為主權者的秩序"}, {"s": 742.4, "e": 744.4, "t": "是不能被挑戰的"}, {"s": 744.4, "e": 746.4, "t": "這裡霍普斯並不是說"}, {"s": 746.4, "e": 748.4, "t": "主權者就是絕對正確的"}, {"s": 748.4, "e": 750.4, "t": "主權者是永遠不會犯錯的"}, {"s": 750.4, "e": 752.4, "t": "而是說一旦允許"}, {"s": 752.4, "e": 754.4, "t": "人們質疑主權者"}, {"s": 754.4, "e": 756.4, "t": "秩序就會開始產生鬆動"}, {"s": 756.4, "e": 758.4, "t": "換句話說即便主權者做錯了"}, {"s": 758.4, "e": 760.4, "t": "你也沒有質疑的資格"}, {"s": 760.4, "e": 762.4, "t": "今天你覺得主權者可以被質疑"}, {"s": 762.4, "e": 764.4, "t": "可以被挑戰"}, {"s": 764.4, "e": 766.4, "t": "那明天人們就會認為"}, {"s": 766.4, "e": 768.4, "t": "權力可以再分散一點"}, {"s": 768.4, "e": 770.4, "t": "再制衡一點、再削弱一點"}, {"s": 770.4, "e": 772.4, "t": "到最後不需要外部的"}, {"s": 772.4, "e": 774.4, "t": "強大敵人來打壓你"}, {"s": 774.4, "e": 776.4, "t": "你自己就會把自己掏空"}, {"s": 776.4, "e": 778.4, "t": "一個社會能否穩定"}, {"s": 778.4, "e": 780.4, "t": "不取決於主權者"}, {"s": 780.4, "e": 782.4, "t": "是否足夠聰明"}, {"s": 782.4, "e": 784.4, "t": "或者是領袖是否英明神武"}, {"s": 784.4, "e": 786.4, "t": "而取決於主權者的權威"}, {"s": 786.4, "e": 788.4, "t": "能否穩固"}, {"s": 788.4, "e": 790.4, "t": "第三點,不可廢除性"}, {"s": 790.4, "e": 792.4, "t": "權力一旦讓渡"}, {"s": 792.4, "e": 794.4, "t": "就不能被收回"}, {"s": 794.4, "e": 796.4, "t": "為什麼呢?"}, {"s": 796.4, "e": 798.4, "t": "因為你只要開放收回權力的可能性"}, {"s": 798.4, "e": 800.4, "t": "人們就會開始爭論"}, {"s": 800.4, "e": 802.4, "t": "誰有權力收回權力"}, {"s": 802.4, "e": 804.4, "t": "什麼時候收回權力"}, {"s": 804.4, "e": 806.4, "t": "什麼情況下我們應該"}, {"s": 806.4, "e": 808.4, "t": "收回權力"}, {"s": 808.4, "e": 810.4, "t": "或者是我們準備計劃"}, {"s": 810.4, "e": 812.4, "t": "什麼時候收回我們的權力"}, {"s": 812.4, "e": 814.4, "t": "一旦產生這樣的想法"}, {"s": 814.4, "e": 816.4, "t": "就意味著社會共識的崩塌"}, {"s": 816.4, "e": 818.4, "t": "霍普斯說"}, {"s": 818.4, "e": 820.4, "t": "人類所有的混亂"}, {"s": 820.4, "e": 822.4, "t": "都來自於共識的破碎"}, {"s": 822.4, "e": 824.4, "t": "既然我們授權主權者"}, {"s": 824.4, "e": 826.4, "t": "是為了逃離混亂"}, {"s": 826.4, "e": 828.4, "t": "那怎麼可以再給混亂"}, {"s": 828.4, "e": 830.4, "t": "留下新入口呢?"}, {"s": 830.4, "e": 832.4, "t": "所以主權者必須不可廢除"}, {"s": 832.4, "e": 834.4, "t": "你不能臨時反悔說"}, {"s": 834.4, "e": 836.4, "t": "算了,我覺得你配不上掌握權力"}, {"s": 836.4, "e": 838.4, "t": "我們要換一個新的國王"}, {"s": 838.4, "e": 840.4, "t": "不可以"}, {"s": 840.4, "e": 842.4, "t": "因為反悔本身就是反對秩序"}, {"s": 842.4, "e": 846.4, "t": "這也是霍普斯和所有現代自由主義思潮最大的區別"}, {"s": 846.4, "e": 848.4, "t": "自由主義者們相信"}, {"s": 848.4, "e": 850.4, "t": "限制權力可以帶來自由"}, {"s": 850.4, "e": 852.4, "t": "但是霍普斯相信"}, {"s": 852.4, "e": 854.4, "t": "限制權力只會帶來混亂"}, {"s": 854.4, "e": 856.4, "t": "甚至是必然走向死亡"}, {"s": 856.4, "e": 858.4, "t": "在他看來"}, {"s": 858.4, "e": 860.4, "t": "所有對權力的限制"}, {"s": 860.4, "e": 862.4, "t": "都是不靠譜的行為"}, {"s": 862.4, "e": 864.4, "t": "對於人類社會來說"}, {"s": 864.4, "e": 866.4, "t": "只有主權者才可以"}, {"s": 866.4, "e": 868.4, "t": "讓所有人停止相互懷疑"}, {"s": 868.4, "e": 870.4, "t": "讓未來具備確定性"}, {"s": 870.4, "e": 872.4, "t": "讓暴力得到唯一的壟斷"}, {"s": 872.4, "e": 874.4, "t": "讓法律變得一元"}, {"s": 874.4, "e": 876.4, "t": "讓混亂永久的被壓制下去"}, {"s": 876.4, "e": 878.4, "t": "到這裡我們可以發現"}, {"s": 878.4, "e": 880.4, "t": "在霍普斯眼中"}, {"s": 880.4, "e": 882.4, "t": "權力還真就是一個赤裸裸"}, {"s": 882.4, "e": 884.4, "t": "血淋淋的東西"}, {"s": 884.4, "e": 886.4, "t": "而且霍普斯剝奪了人們"}, {"s": 886.4, "e": 888.4, "t": "推翻不義政府的權力"}, {"s": 888.4, "e": 890.4, "t": "顯然霍普斯的說法"}, {"s": 890.4, "e": 892.4, "t": "和今天的主流觀點"}, {"s": 892.4, "e": 894.4, "t": "是完全相悖的"}, {"s": 894.4, "e": 896.4, "t": "當然我們觀察任何理論"}, {"s": 896.4, "e": 898.4, "t": "都不能脫離他的時代背景"}, {"s": 898.4, "e": 900.4, "t": "其實利維坦的寫作動機"}, {"s": 900.4, "e": 902.4, "t": "還是非常複雜的"}, {"s": 902.4, "e": 904.4, "t": "而且非常的有趣"}, {"s": 904.4, "e": 906.4, "t": "關於這部著作的解讀"}, {"s": 906.4, "e": 908.4, "t": "以後我會單獨出視頻給大家講解"}, {"s": 908.4, "e": 910.4, "t": "現在我們還是把注意力"}, {"s": 910.4, "e": 912.4, "t": "拉回到權力的概念上"}, {"s": 912.4, "e": 914.4, "t": "霍普斯的貢獻其實非常清晰"}, {"s": 914.4, "e": 916.4, "t": "他在權力為什麼發生"}, {"s": 916.4, "e": 918.4, "t": "以及權力的必要性上"}, {"s": 918.4, "e": 920.4, "t": "提供了一個極其堅固的解釋框架"}, {"s": 920.4, "e": 922.4, "t": "也就是說"}, {"s": 922.4, "e": 924.4, "t": "只要人類的寫作規模不斷擴大"}, {"s": 924.4, "e": 926.4, "t": "只要共識無法維持"}, {"s": 926.4, "e": 928.4, "t": "只要人類需要脫離混亂和恐懼"}, {"s": 928.4, "e": 930.4, "t": "權力就必然出現"}, {"s": 930.4, "e": 932.4, "t": "從這個角度來看"}, {"s": 932.4, "e": 934.4, "t": "霍普斯幾乎是抽絲剝繭般的"}, {"s": 934.4, "e": 936.4, "t": "把權力的最深層"}, {"s": 936.4, "e": 938.4, "t": "剝開給我們看"}, {"s": 938.4, "e": 940.4, "t": "但問題在於"}, {"s": 940.4, "e": 942.4, "t": "霍普斯對主權的理論"}, {"s": 942.4, "e": 944.4, "t": "實在是無法說服我們現代人"}, {"s": 944.4, "e": 946.4, "t": "因為在霍普斯的理論當中"}, {"s": 946.4, "e": 948.4, "t": "合法性的來源非常的單一"}, {"s": 948.4, "e": 950.4, "t": "只要主權者不威脅你的生命"}, {"s": 950.4, "e": 952.4, "t": "只要他能保證你免強活得下去"}, {"s": 952.4, "e": 954.4, "t": "你就必須服從他"}, {"s": 954.4, "e": 956.4, "t": "任何基於不滿、不公、不義的反抗行為"}, {"s": 956.4, "e": 958.4, "t": "都會被視為重新製造混亂"}, {"s": 958.4, "e": 960.4, "t": "這對我們現代人來說"}, {"s": 960.4, "e": 962.4, "t": "幾乎是不可接受的"}, {"s": 962.4, "e": 964.4, "t": "因為他從根本上"}, {"s": 964.4, "e": 966.4, "t": "否定了你上排桌的權力"}, {"s": 966.4, "e": 968.4, "t": "也不給你任何的籌碼"}, {"s": 968.4, "e": 970.4, "t": "和主權者談判"}, {"s": 970.4, "e": 972.4, "t": "在這樣的一個理論當中"}, {"s": 972.4, "e": 974.4, "t": "你會忍不住想問"}, {"s": 974.4, "e": 976.4, "t": "為什麼我們要服從呢?"}, {"s": 976.4, "e": 978.4, "t": "如果說"}, {"s": 978.4, "e": 980.4, "t": "權力不是道德問題"}, {"s": 980.4, "e": 982.4, "t": "沒有善惡"}, {"s": 982.4, "e": 984.4, "t": "只是分工和協作的產物"}, {"s": 984.4, "e": 986.4, "t": "那為什麼是你來指揮我呢?"}, {"s": 986.4, "e": 988.4, "t": "為什麼不是我來指揮你?"}, {"s": 988.4, "e": 990.4, "t": "權力為什麼值得被人服從呢?"}, {"s": 990.4, "e": 992.4, "t": "而這種服從的根源"}, {"s": 992.4, "e": 994.4, "t": "又來自哪裡?"}, {"s": 994.4, "e": 996.4, "t": "歷史上有許多的思想家"}, {"s": 996.4, "e": 998.4, "t": "都試圖回答這些問題"}, {"s": 998.4, "e": 1000.4, "t": "但是"}, {"s": 1000.4, "e": 1002.4, "t": "有一個人的回答"}, {"s": 1002.4, "e": 1004.4, "t": "他所建立起的理論框架"}, {"s": 1004.4, "e": 1006.4, "t": "幾乎奠定了整個現代社會"}, {"s": 1006.4, "e": 1008.4, "t": "對權力合法性的"}, {"s": 1008.4, "e": 1010.4, "t": "全部理解"}, {"s": 1010.4, "e": 1012.4, "t": "這就是馬克思·韋伯"}, {"s": 1016.4, "e": 1018.4, "t": "為了方便大家的理解"}, {"s": 1018.4, "e": 1020.4, "t": "我們還是先從場景切入"}, {"s": 1020.4, "e": 1022.4, "t": "想像一下"}, {"s": 1022.4, "e": 1024.4, "t": "一輛高速行駛的火車"}, {"s": 1024.4, "e": 1026.4, "t": "正在朝著自己預定的方向"}, {"s": 1026.4, "e": 1028.4, "t": "前進"}, {"s": 1028.4, "e": 1030.4, "t": "此時鐵軌上的任何障礙"}, {"s": 1030.4, "e": 1032.4, "t": "譬如細小的碎石、落葉、樹枝"}, {"s": 1032.4, "e": 1034.4, "t": "它們都會被推開"}, {"s": 1034.4, "e": 1036.4, "t": "碾碎、卷走"}, {"s": 1036.4, "e": 1038.4, "t": "這些東西都會對"}, {"s": 1038.4, "e": 1040.4, "t": "火車造成一定的阻力"}, {"s": 1040.4, "e": 1042.4, "t": "但是它們最終都無法改變"}, {"s": 1042.4, "e": 1044.4, "t": "火車行駛的方向"}, {"s": 1044.4, "e": 1046.4, "t": "正如韋伯在《經濟與社會》"}, {"s": 1046.4, "e": 1048.4, "t": "一書當中寫道"}, {"s": 1048.4, "e": 1050.4, "t": "權力是指在一種社會關係當中"}, {"s": 1050.4, "e": 1052.4, "t": "一個行動者能夠在對方"}, {"s": 1052.4, "e": 1054.4, "t": "可能反抗的情況下"}, {"s": 1054.4, "e": 1056.4, "t": "實現自身意志的可能性"}, {"s": 1056.4, "e": 1058.4, "t": "相較於這些碎石塵埃"}, {"s": 1058.4, "e": 1060.4, "t": "火車之所以具備權力"}, {"s": 1060.4, "e": 1062.4, "t": "是因為它在阻力面前"}, {"s": 1062.4, "e": 1064.4, "t": "仍然讓事情沿著自己的"}, {"s": 1064.4, "e": 1066.4, "t": "軌跡發生"}, {"s": 1066.4, "e": 1068.4, "t": "權力就是一種你不想"}, {"s": 1068.4, "e": 1070.4, "t": "但是你必須服從的東西"}, {"s": 1070.4, "e": 1072.4, "t": "可是在馬克思韋伯的理論當中"}, {"s": 1072.4, "e": 1074.4, "t": "真正核心的"}, {"s": 1074.4, "e": 1076.4, "t": "並不是權力"}, {"s": 1076.4, "e": 1078.4, "t": "而是權威"}, {"s": 1078.4, "e": 1080.4, "t": "權威不同於權力"}, {"s": 1080.4, "e": 1082.4, "t": "權力需要強迫"}, {"s": 1082.4, "e": 1084.4, "t": "但權威並不需要"}, {"s": 1084.4, "e": 1086.4, "t": "權力依賴於力量"}, {"s": 1086.4, "e": 1088.4, "t": "權威依賴於合法性"}, {"s": 1088.4, "e": 1090.4, "t": "權力可以讓人們臣服"}, {"s": 1090.4, "e": 1092.4, "t": "但是權威讓人們信服"}, {"s": 1092.4, "e": 1094.4, "t": "在權威當中"}, {"s": 1094.4, "e": 1096.4, "t": "人們會認為自己被壓迫"}, {"s": 1096.4, "e": 1098.4, "t": "相反他們會認為"}, {"s": 1098.4, "e": 1100.4, "t": "這種服從是理所應當的"}, {"s": 1100.4, "e": 1102.4, "t": "而且是十分有必要的"}, {"s": 1102.4, "e": 1104.4, "t": "也就是說"}, {"s": 1104.4, "e": 1106.4, "t": "不是權力征服了人民"}, {"s": 1106.4, "e": 1108.4, "t": "而是人民承認了權力"}, {"s": 1108.4, "e": 1110.4, "t": "馬克思韋伯認為"}, {"s": 1110.4, "e": 1112.4, "t": "現代社會要運轉"}, {"s": 1112.4, "e": 1114.4, "t": "不是因為主權者掌握了"}, {"s": 1114.4, "e": 1116.4, "t": "更加強大的能力"}, {"s": 1116.4, "e": 1118.4, "t": "而是因為主權者的權力"}, {"s": 1118.4, "e": 1120.4, "t": "獲得了合法性"}, {"s": 1120.4, "e": 1122.4, "t": "你之所以會配合警察"}, {"s": 1122.4, "e": 1124.4, "t": "不是因為他們用槍去指著你"}, {"s": 1124.4, "e": 1126.4, "t": "你之所以選擇服從這些權力"}, {"s": 1126.4, "e": 1128.4, "t": "就是因為你相信"}, {"s": 1128.4, "e": 1130.4, "t": "眼前的這個體系是合理的"}, {"s": 1130.4, "e": 1132.4, "t": "所以他們具備"}, {"s": 1132.4, "e": 1134.4, "t": "命令你的權力"}, {"s": 1134.4, "e": 1136.4, "t": "而問題的關鍵在於"}, {"s": 1136.4, "e": 1138.4, "t": "我們是通過什麼樣的標準"}, {"s": 1138.4, "e": 1140.4, "t": "來判斷一個權力是否合法的"}, {"s": 1140.4, "e": 1142.4, "t": "馬克思韋伯認為"}, {"s": 1142.4, "e": 1144.4, "t": "人類對權威的認可"}, {"s": 1144.4, "e": 1146.4, "t": "最終只來自於三種來源"}, {"s": 1146.4, "e": 1148.4, "t": "也就是傳統權威"}, {"s": 1148.4, "e": 1150.4, "t": "魅力權威和法理權威"}, {"s": 1152.4, "e": 1154.4, "t": "傳統型權威的核心"}, {"s": 1154.4, "e": 1156.4, "t": "其實就在於一句話"}, {"s": 1156.4, "e": 1158.4, "t": "身份即權力"}, {"s": 1158.4, "e": 1160.4, "t": "歷史即合法"}, {"s": 1160.4, "e": 1162.4, "t": "人們選擇服從傳統權威"}, {"s": 1162.4, "e": 1164.4, "t": "不是因為統治者的能力特別強"}, {"s": 1164.4, "e": 1166.4, "t": "而是因為從來如此"}, {"s": 1166.4, "e": 1168.4, "t": "也就是說傳統權威依賴的是"}, {"s": 1168.4, "e": 1170.4, "t": "習俗、血緣、繼承"}, {"s": 1170.4, "e": 1172.4, "t": "或者是家族結構、宗教傳統"}, {"s": 1172.4, "e": 1174.4, "t": "而非是我們現代人熟悉的"}, {"s": 1174.4, "e": 1176.4, "t": "制度和程序"}, {"s": 1176.4, "e": 1178.4, "t": "在這種體系上"}, {"s": 1178.4, "e": 1180.4, "t": "人類的權威"}, {"s": 1180.4, "e": 1182.4, "t": "在這種體系之下"}, {"s": 1182.4, "e": 1184.4, "t": "統治者擁有著與生俱來的"}, {"s": 1184.4, "e": 1186.4, "t": "天然權力"}, {"s": 1186.4, "e": 1188.4, "t": "而被統治者擁有與生俱來的"}, {"s": 1188.4, "e": 1190.4, "t": "天然義務"}, {"s": 1190.4, "e": 1192.4, "t": "服從就是一種習慣"}, {"s": 1192.4, "e": 1194.4, "t": "而不是一種判斷"}, {"s": 1194.4, "e": 1196.4, "t": "最典型的案例就是古代的"}, {"s": 1196.4, "e": 1198.4, "t": "皇權制度"}, {"s": 1198.4, "e": 1200.4, "t": "皇帝為什麼能合法統治呢"}, {"s": 1200.4, "e": 1202.4, "t": "不是因為他通過程序獲得授權"}, {"s": 1202.4, "e": 1204.4, "t": "也不是因為他向人民證明了"}, {"s": 1204.4, "e": 1206.4, "t": "自己的治理水平有多高"}, {"s": 1206.4, "e": 1208.4, "t": "而是因為他生來就是皇帝"}, {"s": 1208.4, "e": 1210.4, "t": "因為那裡的文化告訴他們"}, {"s": 1210.4, "e": 1212.4, "t": "自古以來就是這樣"}, {"s": 1212.4, "e": 1214.4, "t": "當然一個王朝的開國皇帝"}, {"s": 1214.4, "e": 1216.4, "t": "總不能說自古以來就是這樣吧"}, {"s": 1216.4, "e": 1218.4, "t": "所以開國皇帝"}, {"s": 1218.4, "e": 1220.4, "t": "通常都要解決"}, {"s": 1220.4, "e": 1222.4, "t": "自己的合法性問題"}, {"s": 1222.4, "e": 1224.4, "t": "也就是所謂的名分"}, {"s": 1224.4, "e": 1226.4, "t": "我們可以看到每一個朝代的開國皇帝"}, {"s": 1226.4, "e": 1228.4, "t": "幾乎都要重新敘述一遍"}, {"s": 1228.4, "e": 1230.4, "t": "舊王朝的歷史"}, {"s": 1230.4, "e": 1232.4, "t": "幾乎每個舊王朝"}, {"s": 1232.4, "e": 1234.4, "t": "在最後都是暴虐無道"}, {"s": 1234.4, "e": 1236.4, "t": "失德逆天的"}, {"s": 1236.4, "e": 1238.4, "t": "而新王朝永遠被描述為"}, {"s": 1238.4, "e": 1240.4, "t": "順應天命"}, {"s": 1240.4, "e": 1242.4, "t": "眾望所歸"}, {"s": 1242.4, "e": 1244.4, "t": "當然很多老百姓"}, {"s": 1244.4, "e": 1246.4, "t": "不關心這些問題"}, {"s": 1246.4, "e": 1248.4, "t": "或者說沒有能力關心這些問題"}, {"s": 1248.4, "e": 1250.4, "t": "所以為了強化這種"}, {"s": 1250.4, "e": 1252.4, "t": "天命轉移的敘事"}, {"s": 1252.4, "e": 1254.4, "t": "新的統治者往往會借助一些"}, {"s": 1254.4, "e": 1256.4, "t": "天氣異象、災荒、祥瑞"}, {"s": 1256.4, "e": 1258.4, "t": "乃至是各路的靈異傳說"}, {"s": 1258.4, "e": 1260.4, "t": "為自己進行輿論造勢"}, {"s": 1260.4, "e": 1262.4, "t": "這種說法相對來說"}, {"s": 1262.4, "e": 1264.4, "t": "更容易被老百姓接受"}, {"s": 1264.4, "e": 1266.4, "t": "換言之,誰能當上皇帝"}, {"s": 1266.4, "e": 1268.4, "t": "那都是上天的安排"}, {"s": 1268.4, "e": 1270.4, "t": "不是你我能夠決定的"}, {"s": 1270.4, "e": 1272.4, "t": "這其實也說明了一個非常關鍵的問題"}, {"s": 1272.4, "e": 1274.4, "t": "在傳統型權威的世界裡"}, {"s": 1274.4, "e": 1276.4, "t": "統治者的合法性"}, {"s": 1276.4, "e": 1278.4, "t": "就是一種敘事的合法性"}, {"s": 1278.4, "e": 1280.4, "t": "而不是一種制度的合法性"}, {"s": 1280.4, "e": 1282.4, "t": "所以一旦社會結構"}, {"s": 1282.4, "e": 1284.4, "t": "發生動盪"}, {"s": 1284.4, "e": 1286.4, "t": "傳統權威的合法性就會迅速瓦解"}, {"s": 1288.4, "e": 1290.4, "t": "所謂的魅力型權威"}, {"s": 1290.4, "e": 1292.4, "t": "並不是我們日常理解的"}, {"s": 1292.4, "e": 1294.4, "t": "討人喜歡或者是"}, {"s": 1294.4, "e": 1296.4, "t": "人格上有魅力"}, {"s": 1296.4, "e": 1298.4, "t": "在馬克思韋伯的理論語境當中"}, {"s": 1298.4, "e": 1300.4, "t": "魅力是一種超越日常經驗的個人特質"}, {"s": 1300.4, "e": 1302.4, "t": "這種特質"}, {"s": 1302.4, "e": 1304.4, "t": "讓追隨者相信"}, {"s": 1304.4, "e": 1306.4, "t": "眼前的領袖擁有非凡的本領"}, {"s": 1306.4, "e": 1308.4, "t": "或者是特殊的使命"}, {"s": 1308.4, "e": 1310.4, "t": "他的存在"}, {"s": 1310.4, "e": 1312.4, "t": "甚至能扭轉整個群體的命運"}, {"s": 1312.4, "e": 1314.4, "t":  1402.4, "t": "理解當你飢餓的時候"}, {"s": 1402.4, "e": 1404.4, "t": "有人送上了麵包"}, {"s": 1404.4, "e": 1406.4, "t": "當你絕望的時候"}, {"s": 1406.4, "e": 1408.4, "t": "有人送上了希望"}, {"s": 1408.4, "e": 1410.4, "t": "當你缺乏成就卻渴望榮譽的時候"}, {"s": 1410.4, "e": 1412.4, "t": "有人送上了一份集體榮譽感"}, {"s": 1412.4, "e": 1414.4, "t": "只是這一切都在暗中"}, {"s": 1414.4, "e": 1416.4, "t": "標好了價格"}, {"s": 1416.4, "e": 1418.4, "t": "對於當時的德國人來說"}, {"s": 1418.4, "e": 1420.4, "t": "他們急需的就是一個能解釋"}, {"s": 1420.4, "e": 1422.4, "t": "失敗的人"}, {"s": 1422.4, "e": 1424.4, "t": "一個提供標準答案的人"}, {"s": 1424.4, "e": 1426.4, "t": "一個敢於承諾未來的人"}, {"s": 1426.4, "e": 1428.4, "t": "所以越是簡單粗暴"}, {"s": 1428.4, "e": 1430.4, "t": "越是挑動情緒的答案"}, {"s": 1430.4, "e": 1432.4, "t": "越容易獲得壓倒性的共鳴"}, {"s": 1432.4, "e": 1434.4, "t": "希特勒的權威就是在這樣的土壤中"}, {"s": 1434.4, "e": 1436.4, "t": "生長出來的"}, {"s": 1436.4, "e": 1438.4, "t": "雖然魅力型權威有驚人的動員能力"}, {"s": 1438.4, "e": 1440.4, "t": "能夠在短時間內凝聚情緒"}, {"s": 1440.4, "e": 1442.4, "t": "統一意志"}, {"s": 1442.4, "e": 1444.4, "t": "但是魅力型權威"}, {"s": 1444.4, "e": 1446.4, "t": "有一個無法克服的難題"}, {"s": 1446.4, "e": 1448.4, "t": "那就是無法複製"}, {"s": 1448.4, "e": 1450.4, "t": "無法繼承"}, {"s": 1450.4, "e": 1452.4, "t": "所謂的魅力只能存在於"}, {"s": 1452.4, "e": 1454.4, "t": "獨特的個體之上"}, {"s": 1454.4, "e": 1456.4, "t": "它不屬於制度產物"}, {"s": 1456.4, "e": 1458.4, "t": "一個領袖的人格魅力"}, {"s": 1458.4, "e": 1460.4, "t": "無法被他的繼承者完美繼承"}, {"s": 1460.4, "e": 1462.4, "t": "也無法通過培訓、章程"}, {"s": 1462.4, "e": 1464.4, "t": "或者是什麼組織結構"}, {"s": 1464.4, "e": 1466.4, "t": "進行二次生產"}, {"s": 1466.4, "e": 1468.4, "t": "這意味著一旦魅力型權威的領袖退場"}, {"s": 1468.4, "e": 1470.4, "t": "無論是自然死亡"}, {"s": 1470.4, "e": 1472.4, "t": "還是政治失勢"}, {"s": 1472.4, "e": 1474.4, "t": "或者是被人民推翻"}, {"s": 1474.4, "e": 1476.4, "t": "整個權力體系都會進入真空狀態"}, {"s": 1476.4, "e": 1478.4, "t": "最能說明的案例"}, {"s": 1478.4, "e": 1480.4, "t": "就是亞歷山大"}, {"s": 1480.4, "e": 1482.4, "t": "他曾經用不可思議的速度"}, {"s": 1482.4, "e": 1484.4, "t": "建立了一個橫跨亞歐非三大陸的"}, {"s": 1484.4, "e": 1486.4, "t": "龐大帝國"}, {"s": 1486.4, "e": 1488.4, "t": "所有的士兵、貴族
