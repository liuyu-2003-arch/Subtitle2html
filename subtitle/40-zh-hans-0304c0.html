": 641.47, "t": "制度、流程、集体决策都去哪了"}, {"s": 641.67, "e": 643.0, "t": "如果是制度问题"}, {"s": 643.0, "e": 644.3, "t": "那制定制度的人"}, {"s": 644.3, "e": 646.57, "t": "会对这一次的具体行为负责吗"}, {"s": 646.87, "e": 648.23, "t": "在现实生活当中"}, {"s": 648.23, "e": 649.87, "t": "答案往往是否定的"}, {"s": 650.03, "e": 651.47, "t": "我们经常能够看到"}, {"s": 651.47, "e": 654.07, "t": "最终负责的可能是一个实习生"}, {"s": 654.07, "e": 656.57, "t": "又或者是一个一线的执行者"}, {"s": 656.63, "e": 658.87, "t": "当然也有可能是某个中层领导"}, {"s": 658.87, "e": 660.2, "t": "或者是部门主管"}, {"s": 660.43, "e": 661.6, "t": "但他永远不可能"}, {"s": 661.6, "e": 664.83, "t": "是最接近权力中心枢纽的那个大人物"}, {"s": 665.07, "e": 666.07, "t": "简而言之"}, {"s": 666.07, "e": 669.27, "t": "权力并不会遵循权责对等的原则"}, {"s": 669.27, "e": 670.63, "t": "公平的承担责任"}, {"s": 670.63, "e": 673.3, "t": "而是以最小的代价去承担责任"}, {"s": 673.4, "e": 675.47, "t": "这就是权力的责任稀释性"}, {"s": 675.87, "e": 678.97, "t": "以上我所提到的权力的6个主要特性"}, {"s": 679.03, "e": 681.5, "t": "其实只是权力的冰山一角"}, {"s": 681.8, "e": 684.0, "t": "在人类漫长的文明史当中"}, {"s": 684.03, "e": 686.27, "t": "为了驯服权力这头猛兽"}, {"s": 686.3, "e": 688.7, "t": "我们曾经设计过无数的牢笼"}, {"s": 688.8, "e": 691.57, "t": "其中不乏极具革命性的制度创举"}, {"s": 691.7, "e": 692.9, "t": "而问题在于"}, {"s": 692.9, "e": 694.97, "t": "这些事件一旦展开来讲"}, {"s": 694.97, "e": 698.3, "t": "往往会变成一长串的历史著作、思想家"}, {"s": 698.3, "e": 700.6, "t": "或者是制度革命的时间线"}, {"s": 700.87, "e": 702.07, "t": "如果要深究"}, {"s": 702.07, "e": 704.47, "t": "真不是一个视频能够讲完的"}, {"s": 704.83, "e": 707.0, "t": "但是我们也可以换一个角度来看"}, {"s": 707.17, "e": 709.0, "t": "当我们去回看近代以来"}, {"s": 709.0, "e": 711.1, "t": "这条限制权力的历史脉络"}, {"s": 711.1, "e": 713.67, "t": "我们就会发现一个非常重要的事实"}, {"s": 713.83, "e": 716.07, "t": "这些看似零散的制度尝试"}, {"s": 716.07, "e": 717.77, "t": "并不是随机出现的"}, {"s": 717.77, "e": 720.77, "t": "而是一步一步被迫推进的结果"}, {"s": 720.9, "e": 722.27, "t": "从这个意义上来说"}, {"s": 722.27, "e": 724.43, "t": "近代以来的人类限权实践"}, {"s": 724.47, "e": 725.6, "t": "不是制度清单"}, {"s": 725.6, "e": 727.9, "t": "而是一条逐渐递进的脉络"}, {"s": 728.17, "e": 730.07, "t": "今天我在视频中要做的"}, {"s": 730.07, "e": 732.27, "t": "就是把这条脉络提炼出来"}, { 翰签署了一份文件"}, {"s": 921.07, "e": 923.83, "t": "这份文件就是赫赫有名的《大宪章》"}, {"s": 924.2, "e": 925.83, "t": "在人类的政治史上"}, {"s": 925.83, "e": 928.9, "t": "《大宪章》第一次明确的写下了一条原则"}, {"s": 928.9, "e": 930.63, "t": "那就是统治者本身"}, {"s": 930.63, "e": 933.0, "t": "也必须被规则所束缚"}, {"s": 933.47, "e": 934.67, "t": "这也是第一份"}, {"s": 934.67, "e": 937.03, "t": "带有限权思想的法理性文件"}, {"s": 937.47, "e": 938.2, "t": "所以说"}, {"s": 938.2, "e": 941.5, "t": "有限政府并不是要政府变得软弱"}, {"s": 941.5, "e": 943.57, "t": "而是要承认一个政治现实"}, {"s": 943.77, "e": 946.7, "t": "权力本身具备自我扩张的倾向"}, {"s": 946.83, "e": 950.0, "t": "而制度的任务就是假设最坏的情景"}, {"s": 950.23, "e": 952.67, "t": "它并不指望国王可以仁慈"}, {"s": 952.67, "e": 954.57, "t": "也不依赖官员的自律"}, {"s": 954.7, "e": 957.67, "t": "它更不会幻想权力会自动克制"}, {"s": 957.87, "e": 959.63, "t": "它要做的只有一件事"}, {"s": 959.63, "e": 962.03, "t": "那就是把权力关进规则的笼子"}, {"s": 962.03, "e": 964.77, "t": "里这就是所谓的王在法下"}, {"s": 965.37, "e": 966.6, "t": "不过大家要注意"}, {"s": 966.67, "e": 968.27, "t": "不要以为有了《大宪章》"}, {"s": 968.27, "e": 969.7, "t": "就可以一劳永逸了"}, {"s": 969.77, "e": 972.2, "t": "事实上在很长的一段时间里"}, {"s": 972.27, "e": 975.3, "t": "《大宪章》都像一张废纸一样无人在意"}, {"s": 975.4, "e": 976.77, "t": "所谓的王在法下"}, {"s": 976.77, "e": 979.77, "t": "也只是当初的一个美好的政治理想"}, {"s": 980.1, "e": 983.23, "t": "英国经历了无数的王权与贵族的博弈"}, {"s": 983.23, "e": 985.27, "t": "才逐渐形成了议会权力"}, {"s": 985.47, "e": 986.97, "t": "从签署《大宪章》"}, {"s": 987.0, "e": 987.97, "t": "到事实上"}, {"s": 987.97, "e": 990.43, "t": "成为一个现代意义的有限政府"}, {"s": 990.43, "e": 992.77, "t": "英国人花费了几百年的时间"}, {"s": 993.1, "e": 993.9, "t": "也就是说"}, {"s": 993.9, "e": 996.27, "t": "即便所有人都在口头上承认"}, {"s": 996.27, "e": 998.3, "t": "政府的权力应该被限制"}, {"s": 998.37, "e": 999.4, "t": "而这种限制"}, {"s": 999.4, "e": 1002.07, "t": "只要还没有变成明确稳定"}, {"s": 1002.07, "e": 1004.07, "t": "不可随意突破的规则"}, {"s": 1004.17, "e": 1006.2, "t": "它在现实的权力运作当中"}, {"s": 1006.2, "e": 1008.43, "t": "就会一点一滴的被侵蚀掉"}, {"s": 1008.67, "e": 1010.3, "t": "这就是我要说的第二点"}, {"s": 1010.43, "e": 1011.53, "t": "明确宪法"}, {"s": 1011.7, "e": 1014.07, "t": "宪法一词在中文语境中"}, {"s": 1014.07, "e": 1016.23, "t": "其实有许多不同的称呼"}, {"s": 1016.27, "e": 1019.8, "t": "比如说基本法、根本法、国法、宪章"}, {"s": 1019.8, "e": 1021.43, "t": "或者是宪制文件"}, {"s": 1021.7, "e": 1024.87, "t": "这些名称强调的侧重点各不相同"}, {"s": 1024.97, "e": 1026.67, "t": "但它们共同指向的"}, {"s": 1026.67, "e": 1029.0, "t": "都是权力运行的根本规则"}, {"s": 1029.0, "e": 1030.3, "t": "而在英文当中"}, {"s": 1030.3, "e": 1033.77, "t": "宪法一词对应的单词是constitution"}, {"s": 1033.83, "e": 1037.53, "t": "而它的词源来自于拉丁文的constitutio"}, {"s": 1037.7, "e": 1039.47, "t": "在罗马法的语境当中"}, {"s": 1039.6, "e": 1042.97, "t": "这个概念不是指一部单纯的法律文本"}, {"s": 1043.1, "e": 1046.5, "t": "而是一种秩序如何被安排的状态"}, {"s": 1046.7, "e": 1049.2, "t": "其中包含了权力如何被放置"}, {"s": 1049.2, "e": 1050.83, "t": "谁有权力决定什么"}, {"s": 1050.83, "e": 1053.23, "t": "以及整体的秩序如何运作"}, {"s": 1053.4, "e": 1054.3, "t": "换言之"}, {"s": 1054.3, "e": 1056.9, "t": "这个概念关注的不是价值判断"}, {"s": 1056.9, "e": 1059.23, "t": "而是权力结构的安置方式"}, {"s": 1059.5, "e": 1060.47, "t": "正因如此"}, {"s": 1060.47, "e": 1062.67, "t": "从概念流变的角度上来看"}, {"s": 1062.77, "e": 1065.87, "t": "宪法这个概念首先是一种制度形式"}, {"s": 1066.0, "e": 1068.4, "t": "它本身并不天然指向正义"}, {"s": 1068.43, "e": 1072.07, "t": "所以宪法本身并不带有限权思想"}, {"s": 1072.3, "e": 1073.33, "t": "它既可以被用来"}, {"s": 1073.37, "e": 1075.27, "t": "服务于限权的政治目标"}, {"s": 1075.27, "e": 1075.9, "t": "同样"}, {"s": 1075.9, "e": 1079.17, "t": "也可以被用来服务于集权的政治需要"}, {"s": 1079.5, "e": 1081.6, "t": "真正将限制权力这个使命"}, {"s": 1081.6, "e": 1083.2, "t": "安插到宪法之中的"}, {"s": 1083.2, "e": 1085.5, "t": "是后来发展出来的「宪政主义」"}, {"s": 1085.73, "e": 1088.07, "t": "因此对我们现代公民来说"}, {"s": 1088.07, "e": 1091.57, "t": "我们真正需要的不是一部单纯的宪法"}, {"s": 1091.57, "e": 1094.07, "t": "而是一部有明确政治使命"}, {"s": 1094.07, "e": 1096.2, "t": "符合宪政主义精神的宪法"}, {"s": 1096.2, "e": 1097.43, "t": "从表面上看"}, {"s": 1097.43, "e": 1099.4, "t": "无论是过去还是现在"}, {"s": 1099.4, "e": 1101.17, "t": "无论是哪个国家的宪法"}, {"s": 1101.17, "e": 1104.37, "t": "在结构和形式上往往都是大同小异的"}, {"s": 1104.5, "e": 1107.07, "t": "但真正的分野之处不在于文本"}, {"s": 1107.1, "e": 1109.47, "t": "在于宪法背后所服务的目的"}, {"s": 1109.67, "e": 1111.3, "t": "决定一部宪法性质的"}, {"s": 1111.3, "e": 1112.77, "t": "不是它写了什么"}, {"s": 1112.77, "e": 1115.4, "t": "而是它试图防范谁约束谁"}, {"s": 1115.43, "e": 1117.97, "t": "在这里我们就以日本来举例"}, {"s": 1120.97, "e": 1122.67, "t": "其实最早在东亚地区"}, {"s": 1122.67, "e": 1124.87, "t": "使用宪法字眼的制宪文件"}, {"s": 1124.87, "e": 1127.27, "t": "就是公布于明治二十二年"}, {"s": 1127.27, "e": 1130.17, "t": "也就是1889年的《大日本帝国宪法》"}, {"s": 1130.77, "e": 1131.47, "t": "这部宪法"}, {"s": 1131.47, "e": 1135.37, "t": "于明治二十三年11月29日开始实行"}, {"s": 1135.43, "e": 1137.67, "t": "直至二战之后的1947年"}, {"s": 1137.67, "e": 1140.03, "t": "被现行的《日本国宪法》所取代"}, {"s": 1140.23, "e": 1142.37, "t": "所以从严格意义上来讲"}, {"s": 1142.37, "e": 1145.27, "t": "日本在近代其实经历过两部宪法"}, {"s": 1145.63, "e": 1146.23, "t": "第一部"}, {"s": 1146.23, "e": 1149.1, "t": "就是1889年颁布的《大日本帝国宪法》"}, {"s": 1149.1, "e": 1151.4, "t": "通常被称作为明治宪法"}, {"s": 1151.5, "e": 1153.0, "t": "第二部就是二战后"}, {"s": 1153.0, "e": 1155.5, "t": "在1947年实行的《日本国宪法》"}, {"s": 1155.5, "e": 1157.43, "t": "通常被称之为昭和宪法"}, {"s": 1157.7, "e": 1161.17, "t": "这两部宪法在形式上同样被称作宪法"}, {"s": 1161.17, "e": 1163.07, "t": "但它们所承担的政治使命"}, {"s": 1163.07, "e": 1164.43, "t": "是完全相反的"}, {"s": 1164.77, "e": 1166.43, "t": "明治宪法的核心任务"}, {"s": 1166.43, "e": 1168.3, "t": "是在近代国家体系之中"}, {"s": 1168.3, "e": 1169.6, "t": "为天皇的主权"}, {"s": 1169.6, "e": 1172.63, "t": "提供制度化、法律化的正当性表述"}, {"s": 1172.83, "e": 1174.77, "t": "而战后宪法（昭和宪法）的根本目的"}, {"s": 1174.77, "e": 1177.63, "t": "则是通过制度设计限制国家权力"}, {"s": 1177.63, "e": 1179.57, "t": "防止权力的再次失控"}, {"s": 1179.8, "e": 1181.9, "t": "二者的差异并不在于文本"}, {"s": 1181.9, "e": 1184.4, "t": "而在于宪法所服务的政治原则"}, {"s": 1184.4, "e": 1185.97, "t": "发生了根本的转变"}, {"s": 1186.43, "e": 1187.67, "t": "更值得注意的是"}, {"s": 1187.77, "e": 1188.87, "t": "日本明治政府"}, {"s": 1188.87, "e": 1191.4, "t": "在引进近代宪法概念的时候"}, {"s": 1191.5, "e": 1193.67, "t": "对宪法一词的翻译和理解"}, {"s": 1193.67, "e": 1196.77, "t": "并没有区分出宪法作为制度形式"}, {"s": 1196.77, "e": 1199.57, "t": "和宪法作为限权原则之间的差异"}, {"s": 1199.7, "e": 1201.0, "t": "这种翻译路径"}, {"s": 1201.1, "e": 1202.63, "t": "对整个汉字文化圈"}, {"s": 1202.63, "e": 1204.43, "t": "都造成了深远的影响"}, {"s": 1204.5, "e": 1207.5, "t": "所以在相当广泛的东亚语境之中"}, {"s": 1207.5, "e": 1208.57, "t": "宪法一词"}, {"s": 1208.57, "e": 1210.2, "t": "常常被直观的理解成"}, {"s": 1210.2, "e": 1212.6, "t": "一种至高无上的法律文件"}, {"s": 1212.63, "e": 1214.07, "t": "却很少被人理解成"}, {"s": 1214.07, "e": 1217.1, "t": "一种以限制权力为使命的宪政手段"}, {"s": 1217.5, "e": 1218.27, "t": "这样的理解"}, {"s": 1218.27, "e": 1220.97, "t": "并非源自于现代的宪政主义本身"}, {"s": 1221.03, "e": 1222.2, "t": "而是根植于"}, {"s": 1222.2, "e": 1225.0, "t": "近代日本对宪法概念的引荐方式"}, {"s": 1232.37, "e": 1234.8, "t": "其实早在1876年的9月6日"}, {"s": 1234.8, "e": 1237.07, "t": "明治天皇就颁布了一个敕文"}, {"s": 1237.43, "e": 1238.57, "t": "敕文的名称是"}, {"s": 1238.57, "e": 1243.33, "t": "《命令元老院议长有栖川宫炽仁亲王起草国宪之敕文》"}, {"s": 1243.57, "e": 1246.9, "t": "大概意思是说朕现据本国国体"}, {"s": 1246.9, "e": 1249.67, "t": "广泛参照海外各国集成法律"}, {"s": 1249.7, "e": 1250.63, "t": "已定国宪"}, {"s": 1250.77, "e": 1253.27, "t": "因此现命令你等起创草案"}, {"s": 1253.6, "e": 1255.03, "t": "他就是要求官员们"}, {"s": 1255.03, "e": 1256.8, "t": "开始研究各国的宪法"}, {"s": 1256.8, "e": 1258.63, "t": "撰写本国的宪法草案"}, {"s": 1258.83, "e": 1261.83, "t": "到1880年 也就是明治十三年的时候"}, {"s": 1261.83, "e": 1264.77, "t": "元老院就将完成的草案提交给了天皇"}, {"s": 1264.8, "e": 1268.23, "t": "其中就规定了天皇必须发誓遵守国宪"}, {"s": 1268.37, "e": 1271.07, "t": "并将绝大部分的权力交于议会"}, {"s": 1271.43, "e": 1272.83, "t": "结果可想而知"}, {"s": 1272.83, "e": 1273.57, "t": "这个法案"}, {"s": 1273.57, "e": 1276.1, "t": "遭到了尊皇攘夷派的强烈反对"}, {"s": 1276.27, "e": 1278.67, "t": "其实不能通过的原因也很简单"}, {"s": 1278.77, "e": 1281.23, "t": "因为这部宪法好像真的在搞宪法"}, {"s": 1281.23, "e": 1283.03, "t": "它就是要制定最高规则"}, {"s": 1283.03, "e": 1284.5, "t": "限制天皇的权力"}, {"s": 1284.63, "e": 1286.03, "t": "所以被否决以后"}, {"s": 1286.03, "e": 1287.47, "t": "制定宪法的重担"}, {"s": 1287.47, "e": 1289.47, "t": "就落到了伊藤博文身上"}, {"s": 1289.67, "e": 1290.63, "t": "明治10五年"}, {"s": 1290.63, "e": 1291.97, "t": "也就是1882年"}, {"s": 1292.1, "e": 1294.2, "t": "伊藤博文受命前往德国"}, {"s": 1294.2, "e": 1296.03, "t": "考察立宪主义的理论发展"}, {"s": 1296.13, "e": 1298.5, "t": "次年伊藤博文返回日本"}, {"s": 1298.6, "e": 1301.47, "t": "命令井上毅着手宪法草案的起草"}, {"s": 1301.5, "e": 1302.37, "t": "三年以后"}, {"s": 1302.37, "e": 1305.37, "t": "日本天皇就废止了太政官制"}, {"s": 1305.37, "e": 1306.63, "t": "成立了内阁制度"}, {"s": 1306.63, "e": 1307.63, "t": "而伊藤博文"}, {"s": 1307.63, "e": 1310.47, "t": "就被任命为首任内阁总理大臣"}, {"s": 1310.6, "e": 1311.97, "t": "1888年4月"}, {"s": 1311.97, "e": 1313.3, "t": "明治21年"}, {"s": 1313.6, "e": 1316.3, "t": "井上毅在两位德国顾问的帮助之下"}, {"s": 1316.3, "e": 1317.8, "t": "基本完成了定稿"}, {"s": 1317.9, "e": 1320.47, "t": "然后伊藤博文设置了一个枢密院"}, {"s": 1320.57, "e": 1322.67, "t": "专门用来审议宪法的内容"}, {"s": 1322.77, "e": 1325.6, "t": "审议一直持续到1889年的1月份"}, {"s": 1325.67, "e": 1326.47, "t": "也就是说"}, {"s": 1326.47, "e": 1329.8, "t": "日本从起心动念到拿出完整的宪法"}, {"s": 1329.8, "e": 1332.4, "t": "总共累积花费了13年的时间"}, {"s": 1332.43, "e": 1333.77, "t": "大家看看这张图"}, {"s": 1333.77, "e": 1335.8, "t": "我相信就一目了然了"}, {"s": 1335.8, "e": 1338.9, "t": "这一部宪法不但没有限制天皇的权力"}, {"s": 1338.9, "e": 1340.43, "t": "反而给天皇的权力"}, {"s": 1340.43, "e": 1343.27, "t": "找到了一个不可挑战的合法性源头"}, {"s": 1343.63, "e": 1346.2, "t": "伊藤博文的核心任务只有一个"}, {"s": 1346.27, "e": 1348.5, "t": "不是创造日本的民主宪政"}, {"s": 1348.5, "e": 1350.67, "t": "而是在近代国家体系当中"}, {"s": 1350.67, "e": 1352.43, "t": "保存天皇的绝对地位"}, {"s": 1352.47, "e": 1355.9, "t": "同时又让日本摆脱前现代国家的标签"}, {"s": 1356.0, "e": 1358.7, "t": "《大日本帝国宪法》第一条确立的就是"}, {"s": 1358.73, "e": 1362.2, "t": "日本国由万世一系之天皇统治"}, {"s": 1362.4, "e": 1363.37, "t": "也就是说"}, {"s": 1363.43, "e": 1364.9, "t": "不是王在法下"}, {"s": 1364.9, "e": 1366.37, "t": "而是王在法上"}, {"s": 1366.5, "e": 1369.5, "t": "所谓的内阁、议会、国会、司法"}, {"s": 1369.57, "e": 1372.1, "t": "它们都是天皇意志的代行机关"}, {"s": 1372.3, "e": 1373.77, "t": "法律的终极效力"}, {"s": 1373.83, "e": 1376.07, "t": "仍然来源于天皇的裁决"}, {"s": 1376.43, "e": 1379.07, "t": "形式上看好像是一种分权制度"}, {"s": 1379.07, "e": 1381.07, "t": "实际上就是一个分工制度"}, {"s": 1381.27, "e": 1384.1, "t": "从一开始主权就不在公民手中"}, {"s": 1384.37, "e": 1386.1, "t": "所以从本质上来看"}, {"s": 1386.23, "e": 1387.47, "t": "《大日本帝国宪法》"}, {"s": 1387.47, "e": 1388.97, "t": "就是一个彻头彻尾的"}, {"s": 1388.97, "e": 1390.63, "t": "反宪政精神的设计"}, {"s": 1391.0, "e": 1392.7, "t": "但是当时的日本国民"}, {"s": 1392.7, "e": 1395.1, "t": "对这部宪法给予了很高的评价"}, {"s": 1395.23, "e": 1396.83, "t": "除了当时的各家报社"}, {"s": 1396.83, "e": 1399.5, "t": "许多的知识分子、自由民权主义者"}, {"s": 1399.5, "e": 1401.1, "t": "也都表示非常认可"}, {"s": 1401.3, "e": 1402.7, "t": "民间的情绪笼罩"}, {"s": 1402.7, "e": 1404.27, "t": "在一片天皇赐宪"}, {"s": 1404.27, "e": 1406.17, "t": "国运昌隆的欢呼之中"}, {"s": 1406.27, "e": 1408.8, "t": "因为当时日本绝大多数的国民"}, {"s": 1408.8, "e": 1410.77, "t": "都是不了解宪政主义的"}, {"s": 1411.0, "e": 1412.6, "t": "包括很多知识分子"}, {"s": 1412.6, "e": 1413.83, "t": "有很大一部分"}, {"s": 1413.83, "e": 1415.97, "t": "都是明治政府的御用文人"}, {"s": 1416.1, "e": 1417.6, "t": "那肯定是政府做什么"}, {"s": 1417.6, "e": 1418.87, "t": "他们就吹捧什么"}, {"s": 1418.87, "e": 1421.2, "t": "而另一群都是一些一知半解"}, {"s": 1421.2, "e": 1422.37, "t": "不学无术的人"}, {"s": 1422.43, "e": 1425.43, "t": "他们也觉得有宪法总比没有宪法强吧"}, {"s": 1425.43, "e": 1426.87, "t": "这肯定是个好事"}, {"s": 1427.1, "e": 1429.6, "t": "但当时的日本也是有明白人的"}, {"s": 1429.97, "e": 1432.57, "t": "当时的福泽谕吉已经54岁了"}, {"s": 1432.63, "e": 1435.0, "t": "他在自己主编的《时事新报》上"}, {"s": 1435.0, "e": 1436.37, "t": "发表了一个评论"}, {"s": 1436.5, "e": 1437.3, "t": "他说"}, {"s": 1437.37, "e": 1441.27, "t": "追溯西方各国实行的国会制度本源及沿革"}, {"s": 1441.4, "e": 1444.37, "t": "即可发现政府往往与民众对立"}, {"s": 1444.37, "e": 1446.03, "t": "而人民民智渐开"}, {"s": 1446.03, "e": 1447.57, "t": "反抗君主压迫"}, {"s": 1447.63, "e": 1449.07, "t": "政府未得民心"}, {"s": 1449.1, "e": 1451.8, "t": "不得已而逐渐将政权分立"}, {"s": 1451.83, "e": 1454.17, "t": "如今日本还缺少这样的人民"}, {"s": 1454.6, "e": 1457.37, "t": "虽然福泽谕吉有所谓的「未来论」"}, {"s": 1457.47, "e": 1458.4, "t": "但实际上"}, {"s": 1458.43, "e": 1461.67, "t": "他的内心对日本民众开启民智这件事"}, {"s": 1461.67, "e": 1463.03, "t": "是非常悲观的"}, {"s": 1463.23, "e": 1466.2, "t": "当时有一个著名的日本民运人士"}, {"s": 1466.2, "e": 1467.7, "t": "叫做中江兆民"}, {"s": 1467.83, "e": 1470.37, "t": "他因为政府颁布这部宪法获得了恩赦"}, {"s": 1470.67, "e": 1471.6, "t": "按道理来说"}, {"s": 1471.6, "e": 1473.97, "t": "他应该对天皇赐宪感恩戴德"}, {"s": 1473.97, "e": 1476.2, "t": "出来以后就不要对抗政府了"}, {"s": 1476.37, "e": 1478.63, "t": "但是他却说出了这样的一段话"}, {"s": 1478.87, "e": 1481.4, "t": "他说送到我们手中的这部宪法"}, {"s": 1481.4, "e": 1482.57, "t": "究竟为何物"}, {"s": 1482.57, "e": 1484.27, "t": "是良玉还是土瓦"}, {"s": 1484.43, "e": 1486.2, "t": "大家还未看到其实质"}, {"s": 1486.2, "e": 1487.57, "t": "就沉醉其名称"}, {"s": 1487.67, "e": 1489.93, "t": "国民之愚，竟至于此！"}, {"s": 1490.2, "e": 1493.2, "t": "其实也不能完全说是民智未开"}, {"s": 1493.2, "e": 1494.27, "t": "民众愚蠢"}, {"s": 1494.43, "e": 1496.37, "t": "因为日本当时的很多翻译"}, {"s": 1496.37, "e": 1498.5, "t": "真的是极尽修辞之能事"}, {"s": 1498.87, "e": 1501.07, "t": "在选择宪法这个字眼的时候"}, {"s": 1501.1, "e": 1503.2, "t": "官方的构思就非常的巧妙"}, {"s": 1503.3, "e": 1504.7, "t": "在古典汉语当中"}, {"s": 1504.7, "e": 1508.4, "t": "「宪」有成法、旧章、祖制、典范的意思"}, {"s": 1508.4, "e": 1511.67, "t": "而「法」有统治、技术、秩序的意思"}, {"s": 1511.9, "e": 1513.7, "t": "法本身就是向下约束"}, {"s": 1513.7, "e": 1515.2, "t": "而不是向上约束"}, {"s": 1515.3, "e": 1517.07, "t": "所以选择宪法一词"}, {"s": 1517.07, "e": 1518.87, "t": "从自然语感的理解上"}, {"s": 1518.87, "e": 1521.8, "t": "就不容易让民众联想到限制权力"}, {"s": 1521.8, "e": 1522.57, "t": "或者是"}, {"s": 1522.57, "e": 1525.7, "t": "公民据此宪法来监督政府的权利"}, {"s": 1526.07, "e": 1527.77, "t": "它的天然语感就是"}, {"s": 1527.77, "e": 1530.2, "t": "天皇根据传统而立的法"}, {"s": 1530.23, "e": 1531.17, "t": "最高的法"}, {"s": 1531.17, "e": 1533.3, "t": "而不是主权在民的法"}, {"s": 1533.83, "e": 1534.87, "t": "宪法这个词"}, {"s": 1534.87, "e": 1538.2, "t": "能够完美的承接明治政府的政治诉求"}, {"s": 1538.27, "e": 1541.3, "t": "对外既可以标榜自己是现代立宪国家"}, {"s": 1541.3, "e": 1543.3, "t": "对内又可以让民众认为"}, {"s": 1543.3, "e": 1546.43, "t": "宪法就是天皇统治的根本法、最高法"}, {"s": 1552.5, "e": 1555.57, "t": "单单一个宪法的概念就讲了这么多"}, {"s": 1555.7, "e": 1558.1, "t": "我就是为了跟大家澄清一个误解"}, {"s": 1558.37, "e": 1561.17, "t": "千万不要以为带有宪法二字"}, {"s": 1561.17, "e": 1564.47, "t": "就自动具备现代标准宪法的实质效力"}, {"s": 1564.63, "e": 1565.3, "t": "在这里"}, {"s": 1565.3, "e": 1568.07, "t": "我给大家提供四个基本的参考维度"}, {"s": 1568.37, "e": 1569.17, "t": "第一点"}, {"s": 1569.33, "e": 1572.57, "t": "明确限定国家权力的来源与边界"}, {"s": 1572.87, "e": 1576.1, "t": "第二点确立个人权利的绝对正当性"}, {"s": 1576.1, "e": 1578.0, "t": "并置于国家权力之上"}, {"s": 1578.77, "e": 1581.3, "t": "第三点具有最高法律效力"}, {"s": 1581.43, "e": 1583.37, "t": "普通法律不得与之冲突"}, {"s": 1583.43, "e": 1586.77, "t": "第四点宪法具备相对稳定的程序"}, {"s": 1586.77, "e": 1587.9, "t": "不得随意更改"}, {"s": 1588.6, "e": 1590.9, "t": "如果我们用一个严格的现代标准"}, {"s": 1590.9, "e": 1592.03, "t": "去看待宪法"}, {"s": 1592.17, "e": 1594.67, "t": "那么真正意义上的现代成文宪法"}, {"s": 1594.67, "e": 1596.3, "t": "是很晚才诞生的"}, {"s": 1596.47, "e": 1598.6, "t": "也就是 18 世纪末这个时间点"}, {"s": 1598.6, "e": 1599.77, "t": "才正式出现"}, {"s": 1600.03, "e": 1601.4, "t": "最具有标志性的"}, {"s": 1601.4, "e": 1604.37, "t": "就是1787年美国宪法的颁布"}, {"s": 1604.8, "e": 1607.2, "t": "美国宪法虽然非常的简短"}, {"s": 1607.2, "e": 1608.97, "t": "全文只有7条正文"}, {"s": 1608.97, "e": 1610.37, "t": "27个修正案"}, {"s": 1610.43, "e": 1612.4, "t": "总共也就4,400字"}, {"s": 1612.57, "e": 1614.3, "t": "但这部宪法的革命性"}, {"s": 1614.3, "e": 1616.23, "t": "并不在于内容的多寡"}, {"s": 1616.27, "e": 1616.8, "t": "而在于"}, {"s": 1616.8, "e": 1620.07, "t": "它第一次系统性的完成了四件事情"}, {"s": 1620.47, "e": 1622.43, "t": "第一它明确的写出"}, {"s": 1622.47, "e": 1624.67, "t": "政府的权力不是来自于上帝"}, {"s": 1624.67, "e": 1626.57, "t": "传统或者是血缘"}, {"s": 1626.8, "e": 1628.9, "t": "它来自于人民的授权"}, {"s": 1629.3, "e": 1631.77, "t": "第二它通过成文文本"}, {"s": 1631.77, "e": 1635.43, "t": "系统划分了立法、行政、司法三种权力"}, {"s": 1635.87, "e": 1638.9, "t": "权力不再依赖于个人君主的节制"}, {"s": 1639.0, "e": 1641.57, "t": "而是用结构防止权力的集中"}, {"s": 1641.97, "e": 1645.0, "t": "第三它确立了宪法的最高法律地位"}, {"s": 1645.2, "e": 1648.27, "t": "这意味着任何的法律政策政府行为"}, {"s": 1648.27, "e": 1650.1, "t": "都必须服从于宪法"}, {"s": 1650.17, "e": 1652.47, "t": "第四它通过修正案机制"}, {"s": 1652.47, "e": 1655.4, "t": "把个人权利写进了宪法结构当中"}, {"s": 1655.67, "e": 1656.67, "t": "它让个人权利"}, {"s": 1656.67, "e": 1658.6, "t": "不再是一种道德上的诉求"}, {"s": 1658.6, "e": 1661.4, "t": "而是可以对抗国家权力的法律依据"}, {"s": 1661.77, "e": 1662.57, "t": "到这里"}, {"s": 1662.6, "e": 1665.43, "t": "宪法的性质发生了一个根本转变"}, {"s": 1665.63, "e": 1667.9, "t": "宪法不再是像《大宪章》那样"}, {"s": 1668.0, "e": 1671.0, "t": "只是限制某一个统治者的限制文件"}, {"s": 1671.07, "e
