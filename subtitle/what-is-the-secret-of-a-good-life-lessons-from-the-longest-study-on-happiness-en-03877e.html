<script>
const S=[{"s": 0.0, "e": 3.18, "t": "- This video is about one of the most important questions:"}, {"s": 3.18, "e": 5.34, "t": "what leads to a happy life?"}, {"s": 5.34, "e": 6.87, "t": "- Realistically, money."}, {"s": 6.87, "e": 9.42, "t": "- Being wealthy is definitely a big aspect of it."}, {"s": 9.42, "e": 10.53, "t": "- To save a lot of money."}, {"s": 10.53, "e": 11.36, "t": "- Money. - Money."}, {"s": 11.36, "e": 12.2, "t": "- Earning money."}, {"s": 12.2, "e": 13.62, "t": "- It's very important to be rich."}, {"s": 13.62, "e": 14.46, "t": "- It's easy for people"}, {"s": 14.46, "e": 15.93, "t": "to say they don't care about having money"}, {"s": 15.93, "e": 17.94, "t": "and that money can't buy happiness,"}, {"s": 17.94, "e": 19.92, "t": "but that's really not true."}, {"s": 19.92, "e": 21.57, "t": "- 'Cause I would rather cry on a yacht"}, {"s": 21.57, "e": 24.32, "t": "than in a like a Subaru."}, {"s": 24.32, "e": 26.49, "t": "(both laugh)"}, {"s": 26.49, "e": 28.38, "t": "- [Derek] Clearly, having a successful career"}, {"s": 28.38, "e": 30.63, "t": "and financial wealth are important to people."}, {"s": 30.63, "e": 33.03, "t": "Is there a number in mind? Something you wanna get to?"}, {"s": 33.03, "e": 34.5, "t": "- At least a million."}, {"s": 34.5, "e": 35.49, "t": "- Yeah? - Yeah."}, {"s": 35.49, "e": 37.11, "t": "- In a survey from 2018"}, {"s": 37.11, "e": 39.78, "t": "of around a hundred thousand college freshmen,"}, {"s": 39.78, "e": 43.77, "t": "about 55% said they wanted to be successful in their career"}, {"s": 43.77, "e": 48.03, "t": "and 83% reported that they wanted to become rich."}, {"s": 48.03, "e": 51.15, "t": "But do these accomplishments really increase happiness?"}, {"s": 51.15, "e": 53.94, "t": "Well, that's what I wanna find out in this video."}, {"s": 53.94, "e": 56.58, "t": "But how do you study what makes people happy?"}, {"s": 56.58, "e": 58.02, "t": "Well, you can ask them."}, {"s": 58.02, "e": 60.15, "t": "What's gonna make you happy?"}, {"s": 60.15, "e": 61.08, "t": "- Um. - Uh."}, {"s": 61.08, "e": 62.07, "t": "- Uh. - Uh."}, {"s": 62.07, "e": 62.9, "t": "- Ooh."}, {"s": 62.9, "e": 64.5, "t": "- [Derek] But people aren't really good"}, {"s": 64.5, "e": 66.12, "t": "at judging what will make them happy."}, {"s": 66.12, "e": 68.91, "t": "Winning the lottery seems like it should make you happy."}, {"s": 68.91, "e": 70.22, "t": "- What!? (sister screams)"}, {"s": 70.22, "e": 71.31, "t": "What!? What!?"}, {"s": 72.27, "e": 74.34, "t": "- [Derek] But numerous studies on lottery winners"}, {"s": 74.34, "e": 76.98, "t": "find that after the initial surge of happiness wears off,"}, {"s": 76.98, "e": 79.53, "t": "many are no happier than the rest of us."}, {"s": 79.53, "e": 82.56, "t": "Some are, in fact, more miserable than they were beforehand."}, {"s": 82.56, "e": 84.69, "t": "- 'Cause you don't see as many people as you used to see."}, {"s": 84.69, "e": 87.27, "t": "Obviously, you become slightly isolated,"}, {"s": 87.27, "e": 88.86, "t": "I think in some ways."}, {"s": 88.86, "e": 89.69, "t": "- Yeah, I agree."}, {"s": 89.69, "e": 92.88, "t": "- Another problem is that people's memories aren't reliable."}, {"s": 92.88, "e": 96.57, "t": "- We only detect, encode and store in our brains"}, {"s": 96.57, "e": 99.75, "t": "bits and pieces of the entire experience in front of us."}, {"s": 99.75, "e": 101.79, "t": "It's called reconstructed memories."}, {"s": 101.79, "e": 102.99, "t": "It happens to us"}, {"s": 102.99, "e": 106.53, "t": "in all the aspects of our lives all the time."}, {"s": 106.53, "e": 109.08, "t": "- Most studies on happiness find older people"}, {"s": 109.08, "e": 111.69, "t": "and ask them to recall what made them happy."}, {"s": 111.69, "e": 114.54, "t": "But as we've just seen, memory is unreliable."}, {"s": 115.59, "e": 117.27, "t": "So a better way to conduct a study"}, {"s": 117.27, "e": 120.24, "t": "would be to follow people throughout their entire lives,"}, {"s": 120.24, "e": 121.98, "t": "capturing the choices they make"}, {"s": 121.98, "e": 124.8, "t": "and how those affect their happiness."}, {"s": 124.8, "e": 126.6, "t": "That is really hard to do."}, {"s": 126.6, "e": 128.25, "t": "But there is one study like this"}, {"s": 128.25, "e": 131.16, "t": "that's been running since 1938."}, {"s": 131.16, "e": 134.28, "t": "Now, 85 years is a long time to run a study"}, {"s": 134.28, "e": 135.6, "t": "so it has been passed down"}, {"s": 135.6, "e": 138.3, "t": "from one generation of researchers to the next."}, {"s": 138.3, "e": 142.17, "t": "It's currently run by its fourth director, Robert Waldinger."}, {"s": 142.17, "e": 144.9, "t": "What is the claim to fame then of the study?"}, {"s": 144.9, "e": 148.65, "t": "- You know, the claim to fame is that it is,"}, {"s": 148.65, "e": 153.42, "t": "as far as we know, the longest study of human development"}, {"s": 153.42, "e": 154.44, "t": "that's ever been done."}, {"s": 154.44, "e": 156.36, "t": "The longest study of any depth."}, {"s": 156.36, "e": 160.5, "t": "These are studies that take deep dives into people's lives"}, {"s": 160.5, "e": 163.11, "t": "and their mental and physical health."}, {"s": 163.11, "e": 165.54, "t": "- [Derek] The study actually began as two separate studies"}, {"s": 165.54, "e": 167.67, "t": "by two groups of Harvard researchers"}, {"s": 167.67, "e": 170.01, "t": "that didn't know about each other."}, {"s": 170.01, "e": 173.01, "t": "The first group followed 268 young men from Harvard"}, {"s": 173.01, "e": 176.1, "t": "to find out how they would develop into early adulthood."}, {"s": 176.1, "e": 176.93, "t": "- So of course,"}, {"s": 176.93, "e": 179.16, "t": "if you wanna study normal young adult development,"}, {"s": 179.16, "e": 180.95, "t": "you study all white guys from Harvard, right?"}, {"s": 180.95, "e": 181.79, "t": "(Derek laughs)"}, {"s": 181.79, "e": 184.74, "t": "You know, it's one of those limitations."}, {"s": 184.74, "e": 187.2, "t": "- [Derek] The second group studied 456 boys"}, {"s": 187.2, "e": 188.52, "t": "from middle school onwards"}, {"s": 188.52, "e": 191.64, "t": "from Boston's poorest and most disadvantaged families."}, {"s": 191.64, "e": 192.96, "t": "- So there were these two studies,"}, {"s": 192.96, "e": 197.58, "t": "both meant to be studies of what goes right in development"}, {"s": 197.58, "e": 202.08, "t": "and how we predict who does well as they grow up."}, {"s": 202.08, "e": 204.96, "t": "- Eventually, the two studies merged into one:"}, {"s": 204.96, "e": 207.54, "t": "The Harvard Study of Adult Development."}, {"s": 207.54, "e": 209.97, "t": "At the start of the study, the participants were interviewed"}, {"s": 209.97, "e": 212.97, "t": "and received extensive physical examinations."}, {"s": 212.97, "e": 216.09, "t": "And as they grew, they entered all walks of life."}, {"s": 216.09, "e": 218.64, "t": "Some of them became bricklayers and doctors"}, {"s": 218.64, "e": 220.65, "t": "and factory workers and lawyers,"}, {"s": 220.65, "e": 224.3, "t": "and one even became president of the United States."}, {"s": 224.3, "e": 225.99, "t": "(presidential music)"}, {"s": 225.99, "e": 228.63, "t": "Every two years, researchers ask them questions"}, {"s": 228.63, "e": 229.47, "t": "about their lives."}, {"s": 229.47, "e": 232.44, "t": "Like, \"If you could stop working without loss of income,"}, {"s": 232.44, "e": 235.05, "t": "would you, what would you do instead?"}, {"s": 235.05, "e": 238.23, "t": "How often do you feel isolated from others?"}, {"s": 238.23, "e": 241.8, "t": "True or false, life has more pain than pleasure.\""}, {"s": 241.8, "e": 243.6, "t": "And other questions about their marriage,"}, {"s": 243.6, "e": 247.38, "t": "career, friendships, and their physical and mental health."}, {"s": 247.38, "e": 250.62, "t": "While the study started with just 724 participants,"}, {"s": 250.62, "e": 252.96, "t": "over time, their spouses and children"}, {"s": 252.96, "e": 255.21, "t": "were also included in the study."}, {"s": 255.21, "e": 258.69, "t": "So how many people are we talking about in total"}, {"s": 258.69, "e": 260.34, "t": "who have been part of the study?"}, {"s": 260.34, "e": 265.34, "t": "- Between 2,500 and 3,000 people altogether in the study."}, {"s": 266.07, "e": 267.57, "t": "- [Derek] And as technology improved,"}, {"s": 267.57, "e": 269.7, "t": "so did the methods of data collection."}, {"s": 269.7, "e": 272.37, "t": "- We now draw blood from DNA."}, {"s": 272.37, "e": 275.74, "t": "You know, DNA wasn't even imagined in 1938."}, {"s": 275.74, "e": 280.68, "t": "We measure messenger RNA, DNA methylation,"}, {"s": 280.68, "e": 283.2, "t": "we bring people into our laboratory,"}, {"s": 283.2, "e": 285.24, "t": "we deliberately stress them out"}, {"s": 285.24, "e": 288.81, "t": "and then see how quickly they recover from stress."}, {"s": 288.81, "e": 292.38, "t": "Looking at heart rate variability, for example,"}, {"s": 292.38, "e": 296.79, "t": "looking at cortisol deposited in hair,"}, {"s": 296.79, "e": 299.31, "t": "because that seems to be a long-term measure"}, {"s": 299.31, "e": 300.93, "t": "of circulating cortisol."}, {"s": 300.93, "e": 304.47, "t": "But all of these new methods are in the service"}, {"s": 304.47, "e": 308.91, "t": "of studying the same big phenomena"}, {"s": 308.91, "e": 310.17, "t": "of human wellbeing."}, {"s": 312.18, "e": 314.25, "t": "- So what do 85 years of research"}, {"s": 314.25, "e": 316.38, "t": "across entire human lives teach us"}, {"s": 316.38, "e": 318.75, "t": "about a healthy and happy life?"}, {"s": 318.75, "e": 321.12, "t": "- Two huge takeaways really."}, {"s": 321.12, "e": 322.92, "t": "One is no surprise."}, {"s": 322.92, "e": 325.95, "t": "It's that if you take care of your physical health,"}, {"s": 325.95, "e": 330.3, "t": "it has huge benefits, not just for your longevity,"}, {"s": 330.3, "e": 332.22, "t": "but for how long you stay healthy."}, {"s": 332.22, "e": 335.25, "t": "Eating well, getting regular exercise,"}, {"s": 335.25, "e": 338.73, "t": "not abusing alcohol or drugs, not smoking,"}, {"s": 338.73, "e": 340.95, "t": "getting preventive healthcare,"}, {"s": 340.95, "e": 343.83, "t": "exercise is hugely important."}, {"s": 343.83, "e": 345.87, "t": "- [Derek] A Taiwanese study looked at the medical data"}, {"s": 345.87, "e": 350.7, "t": "of 416,000 healthy people between 1996 and 2008."}, {"s": 350.7, "e": 352.71, "t": "Eight years later, they followed up with each person"}, {"s": 352.71, "e": 355.68, "t": "to look at the link between exercise and mortality."}, {"s": 355.68, "e": 358.89, "t": "They found that people who exercised just 15 minutes a day"}, {"s": 358.89, "e": 361.47, "t": "had a 14% reduced risk of dying,"}, {"s": 361.47, "e": 364.41, "t": "and a three year longer life expectancy."}, {"s": 364.41, "e": 366.48, "t": "Every additional 15 minutes of exercise"}, {"s": 366.48, "e": 369.78, "t": "decreased the risk of dying by an extra 4%."}, {"s": 369.78, "e": 372.42, "t": "A large meta-analysis from 2008 confirms"}, {"s": 372.42, "e": 373.98, "t": "that people who are physically active"}, {"s": 373.98, "e": 375.63, "t": "have a reduced risk of dying"}, {"s": 375.63, "e": 378.15, "t": "during the timeframes investigated in each study."}, {"s": 379.38, "e": 382.29, "t": "Exercise also protects our cognitive health."}, {"s": 382.29, "e": 384.36, "t": "A meta-analysis from 2014 found"}, {"s": 384.36, "e": 386.76, "t": "that participants with higher levels of physical activity"}, {"s": 386.76, "e": 389.88, "t": "had a 35% reduced risk of cognitive decline"}, {"s": 389.88, "e": 392.7, "t": "and a 14% reduced risk of dementia."}, {"s": 394.08, "e": 398.43, "t": "- And then the big surprising finding is, relationships,"}, {"s": 398.43, "e": 400.53, "t": "not just keeping us happier,"}, {"s": 400.53, "e": 403.98, "t": "but keeping us healthier and helping us live longer."}, {"s": 404.91, "e": 406.41, "t": "- It's not just the Harvard study."}, {"s": 406.41, "e": 408.12, "t": "There's now a whole list of studies"}, {"s": 408.12, "e": 409.77, "t": "that show the importance of relationships"}, {"s": 409.77, "e": 411.72, "t": "to human happiness and health."}, {"s": 411.72, "e": 414.69, "t": "They teach us three main lessons."}, {"s": 414.69, "e": 418.02, "t": "The first is that relationships are great for our health."}, {"s": 419.01, "e": 422.25, "t": "In 2010, researchers looked across 148 studies"}, {"s": 422.25, "e": 425.61, "t": "with a total of more than 300,000 participants."}, {"s": 425.61, "e": 426.69, "t": "They found that, on average,"}, {"s": 426.69, "e": 428.73, "t": "people with stronger social connections"}, {"s": 428.73, "e": 431.58, "t": "had a 50% increased likelihood of survival"}, {"s": 431.58, "e": 433.02, "t": "for any given year."}, {"s": 433.02, "e": 434.64, "t": "Being married, in particular,"}, {"s": 434.64, "e": 437.25, "t": "has a large impact on how long people live."}, {"s": 437.25, "e": 441.93, "t": "- There's one study, I think it's pretty well respected,"}, {"s": 441.93, "e": 443.79, "t": "that suggests that married men"}, {"s": 443.79, "e": 448.53, "t": "live 12 years longer on average than unmarried men"}, {"s": 448.53, "e": 453.39, "t": "and married women live seven years longer on average"}, {"s": 453.39, "e": 454.89, "t": "than unmarried women."}, {"s": 454.89, "e": 458.01, "t": "Marriage is always a better deal for men on all parameters"}, {"s": 458.01, "e": 459.48, "t": "than it is for women. (Derek laughs)"}, {"s": 459.48, "e": 461.94, "t": "And it's not because you have a marriage license, right?"}, {"s": 461.94, "e": 465.0, "t": "It's because people living together"}, {"s": 465.0, "e": 467.22, "t": "in an intimate partnership"}, {"s": 467.22, "e": 469.56, "t": "tend to keep each other healthier."}, {"s": 469.56, "e": 472.35, "t": "You have somebody who's kind of watching,"}, {"s": 472.35, "e": 473.73, "t": "looking out for you."}, {"s": 473.73, "e": 476.13, "t": "It's a very real, concrete effect."}, {"s": 477.21, "e": 478.92, "t": "- If feeling well-connected to others"}, {"s": 478.92, "e": 482.34, "t": "makes us happier, healthier, and extends our lives,"}, {"s": 482.34, "e": 485.19, "t": "then what happens if we feel disconnected?"}, {"s": 485.19, "e": 487.95, "t": "- There's a researcher, Julianne Holt-Lunstad,"}, {"s": 487.95, "e": 490.11, "t": "out of the University of Utah,"}, {"s": 490.11, "e": 495.11, "t": "who did a meta-analysis of a whole slew of studies"}, {"s": 495.24, "e": 498.48, "t": "of the physical effects of loneliness."}, {"s": 498.48, "e": 502.77, "t": "And her calculation was that being lonely"}, {"s": 502.77, "e": 504.36, "t": "is as dangerous to your health"}, {"s": 504.36, "e": 507.42, "t": "as smoking half a pack of cigarettes a day,"}, {"s": 508.26, "e": 511.41, "t": "or as dangerous as being obese."}, {"s": 511.41, "e": 513.0, "t": "- [Derek] Feeling disconnected from others"}, {"s": 513.0, "e": 515.19, "t": "also makes you more prone to disease."}, {"s": 515.19, "e": 517.44, "t": "A large meta-analysis from 2016"}, {"s": 517.44, "e": 519.63, "t": "found that poor social relationships"}, {"s": 519.63, "e": 523.08, "t": "were associated with a 29% increase in risk of heart disease"}, {"s": 523.08, "e": 526.8, "t": "and a 32% increase in risk of stroke."}, {"s": 526.8, "e": 531.27, "t": "- So these have real sort of quantifiable consequences"}, {"s": 531.27, "e": 534.24, "t": "when we look at studies of thousands of people."}, {"s": 535.08, "e": 537.06, "t": "- One caveat is that most studies"}, {"s": 537.06, "e": 538.77, "t": "on the health effects of loneliness"}, {"s": 538.77, "e": 541.36, "t": "focus on people aged 50 and older."}, {"s": 541.36, "e": 542.76, "t": "(clock ticking)"}, {"s": 542.76, "e": 544.95, "t": "And loneliness is on the rise."}, {"s": 544.95, "e": 546.57, "t": "- The U.S. Surgeon General today"}, {"s": 546.57, "e": 550.08, "t": "declared a new public health epidemic in America."}, {"s": 550.08, "e": 551.07, "t": "Loneliness."}, {"s": 552.03, "e": 554.46, "t": "- We're now finding that one in two adults"}, {"s": 554.46, "e": 556.44, "t": "report measurable levels of loneliness"}, {"s": 556.44, "e": 559.86, "t": "and it turns out that young people are most affected."}, {"s": 559.86, "e": 562.08, "t": "And here's why this is so concerning."}, {"s": 562.08, "e": 563.28, "t": "It's because we've realized"}, {"s": 563.28, "e": 565.44, "t": "that loneliness is more than just a bad feeling."}, {"s": 565.44, "e": 566.82, "t": "It has real consequences"}, {"s": 566.82, "e": 568.77, "t": "for our mental and physical health."}, {"s": 568.77, "e": 571.77, "t": "- The UK has appointed a minister of loneliness."}, {"s": 572.91, "e": 575.82, "t": "Many, many countries are concerned"}, {"s": 575.82, "e": 579.21, "t": "about this breakdown in social connection."}, {"s": 579.21, "e": 582.33, "t": "- A question about loneliness,"}, {"s": 582.33, "e": 584.37, "t": "like, what does that look like?"}, {"s": 584.37, "e": 585.9, "t": "Because, obviously, everyone experiences"}, {"s": 585.9, "e": 587.07, "t": "some periods of loneliness."}, {"s": 587.07, "e": 591.39, "t": "So you know, when does it become sort of really detrimental"}, {"s": 591.39, "e": 592.77, "t": "and how do we define that?"}, {"s": 592.77, "e": 595.71, "t": "- Well, loneliness is different from being alone, right?"}, {"s": 595.71, "e": 599.52, "t": "So you can be alone and quite content,"}, {"s": 599.52, "e": 601.32, "t": "and many people are, in fact."}, {"s": 601.32, "e": 603.6, "t": "The ability to be content when you're alone"}, {"s": 603.6, "e": 607.17, "t": "is quite a skill and it's a wonderful ability."}, {"s": 607.17, "e": 610.47, "t": "Loneliness is that subjective experience"}, {"s": 610.47, "e": 614.52, "t": "of being less connected to people than you wanna be."}, {"s": 614.52, "e": 617.73, "t": "And that's why, you know, you can be lonely in a crowd."}, {"s": 617.73, "e": 622.73, "t": "We're all on a spectrum between extroversion,"}, {"s": 623.07, "e": 625.29, "t": "you know, wanting lots of people in our lives,"}, {"s": 625.29, "e": 629.25, "t": "and introversion, actually needing a lot of solitude"}, {"s": 629.25, "e": 631.56, "t": "and not wanting a lot of people,"}, {"s": 631.56, "e": 634.41, "t": "a lot of people are stressful for introverts."}, {"s": 634.41, "e": 638.55, "t": "And what we know is that neither one is healthier, right?"}, {"s": 638.55, "e": 641.16, "t": "Like introverts are perfectly healthy."}, {"s": 641.16, "e": 645.15, "t": "They just may need one or two really solid relationships"}, {"s": 645.15, "e": 647.34, "t": "and don't want a lot more people."}, {"s": 647.34, "e": 649.47, "t": "Nothing wrong with that at all."}, {"s": 649.47, "e": 652.44, "t": "Whereas extroverts may want lots of people in their lives."}, {"s": 652.44, "e": 653.82, "t": "- [Derek] So the second lesson is"}, {"s": 653.82, "e": 656.52, "t": "that it's not how many people you know or see,"}, {"s": 656.52, "e": 657.96, "t": "or even whether you're married or not,"}, {"s": 657.96, "e": 659.4, "t": "because a bad marriage can be worse"}, {"s": 659.4, "e": 661.26, "t": "for your health than getting divorced."}, {"s": 661.26, "e": 662.88, "t": "Instead, it's about the quality"}, {"s": 662.88, "e": 665.7, "t": "of your close relationships that matters."}, {"s": 665.7, "e": 668.85, "t": "- When we'd followed all the original people"}, {"s": 668.85, "e": 670.99, "t": "out to their 80s we said,"}, {"s": 670.99, "e": 675.84, "t": "\"Okay, what data actually are the best predictors"}, {"s": 675.84, "e": 677.67, "t": "at age 50 of who's gonna be happy"}, {"s": 677.67, "e": 681.6, "t": "and healthy at age 80 as opposed to sick or dead?\""}, {"s": 681.6, "e": 683.43, "t": "And we thought we were gonna be looking"}, {"s": 683.43, "e": 686.52, "t": "at blood pressure and cholesterol level at age 50"}, {"s": 686.52, "e": 688.47, "t": "as the strongest predictors."}, {"s": 688.47, "e": 690.27, "t": "It was their relationships."}, {"s": 690.27, "e": 694.35, "t": "It was particularly their satisfaction"}, {"s": 694.35, "e": 696.84, "t": "with their marital relationships"}, {"s": 696.84, "e": 698.64, "t": "that was the strongest predictor."}, {"s": 699.54, "e": 701.64, "t": "- And relationships don't just keep us happier"}, {"s": 701.64, "e": 702.84, "t": "and physically healthier,"}, {"s": 702.84, "e": 704.94, "t": "they also protect our brains."}, {"s": 704.94, "e": 707.61, "t": "People who are in secure relationships in their 80s,"}, {"s": 707.61, "e": 710.22, "t": "where they feel that they can rely on the other person,"}, {"s": 710.22, "e": 713.13, "t": "find that their memories stay sharper for longer."}, {"s": 713.13, "e": 714.72, "t": "And people who feel lonely,"}, {"s": 714.72, "e": 716.55, "t": "well, their memories fade quicker."}, {"s": 718.26, "e": 720.3, "t": "A study of retired U.S. adults found"}, {"s": 720.3, "e": 721.62, "t": "that the rate of cognitive decline"}, {"s": 721.62, "e": 725.79, "t": "was 20% higher over 10 years for those who felt lonely."}, {"s": 725.79, "e": 728.4, "t": "A meta-analysis from 2018 further confirms"}, {"s": 728.4, "e": 730.44, "t": "the detrimental effects of loneliness,"}, {"s": 730.44, "e": 733.2, "t": "finding that it also increased the risk of dementia."}, {"s": 734.25, "e": 737.07, "t": "But there's still a big open question:"}, {"s": 737.07, "e": 739.05, "t": "what is it about the relationships"}, {"s": 739.05, "e": 744.0, "t": "that makes them particularly healthful or helpful?"}, {"s": 744.0, "e": 745.74, "t": "- The best hypothesis,"}, {"s": 745.74, "e": 748.77, "t": "for which there's some pretty decent research now,"}, {"s": 749.61, "e": 753.87, "t": "is that relationships are emotion regulators."}, {"s": 753.87, "e": 755.79, "t": "They're stress regulators."}, {"s": 755.79, "e": 759.84, "t": "So stressful things happen every day"}, {"s": 759.84, "e": 761.52, "t": "to many of us, right?"}, {"s": 761.52, "e": 763.44, "t": "So then what happens?"}, {"s": 763.44, "e": 766.05, "t": "Well, the body goes into fight-or-flight mode,"}, {"s": 766.05, "e": 767.91, "t": "blood pressure goes up,"}, {"s": 767.91, "e": 770.07, "t": "respirations become more rapid,"}, {"s": 770.07, "e": 773.01, "t": "circulating stress hormone levels rise."}, {"s": 773.01, "e": 776.04, "t": "But then the body is meant to go back to equilibrium"}, {"s": 776.04, "e": 778.62, "t": "after that normal fight-or-flight response"}, {"s": 778.62, "e": 780.81, "t": "when we face a challenge."}, {"s": 780.81, "e": 784.08, "t": "If I can come home and there's somebody here to talk to,"}, {"s": 784.08, "e": 787.02, "t": "I can literally feel my body calm down."}, {"s": 787.95, "e": 789.87, "t": "What we are pretty sure happens"}, {"s": 789.87, "e": 793.08, "t": "is that people who are isolated, that they're more likely"}, {"s": 793.08, "e": 797.58, "t": "to stay in a kind of chronic fight-or-flight mode."}, {"s": 797.58, "e": 799.14, "t": "And that what that means is"}, {"s": 799.14, "e": 802.77, "t": "that they have higher levels of circulating cortisol,"}, {"s": 802.77, "e": 805.17, "t": "higher levels of chronic inflammation,"}, {"s": 805.17, "e": 810.17, "t": "and that those things gradually wear away body systems."}, {"s": 810.54, "e": 814.02, "t": "So that's how, for example,"}, {"s": 814.02, "e": 819.02, "t": "chronic stress can predict coronary artery disease,"}, {"s": 819.03, "e": 823.32, "t": "but also arthritis and also type-two diabetes"}, {"s": 823.32, "e": 826.32, "t": "because of this common mechanism"}, {"s": 826.32, "e": 829.62, "t": "that breaks down multiple body systems."}, {"s": 829.62, "e": 832.41, "t": "- The key to preventing this breakdown is simple."}, {"s": 832.41, "e": 833.94, "t": "Just spend a little more time"}, {"s": 833.94, "e": 835.86, "t": "with the people you care about."}, {"s": 835.86, "e": 839.37, "t": "Unfortunately, we seem to be doing the exact opposite."}, {"s": 839.37, "e": 841.77, "t": "Before going into why we're doing the exact opposite,"}, {"s": 841.77, "e": 844.59, "t": "this part of the video was sponsored by BetterHelp."}, {"s": 844.59, "e": 845.7, "t": "There are many things"}, {"s": 845.7, "e": 847.98, "t": "that can negatively impact our happiness."}, {"s": 847.98, "e": 851.55, "t": "It could be stress or fear or a clinical mental health issue"}, {"s": 851.55, "e": 853.47, "t": "like depression or anxiety."}, {"s": 853.47, "e": 855.15, "t": "But regardless of which one it is,"}, {"s": 855.15, "e": 857.1, "t": "therapy can help you by giving you the tools"}, {"s": 857.1, "e": 859.14, "t": "to approach your life in a very different way."}, {"s": 859.14, "e": 861.27, "t": "And that's where BetterHelp comes in."}, {"s": 861.27, "e": 864.03, "t": "They connect you with an experienced, licensed therapist"}, {"s": 864.03, "e": 865.08, "t": "who is trained to listen"}, {"s": 865.08, "e": 867.75, "t": "and give you helpful, unbiased advice."}, {"s": 867.75, "e": 869.88, "t": "I know that finding a good therapist is hard,"}, {"s": 869.88, "e": 872.58, "t": "especially when you only have the options in your city."}, {"s": 872.58, "e": 874.83, "t": "But BetterHelp changes the game on this"}, {"s": 874.83, "e": 876.78, "t": "because it's an online platform."}, {"s": 876.78, "e": 878.43, "t": "And by filling out a few questions,"}, {"s": 878.43, "e": 880.68, "t": "you'll get matched with a professional therapist."}, {"s": 880.68, "e": 884.13, "t": "So you can get talking in most cases within 48 hours"}, {"s": 884.13, "e": 887.4, "t": "and then you can have your therapy session as a phone call,"}, {"s": 887.4, "e": 890.82, "t": "as a video chat, or even via messaging if you prefer that."}, {"s": 890.82, "e": 893.07, "t": "Just whatever's the most comfortable version"}, {"s": 893.07, "e": 894.45, "t": "of therapy for you."}, {"s": 894.45, "e": 897.27, "t": "And it's easy to sign up, there's a link in the description."}, {"s": 897.27, "e": 900.51, "t": "It is betterhelp.com/veritasium."}, {"s": 900.51, "e": 902.85, "t": "Clicking on that link both helps support this channel"}, {"s": 902.85, "e": 905.64, "t": "and it also gets you 10% off your first month of BetterHelp."}, {"s": 905.64, "e": 908.4, "t": "So you can try it out and see if it helps you."}, {"s": 908.4, "e": 910.74, "t": "And if you don't really fit with your first therapist,"}, {"s": 910.74, "e": 911.82, "t": "which is pretty common,"}, {"s": 911.82, "e": 913.74, "t": "you can easily switch to a new one for free"}, {"s": 913.74, "e": 915.3, "t": "without stressing about insurance,"}, {"s": 915.3, "e": 917.88, "t": "who's in your network or anything like that."}, {"s": 917.88, "e": 920.16, "t": "If you feel like you could benefit from talking to someone,"}, {"s": 920.16, "e": 923.31, "t": "getting feedback, advice, and help for anything"}, {"s": 923.31, "e": 925.95, "t": "that might be affecting your happiness and progress in life,"}, {"s": 925.95, "e": 928.17, "t": "then visit betterhelp.com/veritasium"}, {"s": 928.17, "e": 930.36, "t": "or click that link in the description below."}, {"s": 930.36, "e": 931.38, "t": "So I want to thank BetterHelp"}, {"s": 931.38, "e": 933.0, "t": "for sponsoring this part of the video."}, {"s": 933.0, "e": 936.06, "t": "And now, back to the importance of relationships."}, {"s": 937.11, "e": 940.17, "t": "There is an alarming trend in our society."}, {"s": 940.17, "e": 942.66, "t": "- [Newsreader] Social engagement with friends decreased"}, {"s": 942.66, "e": 944.88, "t": "from 60 minutes a day in 2003"}, {"s": 944.88, "e": 948.15, "t": "to just 20 minutes a day in 2020."}, {"s": 948.15, "e": 950.82, "t": "- The technology has fundamentally changed"}, {"s": 950.82, "e": 952.71, "t": "how we interact with one another"}, {"s": 952.71, "e": 954.33, "t": "and how we communicate with one another"}, {"s": 954.33, "e": 956.19, "t": "and, unfortunately, has often replaced"}, {"s": 956.19, "e": 959.31, "t": "what used to be rich in-person connections"}, {"s": 959.31, "e": 963.21, "t": "with online connections, which often are of lower quality."}, {"s": 963.21, "e": 965.28, "t": "- Now, you may say you're an introvert"}, {"s": 965.28, "e": 967.32, "t": "and you don't need to spend much time with people"}, {"s": 967.32, "e": 968.52, "t": "to feel good."}, {"s": 968.52, "e": 971.07, "t": "And while it's true that introverts and extroverts"}, {"s": 971.07, "e": 973.68, "t": "need different amounts of social stimulation,"}, {"s": 973.68, "e": 975.93, "t": "both need human connection."}, {"s": 975.93, "e": 978.45, "t": "In 2015, Holt-Lunstad and her colleagues"}, {"s": 978.45, "e": 980.94, "t": "looked at the data of 70 independent studies"}, {"s": 980.94, "e": 983.97, "t": "with more than 3 million total participants."}, {"s": 983.97, "e": 985.11, "t": "Similar to other studies,"}, {"s": 985.11, "e": 987.39, "t": "they found that the subjective feeling of loneliness"}, {"s": 987.39, "e": 990.99, "t": "increased the risk of premature death by 26%."}, {"s": 990.99, "e": 992.01, "t": "But they also looked at"}, {"s": 992.01, "e": 994.23, "t": "the objective measure of social isolation,"}, {"s": 994.23, "e": 997.17, "t": "how much time you're actually spending with other people."}, {"s": 997.17, "e": 999.09, "t": "And they found that social isolation"}, {"s": 999.09, "e": 1002.48, "t": "increased the risk of premature death by 29%."}, {"s": 1002.48, "e": 1005.48, "t": "And unfortunately, introverts are more at risk"}, {"s": 1005.48, "e": 1007.31, "t": "of being socially isolated."}, {"s": 1009.02, "e": 1010.88, "t": "Just like many young people today,"}, {"s": 1010.88, "e": 1012.62, "t": "many participants from the Harvard study"}, {"s": 1012.62, "e": 1014.57, "t": "also believed that money and achievement"}, {"s": 1014.57, "e": 1017.15, "t": "were what they should go after to have a good life."}, {"s": 1017.15, "e": 1019.55, "t": "But what this study and plenty of others show"}, {"s": 1019.55, "e": 1021.26, "t": "is that the people who were the happiest"}, {"s": 1021.26, "e": 1023.75, "t": "were those that leaned into their relationships"}, {"s": 1023.75, "e": 1026.72, "t": "with their partner, friends, family, and community."}, {"s": 1026.72, "e": 1028.28, "t": "And when they were in their 80s"}, {"s": 1028.28, "e": 1031.28, "t": "the researchers asked them, what are you most proud of"}, {"s": 1031.28, "e": 1033.53, "t": "and what is your biggest regret?"}, {"s": 1033.53, "e": 1037.07, "t": "- Many people said that they were proudest"}, {"s": 1037.07, "e": 1039.92, "t": "of something to do with their relationships."}, {"s": 1039.92, "e": 1044.92, "t": "So it could be, \"I was a good boss, I was a good parent,"}, {"s": 1045.05, "e": 1047.33, "t": "I was a good friend, I was a good mentor.\""}, {"s": 1047.33, "e": 1050.96, "t": "Nobody said, \"I made a fortune,\" right?"}, {"s": 1050.96, "e": 1053.93, "t": "Nobody even said, you know, \"I won the Nobel Prize,\""}, {"s": 1053.93, "e": 1055.4, "t": "which a few people did."}, {"s": 1055.4, "e": 1059.06, "t": "It wasn't about those badges of achievement, right,"}, {"s": 1059.06, "e": 1061.52, "t": "that we think of as, \"Oh, that's what we gotta get"}, {"s": 1061.52, "e": 1063.83, "t": "to feel like we've had a meaningful life.\""}, {"s": 1063.83, "e": 1067.85, "t": "Everybody looking back mentioned their relationships."}, {"s": 1067.85, "e": 1071.6, "t": "The biggest regret was particularly among the men,"}, {"s": 1071.6, "e": 1074.69, "t": "'cause this was the World War II generation."}, {"s": 1074.69, "e": 1077.57, "t": "They said, \"I wish I hadn't spent so much time at work,"}, {"s": 1077.57, "e": 1081.59, "t": "I wish I had spent more time with the people I care about.\""}, {"s": 1082.64, "e": 1084.95, "t": "- So what about our original question?"}, {"s": 1084.95, "e": 1088.01, "t": "Do achievements and money really make us happy?"}, {"s": 1088.01, "e": 1089.84, "t": "Well, according to the Harvard study,"}, {"s": 1089.84, "e": 1093.2, "t": "badges of achievement do not necessarily make us happier,"}, {"s": 1093.2, "e": 1096.05, "t": "but doing meaningful work can."}, {"s": 1096.05, "e": 1098.64, "t": "And what about money? Does that make us happier?"}, {"s": 1098.64, "e": 1100.61, "t": "Well, there's a famous study from 2010"}, {"s": 1100.61, "e": 1102.41, "t": "by Daniel Kahneman and Angus Deaton"}, {"s": 1102.41, "e": 1106.1, "t": "that found that above an income of around $75,000 a year,"}, {"s": 1106.1, "e": 1108.11, "t": "there is no improvement whatever"}, {"s": 1108.11, "e": 1110.51, "t": "in the measures of emotional wellbeing."}, {"s": 1110.51, "e": 1111.56, "t": "But 11 years later,"}, {"s": 1111.56, "e": 1113.12, "t": "Matthew Killingsworth studied data"}, {"s": 1113.12, "e": 1116.0, "t": "on 33,000 employed U.S. adults"}, {"s": 1116.0, "e": 1117.53, "t": "and he found that higher incomes"}, {"s": 1117.53, "e": 1120.53, "t": "corresponded to higher levels of wellbeing."}, {"s": 1120.53, "e": 1122.45, "t": "So he wrote, \"There was no evidence"}, {"s": 1122.45, "e": 1126.26, "t": "for an experienced wellbeing plateau above $75,000 a year,"}, {"s": 1126.26, "e": 1129.08, "t": "contrary to some influential past research.\""}, {"s": 1129.08, "e": 1131.72, "t": "In 2022, Kahneman and Killingsworth set out"}, {"s": 1131.72, "e": 1135.17, "t": "to resolve the conflict with Barbara Mellers as a mediator."}, {"s": 1135.17, "e": 1137.48, "t": "When they analyzed Killingsworth's data,"}, {"s": 1137.48, "e": 1139.73, "t": "they discovered an interesting pattern,"}, {"s": 1139.73, "e": 1142.88, "t": "depending on how happy people were relative to others,"}, {"s": 1142.88, "e": 1146.57, "t": "earning more resulted in different increases in happiness."}, {"s": 1146.57, "e": 1147.8, "t": "For each income level,"}, {"s": 1147.8, "e": 1150.38, "t": "they divided people into groups based on their happiness,"}, {"s": 1150.38, "e": 1152.69, "t": "low, medium, high, and so on."}, {"s": 1152.69, "e": 1154.4, "t": "And they found that below a threshold"}, {"s": 1154.4, "e": 1156.59, "t": "of roughly a hundred thousand dollars a year,"}, {"s": 1156.59, "e": 1158.6, "t": "a higher income was associated"}, {"s": 1158.6, "e": 1161.06, "t": "with more happiness for all groups."}, {"s": 1161.06, "e": 1162.74, "t": "But if you go above that threshold,"}, {"s": 1162.74, "e": 1164.45, "t": "then for the unhappiest group,"}, {"s": 1164.45, "e": 1168.14, "t": "a further increase is not associated with more happiness."}, {"s": 1168.14, "e": 1170.0, "t": "However, for all the happier groups,"}, {"s": 1170.0, "e": 1173.18, "t": "higher incomes do seem to lead to more happiness."}, {"s": 1173.18, "e": 1174.17, "t": "And the real twist is"}, {"s": 1174.17, "e": 1176.33, "t": "that those who are the happiest to start with"}, {"s": 1176.33, "e": 1179.45, "t": "stand to gain the most with increasing income."}, {"s": 1180.83, "e": 1182.54, "t": "Relationships, meaningful work,"}, {"s": 1182.54, "e": 1185.21, "t": "and money all play a role in our happiness."}, {"s": 1185.21, "e": 1187.07, "t": "So why can it be so hard"}, {"s": 1187.07, "e": 1190.34, "t": "to realize just how important relationships are?"}, {"s": 1190.34, "e": 1191.24, "t": "- You know, if you think about it,"}, {"s": 1191.24, "e": 1192.83, "t": "relationships have been there"}, {"s": 1192.83, "e": 1196.22, "t": "since before we have memory, right?"}, {"s": 1196.22, "e": 1197.9, "t": "So they're like the air we breathe,"}, {"s": 1197.9, "e": 1199.7, "t": "we take 'em for granted."}, {"s": 1199.7, "e": 1203.39, "t": "So you don't think about that as something you cultivate"}, {"s": 1203.39, "e": 1206.84, "t": "in order to make yourself happy."}, {"s": 1206.84, "e": 1208.4, "t": "We don't think about that at all."}, {"s": 1208.4, "e": 1211.04, "t": "And yet, when we study it scientifically,"}, {"s": 1211.04, "e": 1215.42, "t": "we find that that turns out to be an enormous predictor"}, {"s": 1215.42, "e": 1217.94, "t": "of happiness as well as physical health."}, {"s": 1219.41, "e": 1221.55, "t": "- What's gonna make you happy?"}, {"s": 1221.55, "e": 1222.38, "t": "- Um. - Uh."}, {"s": 1222.38, "e": 1223.21, "t": "- Uh. - Uh."}, {"s": 1223.21, "e": 1224.12, "t": "- Um. - Uh."}, {"s": 1224.12, "e": 1227.06, "t": "- Being wealthy is definitely a big aspect of it."}, {"s": 1227.06, "e": 1230.84, "t": "But that loving family is kind of like the foundation of it."}, {"s": 1230.84, "e": 1233.0, "t": "You know what I mean? - Realistically, money."}, {"s": 1233.0, "e": 1234.56, "t": "But like building deep connections"}, {"s": 1234.56, "e": 1236.57, "t": "with people are what's going"}, {"s": 1236.57, "e": 1238.13, "t": "to make me happy. - [Derek] That's awesome."}, {"s": 1238.13, "e": 1240.14, "t": "- Having like good relationships with other people."}, {"s": 1240.14, "e": 1240.97, "t": "- You raise a family."}, {"s": 1240.97, "e": 1242.27, "t": "- Have a family and provide."}, {"s": 1242.27, "e": 1243.53, "t": "- Friends and family."}, {"s": 1243.53, "e": 1245.75, "t": "- Seeing my family happy, that's all I really care about."}, {"s": 1245.75, "e": 1248.18, "t": "- Giving back to the community"}, {"s": 1248.18, "e": 1249.77, "t": "where you came from, the world."}, {"s": 1249.77, "e": 1252.17, "t": "- A strong family base just to come home to every night."}, {"s": 1252.17, "e": 1254.69, "t": "- Yeah. I wanna get married, have a ton of kids."}, {"s": 1254.69, "e": 1256.55, "t": "I want to- - How many is a ton?"}, {"s": 1256.55, "e": 1257.96, "t": "- Probably like five-ish, six."}, {"s": 1257.96, "e": 1259.83, "t": "- That's a- - As many as I can afford."}, {"s": 1259.83, "e": 1261.2, "t": "(Derek laughs) So."}, {"s": 1261.2, "e": 1263.24, "t": "- In fact, when I interviewed people,"}, {"s": 1263.24, "e": 1264.53, "t": "I was pleasantly surprised"}, {"s": 1264.53, "e": 1267.89, "t": "to see how many identified the importance of relationships."}, {"s": 1268.79, "e": 1271.19, "t": "So if you could give people advice"}, {"s": 1271.19, "e": 1275.63, "t": "on what to start doing today to start being happier,"}, {"s": 1275.63, "e": 1277.61, "t": "what suggestions would you make?"}, {"s": 1277.61, "e": 1280.88, "t": "- To think about it as analogous with physical fitness,"}, {"s": 1280.88, "e": 1283.64, "t": "if you go out today, you don't come home"}, {"s": 1283.64, "e": 1285.11, "t": "and say, \"I'm done."}, {"s": 1285.11, "e": 1287.63, "t": "I don't ever have to do that again,\" right?"}, {"s": 1287.63, "e": 1290.0, "t": "It's like a practice, right?"}, {"s": 1290.0, "e": 1293.48, "t": "That the people who were best at relationships"}, {"s": 1293.48, "e": 1296.57, "t": "were the people who made it a practice"}, {"s": 1296.57, "e": 1298.52, "t": "day after day, week after week,"}, {"s": 1298.52, "e": 1301.64, "t": "to stay connected to the people they cared about."}, {"s": 1301.64, "e": 1305.87, "t": "You know, to talk on the phone, to go for walks,"}, {"s": 1305.87, "e": 1309.62, "t": "to have coffee, to do whatever, to play basketball."}, {"s": 1309.62, "e": 1314.62, "t": "The people who took those actions again and again regularly"}, {"s": 1314.93, "e": 1317.63, "t": "were the people who stayed very connected"}, {"s": 1317.63, "e": 1319.22, "t": "and stayed happy that way."}, {"s": 1319.22, "e": 1322.94, "t": "So what we propose is"}, {"s": 1322.94, "e": 1326.21, "t": "that this is a practice we can cultivate"}, {"s": 1326.21, "e": 1330.08, "t": "and that there are tiny actions that people can take."}, {"s": 1330.08, "e": 1333.26, "t": "We have many stories of people"}, {"s": 1333.26, "e": 1337.43, "t": "who thought that they were no good at relationships,"}, {"s": 1337.43, "e": 1340.88, "t": "that they were never gonna have happy lives."}, {"s": 1340.88, "e": 1342.47, "t": "And then it changed."}, {"s": 1342.47, "e": 1346.16, "t": "And many times it changed when they didn't expect it."}, {"s": 1346.16, "e": 1349.55, "t": "So like, we have a story about one man"}, {"s": 1349.55, "e": 1353.15, "t": "who really didn't have a good marriage"}, {"s": 1353.15, "e": 1356.18, "t": "and was kind of distant from his kids,"}, {"s": 1356.18, "e": 1357.56, "t": "didn't have any friends."}, {"s": 1357.56, "e": 1358.64, "t": "And then when he retired,"}, {"s": 1358.64, "e": 1361.31, "t": "he joined a gym and he found this group of friends"}, {"s": 1361.31, "e": 1365.84, "t": "that became, for the first time, a kind of tribe for him."}, {"s": 1365.84, "e": 1367.61, "t": "And that's just one example"}, {"s": 1367.61, "e": 1372.44, "t": "of how our lives take these twists and turns"}, {"s": 1372.44, "e": 1376.13, "t": "that we usually can't predict,"}, {"s": 1376.13, "e": 1377.42, "t": "that we don't expect."}, {"s": 1377.42, "e": 1380.72, "t": "And many of those turns are in positive directions."}, {"s": 1380.72, "e": 1383.99, "t": "The message that the science tells us"}, {"s": 1383.99, "e": 1388.1, "t": "is don't give up on this aspect of your life."}, {"s": 1388.1, "e": 1392.12, "t": "'cause many things can change at any age."}, {"s": 1393.64, "e": 1397.47, "t": "(transition beeps and chimes)"}],DUR=1397.47;
let cur=-1,aF=true,cpt=false,play=false,ct=0,lT=null;

function fmt(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return h>0?[h,m,s].map(x=>String(x).padStart(2,'0')).join(':'):[m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fmtF(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fi(t){let lo=0,hi=S.length-1,r=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(S[mid].s<=t){r=mid;lo=mid+1;}else hi=mid-1;}return r;}

function doQ(){const q=document.getElementById('q').value.trim();let cnt=0;document.querySelectorAll('.si').forEach((line,i)=>{const tx=line.querySelector('.sx');if(q&&S[i].t.includes(q)){line.classList.add('sm');const ps=S[i].t.split(q);tx.innerHTML='';ps.forEach((p,pi)=>{tx.appendChild(document.createTextNode(p));if(pi<ps.length-1){const mk=document.createElement('mark');mk.textContent=q;tx.appendChild(mk);}});cnt++;}else{line.classList.remove('sm');tx.textContent=S[i].t;}});const row=document.getElementById('sqR');if(q){row.style.display='flex';document.getElementById('sqC').textContent=cnt+' 处';const f=document.querySelector('.sm');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});}else row.style.display='none';}
