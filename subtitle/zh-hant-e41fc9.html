爾人"}, {"s": 360.63, "e": 364.63, "t": "阿卡德當時的君主也就成了人類歷史上第一位大帝"}, {"s": 364.9, "e": 365.87, "t": "薩爾貢大帝"}, {"s": 366.37, "e": 369.3, "t": "他建立的這個帝國呢就叫阿卡德帝國"}, {"s": 369.3, "e": 371.07, "t": "首都就是阿卡德"}, {"s": 371.57, "e": 374.03, "t": "阿卡德帝國實行總督制"}, {"s": 374.17, "e": 376.47, "t": "每個城邦都由一個總督管理"}, {"s": 376.8, "e": 378.63, "t": "帝國設有一支統一的軍隊"}, {"s": 378.77, "e": 380.63, "t": "以確保統治的穩定"}, {"s": 381.4, "e": 384.97, "t": "古老的蘇美爾城邦過去不曾被任何人控制"}, {"s": 384.97, "e": 388.03, "t": "如今卻在政治、宗教、經濟和文化上"}, {"s": 388.03, "e": 390.63, "t": "都處於一種強硬的統治之下"}, {"s": 390.63, "e": 392.87, "t": "承受沉重的賦稅和兵役"}, {"s": 393.0, "e": 395.37, "t": "自然就萌生了反叛之心"}, {"s": 396.07, "e": 399.33, "t": "但這些反叛最終都被殘酷的鎮壓了"}, {"s": 399.47, "e": 402.5, "t": "很多造反的蘇美爾城邦都慘遭屠城"}, {"s": 403.2, "e": 406.13, "t": "直到西元前2160年左右"}, {"s": 406.43, "e": 409.93, "t": "在來自札格洛斯山脈的庫提人入侵下"}, {"s": 409.97, "e": 411.7, "t": "阿卡德帝國滅亡"}, {"s": 412.17, "e": 415.63, "t": "蘇美爾諸邦這才恢復了獨立、短暫復興"}, {"s": 416.3, "e": 417.33, "t": "尤其是烏爾"}, {"s": 417.5, "e": 420.13, "t": "又快速回血迎來了第二春"}, {"s": 420.23, "e": 422.37, "t": "稱霸美索不達米亞"}, {"s": 422.37, "e": 424.33, "t": "讓蘇美爾王表得以延續"}, {"s": 424.67, "e": 425.37, "t": "然而"}, {"s": 425.37, "e": 427.5, "t": "在西元前21世紀末"}, {"s": 427.7, "e": 430.6, "t": "由於土地鹽鹼化帶來的糧食危機"}, {"s": 430.6, "e": 432.53, "t": "外加遊牧民族的入侵"}, {"s": 432.83, "e": 436.7, "t": "蘇美爾文明最終還是在內憂外患中被摧毀了"}, {"s": 436.9, "e": 438.63, "t": "西元前2004年"}, {"s": 438.63, "e": 441.47, "t": "來自伊朗的埃蘭人洗劫了烏爾"}, {"s": 441.77, "e": 443.7, "t": "俘虜了末代蘇美爾王"}, {"s": 444.1, "e": 447.07, "t": "人類歷史上的第一個文明蘇美爾文明"}, {"s": 447.07, "e": 450.17, "t": "便從此消失在了歷史的長河之中"}, {"s": 453.43, "e": 455.07, "t": "西元前19世紀"}, {"s": 455.07, "e": 456.67, "t": "繼阿卡德人之後"}, {"s": 456.67, "e": 460.27, "t": "又有一支閃米特人在美索不達米亞定居下來"}, {"s": 460.3, "e": 462.03, "t": "這就是阿摩利人"}, {"s": 462.7, "e": 466.37, "t": "阿摩利人將蘇美爾人驅逐出了他們的城邦"}, {"s": 466.6, "e": 468.4, "t": "然後就鳩占鵲巢"}, {"s": 468.4, "e": 472.47, "t": "在這些原本屬於蘇美爾人的城邦裡建立了自己的政權"}, {"s": 473.23, "e": 475.87, "t": "這些阿摩利人的城邦雖然各自獨立"}, {"s": 475.87 function fmt(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return h>0?[h,m,s].map(x=>String(x).padStart(2,'0')).join(':'):[m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fmtF(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fi(t){let lo=0,hi=S.length-1,r=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(S[mid].s<=t){r=mid;lo=mid+1;}else hi=mid-1;}return r;}
