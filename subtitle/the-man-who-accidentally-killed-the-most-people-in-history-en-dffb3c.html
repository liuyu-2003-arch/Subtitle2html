<script>
const S=[{"s": 0.16, "e": 3.44, "t": "One single scientist created three inventions"}, {"s": 3.44, "e": 7.28, "t": "that accidentally caused the deaths of millions of people,"}, {"s": 7.84, "e": 9.28, "t": "including himself."}, {"s": 10.0, "e": 13.76, "t": "Not only that, they decreased the\\h average intelligence of people\\h"}, {"s": 13.76, "e": 15.04, "t": "all around the world,"}, {"s": 15.04, "e": 16.48, "t": "increased crime rates,"}, {"s": 16.48, "e": 20.08, "t": "and caused two completely\\h separate environmental disasters"}, {"s": 20.08, "e": 22.48, "t": "that we are still dealing with today."}, {"s": 24.08, "e": 26.24, "t": "Part of this video is sponsored by Wren."}, {"s": 26.24, "e": 29.84, "t": "More about them at the end of the show."}, {"s": 30.4, "e": 33.76, "t": "In 1944, as a young chemist who had just finished his"}, {"s": 33.76, "e": 38.08, "t": "Master's, Clair Patterson went to work on the Manhattan Project,"}, {"s": 38.08, "e": 40.96, "t": "building the first nuclear weapons."}, {"s": 40.96, "e": 46.56, "t": "His job was to concentrate uranium-235, the fissile fuel for bombs"}, {"s": 46.56, "e": 49.52, "t": "from the much more common uranium-238."}, {"s": 49.52, "e": 55.04, "t": "And this required huge machines, mass spectrometers, which separated"}, {"s": 55.04, "e": 58.48, "t": "the two types of uranium by their slight difference in mass."}, {"s": 64.56, "e": 67.76, "t": "After the war, Patterson went back to grad school to get his"}, {"s": 67.76, "e": 71.04, "t": "PhD, he picked a research project that would take"}, {"s": 71.04, "e": 73.84, "t": "advantage of his experience with mass spectrometers:"}, {"s": 74.48, "e": 76.56, "t": "measuring the age of the Earth."}, {"s": 78.4, "e": 81.92, "t": "Radioactive rocks are effectively clocks."}, {"s": 81.92, "e": 86.88, "t": "Uranium-238, for example, decays into thorium and then protactinium,"}, {"s": 86.88, "e": 91.44, "t": "and then 12 More decays until it ends up as lead-206, which is stable."}, {"s": 92.08, "e": 95.12, "t": "The rate of this decay is consistent and can be"}, {"s": 95.12, "e": 99.28, "t": "measured. It takes four and a half billion years for half of"}, {"s": 99.28, "e": 103.12, "t": "a sample of U-238. to decay into lead-206"}, {"s": 103.84, "e": 108.32, "t": "Patterson's PhD project was to determine the age of the Earth by measuring"}, {"s": 108.32, "e": 111.92, "t": "the ratio of uranium to lead in primordial rocks,"}, {"s": 112.56, "e": 116.88, "t": "but to calibrate his instrument, first he used zircon crystals whose"}, {"s": 116.88, "e": 117.92, "t": "ages were known."}, {"s": 118.64, "e": 120.8, "t": "Zircon is ideal for this purpose,"}, {"s": 120.8, "e": 123.84, "t": "because when it forms it contains trace amounts of"}, {"s": 123.84, "e": 126.32, "t": "uranium but absolutely no lead."}, {"s": 126.88, "e": 131.76, "t": "So any lead that you later find inside a zircon, you know must be the product"}, {"s": 131.76, "e": 132.96, "t": "of a uranium decay."}, {"s": 134.0, "e": 137.04, "t": "Patterson was tasked with\\h measuring the lead content,"}, {"s": 137.04, "e": 139.84, "t": "and another student, George\\h Tilton, measured uranium"}, {"s": 141.28, "e": 144.88, "t": "Tilton 's uranium measurements were fine. They matched predictions."}, {"s": 145.52, "e": 147.92, "t": "But Patterson's lead measurements were all"}, {"s": 147.92, "e": 150.96, "t": "over the place. And they were many many times higher than"}, {"s": 150.96, "e": 152.0, "t": "they expected."}, {"s": 152.0, "e": 154.24, "t": "We'd take George's uranium and my lead..."}, {"s": 154.8, "e": 155.84, "t": "Not right Patterson!"}, {"s": 157.2, "e": 159.04, "t": "There was lead there that didn't belong there."}, {"s": 160.48, "e": 163.12, "t": "So where was all this extra lead coming from?"}, {"s": 163.92, "e": 168.48, "t": "That mystery would take over the rest of Clair Patterson's life"}, {"s": 168.48, "e": 171.44, "t": "and bring him to the literal ends of the earth."}, {"s": 174.4, "e": 178.24, "t": "In 1908, a woman was driving across the Belle Isle bridge"}, {"s": 178.24, "e": 180.48, "t": "in Detroit. When her car stalled."}, {"s": 181.12, "e": 183.36, "t": "A passing motorist stopped to help."}, {"s": 183.36, "e": 186.56, "t": "In those days cars needed to be hand cranked to start."}, {"s": 187.28, "e": 190.08, "t": "He knelt down and turned the crank,"}, {"s": 190.08, "e": 193.52, "t": "and the engine roared to life. A little too suddenly."}, {"s": 194.08, "e": 197.52, "t": "The man couldn't get out of the way. The crank handle hit him in"}, {"s": 197.52, "e": 199.2, "t": "the face and broke his jaw."}, {"s": 200.48, "e": 202.72, "t": "He died as a result of his injuries."}, {"s": 203.36, "e": 208.32, "t": "His name was Byron Carter, and he was the founder of his own car company."}, {"s": 208.32, "e": 211.28, "t": "So he was well connected in the Detroit Auto scene."}, {"s": 211.28, "e": 215.28, "t": "He counted among his close friends, the founder of Cadillac, Henry Leland."}, {"s": 216.0, "e": 218.48, "t": "Leland was so distraught over his friend's"}, {"s": 218.48, "e": 222.96, "t": "death that he resolved to eliminate hand cranks from his vehicles."}, {"s": 224.0, "e": 226.83, "t": "Leland hired Charles Kettering to create a self-"}, {"s": 226.83, "e": 230.88, "t": "starting car. And by 1911, he had a working prototype."}, {"s": 231.76, "e": 236.16, "t": "Hand cranking was difficult and dangerous, and best left to men,"}, {"s": 237.2, "e": 240.24, "t": "but a car that started itself"}, {"s": 240.24, "e": 241.68, "t": "changed everything."}, {"s": 242.4, "e": 244.08, "t": "The world's first crankless car"}, {"s": 244.08, "e": 247.2, "t": "was the Cadillac Model 30. It was much more powerful than"}, {"s": 247.2, "e": 251.2, "t": "cars before it. It had a top speed of 45 miles per hour and"}, {"s": 251.2, "e": 255.76, "t": "40 horsepower, double the Ford Model T. The Model 30 was a"}, {"s": 255.76, "e": 259.2, "t": "huge success for Cadillac, doubling the company's annual"}, {"s": 259.2, "e": 263.92, "t": "sales, but it had a problem. It was deafeningly loud."}, {"s": 265.36, "e": 269.68, "t": "In internal combustion engines a piston compresses the fuel-air mixture,"}, {"s": 269.68, "e": 272.8, "t": "which is then ignited by a spark from the spark plug."}, {"s": 272.8, "e": 276.0, "t": "The expanding hot gases push the piston back down."}, {"s": 276.64, "e": 279.12, "t": "The problem with the Model 30 engine was it"}, {"s": 279.12, "e": 282.08, "t": "compressed the fuel-air mixture more than previous"}, {"s": 282.08, "e": 285.12, "t": "models so much in fact, that often the fuel would"}, {"s": 285.12, "e": 288.96, "t": "spontaneously combust before the spark from the spark plug."}, {"s": 288.96, "e": 291.84, "t": "So rather than orderly, perfectly timed explosions,"}, {"s": 291.84, "e": 295.28, "t": "you'd get multiple haphazard combustions leading to"}, {"s": 295.28, "e": 298.16, "t": "turbulent pressure waves inside the cylinder. The"}, {"s": 298.16, "e": 299.92, "t": "resulting sound led the problem"}, {"s": 299.92, "e": 302.08, "t": "To become known as engine knocking."}, {"s": 303.52, "e": 306.8, "t": "Knocking wasn't just hard on the ears, it hurt the engine's"}, {"s": 306.8, "e": 310.0, "t": "performance, it reduced power output and lowered fuel"}, {"s": 310.0, "e": 313.52, "t": "efficiency. The vibrations also damaged the piston and"}, {"s": 313.52, "e": 315.92, "t": "walls of the cylinder shortening the life of the"}, {"s": 315.92, "e": 316.24, "t": "engine."}, {"s": 317.44, "e": 320.64, "t": "The good news was that engine knocking could be corrected by"}, {"s": 320.64, "e": 324.56, "t": "changing the fuel. Different fuels can withstand different"}, {"s": 324.56, "e": 328.32, "t": "levels of compression before detonating n-heptane for"}, {"s": 328.32, "e": 331.68, "t": "example, will spontaneously combust under only a little"}, {"s": 331.68, "e": 335.28, "t": "compression. Iso-octane, on the other hand can withstand a"}, {"s": 335.28, "e": 339.52, "t": "much higher compression ratio before it auto ignites. So"}, {"s": 339.52, "e": 343.28, "t": "it's much less likely to cause knocking. To quantify how much"}, {"s": 343.28, "e": 345.84, "t": "compression a fuel can withstand scientists came up"}, {"s": 345.84, "e": 349.12, "t": "with the octane rating system, they arbitrarily set"}, {"s": 349.12, "e": 353.04, "t": "iso-octane to have a rating of 100 and n-heptane a rating of"}, {"s": 353.04, "e": 356.24, "t": "zero. Now real fuels aren't made up of only these two"}, {"s": 356.24, "e": 358.48, "t": "ingredients. They're a mix of lots of different"}, {"s": 358.48, "e": 361.76, "t": "hydrocarbons. But the octane rating tells you what mixture"}, {"s": 361.76, "e": 365.36, "t": "of octane and heptane gives equivalent performance. For"}, {"s": 365.36, "e": 368.96, "t": "example, 98 octane fuel can withstand the same compression"}, {"s": 368.96, "e": 373.36, "t": "as a mixture of 98% octane and 2% heptane. Now, I'm going to"}, {"s": 373.36, "e": 377.12, "t": "take a little bit of 98 octane fuel and put it in this"}, {"s": 377.92, "e": 380.48, "t": "piston. And when I compress it,"}, {"s": 382.56, "e": 385.68, "t": "nothing happens which is exactly what you'd expect."}, {"s": 385.68, "e": 389.28, "t": "This fuel can withstand a lot of compression. Diesel has an"}, {"s": 389.28, "e": 392.4, "t": "octane rating of 20. So it acts like a mixture of 20%"}, {"s": 392.4, "e": 395.92, "t": "iso-octane and 80% n-heptane. If I put a little bit of"}, {"s": 395.92, "e": 399.12, "t": "diesel in there, let's see what happens with the same"}, {"s": 399.12, "e": 400.08, "t": "compression ratio."}, {"s": 406.56, "e": 409.44, "t": "There you go. You get a little explosion in there. That's"}, {"s": 409.44, "e": 411.84, "t": "because this is a low octane fuel. I mean, that's what"}, {"s": 411.84, "e": 414.64, "t": "diesel is meant to do. You compress it and it ignites."}, {"s": 414.64, "e": 418.0, "t": "But you don't want this sort of fuel in an engine with"}, {"s": 418.0, "e": 422.24, "t": "spark plugs. The reason fancy cars demand high octane fuel"}, {"s": 422.24, "e": 424.72, "t": "is to prevent knocking in their high-compression"}, {"s": 424.72, "e": 426.0, "t": "high-performance engines."}, {"s": 428.0, "e": 430.64, "t": "Kettering wanted to find an additive which would increase"}, {"s": 430.64, "e": 434.08, "t": "the octane rating of ordinary fuel and eliminate knocking in"}, {"s": 434.08, "e": 437.52, "t": "high-compression engines. So he hired a 27-year-old"}, {"s": 437.52, "e": 441.84, "t": "engineer Thomas Midgley Jr. Midgley experimented with all"}, {"s": 441.84, "e": 446.16, "t": "sorts of compounds from melted butter and camphor, to ethyl"}, {"s": 446.16, "e": 449.76, "t": "acetate and aluminum chloride. He later wrote, most of them"}, {"s": 449.76, "e": 452.24, "t": "had no more effect than spitting in the Great Lakes."}, {"s": 453.68, "e": 456.8, "t": "Ethanol was an interesting exception, it did stop the"}, {"s": 456.8, "e": 460.48, "t": "knocking, but you needed a lot of it about 10% of the fuel"}, {"s": 460.48, "e": 463.2, "t": "mixture for it to be effective, that much ethanol"}, {"s": 463.2, "e": 467.04, "t": "would be expensive and hard to turn a profit on. And Midgley"}, {"s": 467.04, "e": 469.6, "t": "was really after an additive that was cheap, easy to"}, {"s": 469.6, "e": 473.76, "t": "produce and effective even at low concentrations. So he kept"}, {"s": 473.76, "e": 478.08, "t": "trying. Then he hit on tellurium. It worked"}, {"s": 478.08, "e": 481.84, "t": "wonderfully as an anti knock agent, but it had a terrible"}, {"s": 481.84, "e": 485.6, "t": "smell. You couldn't get rid of it by changing clothes or"}, {"s": 485.6, "e": 489.44, "t": "bathing. His wife was so offended by the stench that he"}, {"s": 489.44, "e": 493.12, "t": "had to sleep in the basement for seven months, Midgley"}, {"s": 493.12, "e": 496.16, "t": "wrote, I don't think that although this doubled the fuel"}, {"s": 496.16, "e": 499.04, "t": "economy, humanity would suffer this smell."}, {"s": 501.44, "e": 505.44, "t": "On December 3 1921, after five years of working on the"}, {"s": 505.44, "e": 508.64, "t": "problem, Midgley found what he thought was the perfect"}, {"s": 508.64, "e": 512.8, "t": "solution, tetraethyl lead. That's a lead atom right there"}, {"s": 512.8, "e": 516.24, "t": "in the center. This additive was exactly what he was"}, {"s": 516.24, "e": 520.16, "t": "looking for. It stopped the knocking, it didn't smell. It"}, {"s": 520.16, "e": 523.04, "t": "was cheap to produce and readily available. Best of"}, {"s": 523.04, "e": 526.72, "t": "all, you only needed one part in 1000, for it to be"}, {"s": 526.72, "e": 530.24, "t": "effective. In a call to Kettering, Midgley said, can"}, {"s": 530.24, "e": 533.04, "t": "you imagine how much money we're going to make with this?"}, {"s": 533.04, "e": 537.2, "t": "We're going to make $200 million, maybe even more. That"}, {"s": 537.2, "e": 541.76, "t": "is over 3 billion in today's dollars. Now for his"}, {"s": 541.76, "e": 544.48, "t": "discovery, the American Chemical Society gave him the"}, {"s": 544.48, "e": 548.16, "t": "prestigious Nichols award, and they asked him to do a series"}, {"s": 548.16, "e": 552.48, "t": "of public talks, but Midgley declined. He and Kettering"}, {"s": 552.48, "e": 555.52, "t": "patented the process for making Tetra ethyl led, and"}, {"s": 555.52, "e": 559.12, "t": "they called their new additive Ethyl, perhaps so it might be"}, {"s": 559.12, "e": 562.72, "t": "confused with another common additive ethyl alcohol they"}, {"s": 562.72, "e": 567.28, "t": "made no mention of lead. Then they teamed up with three of"}, {"s": 567.28, "e": 570.56, "t": "America's largest corporations General Motors, DuPont and"}, {"s": 570.56, "e": 575.84, "t": "Standard Oil of New Jersey to form the Ethyl Corporation."}, {"s": 575.84, "e": 579.92, "t": "Their marketing was brilliant. No man can look at the amazing"}, {"s": 579.92, "e": 582.48, "t": "record of accomplishment here in this research division,"}, {"s": 582.48, "e": 585.52, "t": "without confidence that these men are going ahead with an"}, {"s": 585.52, "e": 588.8, "t": "eye to the future, looking for new facts and principles,"}, {"s": 588.8, "e": 592.08, "t": "which will make things better and make life easier for all of us."}, {"s": 603.6, "e": 608.4, "t": "at the 1923 Indianapolis 500, the top three finishers all"}, {"s": 608.4, "e": 613.52, "t": "used Ethyl and the demand for leaded gasoline took off. To"}, {"s": 613.52, "e": 616.56, "t": "keep up Ethyl Corporation had to build a new chemical plant"}, {"s": 616.56, "e": 620.4, "t": "in New Jersey. But the project began terribly. Within two"}, {"s": 620.4, "e": 623.92, "t": "months of operating, dozens of workers fell ill with lead"}, {"s": 623.92, "e": 626.08, "t": "poisoning. Five of them died."}, {"s": 627.36, "e": 630.64, "t": "To address the public outcry, Midgley held a press"}, {"s": 630.64, "e": 634.56, "t": "conference. And there he poured Tetraethyl lead onto"}, {"s": 634.56, "e": 639.04, "t": "his hands, and he inhaled it for a full minute. He claimed"}, {"s": 639.04, "e": 643.28, "t": "he could do this daily without harm. But Midgley knew the"}, {"s": 643.28, "e": 646.88, "t": "dangers. The reason he had turned down the public talks"}, {"s": 646.88, "e": 651.2, "t": "was because he spent much of 1923 in Florida, where he"}, {"s": 651.2, "e": 655.28, "t": "himself was recovering from lead poisoning. He didn't go"}, {"s": 655.28, "e": 660.16, "t": "anywhere near his company's product if he could help it."}, {"s": 660.16, "e": 664.64, "t": "Lead is dangerous even in small doses, it mimics calcium"}, {"s": 664.64, "e": 667.2, "t": "in our bodies, so there's no efficient way to get rid of"}, {"s": 667.2, "e": 671.68, "t": "it. And like calcium lead can be stored in bones for years,"}, {"s": 671.68, "e": 674.48, "t": "meaning it can continue to poison the body long after the"}, {"s": 674.48, "e": 678.32, "t": "initial exposure. The organ most sensitive to lead is the"}, {"s": 678.32, "e": 682.24, "t": "brain. Lead breaks down the myelin sheath around axons and"}, {"s": 682.24, "e": 685.04, "t": "prevents the release of neurotransmitters. That's why"}, {"s": 685.04, "e": 687.84, "t": "common symptoms of lead poisoning are headaches,"}, {"s": 687.84, "e": 691.36, "t": "memory loss and tingling in the hands and feet. And"}, {"s": 691.36, "e": 694.72, "t": "children are particularly susceptible, lead exposure can"}, {"s": 694.72, "e": 697.2, "t": "cause permanent learning disorders and behavioral"}, {"s": 697.2, "e": 700.32, "t": "problems, and the dangers of lead had been known for"}, {"s": 700.32, "e": 704.56, "t": "hundreds of years. Already in 1786, Benjamin Franklin"}, {"s": 704.56, "e": 707.76, "t": "remarked that lead had been used for far too long"}, {"s": 707.76, "e": 711.12, "t": "considering its known toxicity, \"you will observe"}, {"s": 711.12, "e": 714.72, "t": "with concern how long a useful truth may be known and exist"}, {"s": 714.72, "e": 718.24, "t": "before it is generally received and practiced on\". He"}, {"s": 718.24, "e": 721.2, "t": "would have been aghast to learn that nearly 150 years"}, {"s": 721.2, "e": 725.92, "t": "later, scientists planned to add lead to fuel. Doctors and"}, {"s": 725.92, "e": 729.36, "t": "public health officials from MIT, Harvard, Yale, and the US"}, {"s": 729.36, "e": 731.76, "t": "health service, wrote to Midgley and warned them"}, {"s": 731.76, "e": 734.72, "t": "against producing Tetraethyl lead. They called lead a"}, {"s": 734.72, "e": 738.24, "t": "creeping and malicious poison and a serious menace to public"}, {"s": 738.24, "e": 741.52, "t": "health. Their concerns were dismissed."}, {"s": 743.68, "e": 746.48, "t": "This model shows how just the right amount of fluid"}, {"s": 746.48, "e": 751.2, "t": "containing Tetraethyl lead and dye is added to the gasoline."}, {"s": 751.2, "e": 754.72, "t": "No one doubted that a lot of lead was bad for you. But how"}, {"s": 754.72, "e": 757.84, "t": "much harm could a little lead do?"}, {"s": 758.96, "e": 762.4, "t": "By the 1950s, millions of motorists globally were"}, {"s": 762.4, "e": 765.6, "t": "burning lead in their cars and releasing it into the air."}, {"s": 766.4, "e": 769.88, "t": "Some of that lead ended up on Clair Patterson's zircon on"}, {"s": 769.88, "e": 773.84, "t": "samples, preventing him from determining their age. In"}, {"s": 773.84, "e": 777.84, "t": "1952, he moved to Caltech, where he built a new lab from"}, {"s": 777.84, "e": 780.96, "t": "scratch, suspicious of environmental contamination,"}, {"s": 780.96, "e": 784.08, "t": "he tore the electrical cables out of the walls to remove the"}, {"s": 784.08, "e": 787.68, "t": "lead solder. He cleaned the floors and benches daily with"}, {"s": 787.68, "e": 790.96, "t": "ammonia and made sure that air was always being blown out of"}, {"s": 790.96, "e": 795.52, "t": "the lab. To go inside, you had to wear a plastic bunny suit."}, {"s": 795.52, "e": 799.68, "t": "Patterson basically invented the cleanroom. Inside that"}, {"s": 799.68, "e": 803.12, "t": "room, he turned his attention to the oldest rocks in the"}, {"s": 803.12, "e": 807.52, "t": "solar system. meteorites. All the original rocks on Earth"}, {"s": 807.52, "e": 811.12, "t": "had long since been destroyed by tectonic activity. But"}, {"s": 811.12, "e": 814.88, "t": "meteorites come from asteroids which formed around the same"}, {"s": 814.88, "e": 819.28, "t": "time as Earth. They have just been drifting through space"}, {"s": 819.28, "e": 822.88, "t": "until they entered the Earth's atmosphere. So the best way to"}, {"s": 822.88, "e": 826.24, "t": "measure the age of the Earth was to measure the age of"}, {"s": 826.24, "e": 830.72, "t": "meteorites. Patterson measured five meteorites, each with"}, {"s": 830.72, "e": 833.84, "t": "three different radiometric dating techniques, and he"}, {"s": 833.84, "e": 839.68, "t": "found they were all 4.55 billion years old. That number"}, {"s": 839.68, "e": 844.24, "t": "is within 0.15% of the currently accepted value for"}, {"s": 844.24, "e": 847.52, "t": "the age of the earth. You know, before Patterson's"}, {"s": 847.52, "e": 850.56, "t": "experiment, people thought the earth was a billion years"}, {"s": 850.56, "e": 854.64, "t": "younger. So Patterson had done it. He measured the age of the"}, {"s": 854.64, "e": 858.56, "t": "Earth, but he wasn't done getting rid of lead contaminants."}, {"s": 860.08, "e": 862.88, "t": "Public concern about lead exposure had continued to"}, {"s": 862.88, "e": 865.84, "t": "grow. But President of Standard Oil, Frank Howard"}, {"s": 865.84, "e": 869.2, "t": "pushed back saying, \"We do not feel justified in giving up"}, {"s": 869.2, "e": 872.48, "t": "what has come to the industry like a gift from heaven, on"}, {"s": 872.48, "e": 875.28, "t": "the possibility that a hazard may be involved in it.\""}, {"s": 876.88, "e": 880.56, "t": "Scientists funded by the Ethyl Corporation claimed that lead"}, {"s": 880.56, "e": 883.92, "t": "was a natural part of our environment, and therefore not"}, {"s": 883.92, "e": 887.44, "t": "harmful to people. But Patterson wondered just how"}, {"s": 887.44, "e": 891.68, "t": "natural is the lead in our environment, and he had just"}, {"s": 891.68, "e": 897.84, "t": "the skills to find out."}, {"s": 897.84, "e": 900.96, "t": "He began by measuring lead in the oceans. If it were"}, {"s": 900.96, "e": 903.44, "t": "natural, he expected the concentration of lead to be"}, {"s": 903.44, "e": 907.12, "t": "the same regardless of depth. But if lead pollution had"}, {"s": 907.12, "e": 909.92, "t": "increased recently, it would be more concentrated near the"}, {"s": 909.92, "e": 913.28, "t": "surface. He took samples in the Pacific and Atlantic"}, {"s": 913.28, "e": 917.12, "t": "Oceans down to a depth of four kilometers. And sure enough,"}, {"s": 917.12, "e": 920.4, "t": "lead concentrations were nearly 10 times higher near"}, {"s": 920.4, "e": 924.96, "t": "the surface. Lead pollution was clearly recent, but when"}, {"s": 924.96, "e": 926.48, "t": "exactly had it occurred?"}, {"s": 928.4, "e": 931.28, "t": "To find out Patterson had to go to Greenland and"}, {"s": 931.28, "e": 934.96, "t": "Antarctica. Ice cores record the level of lead in the air"}, {"s": 934.96, "e": 939.2, "t": "going back 1000s of years, the levels of lead in the"}, {"s": 939.2, "e": 943.36, "t": "atmosphere have been elevated for the last 4500 years. All"}, {"s": 943.36, "e": 947.44, "t": "of it is due to human activity mainly smelting ores to make"}, {"s": 947.44, "e": 950.8, "t": "metal. You can see the rise and fall of the Greek and"}, {"s": 950.8, "e": 954.4, "t": "Roman Empires. The dip caused by the Black Death in the"}, {"s": 954.4, "e": 958.32, "t": "1300s. And of course, the spike in the 20th century due"}, {"s": 958.32, "e": 961.04, "t": "to industrialization and Tetraethyl lead."}, {"s": 962.96, "e": 966.72, "t": "So what did this do to people? Well, Patterson looked at the"}, {"s": 966.72, "e": 969.68, "t": "lead levels in the teeth and bones of recently deceased"}, {"s": 969.68, "e": 973.12, "t": "Americans. And for comparison, he measured the lead in bones"}, {"s": 973.12, "e": 976.56, "t": "and teeth of Peruvian and Egyptian mummies. Since they"}, {"s": 976.56, "e": 979.84, "t": "lived over 1600 years ago, they would have been exposed"}, {"s": 979.84, "e": 983.92, "t": "to much less lead in their lifetimes. He expected to find"}, {"s": 983.92, "e": 986.96, "t": "modern Americans had about 100 times as much lead in their"}, {"s": 986.96, "e": 990.4, "t": "bones. But results showed it was closer to a factor of"}, {"s": 990.4, "e": 995.76, "t": "1,000. 20th century Americans had 1000 times more lead in"}, {"s": 995.76, "e": 999.68, "t": "their bones than their ancestors. Studies of baby"}, {"s": 999.68, "e": 1002.96, "t": "teeth revealed that even Lead exposure well below the level"}, {"s": 1002.96, "e": 1007.36, "t": "considered safe resulted in delayed learning, decreased IQ"}, {"s": 1007.36, "e": 1011.68, "t": "and increased behavioral problems. And there's a broad"}, {"s": 1011.68, "e": 1014.24, "t": "consensus on the part of everybody except the lead"}, {"s": 1014.24, "e": 1016.96, "t": "industry and its spokesmen that lead is extremely toxic"}, {"s": 1016.96, "e": 1020.4, "t": "at extremely low doses. A follow up study showed that"}, {"s": 1020.4, "e": 1023.2, "t": "those with higher levels of lead in their baby teeth were"}, {"s": 1023.2, "e": 1027.2, "t": "many times more likely to fail out of high school. As a"}, {"s": 1027.2, "e": 1030.64, "t": "result of studies like these, the CDC's guidelines for the"}, {"s": 1030.64, "e": 1033.84, "t": "acceptable level of lead in children's blood dropped from"}, {"s": 1033.84, "e": 1039.2, "t": "60 micrograms per deciliter down to 3.5. And as far as we"}, {"s": 1039.2, "e": 1044.0, "t": "know, today, there is no safe level of lead. Globally, lead"}, {"s": 1044.0, "e": 1047.36, "t": "is believed to be responsible for nearly two thirds of all"}, {"s": 1047.36, "e": 1050.8, "t": "unexplained intellectual disability. According to a"}, {"s": 1050.8, "e": 1054.56, "t": "study published in 2022, more than half of the current"}, {"s": 1054.56, "e": 1059.04, "t": "US population, that's 170 million people were exposed to"}, {"s": 1059.04, "e": 1062.32, "t": "high levels of lead in early childhood. Those born between"}, {"s": 1062.32, "e": 1065.84, "t": "1951 and 1980, are disproportionately affected."}, {"s": 1066.48, "e": 1069.92, "t": "The author's estimate that in aggregate lead caused a loss"}, {"s": 1069.92, "e": 1074.72, "t": "of more than 800 million IQ points. The world is less"}, {"s": 1074.72, "e": 1079.28, "t": "intelligent today because of leaded gasoline. But there are"}, {"s": 1079.28, "e": 1083.2, "t": "even more troubling correlations. The US saw a"}, {"s": 1083.2, "e": 1089.04, "t": "steady rise in crime from the 1970s to the 1990s, then it"}, {"s": 1089.04, "e": 1093.76, "t": "abruptly declined. This graph looks eerily similar to a plot"}, {"s": 1093.76, "e": 1098.96, "t": "of preschool blood lead levels just offset by 20 years. The"}, {"s": 1098.96, "e": 1102.16, "t": "obvious question is did kids who were exposed to higher"}, {"s": 1102.16, "e": 1105.2, "t": "levels of lead grow up to commit more crimes than they"}, {"s": 1105.2, "e": 1108.24, "t": "otherwise would have? You might think this is just a"}, {"s": 1108.24, "e": 1111.04, "t": "spurious correlation. But the same pattern appears in many"}, {"s": 1111.04, "e": 1114.72, "t": "countries, including Britain, Canada, and Australia. And we"}, {"s": 1114.72, "e": 1116.8, "t": "know there's a causal connection between lead"}, {"s": 1116.8, "e": 1120.64, "t": "exposure and antisocial or violent behavior. A study of"}, {"s": 1120.64, "e": 1124.4, "t": "340 Teenagers found that those who were arrested were four"}, {"s": 1124.4, "e": 1126.96, "t": "times as likely to have elevated lead in their bones"}, {"s": 1126.96, "e": 1129.72, "t": "than similar demographic controls who didn't have run"}, {"s": 1129.72, "e": 1132.4, "t": "ins with the law. Now, this doesn't mean that lead is"}, {"s": 1132.4, "e": 1135.28, "t": "responsible for all of the increase in crime, but it's"}, {"s": 1135.28, "e": 1137.2, "t": "very likely responsible for some of it."}, {"s": 1139.12, "e": 1142.4, "t": "Now, it's tough to estimate the precise death toll of"}, {"s": 1142.4, "e": 1145.68, "t": "lead. One of its lesser known effects is a hardening of the"}, {"s": 1145.68, "e": 1150.08, "t": "arteries, leading to increased cardiovascular disease. A"}, {"s": 1150.08, "e": 1154.72, "t": "study from 2018 found lead was likely responsible for 250,000"}, {"s": 1155.44, "e": 1159.76, "t": "heart disease deaths per year in the US, assuming a constant"}, {"s": 1159.76, "e": 1163.36, "t": "rate over the past century, that amounts to 25 million"}, {"s": 1163.36, "e": 1167.36, "t": "deaths in the US alone. Globally, the figure may"}, {"s": 1167.36, "e": 1170.96, "t": "approach 100 million. Most of those deaths are due to"}, {"s": 1170.96, "e": 1174.96, "t": "Midgley's decision to put lead in gasoline, as substance he"}, {"s": 1174.96, "e": 1178.88, "t": "knew firsthand was toxic, but he did it anyway to maximize"}, {"s": 1178.88, "e": 1183.12, "t": "profits. And the problem is not over. Current estimates of"}, {"s": 1183.12, "e": 1187.68, "t": "deaths caused by lead range from 500 to 900 thousand per"}, {"s": 1187.68, "e": 1191.36, "t": "year. The 2020 UNICEF report warns that one in three"}, {"s": 1191.36, "e": 1195.68, "t": "children globally, that's over 800 million children have"}, {"s": 1195.68, "e": 1199.52, "t": "blood lead levels at or above five micrograms per deciliter."}, {"s": 1200.32, "e": 1203.6, "t": "A lot of this lead now comes from batteries and industrial"}, {"s": 1203.6, "e": 1208.16, "t": "processes, but some is still due to Midgley's invention."}, {"s": 1211.2, "e": 1214.08, "t": "After Midgley's success with Ethyl, he was put in charge of"}, {"s": 1214.08, "e": 1217.92, "t": "another engineering project. GM wasn't just making cars but"}, {"s": 1217.92, "e": 1222.16, "t": "also household appliances and fridges had a problem. The two"}, {"s": 1222.16, "e": 1224.96, "t": "most common gases used as refrigerants were methyl"}, {"s": 1224.96, "e": 1229.28, "t": "formate and sulfur dioxide. One is highly toxic, the other"}, {"s": 1229.28, "e": 1233.28, "t": "is flammable. Midgley was tasked with creating a safer"}, {"s": 1233.28, "e": 1237.0, "t": "alternative and in 1928, he developed a non toxic and non"}, {"s": 1237.0, "e": 1241.76, "t": "flammable refrigerant dichlorodifluoromethane, GM"}, {"s": 1241.76, "e": 1245.12, "t": "called this new product Freon and to demonstrate Freon's"}, {"s": 1245.12, "e": 1247.68, "t": "safety, during the unveiling at the American Chemical"}, {"s": 1247.68, "e": 1251.92, "t": "Society, Midgley inhaled a lung full of this gas and blew"}, {"s": 1251.92, "e": 1257.04, "t": "out a candle. In the following decades CFCs like Freon became"}, {"s": 1257.04, "e": 1261.36, "t": "very popular and were used as solvents and aerosols. The"}, {"s": 1261.36, "e": 1265.92, "t": "problem is CFCs are light and stable. When released into the"}, {"s": 1265.92, "e": 1269.84, "t": "atmosphere, they climb up into the stratosphere where they"}, {"s": 1269.84, "e": 1274.32, "t": "can remain for 50 to 100 years. But if a CFC molecule"}, {"s": 1274.32, "e": 1276.72, "t": "is hit by an ultraviolet photon of just the right"}, {"s": 1276.72, "e": 1280.96, "t": "energy, it breaks apart, releasing a chlorine atom and"}, {"s": 1280.96, "e": 1284.64, "t": "this chlorine atom can then react with ozone, breaking it"}, {"s": 1284.64, "e": 1289.28, "t": "apart into chlorine monoxide and oxygen gas. The results"}, {"s": 1289.28, "e": 1292.08, "t": "was another environmental disaster: the hole in the"}, {"s": 1292.08, "e": 1295.76, "t": "ozone layer. With less ozone more UV light penetrates the"}, {"s": 1295.76, "e": 1298.4, "t": "atmosphere increasing the rates of skin cancer and"}, {"s": 1298.4, "e": 1303.04, "t": "cataracts. Plus CFCs are potent greenhouse gases per"}, {"s": 1303.04, "e": 1307.44, "t": "kilogram they produce 10,000 times more warming than CO2."}, {"s": 1307.44, "e": 1310.48, "t": "The historian John McNeil wrote that Midgley had more"}, {"s": 1310.48, "e": 1314.08, "t": "impact on the atmosphere than any other single organism in"}, {"s": 1314.08, "e": 1318.08, "t": "Earth's history. An agreement to phase out CFCs the Montreal"}, {"s": 1318.08, "e": 1322.24, "t": "Protocol went into effect in 1989. And the ozone layer is"}, {"s": 1322.24, "e": 1325.04, "t": "now showing signs of recovery, although it will take many"}, {"s": 1325.04, "e": 1327.2, "t": "more decades to fully recover."}, {"s": 1328.08, "e": 1330.48, "t": "In 1940, at the age of 51,"}, {"s": 1330.48, "e": 1334.16, "t": "Midgley contracted polio and became physically disabled, so"}, {"s": 1334.16, "e": 1337.36, "t": "to help him get up, he devised a mechanical bed controlled by"}, {"s": 1337.36, "e": 1342.0, "t": "a series of ropes and pulleys. On November 2 1944, while"}, {"s": 1342.0, "e": 1345.52, "t": "using the contraption, he became tangled in the ropes"}, {"s": 1345.52, "e": 1347.36, "t": "and died of strangulation."}, {"s": 1350.0, "e": 1352.96, "t": "Thanks to the work of Clair Patterson, it became clear"}, {"s": 1352.96, "e": 1355.6, "t": "that the lead in our environment is not natural."}, {"s": 1356.16, "e": 1359.04, "t": "Burning lead and combustion engines spread the toxic"}, {"s": 1359.04, "e": 1363.52, "t": "elements across the planet. Into the air, oceans, the snow"}, {"s": 1363.52, "e": 1368.32, "t": "at the South Pole and even our bones. Japan was the first to"}, {"s": 1368.32, "e": 1372.24, "t": "ban leaded fuel and cars in 1986. But other countries soon"}, {"s": 1372.24, "e": 1378.48, "t": "followed suit. Algeria was the last to do so in 2021. The UN"}, {"s": 1378.48, "e": 1381.04, "t": "calculates that the elimination of lead from gas"}, {"s": 1381.04, "e": 1386.24, "t": "saves over a million lives per year, and $2.45 trillion"}, {"s": 1386.24, "e": 1387.84, "t": "dollars."}, {"s": 1388.64, "e": 1392.88, "t": "But leaded gas is still used, by the way in piston driven"}, {"s": 1392.88, "e": 1395.84, "t": "airplane engines. That's now the largest source of lead"}, {"s": 1395.84, "e": 1397.84, "t": "emissions into the air in the US."}, {"s": 1398.96, "e": 1403.68, "t": "You will observe with concern how long a useful truth may be known and exist"}, {"s": 1403.68, "e": 1415.92, "t": "before it is generally received and practiced on."}, {"s": 1415.92, "e": 1418.56, "t": "When I first learned about Thomas Midgley and Clair"}, {"s": 1418.56, "e": 1422.48, "t": "Patterson, I was amazed by how much harm or how much good a"}, {"s": 1422.48, "e": 1425.28, "t": "single person could do to the environment. Which brings me"}, {"s": 1425.28, "e": 1428.32, "t": "to the sponsor of this video Wren, an organization that's"}, {"s": 1428.32, "e": 1431.28, "t": "taking action on climate change. I think it's important"}, {"s": 1431.28, "e": 1434.0, "t": "that we tackle the climate crisis both by lobbying for"}, {"s": 1434.0, "e": 1437.28, "t": "systemic change. And by making more environmentally friendly"}, {"s": 1437.28, "e": 1440.64, "t": "choices ourselves. On Wren's website, you can calculate how"}, {"s": 1440.64, "e": 1443.76, "t": "much carbon you emit and which activities have the greatest"}, {"s": 1443.76, "e": 1446.96, "t": "impact. And if you like you can offset your emissions"}, {"s": 1446.96, "e": 1449.68, "t": "through a monthly subscription. The funds raised"}, {"s": 1449.68, "e": 1452.0, "t": "go to support a variety of projects that reduce"}, {"s": 1452.0, "e": 1454.96, "t": "greenhouse gases in the atmosphere. One project I"}, {"s": 1454.96, "e": 1457.92, "t": "particularly like involves collecting up flammable dead"}, {"s": 1457.92, "e": 1462.16, "t": "wood from California forests. This helps prevent wildfires."}, {"s": 1462.16, "e": 1465.52, "t": "Plus the collected wood is converted into biochar, a"}, {"s": 1465.52, "e": 1469.04, "t": "material that locks up the carbon inside for 1000s of"}, {"s": 1469.04, "e": 1472.08, "t": "years. Once you sign up to offset your carbon footprint,"}, {"s": 1472.08, "e": 1475.36, "t": "you'll receive monthly updates from the projects you support."}, {"s": 1475.36, "e": 1478.64, "t": "It's completely transparent with photos and details of"}, {"s": 1478.64, "e": 1482.4, "t": "every tree planted every acre reforested every tonne of"}, {"s": 1482.4, "e": 1485.36, "t": "carbon offset, and for the first 100 People who sign up"}, {"s": 1485.36, "e": 1488.24, "t": "using the link in the description. I will personally"}, {"s": 1488.24, "e": 1491.28, "t": "pay for the first month of your subscription. So I want"}, {"s": 1491.28, "e": 1494.24, "t": "to thank Wren for supporting Veritasium and I want to"}, {"s": 1494.24, "e": 1496.32, "t": "thank you for watching."}],DUR=1496.32;
let cur=-1,aF=true,cpt=false,play=false,ct=0,lT=null;
const sl=document.getElementById('sl');
const fr=document.createDocumentFragment();
S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='si';d.id='i'+i;d.onclick=()=>jump(i);
  const ts=document.createElement('span');ts.className='st';ts.textContent=fmt(s.s);
  const tx=document.createElement('span');tx.className='sx';tx.textContent=s.t;
  d.appendChild(ts);d.appendChild(tx);fr.appendChild(d);
});
sl.appendChild(fr);
function fmt(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return h>0?[h,m,s].map(x=>String(x).padStart(2,'0')).join(':'):[m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fmtF(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fi(t){let lo=0,hi=S.length-1,r=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(S[mid].s<=t){r=mid;lo=mid+1;}else hi=mid-1;}return r;}
function act(idx){
  if(idx===cur)return;
  if(cur>=0){const e=document.getElementById('i'+cur);if(e)e.classList.remove('act');}
  cur=idx;
  if(idx>=0){const e=document.getElementById('i'+idx);if(e){e.classList.add('act');if(aF)e.scrollIntoView({behavior:'smooth',block:'center'});}
  document.getElementById('npTx').textContent=S[idx].t;document.getElementById('npIx').textContent=(idx+1)+' / '+S.length;}
}
function jump(i){ct=S[i].s;act(i);upd();}
function upd(){const p=(ct/DUR)*100;document.getElementById('pf').style.width=p+'%';document.getElementById('tL').textContent=fmtF(ct);document.getElementById('sTm').textContent=fmtF(ct);document.getElementById('sPct').textContent=Math.round(p)+'%';}
function seek(e){const r=document.getElementById('pb').getBoundingClientRect();ct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*DUR;act(fi(ct));upd();play=true;lT=null;}
function frame(ts){if(play){if(lT!==null){ct+=(ts-lT)/1000;if(ct>DUR){ct=DUR;play=false;}act(fi(ct));upd();}lT=ts;}else lT=null;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();play=!play;if(play)lT=null;}if(e.code==='ArrowRight'){ct=Math.min(DUR,ct+10);act(fi(ct));upd();}if(e.code==='ArrowLeft'){ct=Math.max(0,ct-10);act(fi(ct));upd();}});
function tA(){aF=!aF;document.getElementById('btnA').classList.toggle('on',aF);}
function tC(){cpt=!cpt;document.getElementById('btnC').classList.toggle('on',cpt);document.querySelectorAll('.si').forEach(l=>{l.style.paddingTop=cpt?'4px':'';l.style.paddingBottom=cpt?'4px':'';l.style.marginBottom=cpt?'0':'';});document.querySelectorAll('.sx').forEach(t=>{t.style.fontSize=cpt?'12.5px':'';});}
function doQ(){const q=document.getElementById('q').value.trim();let cnt=0;document.querySelectorAll('.si').forEach((line,i)=>{const tx=line.querySelector('.sx');if(q&&S[i].t.includes(q)){line.classList.add('sm');const ps=S[i].t.split(q);tx.innerHTML='';ps.forEach((p,pi)=>{tx.appendChild(document.createTextNode(p));if(pi<ps.length-1){const mk=document.createElement('mark');mk.textContent=q;tx.appendChild(mk);}});cnt++;}else{line.classList.remove('sm');tx.textContent=S[i].t;}});const row=document.getElementById('sqR');if(q){row.style.display='flex';document.getElementById('sqC').textContent=cnt+' 处';const f=document.querySelector('.sm');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});}else row.style.display='none';}
</script>
</body>
</html>
