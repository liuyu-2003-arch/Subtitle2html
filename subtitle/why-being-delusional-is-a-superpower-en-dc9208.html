const S=[{"s": 0.08, "e": 3.2, "t": "During the COVID lockdown, this headline went viral:"}, {"s": 3.2, "e": 6.34, "t": "\"Nearly half of men say they do most of the homeschooling..."}, {"s": 7.04, "e": 9.04, "t": "...three percent of women agree.\""}, {"s": 9.62, "e": 15.94, "t": "I bring this up not to debate who's right, but because it's a great example of something called egocentric bias:"}, {"s": 16.16, "e": 19.84, "t": "Most people think they do most of the work."}, {"s": 19.84, "e": 23.68, "t": "For example, researchers have asked authors of multi-author papers"}, {"s": 23.68, "e": 26.9, "t": "what percentage of the work they personally did,"}, {"s": 26.9, "e": 29.92, "t": "and when they add up those percentages, the sum is on average"}, {"s": 29.98, "e": 32.08, "t": "140 percent."}, {"s": 32.08, "e": 35.14, "t": "When couples are asked to estimate how much of the housework they do,"}, {"s": 35.14, "e": 38.58, "t": "the combined total is almost always over 100%."}, {"s": 39.28, "e": 44.12, "t": "Now you might think this is because people want to appear more helpful than they actually are,"}, {"s": 44.12, "e": 45.68, "t": "but that's not it."}, {"s": 45.68, "e": 49.84, "t": "When couples are asked what fraction of the fights they start or how much of the mess is theirs,"}, {"s": 50.0, "e": 54.24, "t": "the total is again over a hundred. People think they do more of the work,"}, {"s": 54.4, "e": 57.84, "t": "but they also think they cause more of the problems. So why is this?"}, {"s": 58.48, "e": 62.8, "t": "I think it's simply because you experience and remember vividly all of what you do,"}, {"s": 63.12, "e": 65.26, "t": "but not all of what everyone else does,"}, {"s": 65.26, "e": 69.44, "t": "so naturally you overestimate your own contributions and underestimate others."}, {"s": 70.24, "e": 75.26, "t": "And I think this bias leads us to underestimate the influence of other things on our lives"}, {"s": 75.26, "e": 77.6, "t": "like the role luck plays in our success."}, {"s": 78.08, "e": 79.68, "t": "Take hockey players, for example."}, {"s": 79.84, "e": 82.98, "t": "If you ask a professional hockey player how they managed to reach the NHL,"}, {"s": 83.28, "e": 88.72, "t": "they might mention their hard work, determination, great coaches, their parents willingness to get up at 5 AM, and so on,"}, {"s": 88.96, "e": 94.96, "t": "but they probably won't acknowledge how lucky they were to be born in January. And yet, in many years 40%"}, {"s": 95.36, "e": 100.96, "t": "of hockey players selected into top tier leagues are born in the first quarter of the year, compared to just 10%"}, {"s": 101.2, "e": 107.12, "t": "in the fourth quarter; an early birthday can make you up to four times as likely to be a pro hockey player."}, {"s": 107.52, "e": 113.12, "t": "And the reason for this disparity is presumably because the cutoff date for kids hockey leagues is January 1st."}, {"s": 113.6, "e": 120.38, "t": "Those born in the first part of the year are a little older and so on average bigger and faster than kids in their league born late in the year."}, {"s": 120.8, "e": 124.96, "t": "Now as they grow up, this difference should eventually shrink to nothing, but it doesn't."}, {"s": 125.44, "e": 131.44, "t": "Because the young kids who share the most promise are given more time on the ice and enter more tournaments, where they receive better coaching"}, {"s": 131.52, "e": 135.76, "t": "and improve their skills. And these advantages compound year after year,"}, {"s": 135.84, "e": 140.48, "t": "so by the time you get to the pros, birthdays are heavily skewed towards the start of the year."}, {"s": 140.96, "e": 143.92, "t": "But does any professional hockey player feel thankful for their birthday?"}, {"s": 144.46, "e": 150.8, "t": "Probably not. And we are all like that, largely oblivious to the fortunate events that support our success."}, {"s": 151.28, "e": 155.84, "t": "Probably the most significant bit of luck many of us enjoy is being born into a prosperous country;"}, {"s": 156.4, "e": 161.4, "t": "around half the variance in income received by people around the world is explained by their country of residence"}, {"s": 161.48, "e": 163.44, "t": "and that country's income distribution."}, {"s": 163.68, "e": 170.08, "t": "If you were born in Burundi, for example, which has the world's lowest gross national income per capita of just 730 dollars a year,"}, {"s": 170.08, "e": 174.56, "t": "it doesn't matter how smart or hard-working you are; you're unlikely to earn much as an adult."}, {"s": 175.3, "e": 179.48, "t": "Now many people get offended if you point out how big a role chance plays in their success"}, {"s": 179.68, "e": 182.18, "t": "and I get it. If we are just a product of our circumstances,"}, {"s": 182.72, "e": 186.0, "t": "then our hard work and our talent seem to count for nothing."}, {"s": 186.48, "e": 192.56, "t": "People think it has to be either skill or luck that explains success, but the truth is you need both."}, {"s": 193.2, "e": 197.84, "t": "Take these eight track and field world records: all the athletes who achieve these records are obviously"}, {"s": 198.08, "e": 205.14, "t": "world class, extremely dedicated, and talented and yet, when they achieved their world records, seven out of eight had a tailwind."}, {"s": 205.52, "e": 211.5, "t": "Now these athletes all had the ability to win a gold medal, but to set the world record required a bit of luck as well."}, {"s": 211.98, "e": 217.12, "t": "The importance of luck increases the greater the number of applicants applying for just a few spaces."}, {"s": 217.68, "e": 220.1, "t": "Consider the most recent class of NASA astronauts."}, {"s": 220.64, "e": 224.52, "t": "From over 18,300 applicants in 2017,"}, {"s": 224.96, "e": 229.9, "t": "only 11 were selected and went on to graduate from the astronaut training program."}, {"s": 229.9, "e": 232.78, "t": "Now we can make a toy model of the selection process."}, {"s": 233.28, "e": 236.74, "t": "Let's assume that astronauts are selected mostly based on skill,"}, {"s": 236.74, "e": 242.92, "t": "experience, and hard work, but also say five percent as a result of luck — fortunate circumstances."}, {"s": 243.36, "e": 247.18, "t": "For each applicant, I randomly generated a skill score out of a hundred,"}, {"s": 247.18, "e": 250.68, "t": "and I also randomly generated a luck score out of a hundred."}, {"s": 250.96, "e": 256.72, "t": "Then I added those numbers together, weighted in the 95-to-5 ratio to get an overall score."}, {"s": 257.44, "e": 264.16, "t": "This score represents the selector's judgments, meaning the top 11 by this metric would become astronauts."}, {"s": 264.64, "e": 270.32, "t": "And I repeated this simulation a thousand times representing a thousand different astronaut selections."}, {"s": 270.8, "e": 278.0, "t": "And what I found was the astronauts who were picked were very lucky; they had an average luck score of 94.7."}, {"s": 278.56, "e": 283.76, "t": "So how many of the selected astronauts would have been in the top 11 based on skill alone?"}, {"s": 284.4, "e": 287.48, "t": "The answer was, on average, only 1.6."}, {"s": 288.24, "e": 296.02, "t": "That means, even with luck accounting for just 5% of the outcome, 9 or maybe 10 of the 11 applicants selected"}, {"s": 296.24, "e": 299.44, "t": "would have been different if luck played no role at all."}, {"s": 300.56, "e": 306.54, "t": "When competition is fierce, being talented and hard-working is important, but it's not enough to guarantee success."}, {"s": 306.54, "e": 308.76, "t": "You also need to catch a break."}, {"s": 309.2, "e": 313.72, "t": "Largely, I think we're unaware of our good luck because, by definition, it's not something we did."}, {"s": 314.12, "e": 317.8, "t": "Like the housework done by your significant other, it goes unappreciated."}, {"s": 318.4, "e": 319.76, "t": "And here's the crazy thing:"}, {"s": 319.76, "e": 325.5, "t": "Downplaying the importance of chance events may actually improve your probability of success because"}, {"s": 325.84, "e": 331.92, "t": "if you perceive an outcome to be uncertain, you're less likely to invest effort in it, which further decreases your chances of success."}, {"s": 332.48, "e": 337.06, "t": "So, it's a useful delusion to believe you are in full control of your destiny."}, {"s": 337.36, "e": 343.1, "t": "I mean, if I had known how bad I was when I started YouTube or how much work it would take, I might have given up right then."}, {"s": 343.42, "e": 344.94, "t": "\"Welcome to Veritasium:"}, {"s": 345.36, "e": 347.42, "t": "an online science video blog.\""}, {"s": 347.62, "e": 350.72, "t": "Now there may be another benefit to overlooking your lucky breaks,"}, {"s": 350.8, "e": 354.4, "t": "which is it makes it easier to justify your place in society:"}, {"s": 354.64, "e": 359.76, "t": "if you have a lot of wealth or power, you can just chalk it up to your own intelligence, effort, and perseverance."}, {"s": 360.16, "e": 362.92, "t": "It makes it easier to accept inequality."}, {"s": 363.2, "e": 369.12, "t": "In one experiment, participants were put in groups of three in small rooms to discuss a complex moral problem,"}, {"s": 369.44, "e": 372.56, "t": "and one person in each group was randomly designated the team leader."}, {"s": 373.36, "e": 377.04, "t": "Half an hour later, the experimenter came by with four cookies for each team."}, {"s": 377.52, "e": 383.68, "t": "So who got the extra cookie? In each case, it went to the team leader. Even though they had no special aptitude,"}, {"s": 383.76, "e": 387.84, "t": "they didn't have extra responsibilities and they'd gotten their position through chance alone."}, {"s": 388.4, "e": 390.4, "t": "Once you have achieved a certain status,"}, {"s": 390.4, "e": 394.94, "t": "it seems natural to feel like you deserve it and all the other good things that come your way."}, {"s": 395.28, "e": 396.64, "t": "Now this is just an anecdote,"}, {"s": 396.64, "e": 403.12, "t": "but whenever I've been upgraded to fly a business class, I've always observed the worst behavior in my fellow privileged passengers;"}, {"s": 403.12, "e": 408.72, "t": "they just act so entitled and uncourteous. And research has found evidence for this as well."}, {"s": 409.28, "e": 413.6, "t": "In another experiment, participants were asked to think of a good thing that happened to them recently,"}, {"s": 413.92, "e": 418.56, "t": "and then one group was asked to list their own personal qualities or actions that made that good thing happen,"}, {"s": 418.88, "e": 423.02, "t": "another group was asked to list external factors beyond their control that led to the event,"}, {"s": 423.34, "e": 426.72, "t": "and a control group was simply asked to list reasons why the good thing happened."}, {"s": 426.96, "e": 430.4, "t": "Now for completing this task, participants were told they would be paid a dollar,"}, {"s": 430.56, "e": 435.2, "t": "but at the end they were offered the option to donate some or all of the money to a charity."}, {"s": 435.6, "e": 440.92, "t": "Results showed those who listed their own personal attributes contributed 25% less"}, {"s": 441.08, "e": 443.84, "t": "than those who listed external factors beyond their control."}, {"s": 444.48, "e": 447.44, "t": "Now think of what all this means for people in our society,"}, {"s": 447.44, "e": 451.3, "t": "specifically for people in positions of power like business leaders and politicians."}, {"s": 451.6, "e": 454.88, "t": "Now undoubtedly most of them are talented and hard-working,"}, {"s": 455.04, "e": 461.2, "t": "but they have also been luckier than most, and like most of us, they don't realize just how lucky they are."}, {"s": 461.6, "e": 463.84, "t": "And this gives them a distorted view of reality."}, {"s": 464.56, "e": 470.52, "t": "They're kind of living in a form of survivor bias: all these leaders have worked hard and ultimately succeeded,"}, {"s": 470.56, "e": 472.8, "t": "so to them the world appears fair."}, {"s": 473.06, "e": 475.42, "t": "In their experience, it rewards hard work,"}, {"s": 475.42, "e": 479.7, "t": "but what they don't have is the experience of all the people who have worked hard and failed."}, {"s": 480.24, "e": 483.2, "t": "So what are they to make of people less successful than themselves?"}, {"s": 483.28, "e": 487.7, "t": "Well, the natural conclusion is that they must just be less talented or less hard-working,"}, {"s": 488.08, "e": 491.98, "t": "and this perspective makes them less inclined to be generous — to give back."}, {"s": 492.16, "e": 495.28, "t": "And they are the ones who set the rules for how society operates."}, {"s": 495.84, "e": 501.84, "t": "And this is particularly unfortunate since one of the main ways many of us are lucky is in our country of residence."}, {"s": 502.08, "e": 506.12, "t": "But what is a country except for the things put there by people who came before?"}, {"s": 506.12, "e": 511.36, "t": "The roads and the schools, public transport, emergency services, clean air and water, everything like that."}, {"s": 512.08, "e": 520.3, "t": "It seems a cruel trick of our psychology that successful people without any malice will credit their success largely to their own hard work and ingenuity,"}, {"s": 520.48, "e": 523.1, "t": "and therefore contribute less to maintaining the very"}, {"s": 523.2, "e": 526.16, "t": "circumstances that made that success possible in the first place."}, {"s": 527.0, "e": 532.7, "t": "The good news is that acknowledging our fortunate circumstances not only brings us more in line with reality,"}, {"s": 532.7, "e": 534.36, "t": "it also makes us more likeable."}, {"s": 534.72, "e": 539.9, "t": "In a study where people had to read the transcript of a fictional 60-minutes interview with a biotech entrepreneur,"}, {"s": 540.3, "e": 545.84, "t": "experimenters tried changing just the last paragraph where the interviewee is talking about the reasons for their company's success."}, {"s": 546.48, "e": 550.42, "t": "In one version, the entrepreneur personally takes credit for the success they've had,"}, {"s": 550.74, "e": 553.96, "t": "but in the other, he says luck played a significant role."}, {"s": 554.24, "e": 558.16, "t": "Now people who read the luck version of the transcript judged the entrepreneur as kinder,"}, {"s": 558.32, "e": 563.1, "t": "and thought they'd be more likely to be close friends with him than those who read the other version of the transcript."}, {"s": 563.52, "e": 569.92, "t": "And raising our awareness of fortunate events can also make us happier because it allows us to feel gratitude."}, {"s": 570.48, "e": 573.26, "t": "Personally, I am grateful to Michael Stevens of Vsauce,"}, {"s": 573.26, "e": 577.58, "t": "who on October 7th, 2012, posted the video: \"How Much Does a Shadow Weigh?\","}, {"s": 577.84, "e": 580.26, "t": "which shouts out my slow-motion slinky drop video,"}, {"s": 580.26, "e": 583.88, "t": "and within three days my subscribers had increased by a third, and within a month,"}, {"s": 584.24, "e": 588.56, "t": "they had doubled, leading me to quit my part-time job and work exclusively on YouTube videos."}, {"s": 588.88, "e": 590.96, "t": "And I'm grateful to the writer of the free newspaper"}, {"s": 590.96, "e": 594.14, "t": "they give out on the trains in Sydney who didn't quite understand electricity,"}, {"s": 594.32, "e": 598.96, "t": "leading me to post this picture of their article to my Instagram with the caption: \"What's wrong with this picture?\""}, {"s": 599.2, "e": 604.6, "t": "And I'm lucky that the first person to answer correctly was a beautiful woman who became my future wife."}, {"s": 605.28, "e": 606.24, "t": "Yep!"}, {"s": 606.24, "e": 608.24, "t": "That is how I met your mother."}, {"s": 608.4, "e": 615.36, "t": "Now initially, I wanted to make this video just to say our circumstances and psychology conspire to make us oblivious to our own luck."}, {"s": 615.68, "e": 618.18, "t": "This leads successful people to view the world as fair,"}, {"s": 618.18, "e": 622.02, "t": "and those less successful than them as less talented or less hard-working."}, {"s": 622.32, "e": 625.54, "t": "And this is before you factor in any discrimination or prejudice."}, {"s": 626.16, "e": 631.7, "t": "But, it also became apparent to me that I should talk about what to do if you want to be successful in such a world,"}, {"s": 631.84, "e": 634.52, "t": "and I think the best advice is paradoxical."}, {"s": 634.96, "e": 639.18, "t": "First, you must believe that you are in complete control of your destiny,"}, {"s": 639.18, "e": 643.0, "t": "and that your success comes down only to your own talent and hard work."}, {"s": 643.36, "e": 648.32, "t": "But second, you've got to know that's not true for you or anyone else."}, {"s": 648.48, "e": 654.36, "t": "So you have to remember: if you do achieve success that luck played a significant role and given your good fortune,"}, {"s": 654.56, "e": 657.86, "t": "you should do what you can to increase the luck of others."}, {"s": 661.2, "e": 667.12, "t": "Hey, so I had an idea for what I could do to increase the luck of others and that is to give away a hundred"}, {"s": 667.28, "e": 669.6, "t": "snatoms kits to people who couldn't otherwise afford them."}, {"s": 670.0, "e": 674.32, "t": "So, if you didn't know snatoms is a product that I invented and kick-started five years ago."}, {"s": 674.64, "e": 679.46, "t": "It's a molecular modeling kit where all the atoms snap together magnetically."}, {"s": 680.4, "e": 684.88, "t": "Now, I made it because I really wanted to tackle the misconception that bonds store energy."}, {"s": 685.12, "e": 689.52, "t": "They don't. It takes energy to break them, and you can feel that with snatoms."}, {"s": 690.16, "e": 695.08, "t": "Recently, I completely retooled snatums. So there are small holes where the magnets are"}, {"s": 695.2, "e": 703.36, "t": "This allows them to touch directly, increasing the bonding strength, so you can form bigger more stable molecules. I call these \"snatomsX\"."}, {"s": 703.6, "e": 707.96, "t": "And yes, they are backwards compatible with original snatoms. So, here's my idea:"}, {"s": 708.14, "e": 711.74, "t": "for the next month you can buy snatoms for 10% off using the code \"giveluck\""}, {"s": 712.0, "e": 716.56, "t": "and for each one sold, I will give a kit to someone who can't afford one, up to a limit of a hundred."}, {"s": 716.78, "e": 720.08, "t": "So, I'll put links and more details in the description, and I really want to thank you"}, {"s": 720.4, "e": 723.6, "t": "for watching, and thank you for all my good luck."}],DUR=723.6;
let cur=-1,aF=true,cpt=false,play=false,ct=0,lT=null;
const sl=document.getElementById('sl');
const fr=document.createDocumentFragment();
S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='si';d.id='i'+i;d.onclick=()=>jump(i);
  const ts=document.createElement('span');ts.className='st';ts.textContent=fmt(s.s);
  const tx=document.createElement('span');tx.className='sx';tx.textContent=s.t;
  d.appendChild(ts);d.appendChild(tx);fr.appendChild(d);
});
sl.appendChild(fr);
function fmt(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return h>0?[h,m,s].map(x=>String(x).padStart(2,'0')).join(':'):[m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fmtF(v){const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');}
function fi(t){let lo=0,hi=S.length-1,r=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(S[mid].s<=t){r=mid;lo=mid+1;}else hi=mid-1;}return r;}
function act(idx){
  if(idx===cur)return;
  if(cur>=0){const e=document.getElementById('i'+cur);if(e)e.classList.remove('act');}
  cur=idx;
  if(idx>=0){const e=document.getElementById('i'+idx);if(e){e.classList.add('act');if(aF)e.scrollIntoView({behavior:'smooth',block:'center'});}
  document.getElementById('npTx').textContent=S[idx].t;document.getElementById('npIx').textContent=(idx+1)+' / '+S.length;}
}
function jump(i){ct=S[i].s;act(i);upd();}
function upd(){const p=(ct/DUR)*100;document.getElementById('pf').style.width=p+'%';document.getElementById('tL').textContent=fmtF(ct);document.getElementById('sTm').textContent=fmtF(ct);document.getElementById('sPct').textContent=Math.round(p)+'%';}
function seek(e){const r=document.getElementById('pb').getBoundingClientRect();ct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*DUR;act(fi(ct));upd();play=true;lT=null;}
function frame(ts){if(play){if(lT!==null){ct+=(ts-lT)/1000;if(ct>DUR){ct=DUR;play=false;}act(fi(ct));upd();}lT=ts;}else lT=null;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();play=!play;if(play)lT=null;}if(e.code==='ArrowRight'){ct=Math.min(DUR,ct+10);act(fi(ct));upd();}if(e.code==='ArrowLeft'){ct=Math.max(0,ct-10);act(fi(ct));upd();}});
function tA(){aF=!aF;document.getElementById('btnA').classList.toggle('on',aF);}
function tC(){cpt=!cpt;document.getElementById('btnC').classList.toggle('on',cpt);document.querySelectorAll('.si').forEach(l=>{l.style.paddingTop=cpt?'4px':'';l.style.paddingBottom=cpt?'4px':'';l.style.marginBottom=cpt?'0':'';});document.querySelectorAll('.sx').forEach(t=>{t.style.fontSize=cpt?'12.5px':'';});}
function doQ(){const q=document.getElementById('q').value.trim();let cnt=0;document.querySelectorAll('.si').forEach((line,i)=>{const tx=line.querySelector('.sx');if(q&&S[i].t.includes(q)){line.classList.add('sm');const ps=S[i].t.split(q);tx.innerHTML='';ps.forEach((p,pi)=>{tx.appendChild(document.createTextNode(p));if(pi<ps.length-1){const mk=document.createElement('mark');mk.textContent=q;tx.appendChild(mk);}});cnt++;}else{line.classList.remove('sm');tx.textContent=S[i].t;}});const row=document.getElementById('sqR');if(q){row.style.display='flex';document.getElementById('sqC').textContent=cnt+' 处';const f=document.querySelector('.sm');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});}else row.style.display='none';}
</script>
</body>
</html>
