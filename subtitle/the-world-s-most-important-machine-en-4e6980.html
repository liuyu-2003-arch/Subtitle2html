 "t": "oxygen comes in and our problem is solved."}, {"s": 2422.8, "e": 2424.87, "t": "Couldn't we think of a way to add"}, {"s": 2424.87, "e": 2427.3, "t": "just a little oxygen to our system"}, {"s": 2427.3, "e": 2431.29, "t": "and make sure that the collector stays clean longer?\""}, {"s": 2431.29, "e": 2433.78, "t": "And so they started experimenting"}, {"s": 2433.78, "e": 2436.35, "t": "with the amount of oxygen that was needed"}, {"s": 2436.35, "e": 2439.09, "t": "in the vacuum and then finally got to this point,"}, {"s": 2439.09, "e": 2441.01, "t": "okay, if we add so much oxygen,"}, {"s": 2441.01, "e": 2443.53, "t": "we'll keep the collector clean for longer."}, {"s": 2443.53, "e": 2445.57, "t": "- With this fix, ASML's machine could run"}, {"s": 2445.57, "e": 2448.96, "t": "continuously for much longer and it finally became"}, {"s": 2448.96, "e": 2450.64, "t": "commercially viable."}, {"s": 2450.64, "e": 2453.16, "t": "By 2016, orders started pouring in"}, {"s": 2453.16, "e": 2455.77, "t": "and now all of the most advanced chips need"}, {"s": 2455.77, "e": 2456.91, "t": "ASML's machine,"}, {"s": 2456.91, "e": 2459.19, "t": "making them perhaps the most important"}, {"s": 2459.19, "e": 2461.14, "t": "tech company in the world."}, {"s": 2461.14, "e": 2463.12, "t": "ASML's first commercial machines had"}, {"s": 2463.12, "e": 2465.37, "t": "a numerical aperture of 0.33"}, {"s": 2465.37, "e": 2468.01, "t": "and could print 13 nanometer lines."}, {"s": 2468.01, "e": 2470.14, "t": "These are called the low NA machines"}, {"s": 2470.14, "e": 2471.88, "t": "and ASML still makes them."}, {"s": 2471.88, "e": 2474.34, "t": "But the machine that Jan's team started working on"}, {"s": 2474.34, "e": 2477.28, "t": "back in 2012 was the next generation,"}, {"s": 2477.28, "e": 2479.05, "t": "which had a larger optic system"}, {"s": 2479.05, "e": 2481.24, "t": "so they could print even smaller features."}, {"s": 2481.24, "e": 2483.34, "t": "This is the high NA machine"}, {"s": 2483.34, "e": 2486.34, "t": "with a numerical aperture of 0.55,"}, {"s": 2486.34, "e": 2489.49, "t": "and we get to see their latest version up close."}, {"s": 2490.57, "e": 2492.16, "t": "- How much is the machine?"}, {"s": 2492.16, "e": 2496.0, "t": "- We always say north of 350 million euros."}, {"s": 2496.0, "e": 2497.41, "t": "- And you can actually buy it, right?"}, {"s": 2497.41, "e": 2498.49, "t": "- You can if you want, yeah."}, {"s": 2498.49, "e": 2500.26, "t": "- If I had the money I could buy it?"}, {"s": 2500.26, "e": 2501.22, "t": "- Yes, you could."}, {"s": 2502.09, "e": 2503.59, "t": "- How many people have seen this before?"}, {"s": 2503.59, "e": 2506.02, "t": "- We really limit the amount of people"}, {"s": 2506.02, "e": 2507.82, "t": "that get to go inside the clean room."}, {"s": 2507.82, "e": 2509.29, "t": "- [Casper] ASML's machines are built"}, {"s": 2509.29, "e": 2511.0, "t": "in a super strict clean room."}, {"s": 2511.0, "e": 2513.91, "t": "In any cubic meter, there can be no more than 10 particles,"}, {"s": 2513.91, "e": 2515.86, "t": "only 0.1 microns large,"}, {"s": 2515.86, "e": 2517.57, "t": "and nothing bigger than that."}, {"s": 2517.57, "e": 2519.64, "t": "A spec of pollen is around 20 microns"}, {"s": 2519.64, "e": 2522.7, "t": "and extremely fine sand is around 10 microns."}, {"s": 2522.7, "e": 2524.44, "t": "To put all of this in perspective,"}, {"s": 2524.44, "e": 2525.73, "t": "hospital operating rooms,"}, {"s": 2525.73, "e": 2527.56, "t": "which have to be extremely clean,"}, {"s": 2527.56, "e": 2531.04, "t": "only allow a maximum of 10,000 particles per cubic meter"}, {"s": 2531.04, "e": 2533.83, "t": "that are 0.1 microns wide."}, {"s": 2533.83, "e": 2536.45, "t": "It's so unfair how much better Marc looks, though"}, {"s": 2537.43, "e": 2538.42, "t": "in his light suit."}, {"s": 2538.42, "e": 2539.77, "t": "I feel like a little Smurf."}, {"s": 2541.1, "e": 2544.69, "t": "- Okay, so we're gonna go through the air showers,"}, {"s": 2544.69, "e": 2546.7, "t": "so you're gonna have to do as I do."}, {"s": 2546.7, "e": 2547.72, "t": "- [Casper] Okay."}, {"s": 2547.72, "e": 2550.14, "t": "So this is brushing down all the particles"}, {"s": 2550.14, "e": 2550.97, "t": "that are still on us."}, {"s": 2550.97, "e": 2552.43, "t": "- [Marc] Yes, so this is like super clean air"}, {"s": 2552.43, "e": 2553.54, "t": "blowing us clean."}, {"s": 2554.92, "e": 2556.18, "t": "- [Casper] This place is huge."}, {"s": 2556.18, "e": 2558.22, "t": "- [Marc] It's huge. - [Casper] It's insane."}, {"s": 2558.22, "e": 2560.74, "t": "I've been in a clean room a couple times before,"}, {"s": 2560.74, "e": 2562.54, "t": "but it's nothing compared to this."}, {"s": 2562.54, "e": 2564.46, "t": "Are there any secret areas here"}, {"s": 2564.46, "e": 2566.16, "t": "where almost no one has access to?"}, {"s": 2567.49, "e": 2568.8, "t": "- [Marc] I can't tell you."}, {"s": 2568.8, "e": 2569.86, "t": "(Casper laughs)"}, {"s": 2569.86, "e": 2570.7, "t": "- [Casper] Great answer."}, {"s": 2570.7, "e": 2572.47, "t": "- [Marc] Okay, so this is the total system."}, {"s": 2574.98, "e": 2576.29, "t": "- [Casper] This is crazy."}, {"s": 2576.29, "e": 2577.96, "t": "Look how big it is."}, {"s": 2577.96, "e": 2581.17, "t": "This is the most advanced machine humanity's ever built."}, {"s": 2581.17, "e": 2584.89, "t": "It's taken many, many years, decades of development,"}, {"s": 2584.89, "e": 2586.69, "t": "many billions of dollars,"}, {"s": 2586.69, "e": 2589.24, "t": "all to get this humongous beauty."}, {"s": 2590.23, "e": 2592.12, "t": "So this is the first high NA machine."}, {"s": 2592.12, "e": 2592.95, "t": "- [Marc] Yes."}, {"s": 2592.95, "e": 2596.95, "t": "So if you saw pictures on the internet or whatever,"}, {"s": 2596.95, "e": 2597.78, "t": "that's this machine."}, {"s": 2597.78, "e": 2600.49, "t": "So the very first lines ever printed at eight nanometers"}, {"s": 2600.49, "e": 2602.17, "t": "and stuff, that was this machine."}, {"s": 2602.17, "e": 2604.69, "t": "- [Casper] This smoothest object on earth."}, {"s": 2604.69, "e": 2606.67, "t": "- [Marc] Yeah, it's all in here, yeah."}, {"s": 2606.67, "e": 2609.13, "t": "- [Casper] Wait, so let me see if I can figure this out."}, {"s": 2609.13, "e": 2611.98, "t": "This is the light source."}, {"s": 2611.98, "e": 2614.17, "t": "It's where they make the extreme ultraviolet."}, {"s": 2614.17, "e": 2615.0, "t": "- [Marc] Yes."}, {"s": 2616.11, "e": 2617.74, "t": "- [Casper] And then the laser must come in from there."}, {"s": 2617.74, "e": 2619.69, "t": "- [Marc] Yeah, let's take a look at the laser."}, {"s": 2619.69, "e": 2620.71, "t": "- [Casper] In fact, we got to see"}, {"s": 2620.71, "e": 2622.76, "t": "just how the laser and light source work."}, {"s": 2623.74, "e": 2625.45, "t": "I think we're entering the laser system here."}, {"s": 2625.45, "e": 2626.68, "t": "Marc's just making sure I think"}, {"s": 2626.68, "e": 2628.51, "t": "that we can actually film here,"}, {"s": 2628.51, "e": 2630.85, "t": "that we're not catching anything we're not supposed to."}, {"s": 2630.85, "e": 2633.61, "t": "Oh wow, this looks dangerous."}, {"s": 2633.61, "e": 2635.02, "t": "Now the laser system is covered"}, {"s": 2635.02, "e": 2636.55, "t": "by all of these brown cabinets,"}, {"s": 2636.55, "e": 2638.53, "t": "but here is a model version."}, {"s": 2638.53, "e": 2641.38, "t": "A carbon dioxide laser of just a few watts enters"}, {"s": 2641.38, "e": 2643.72, "t": "this amplifier where it bounces around"}, {"s": 2643.72, "e": 2646.66, "t": "until it's roughly five times its original power."}, {"s": 2646.66, "e": 2649.51, "t": "It then goes through a total of four different amplifiers"}, {"s": 2649.51, "e": 2652.78, "t": "to bring the final laser up to 20,000 watts,"}, {"s": 2652.78, "e": 2655.09, "t": "which is four times stronger than lasers that cut"}, {"s": 2655.09, "e": 2656.35, "t": "through steel."}, {"s": 2656.35, "e": 2659.86, "t": "- Over here we have the amplifiers that generates"}, {"s": 2659.86, "e": 2662.05, "t": "this powerful laser beam."}, {"s": 2662.05, "e": 2663.82, "t": "And then it basically comes out"}, {"s": 2663.82, "e": 2666.88, "t": "and this is part of the beam transport system"}, {"s": 2666.88, "e": 2669.19, "t": "where it's brought to the machine."}, {"s": 2669.19, "e": 2671.8, "t": "So this pipe here has the big laser beam."}, {"s": 2671.8, "e": 2674.56, "t": "- And this has a mirror. - [Marc] Yes."}, {"s": 2674.56, "e": 2675.73, "t": "- [Casper] Then the pulses travel"}, {"s": 2675.73, "e": 2677.05, "t": "to the light source module."}, {"s": 2677.05, "e": 2678.7, "t": "It kind of looks like a Transformer"}, {"s": 2678.7, "e": 2681.58, "t": "or like a, I don't know, like a spaceship."}, {"s": 2681.58, "e": 2684.22, "t": "There's so many wires going everywhere."}, {"s": 2684.22, "e": 2685.52, "t": "- [Marc] Don't touch this."}, {"s": 2688.45, "e": 2689.5, "t": "- [Casper] Holy crap."}, {"s": 2690.46, "e": 2691.93, "t": "This is pretty big, huh?"}, {"s": 2691.93, "e": 2693.0, "t": "This is insane."}, {"s": 2693.0, "e": 2694.2, "t": "- [Marc] And this is just the light source."}, {"s": 2694.2, "e": 2695.04, "t": "- [Casper] This is just a light source."}, {"s": 2695.04, "e": 2696.85, "t": "Are you getting this comparison shot?"}, {"s": 2696.85, "e": 2700.18, "t": "- [Marc] And so you need all of this just to make EUV light."}, {"s": 2700.18, "e": 2702.43, "t": "- [Casper] Just to make the light, that's incredible."}, {"s": 2702.43, "e": 2703.97, "t": "Can we do a little walk around?"}, {"s": 2703.97, "e": 2704.82, "t": "- [Marc] We can do a little walk."}, {"s": 2706.45, "e": 2707.65, "t": "- Let's go."}, {"s": 2707.65, "e": 2710.77, "t": "- So basically, this is the heart of the source."}, {"s": 2710.77, "e": 2712.32, "t": "- [Casper] Can I stand on here?"}, {"s": 2713.2, "e": 2715.75, "t": "- [Marc] If you are below 137, you can."}, {"s": 2715.75, "e": 2717.4, "t": "- [Casper] I don't, I think I am."}, {"s": 2721.27, "e": 2722.1, "t": "Woo."}, {"s": 2722.1, "e": 2724.42, "t": "And so the tin droplets are coming in from the left."}, {"s": 2724.42, "e": 2725.47, "t": "- [Marc] Yes."}, {"s": 2725.47, "e": 2727.93, "t": "- [Casper] Then we're shooting the laser from here."}, {"s": 2727.93, "e": 2729.25, "t": "- [Marc] Yeah."}, {"s": 2729.25, "e": 2730.75, "t": "- [Casper] Okay, it explodes."}, {"s": 2730.75, "e": 2731.65, "t": "- [Marc] And then the light."}, {"s": 2731.65, "e": 2733.45, "t": "- [Casper] The light goes out there."}, {"s": 2734.62, "e": 2737.26, "t": "One improvement from ASML's first EUV machine"}, {"s": 2737.26, "e": 2738.67, "t": "to their newest one is"}, {"s": 2738.67, "e": 2741.46, "t": "the number of pulses that hit the droplet."}, {"s": 2741.46, "e": 2743.89, "t": "The first pre-pulse still flattens the droplet"}, {"s": 2743.89, "e": 2745.09, "t": "into a pancake,"}, {"s": 2745.09, "e": 2747.43, "t": "but now there's also a second pre-pulse"}, {"s": 2747.43, "e": 2749.02, "t": "that further reduces the density."}, {"s": 2749.02, "e": 2751.9, "t": "It basically turns it into a low density gas,"}, {"s": 2751.9, "e": 2753.64, "t": "it rarifies it."}, {"s": 2753.64, "e": 2757.21, "t": "And then the final pulse essentially ionizes all of it."}, {"s": 2757.21, "e": 2760.57, "t": "So for basically the same power coming from the drive laser,"}, {"s": 2760.57, "e": 2763.03, "t": "they get even more EUV light."}, {"s": 2763.03, "e": 2764.53, "t": "Now if they want even more light,"}, {"s": 2764.53, "e": 2765.76, "t": "then the only way to do that is"}, {"s": 2765.76, "e": 2767.29, "t": "by hitting more droplets."}, {"s": 2767.29, "e": 2769.3, "t": "And that's exactly what they did."}, {"s": 2769.3, "e": 2771.76, "t": "- Our most recent EUV light sources"}, {"s": 2771.76, "e": 2772.81, "t": "that we're shipping right now,"}, {"s": 2772.81, "e": 2775.33, "t": "which are around the 500 watt level,"}, {"s": 2775.33, "e": 2778.48, "t": "we increased the rep rate up to 60,000 times per second."}, {"s": 2778.48, "e": 2780.46, "t": "And then we have a roadmap that's gonna go"}, {"s": 2780.46, "e": 2782.92, "t": "to 100,000 droplets per second."}, {"s": 2782.92, "e": 2784.51, "t": "We've actually now already demonstrated"}, {"s": 2784.51, "e": 2786.67, "t": "this 100,000 droplets per second in the lab."}, {"s": 2786.67, "e": 2788.41, "t": "So it's not an if but a when."}, {"s": 2788.41, "e": 2790.03, "t": "- Crazy."}, {"s": 2790.03, "e": 2791.86, "t": "- [Marc] The three pulses that we use to make"}, {"s": 2791.86, "e": 2794.02, "t": "the pancake, to blow up the pancake a little bit"}, {"s": 2794.02, "e": 2796.36, "t": "and then to evaporate the pancake."}, {"s": 2796.36, "e": 2797.6, "t": "- [Casper] Yeah."}, {"s": 2797.6, "e": 2798.43, "t": "- The first two pulses,"}, {"s": 2798.43, "e": 2801.97, "t": "they would be coming in through this pipe here"}, {"s": 2801.97, "e": 2805.18, "t": "and then the main pulse with the big laser,"}, {"s": 2805.18, "e": 2808.0, "t": "the laser beam would be delivered through this pipe here."}, {"s": 2808.0, "e": 2809.71, "t": "- [Casper] Both the high and low NA machine"}, {"s": 2809.71, "e": 2811.81, "t": "shipping out right now use three pulses"}, {"s": 2811.81, "e": 2815.26, "t": "and eventually they will hit more droplets per second."}, {"s": 2815.26, "e": 2817.48, "t": "But the light source is just one small part"}, {"s": 2817.48, "e": 2818.47, "t": "of the full machine."}, {"s": 2818.47, "e": 2820.3, "t": "After bouncing off the collector mirror,"}, {"s": 2820.3, "e": 2822.97, "t": "the EUV light moves to the illuminator."}, {"s": 2822.97, "e": 2825.25, "t": "A set of mirrors shape and focus the light"}, {"s": 2825.25, "e": 2826.87, "t": "before it hits the reticle."}, {"s": 2826.87, "e": 2828.16, "t": "The reticle is the top half"}, {"s": 2828.16, "e": 2830.44, "t": "and this module is built in a separate facility"}, {"s": 2830.44, "e": 2831.88, "t": "and installed later."}, {"s": 2831.88, "e": 2834.76, "t": "Next the light goes into the projection optics box,"}, {"s": 2834.76, "e": 2837.64, "t": "which is a set of mirrors that shrink the light down."}, {"s": 2837.64, "e": 2839.53, "t": "The high NA machine can shrink the pattern"}, {"s": 2839.53, "e": 2841.33, "t": "eight times in the vertical direction"}, {"s": 2841.33, "e": 2844.0, "t": "and four times in the horizontal direction."}, {"s": 2844.0, "e": 2846.49, "t": "The mirrors are also much smoother still."}, {"s": 2846.49, "e": 2848.95, "t": "If the low NA's mirrors were the size of Germany,"}, {"s": 2848.95, "e": 2851.11, "t": "the tallest bump would be about a millimeter."}, {"s": 2851.11, "e": 2853.66, "t": "But if the high NA mirrors were the size of the world,"}, {"s": 2853.66, "e": 2854.74, "t": "the tallest bump would be"}, {"s": 2854.74, "e": 2856.99, "t": "about the thickness of a playing card."}, {"s": 2856.99, "e": 2859.18, "t": "By the combination of both of these improvements,"}, {"s": 2859.18, "e": 2861.55, "t": "ASML was able to increase the numerical aperture"}, {"s": 2861.55, "e": 2865.12, "t": "from 0.33 to 0.55."}, {"s": 2865.12, "e": 2867.76, "t": "And finally, the light hits the wafer."}, {"s": 2867.76, "e": 2871.18, "t": "In order to print around 185 wafers per hour,"}, {"s": 2871.18, "e": 2872.77, "t": "the reticle whips back and forth"}, {"s": 2872.77, "e": 2875.29, "t": "at accelerations of over 20 Gs."}, {"s": 2875.29, "e": 2877.27, "t": "That's over five times the acceleration"}, {"s": 2877.27, "e": 2878.89, "t": "of a Formula 1 car."}, {"s": 2878.89, "e": 2880.84, "t": "And this is some actual footage"}, {"s": 2880.84, "e": 2882.61, "t": "of what that's like inside this machine."}, {"s": 2882.61, "e": 2884.62, "t": "And notice that this is not sped up."}, {"s": 2886.33, "e": 2888.22, "t": "But the crazy thing to me about this machine"}, {"s": 2888.22, "e": 2890.26, "t": "isn't how fast the reticle moves"}, {"s": 2890.26, "e": 2892.84, "t": "or even how small it can print,"}, {"s": 2892.84, "e": 2895.93, "t": "but it's just how insanely accurate it needs to be."}, {"s": 2895.93, "e": 2898.06, "t": "The most any two layers can be off,"}, {"s": 2898.06, "e": 2901.51, "t": "which is called the overlay, is one nanometer."}, {"s": 2901.51, "e": 2904.6, "t": "That's five freaking silicon atoms of precision."}, {"s": 2904.6, "e": 2905.8, "t": "That's insane."}, {"s": 2905.8, "e": 2909.16, "t": "- So typically what we do as system engineers is"}, {"s": 2909.16, "e": 2910.69, "t": "that we make a budget. - [Casper] Yeah."}, {"s": 2910.69, "e": 2913.78, "t": "- So we say, hey, you get, let's say a nanometer"}, {"s": 2913.78, "e": 2918.78, "t": "and we divide then the nanometers"}, {"s": 2919.0, "e": 2920.23, "t": "to smaller fractions. - Right,"}, {"s": 2920.23, "e": 2921.28, "t": "the nanometers total."}, {"s": 2921.28, "e": 2923.47, "t": "It's not like you group gets a nanometer."}, {"s": 2923.47, "e": 2924.79, "t": "- You get a nanometer, you get, no, no."}, {"s": 2924.79, "e": 2928.24, "t": "You get a nanometer in total, yes."}, {"s": 2928.24, "e": 2930.76, "t": "- [Casper] So you have to fight for the,"}, {"s": 2930.76, "e": 2932.77, "t": "for your part of the nanometer."}, {"s": 2932.77, "e": 2933.97, "t": "- It's kind of cool to realize"}, {"s": 2933.97, "e": 2937.33, "t": "that like every smartphone nowadays has a chip"}, {"s": 2937.33, "e": 2938.71, "t": "that is made with the machine"}, {"s": 2938.71, "e": 2941.08, "t": "that was actually put together here."}, {"s": 2941.08, "e": 2942.33, "t": "So that's a cool thought."}, {"s": 2944.29, "e": 2946.21, "t": "- Take a look at this."}, {"s": 2946.21, "e": 2947.41, "t": "- [Marc] It's pretty massive, eh?"}, {"s": 2947.41, "e": 2949.0, "t": "- [Casper] So big."}, {"s": 2949.0, "e": 2950.89, "t": "So do you cover it up?"}, {"s": 2950.89, "e": 2951.72, "t": "- [Marc] Yes."}, {"s": 2951.72, "e": 2955.09, "t": "Had a customer fab, it will be looking like a big white box."}, {"s": 2957.28, "e": 2958.42, "t": "I like it better like this."}, {"s": 2958.42, "e": 2959.62, "t": "- [Casper] Yeah, me too."}, {"s": 2960.97, "e": 2963.52, "t": "It's funny, you need such a big machine,"}, {"s": 2963.52, "e": 2965.74, "t": "so much infrastructure"}, {"s": 2965.74, "e": 2969.64, "t": "to make the tiniest things we can make at scale."}, {"s": 2969.64, "e": 2971.14, "t": "- It's inversely proportional."}, {"s": 2971.14, "e": 2972.79, "t": "- Yeah, smaller you want to go,"}, {"s": 2972.79, "e": 2974.79, "t": "the larger everything around it becomes."}, {"s": 2975.7, "e": 2978.16, "t": "After the machines are assembled, tested and approved,"}, {"s": 2978.16, "e": 2981.08, "t": "they are disassembled to ship all around the world."}, {"s": 2981.08, "e": 2984.28, "t": "5,000 companies supply 100,000 parts,"}, {"s": 2984.28, "e": 2986.71, "t": "3000 cables, 40,000 bolts"}, {"s": 2986.71, "e": 2988.99, "t": "and two kilometers of hosing."}, {"s": 2988.99, "e": 2992.02, "t": "ASML ships their high NA machine in 250 containers"}, {"s": 2992.02, "e": 2993.76, "t": "spread out over 25 trucks"}, {"s": 2993.76, "e": 2995.95, "t": "and seven Boeing 747s."}, {"s": 2997.54, "e": 2999.4, "t": "Despite all the doubt and setback,"}, {"s": 2999.4, "e": 3001.89, "t": "EUV finally made it to manufacturing level"}, {"s": 3001.89, "e": 3005.07, "t": "three decades after Kinoshita's first images."}, {"s": 3005.07, "e": 3007.83, "t": "But even when almost the entire world didn't believe"}, {"s": 3007.83, "e": 3008.79, "t": "it would work,"}, {"s": 3008.79, "e": 3011.4, "t": "there were some people at ASML who knew"}, {"s": 3011.4, "e": 3014.76, "t": "that it was going to work all the way back in 2010."}, {"s": 3014.76, "e": 3018.9, "t": "- Around 2001, we said let's do EUV."}, {"s": 3018.9, "e": 3021.18, "t": "And then we run into many challenges."}, {"s": 3021.18, "e": 3024.0, "t": "2010, we installed the first system at a customer."}, {"s": 3024.0, "e": 3025.71, "t": "So it was installed in Korea."}, {"s": 3025.71, "e": 3028.68, "t": "There it was, this thing I had been pursuing"}, {"s": 3028.68, "e": 3030.69, "t": "for, you know, 13 years was"}, {"s": 3030.69, "e": 3034.38, "t": "now standing at a customer, producing wafers."}, {"s": 3034.38, "e": 3037.14, "t": "This for me was a moment I realized,"}, {"s": 3037.14, "e": 3039.33, "t": "yes, we made the right bet."}, {"s": 3039.33, "e": 3040.8, "t": "- [Casper] Years later, Jos ran into"}, {"s": 3040.8, "e": 3043.41, "t": "the man who helped install the first machine."}, {"s": 3043.41, "e": 3045.9, "t": "- He's now a professor at a renowned institute."}, {"s": 3045.9, "e": 3048.21, "t": "And I shared the story about my relief"}, {"s": 3048.21, "e": 3050.72, "t": "and how great we made the decision."}, {"s": 3050.72, "e": 3051.81, "t": "(indistinct) said, \"Yeah, yeah, yeah.\""}, {"s": 3051.81, "e": 3054.63, "t": "He said, \"When you left and you flew out after Christmas,"}, {"s": 3054.63, "e": 3057.18, "t": "the thing broke down and it took"}, {"s": 3057.18, "e": 3058.95, "t": "two months to get back up again."}, {"s": 3058.95, "e": 3060.24, "t": "And they almost fired me"}, {"s": 3060.24, "e": 3062.1, "t": "for making the wrong decision.\""}, {"s": 3062.1, "e": 3064.5, "t": "We had some ups and downs along the way."}, {"s": 3064.5, "e": 3065.33, "t": "- [Casper] Yeah."}, {"s": 3065.33, "e": 3067.53, "t": "- But again, once I saw the system installed"}, {"s": 3067.53, "e": 3070.05, "t": "at a customer, in a customer fab,"}, {"s": 3070.05, "e": 3071.79, "t": "I knew we had done the right thing."}, {"s": 3071.79, "e": 3072.72, "t": "This was 2010."}, {"s": 3072.72, "e": 3074.82, "t": "The first phone that came out was 2019."}, {"s": 3074.82, "e": 3077.16, "t": "So we still had some hurdles to resolve."}, {"s": 3077.16, "e": 3077.99, "t": "- [Casper] Right."}, {"s": 3077.99, "e": 3078.83, "t": "- But we kept going."}, {"s": 3082.59, "e": 3084.33, "t": "- Now, I have spent several months"}, {"s": 3084.33, "e": 3087.17, "t": "working on this video and thinking about it"}, {"s": 3087.17, "e": 3090.12, "t": "and it still feels absolutely impossible."}, {"s": 3090.12, "e": 3092.22, "t": "And the more I think about it,"}, {"s": 3092.22, "e": 3095.25, "t": "the more I think, you know, those people 40 years ago"}, {"s": 3095.25, "e": 3098.13, "t": "that said it was impossible, they had a point."}, {"s": 3098.13, "e": 3100.74, "t": "It's completely unreasonable to think"}, {"s": 3100.74, "e": 3103.05, "t": "that you could make this artificial sun in a lab,"}, {"s": 3103.05, "e": 3104.31, "t": "that you could make these mirrors"}, {"s": 3104.31, "e": 3105.33, "t": "that are this smooth"}, {"s": 3105.33, "e": 3109.62, "t": "and that you could get the required overlay accuracy."}, {"s": 3109.62, "e": 3110.94, "t": "The reasonable thing is to think"}, {"s": 3110.94, "e": 3112.35, "t": "that none of that is possible"}, {"s": 3112.35, "e": 3115.29, "t": "and to point out all the problems with each of them."}, {"s": 3115.29, "e": 3117.57, "t": "Which reminds me of this quote,"}, {"s": 3117.57, "e": 3120.42, "t": "the reasonable man adapts himself to the world."}, {"s": 3120.42, "e": 3122.58, "t": "The unreasonable one persists"}, {"s": 3122.58, "e": 3125.34, "t": "in trying to adapt the world to himself."}, {"s": 3125.34, "e": 3127.86, "t": "Therefore, all progress depends"}, {"s": 3127.86, "e": 3129.45, "t": "on the unreasonable man."}, {"s": 3129.45, "e": 3132.81, "t": "Imagine if Andy and Kinoshita and all the others"}, {"s": 3132.81, "e": 3134.4, "t": "had been reasonable,"}, {"s": 3134.4, "e": 3136.47, "t": "we would have none of this."}, {"s": 3136.47, "e": 3138.51, "t": "In fact, imagine what the world would be like"}, {"s": 3138.51, "e": 3141.18, "t": "if everyone on it was reasonable."}, {"s": 3141.18, "e": 3143.22, "t": "It would probably be extremely boring."}, {"s": 3143.22, "e": 3144.75, "t": "Probably most of the technology,"}, {"s": 3144.75, "e": 3147.36, "t": "most of the things you enjoy on a daily basis"}, {"s": 3147.36, "e": 3148.65, "t": "wouldn't be here."}, {"s": 3148.65, "e": 3150.0, "t": "In fact, you probably wouldn't be"}, {"s": 3150.0, "e": 3151.2, "t": "watching this video,"}, {"s": 3151.2, "e": 3153.12, "t": "because just about all the technology we have"}, {"s": 3153.12, "e": 3156.6, "t": "nowadays would seem completely unreasonable"}, {"s": 3156.6, "e": 3159.03, "t": "even just 200 years ago."}, {"s": 3159.03, "e": 3162.06, "t": "And so I really think that to a large extent,"}, {"s": 3162.06, "e": 3165.09, "t": "we owe our lives to those unreasonable people."}, {"s": 3165.09, "e": 3166.89, "t": "And maybe at least to me,"}, {"s": 3166.89, "e": 3170.22, "t": "it's a reminder that it's good to be a little unreasonable,"}, {"s": 3170.22, "e": 3172.47, "t": "at least in some of the big parts of life."}, {"s": 3177.21, "e": 3178.71, "t": "Changing the world is difficult."}, {"s": 3178.71, "e": 3180.66, "t": "It took overcoming thousands of obstacles"}, {"s": 3180.66, "e": 3183.06, "t": "and over 30 years to get EUV to work."}, {"s": 3183.06, "e": 3186.0, "t": "But big breakthroughs usually start in the same way."}, {"s": 3186.0, "e": 3189.57, "t": "That is, you learn, you explore some related ideas,"}, {"s": 3189.57, "e": 3191.82, "t": "you try to apply them in some new ways,"}, {"s": 3191.82, "e": 3193.23, "t": "and then you build skills to take on"}, {"s": 3193.23, "e": 3195.24, "t": "bigger and bigger challenges."}, {"s": 3195.24, "e": 3197.37, "t": "Bit by bit, you gain knowledge"}, {"s": 3197.37, "e": 3200.97, "t": "and that's where today's video sponsor, Brilliant, comes in."}, {"s": 3200.97, "e": 3202.17, "t": "Brilliant helps you excel"}, {"s": 3202.17, "e": 3204.75, "t": "in math, science and computer science"}, {"s": 3204.75, "e": 3206.55, "t": "with visual, interactive learning"}, {"s": 3206.55, "e": 3208.56, "t": "that's personalized for you."}, {"s": 3208.56, "e": 3212.19, "t": "It's an incredibly powerful way to reach big learning goals,"}, {"s": 3212.19, "e": 3213.6, "t": "mastering math for class"}, {"s": 3213.6, "e": 3217.2, "t": "or contributing to the next big technological breakthrough."}, {"s": 3217.2, "e": 3219.42, "t": "On brilliant, you learn by doing,"}, {"s": 3219.42, "e": 3221.22, "t": "a method that research has shown to be"}, {"s": 3221.22, "e": 3223.38, "t": "far more effective than just passive learning."}, {"s": 3223.38, "e": 3225.21, "t": "It starts you at the right level"}, {"s": 3225.21, "e": 3227.52, "t": "based on your background, designs practice sets"}, {"s": 3227.52, "e": 3229.62, "t": "and reviews customized for you."}, {"s": 3229.62, "e": 3232.47, "t": "And then it helps you advance at your ideal pace."}, {"s": 3232.47, "e": 3235.23, "t": "There is always something new to discover on Brilliant."}, {"s": 3235.23, "e": 3236.94, "t": "Want to better understand optics"}, {"s": 3236.94, "e": 3238.02, "t": "after watching this video?"}, {"s": 3238.02, "e": 3240.39, "t": "Well, their \"Scientific Thinking\" course is"}, {"s": 3240.39, "e": 3242.37, "t": "a great place to start."}, {"s": 3242.37, "e": 3244.29, "t": "It helps you think like an engineer"}, {"s": 3244.29, "e": 3245.88, "t": "by showing you how to break down"}, {"s": 3245.88, "e": 3250.08, "t": "large concepts into smaller, more understandable pieces."}, {"s": 3250.08, "e": 3252.36, "t": "Whether you are conquering fundamental math,"}, {"s": 3252.36, "e": 3253.98, "t": "algebra or calculus,"}, {"s": 3253.98, "e": 3255.9, "t": "diving deep into algorithms,"}, {"s": 3255.9, "e": 3257.52, "t": "exploring material science"}, {"s": 3257.52, "e": 3261.42, "t": "or understanding the physics that will take us beyond EUV,"}, {"s": 3261.42, "e": 3263.16, "t": "Brilliant will help you get there."}, {"s": 3263.16, "e": 3265.89, "t": "And if, like me, you've resolved to learn more"}, {"s": 3265.89, "e": 3266.73, "t": "in the New Year,"}, {"s": 3266.73, "e": 3269.04, "t": "then Brilliant is a great way to actually make"}, {"s": 3269.04, "e": 3270.36, "t": "that resolution stick."}, {"s": 3270.36, "e": 3271.92, "t": "So to learn for free,"}, {"s": 3271.92, "e": 3274.59, "t": "go to brilliant.org/Veritasium,"}, {"s": 3274.59, "e": 3276.3, "t": "scan the QR code on screen,"}, {"s": 3276.3, "e": 3278.49, "t": "or click the link in the description."}, {"s": 3278.49, "e": 3281.34, "t": "Brilliant has also given our viewers 20% off"}, {"s": 3281.34, "e": 3283.11, "t": "an annual Premium subscription,"}, {"s": 3283.11, "e": 3285.21, "t": "which gives you unlimited daily access"}, {"s": 3285.21, "e": 3287.1, "t": "to everything on Brilliant."}, {"s": 3287.1, "e": 3289.98, "t": "So I want to thank Brilliant for sponsoring this video"}, {"s": 3289.98, "e": 3291.96, "t": "and I want to thank you for watching."}],DUR=3291.96;

function upd(){const p=(ct/DUR)*100;document.getElementById('pf').style.width=p+'%';document.getElementById('tL').textContent=fmtF(ct);document.getElementById('sTm').textContent=fmtF(ct);document.getElementById('sPct').textContent=Math.round(p)+'%';}
function seek(e){const r=document.getElementById('pb').getBoundingClientRect();ct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*DUR;act(fi(ct));upd();play=true;lT=null;}
function frame(ts){if(play){if(lT!==null){ct+=(ts-lT)/1000;if(ct>DUR){ct=DUR;play=false;}act(fi(ct));upd();}lT=ts;}else lT=null;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();play=!play;if(play)lT=null;}if(e.code==='ArrowRight'){ct=Math.min(DUR,ct+10);act(fi(ct));upd();}if(e.code==='ArrowLeft'){ct=Math.max(0,ct-10);act(fi(ct));upd();}});
function tA(){aF=!aF;document.getElementById('btnA').classList.toggle('on',aF);}
function tC(){cpt=!cpt;document.getElementById('btnC').classList.toggle('on',cpt);document.querySelectorAll('.si').forEach(l=>{l.style.paddingTop=cpt?'4px':'';l.style.paddingBottom=cpt?'4px':'';l.style.marginBottom=cpt?'0':'';});document.querySelectorAll('.sx').forEach(t=>{t.style.fontSize=cpt?'12.5px':'';});}
function doQ(){const q=document.getElementById('q').value.trim();let cnt=0;document.querySelectorAll('.si').forEach((line,i)=>{const tx=line.querySelector('.sx');if(q&&S[i].t.includes(q)){line.classList.add('sm');const ps=S[i].t.split(q);tx.innerHTML='';ps.forEach((p,pi)=>{tx.appendChild(document.createTextNode(p));if(pi<ps.length-1){const mk=document.createElement('mark');mk.textContent=q;tx.appendChild(mk);}});cnt++;}else{line.classList.remove('sm');tx.textContent=S[i].t;}});const row=document.getElementById('sqR');if(q){row.style.display='flex';document.getElementById('sqC').textContent=cnt+' 处';const f=document.querySelector('.sm');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});}else row.style.display='none';}
</script>
</body>
