<script>
const S=[{"s": 0.15, "e": 1.53, "t": "- This is a microchip."}, {"s": 1.53, "e": 5.01, "t": "When you zoom in, you find a nanoscopic computing city,"}, {"s": 5.01, "e": 7.32, "t": "skyscrapers hundreds of layers tall"}, {"s": 7.32, "e": 10.95, "t": "with hundreds of kilometers of wires connecting everything."}, {"s": 10.95, "e": 13.83, "t": "And at the very bottom is this,"}, {"s": 13.83, "e": 14.91, "t": "transistors,"}, {"s": 15.81, "e": 17.43, "t": "billions of them."}, {"s": 17.43, "e": 20.55, "t": "They are the ones and zeros of our computer."}, {"s": 20.55, "e": 22.08, "t": "The chip works by whizzing electrons"}, {"s": 22.08, "e": 24.06, "t": "from transistor to transistor,"}, {"s": 24.06, "e": 25.89, "t": "and the smaller you can make those transistors,"}, {"s": 25.89, "e": 27.42, "t": "the less the signals have to travel,"}, {"s": 27.42, "e": 29.34, "t": "so the faster they can compute."}, {"s": 29.34, "e": 32.55, "t": "Plus, you can fit more transistors into the same area,"}, {"s": 32.55, "e": 35.46, "t": "resulting in a much more powerful chip."}, {"s": 35.46, "e": 38.82, "t": "So for over 50 years, transistors got smaller and smaller,"}, {"s": 38.82, "e": 41.19, "t": "and the number you could fit on a chip doubled"}, {"s": 41.19, "e": 42.72, "t": "every two years."}, {"s": 42.72, "e": 44.49, "t": "This became known as Moore's Law,"}, {"s": 44.49, "e": 46.86, "t": "named for Intel's co-founder, Gordon Moore,"}, {"s": 46.86, "e": 49.59, "t": "after he noticed the pattern back in 1965,"}, {"s": 49.59, "e": 52.59, "t": "and it's been one of the main drivers of the tech industry."}, {"s": 52.59, "e": 53.97, "t": "But around 2015,"}, {"s": 53.97, "e": 56.4, "t": "progress came to a screeching halt,"}, {"s": 56.4, "e": 58.09, "t": "and we might have never gotten past it"}, {"s": 58.09, "e": 62.25, "t": "if it wasn't for a single company that makes these machines,"}, {"s": 62.25, "e": 64.8, "t": "the machines that saved Moore's Law."}, {"s": 64.8, "e": 66.03, "t": "- Holy."}, {"s": 66.03, "e": 68.49, "t": "- This is a video about the most complicated"}, {"s": 68.49, "e": 71.25, "t": "commercial product humanity's ever built."}, {"s": 71.25, "e": 72.69, "t": "- That's insane."}, {"s": 72.69, "e": 75.15, "t": "- It costs a whopping $400 million,"}, {"s": 75.15, "e": 78.06, "t": "and it is so bizarre that I want to introduce it to you"}, {"s": 78.06, "e": 79.59, "t": "with a thought experiment."}, {"s": 81.15, "e": 82.8, "t": "Imagine you are shrunk down"}, {"s": 82.8, "e": 84.09, "t": "to the size of an ant,"}, {"s": 85.17, "e": 87.96, "t": "and you are given a laser that's strong enough to melt"}, {"s": 87.96, "e": 89.76, "t": "through metal like butter."}, {"s": 89.76, "e": 91.89, "t": "Next, a tiny droplet of molten tin,"}, {"s": 91.89, "e": 93.9, "t": "roughly the size of a white blood cell,"}, {"s": 93.9, "e": 95.34, "t": "is shot out in front of you"}, {"s": 95.34, "e": 98.01, "t": "around 250 kilometers per hour."}, {"s": 98.01, "e": 101.31, "t": "And your task is to hit this not once, not twice,"}, {"s": 101.31, "e": 104.13, "t": "but three times in a row in 20 microseconds"}, {"s": 104.13, "e": 105.87, "t": "with your little laser."}, {"s": 105.87, "e": 108.45, "t": "Well, that is exactly what this machine does."}, {"s": 108.45, "e": 111.69, "t": "It hits one tiny tin droplet three times in a row,"}, {"s": 111.69, "e": 115.35, "t": "heating each one up to over 220,000 Kelvin."}, {"s": 115.35, "e": 119.1, "t": "That's roughly 40 times hotter than the surface of the Sun."}, {"s": 119.1, "e": 121.23, "t": "And it doesn't just hit one droplet,"}, {"s": 121.23, "e": 125.28, "t": "it hits 50,000 droplets every single second."}, {"s": 125.28, "e": 127.35, "t": "How often do you miss a laser shot?"}, {"s": 127.35, "e": 128.61, "t": "- We don't miss them."}, {"s": 128.61, "e": 129.44, "t": "- What?"}, {"s": 129.44, "e": 132.96, "t": "You do 150,000 laser shots a second,"}, {"s": 132.96, "e": 134.37, "t": "and you don't miss one?"}, {"s": 134.37, "e": 135.75, "t": "- Exactly."}, {"s": 135.75, "e": 137.64, "t": "- The same machine also contains mirrors"}, {"s": 137.64, "e": 141.24, "t": "that might just be the smoothest objects in the universe."}, {"s": 141.24, "e": 143.58, "t": "If you scale one up to the size of the Earth,"}, {"s": 143.58, "e": 144.93, "t": "then the largest bump would be"}, {"s": 144.93, "e": 147.09, "t": "no thicker than a playing card."}, {"s": 147.09, "e": 148.98, "t": "On top of that, it is able to overlay"}, {"s": 148.98, "e": 151.38, "t": "one layer of a chip perfectly on top of another"}, {"s": 151.38, "e": 154.41, "t": "and never be off by more than five atoms."}, {"s": 154.41, "e": 155.7, "t": "And this is all happening"}, {"s": 155.7, "e": 157.59, "t": "while parts of the machine whip around"}, {"s": 157.59, "e": 160.13, "t": "at accelerations of over 20 Gs."}, {"s": 160.13, "e": 160.96, "t": "(machine rattles)."}, {"s": 160.96, "e": 162.93, "t": "For 30 years, almost everyone thought"}, {"s": 162.93, "e": 166.05, "t": "that actually building this machine was impossible,"}, {"s": 166.05, "e": 168.09, "t": "and yet it exists."}, {"s": 168.09, "e": 171.63, "t": "There is only one company in the world that can make it."}, {"s": 171.63, "e": 173.67, "t": "So what is this company and what is"}, {"s": 173.67, "e": 176.1, "t": "this impossible machine they've built?"}, {"s": 176.1, "e": 178.02, "t": "This video is sponsored by Brilliant."}, {"s": 178.02, "e": 180.39, "t": "More about them at the end of the show."}, {"s": 180.39, "e": 181.83, "t": "Now, just as a quick aside,"}, {"s": 181.83, "e": 184.29, "t": "the makers of this machine didn't actually sponsor"}, {"s": 184.29, "e": 185.22, "t": "this video."}, {"s": 185.22, "e": 187.65, "t": "We just thought that the science and engineering here were"}, {"s": 187.65, "e": 190.53, "t": "so cool that we had to make a video about it."}, {"s": 190.53, "e": 192.74, "t": "So let's jump straight in."}, {"s": 192.74, "e": 193.58, "t": "(upbeat music)"}, {"s": 193.58, "e": 194.43, "t": "- [Derek] To make a microchip, you start"}, {"s": 194.43, "e": 196.86, "t": "by taking silicon dioxide, usually from sand,"}, {"s": 196.86, "e": 199.14, "t": "and purifying it into ultrapure,"}, {"s": 199.14, "e": 202.53, "t": "nearly 100% silicon chunks,"}, {"s": 202.53, "e": 205.59, "t": "which is then melted down in a special furnace."}, {"s": 205.59, "e": 208.77, "t": "Next, you lower a small seed crystal into the vat."}, {"s": 208.77, "e": 210.75, "t": "Silicon atoms attach to the crystal,"}, {"s": 210.75, "e": 212.61, "t": "extending its structure."}, {"s": 212.61, "e": 215.76, "t": "Then you slowly raise the seed crystal while rotating it"}, {"s": 215.76, "e": 219.42, "t": "and this results in a large, single crystal silicon ingot."}, {"s": 219.42, "e": 221.54, "t": "- This is where the seed crystal would be."}, {"s": 221.54, "e": 222.69, "t": "Yeah. - And then you pull it out."}, {"s": 222.69, "e": 223.54, "t": "- [Casper] Can I touch it?"}, {"s": 223.54, "e": 224.55, "t": "- Yeah, you can."}, {"s": 224.55, "e": 226.89, "t": "- It seems like you would not be able to hold"}, {"s": 226.89, "e": 228.78, "t": "this from here. - Yes."}, {"s": 228.78, "e": 230.22, "t": "- It even feels fragile."}, {"s": 230.22, "e": 231.34, "t": "Like if you kinda."}, {"s": 231.34, "e": 232.17, "t": "- [Person Off-Camera] Don't snap it."}, {"s": 232.17, "e": 233.97, "t": "- Yeah, I'm scared to break it."}, {"s": 233.97, "e": 235.11, "t": "- Yes."}, {"s": 235.11, "e": 236.67, "t": "- He's using more force."}, {"s": 236.67, "e": 238.53, "t": "- [Derek] The ingot is then cut into wafers"}, {"s": 238.53, "e": 242.04, "t": "with diamond wire saws, up to 5,000 of them,"}, {"s": 242.04, "e": 245.07, "t": "after which each wafer is carefully polished."}, {"s": 245.07, "e": 247.59, "t": "Next, it's coated with a light sensitive material called"}, {"s": 247.59, "e": 248.79, "t": "photoresist."}, {"s": 248.79, "e": 249.81, "t": "There are different kinds,"}, {"s": 249.81, "e": 251.49, "t": "but in a positive photoresist,"}, {"s": 251.49, "e": 255.12, "t": "the areas exposed to light become weaker and more soluble."}, {"s": 255.12, "e": 257.43, "t": "So if you shine light through a patterned mask,"}, {"s": 257.43, "e": 260.13, "t": "you can selectively weaken parts of that coating."}, {"s": 260.13, "e": 262.44, "t": "Then, you rinse the wafer with a basic solution"}, {"s": 262.44, "e": 264.81, "t": "to wash away the exposed photoresist,"}, {"s": 264.81, "e": 266.67, "t": "leaving the design imprinted."}, {"s": 267.81, "e": 269.79, "t": "So now you can actually turn this pattern"}, {"s": 269.79, "e": 271.35, "t": "into physical structures."}, {"s": 271.35, "e": 272.76, "t": "This is often done by etching"}, {"s": 272.76, "e": 274.2, "t": "into the uncovered silicon"}, {"s": 274.2, "e": 276.84, "t": "by using either chemicals or plasma."}, {"s": 276.84, "e": 279.03, "t": "And then you deposit a metal, like copper,"}, {"s": 279.03, "e": 281.55, "t": "to fill in those etched lines."}, {"s": 281.55, "e": 284.88, "t": "As a last step, you wash away the remaining photoresist,"}, {"s": 284.88, "e": 288.36, "t": "and now you've made a single layer of the chip."}, {"s": 288.36, "e": 290.7, "t": "We've simplified this cycle down to the main steps,"}, {"s": 290.7, "e": 293.1, "t": "coat, expose, etch and deposit."}, {"s": 293.1, "e": 295.41, "t": "It repeats for every single chip layer,"}, {"s": 295.41, "e": 296.43, "t": "and depending on the chip,"}, {"s": 296.43, "e": 299.52, "t": "there could be anywhere from 10 to 100 layers."}, {"s": 299.52, "e": 301.53, "t": "The bottom layer is the transistors."}, {"s": 301.53, "e": 303.09, "t": "This is the most complicated layer,"}, {"s": 303.09, "e": 304.83, "t": "requiring hundreds of steps"}, {"s": 304.83, "e": 306.75, "t": "that all need to be perfect."}, {"s": 306.75, "e": 309.15, "t": "The higher layers are a little easier."}, {"s": 309.15, "e": 312.42, "t": "These are the metal wires that carry signals and power."}, {"s": 312.42, "e": 315.48, "t": "By the end, the completed wafer can have hundreds of chips,"}, {"s": 315.48, "e": 317.28, "t": "which are then cut into separate pieces,"}, {"s": 317.28, "e": 319.2, "t": "packaged and put into products."}, {"s": 320.13, "e": 322.56, "t": "But by far the hardest and most crucial step"}, {"s": 322.56, "e": 325.41, "t": "in the process is where you shine light through the mask"}, {"s": 325.41, "e": 326.61, "t": "and onto the wafer."}, {"s": 326.61, "e": 328.2, "t": "This is photolithography,"}, {"s": 328.2, "e": 330.54, "t": "and that's because this step determines"}, {"s": 330.54, "e": 333.6, "t": "how small you can make the features."}, {"s": 333.6, "e": 335.22, "t": "- At first, it seems simple,"}, {"s": 335.22, "e": 336.87, "t": "light passes through the openings"}, {"s": 336.87, "e": 339.57, "t": "and it gets blocked by all the rest."}, {"s": 339.57, "e": 342.6, "t": "But as you try to print smaller and smaller features,"}, {"s": 342.6, "e": 344.76, "t": "the gaps in the mask start to approach"}, {"s": 344.76, "e": 345.99, "t": "the wavelength of the light,"}, {"s": 345.99, "e": 348.45, "t": "and that causes problems."}, {"s": 348.45, "e": 349.53, "t": "- And we can actually show it"}, {"s": 349.53, "e": 352.44, "t": "because I happen to have a, this is a mask."}, {"s": 352.44, "e": 353.28, "t": "This is a reticle."}, {"s": 353.28, "e": 355.11, "t": "- [Casper] A reticle or a mask carries"}, {"s": 355.11, "e": 356.73, "t": "the design of one chip layer."}, {"s": 356.73, "e": 359.58, "t": "This reticle is filled with microscopic lines and gaps,"}, {"s": 359.58, "e": 362.13, "t": "around 670 nanometers across."}, {"s": 362.13, "e": 363.84, "t": "- And if I take like a laser pointer,"}, {"s": 363.84, "e": 365.67, "t": "so this is a red laser. - Yep."}, {"s": 365.67, "e": 368.22, "t": "- If I shine it through it, then you see this here."}, {"s": 370.53, "e": 371.79, "t": "- [Casper] The laser has a wavelength"}, {"s": 371.79, "e": 373.56, "t": "of around 650 nanometers."}, {"s": 373.56, "e": 375.24, "t": "When light hits the reticle,"}, {"s": 375.24, "e": 378.15, "t": "its wavefronts bend as they pass through each gap."}, {"s": 378.15, "e": 381.81, "t": "So, each gap sends out waves that spread out and overlap."}, {"s": 381.81, "e": 384.93, "t": "Now, let's just look at the light from these two gaps."}, {"s": 384.93, "e": 386.88, "t": "When the peaks of one wave line up"}, {"s": 386.88, "e": 388.5, "t": "with the troughs of the other,"}, {"s": 388.5, "e": 390.78, "t": "we say that the two waves are out of phase"}, {"s": 390.78, "e": 392.19, "t": "and they cancel each other out,"}, {"s": 392.19, "e": 393.87, "t": "so you get dark spots,"}, {"s": 393.87, "e": 395.73, "t": "and when the peaks line up with the peaks,"}, {"s": 395.73, "e": 397.44, "t": "the two waves are in phase."}, {"s": 397.44, "e": 399.78, "t": "They add up and you get bright spots."}, {"s": 399.78, "e": 401.16, "t": "- You can get interference. - Yeah."}, {"s": 401.16, "e": 403.59, "t": "- Right, and you get a diffraction pattern."}, {"s": 403.59, "e": 405.84, "t": "- Now, diffraction is inevitable."}, {"s": 405.84, "e": 407.25, "t": "So instead of fighting it,"}, {"s": 407.25, "e": 410.73, "t": "designers actually use it to get the patterns they want."}, {"s": 410.73, "e": 413.13, "t": "They kind of work backwards from the eventual pattern"}, {"s": 413.13, "e": 414.51, "t": "they want on the wafer,"}, {"s": 414.51, "e": 416.22, "t": "and they design the slits"}, {"s": 416.22, "e": 417.69, "t": "so that diffraction will occur"}, {"s": 417.69, "e": 421.23, "t": "in such a way that it creates the pattern that they want."}, {"s": 421.23, "e": 423.54, "t": "- You see three dots, the middle dot,"}, {"s": 423.54, "e": 424.56, "t": "that's the original one."}, {"s": 424.56, "e": 425.82, "t": "That's the zero order."}, {"s": 425.82, "e": 427.41, "t": "And then on the left and the right,"}, {"s": 427.41, "e": 430.11, "t": "you can see the first and the minus first."}, {"s": 430.11, "e": 432.3, "t": "Now, in order for us to have"}, {"s": 432.3, "e": 435.39, "t": "this image resolved on the wafer,"}, {"s": 435.39, "e": 437.67, "t": "you need to capture the zero and the first"}, {"s": 437.67, "e": 439.44, "t": "and the minus first order."}, {"s": 439.44, "e": 440.94, "t": "- [Derek] The smaller you make the features,"}, {"s": 440.94, "e": 442.53, "t": "the larger this angle, alpha,"}, {"s": 442.53, "e": 445.08, "t": "between the zero and first orders becomes,"}, {"s": 445.08, "e": 448.98, "t": "so the larger your lens needs to be to capture the light."}, {"s": 448.98, "e": 452.49, "t": "The size of the lens is described by the numerical aperture"}, {"s": 452.49, "e": 454.17, "t": "or NA for short,"}, {"s": 454.17, "e": 456.45, "t": "which is just the sin of this angle."}, {"s": 456.45, "e": 457.74, "t": "So the larger that is,"}, {"s": 457.74, "e": 460.26, "t": "the smaller the features you can print."}, {"s": 460.26, "e": 461.58, "t": "But there is a hard limit"}, {"s": 461.58, "e": 463.68, "t": "to how large your lens system can be"}, {"s": 463.68, "e": 465.3, "t": "when this angle is 90 degrees"}, {"s": 465.3, "e": 467.37, "t": "and your numerical aperture is one,"}, {"s": 467.37, "e": 469.62, "t": "where your lens would have to be infinite."}, {"s": 469.62, "e": 473.64, "t": "Fortunately, there is one other thing we can change."}, {"s": 473.64, "e": 475.74, "t": "- This is a red laser. - [Casper] Yeah."}, {"s": 475.74, "e": 479.46, "t": "- And a red laser has a wavelength of 650 nanometers,"}, {"s": 479.46, "e": 480.75, "t": "ish, I would say. - [Casper] Yeah."}, {"s": 480.75, "e": 483.51, "t": "- And if I take a green laser"}, {"s": 483.51, "e": 485.41, "t": "and this one has a wavelength of 532,"}, {"s": 487.23, "e": 489.46, "t": "then you can see that the green dots are"}, {"s": 490.32, "e": 493.65, "t": "closer spaced than the red dots."}, {"s": 493.65, "e": 494.64, "t": "- [Derek] That's because the light"}, {"s": 494.64, "e": 496.77, "t": "from the two different gaps doesn't have to travel"}, {"s": 496.77, "e": 499.17, "t": "as far to match up in phase again."}, {"s": 499.17, "e": 501.54, "t": "So, the orders end up closer together."}, {"s": 501.54, "e": 502.77, "t": "So with a smaller wavelength,"}, {"s": 502.77, "e": 506.34, "t": "you can print smaller patterns using the same lens."}, {"s": 506.34, "e": 508.77, "t": "All of this is captured by the Rayleigh Equation,"}, {"s": 508.77, "e": 510.9, "t": "which determines the smallest feature size"}, {"s": 510.9, "e": 512.16, "t": "or critical dimension."}, {"s": 513.39, "e": 514.92, "t": "- But since there's a limit"}, {"s": 514.92, "e": 517.23, "t": "to how much you can increase the numerical aperture,"}, {"s": 517.23, "e": 518.46, "t": "I mean to one,"}, {"s": 518.46, "e": 520.38, "t": "over time, the only way to keep making"}, {"s": 520.38, "e": 522.54, "t": "smaller and smaller features is"}, {"s": 522.54, "e": 524.58, "t": "by using shorter and shorter wavelengths."}, {"s": 524.58, "e": 526.5, "t": "So this is exactly what happened"}, {"s": 526.5, "e": 528.27, "t": "up until the late 1990s,"}, {"s": 528.27, "e": 531.42, "t": "when the industry settled on 193 nanometer"}, {"s": 531.42, "e": 533.19, "t": "deep UV light."}, {"s": 533.19, "e": 534.78, "t": "This was the light that was used to make"}, {"s": 534.78, "e": 536.58, "t": "all of the most advanced chips"}, {"s": 536.58, "e": 538.74, "t": "right until around 2015."}, {"s": 538.74, "e": 541.41, "t": "But by that point, scientists had reached a limit"}, {"s": 541.41, "e": 543.33, "t": "to how small they could make the features."}, {"s": 543.33, "e": 546.81, "t": "And Moore's Law was about to run into a brick wall."}, {"s": 546.81, "e": 548.97, "t": "So a radical change was needed,"}, {"s": 548.97, "e": 552.18, "t": "a change that had been brewing for around 30 years."}, {"s": 554.31, "e": 556.05, "t": "All the way back in the 1980s,"}, {"s": 556.05, "e": 558.18, "t": "Japanese scientist, Hiroo Kinoshita,"}, {"s": 558.18, "e": 560.67, "t": "came up with a crazy idea."}, {"s": 560.67, "e": 562.65, "t": "Why not use much shorter wavelengths,"}, {"s": 562.65, "e": 565.08, "t": "like x-rays of around 10 nanometers?"}, {"s": 565.08, "e": 566.88, "t": "In theory, that should allow you to print"}, {"s": 566.88, "e": 568.53, "t": "much smaller features,"}, {"s": 568.53, "e": 570.78, "t": "but you quickly run into a problem."}, {"s": 570.78, "e": 572.25, "t": "X-rays at these wavelengths have"}, {"s": 572.25, "e": 575.13, "t": "enough energy to eject electrons from their atoms,"}, {"s": 575.13, "e": 577.83, "t": "so most materials absorb them."}, {"s": 577.83, "e": 579.93, "t": "But unlike medical X-rays which have"}, {"s": 579.93, "e": 582.15, "t": "wavelengths shorter than one nanometer,"}, {"s": 582.15, "e": 584.79, "t": "these are still long enough to interact with air."}, {"s": 584.79, "e": 587.07, "t": "So, air absorbs them too."}, {"s": 587.07, "e": 590.4, "t": "That meant that Kinoshita's setup had to be in a vacuum,"}, {"s": 590.4, "e": 591.54, "t": "but even worse,"}, {"s": 591.54, "e": 593.73, "t": "he couldn't use lenses to focus the light"}, {"s": 593.73, "e": 595.8, "t": "because the lenses would absorb it too."}, {"s": 597.24, "e": 600.03, "t": "So, it seemed like this idea would never work."}, {"s": 601.29, "e": 602.64, "t": "- [Derek] But around 1983,"}, {"s": 602.64, "e": 604.11, "t": "Kinoshita stumbled on a paper"}, {"s": 604.11, "e": 606.18, "t": "by Jim Underwood and Troy Barbee."}, {"s": 606.18, "e": 608.16, "t": "Their work focused on special mirrors"}, {"s": 608.16, "e": 609.48, "t": "that could reflect x-rays"}, {"s": 609.48, "e": 612.36, "t": "with a wavelength of 4.48 nanometers."}, {"s": 612.36, "e": 614.61, "t": "So, Kinoshita was intrigued."}, {"s": 614.61, "e": 617.34, "t": "Curved mirrors can focus light just like lenses do."}, {"s": 617.34, "e": 618.54, "t": "If he could figure out how to make"}, {"s": 618.54, "e": 621.03, "t": "these special mirrors for the wavelength he was using,"}, {"s": 621.03, "e": 624.06, "t": "then this could be another way to do photolithography."}, {"s": 624.06, "e": 626.31, "t": "The mirrors work something like this."}, {"s": 627.69, "e": 630.24, "t": "When light crosses from one medium to another,"}, {"s": 630.24, "e": 631.38, "t": "say, from air to glass,"}, {"s": 631.38, "e": 633.21, "t": "it bends or refracts."}, {"s": 633.21, "e": 636.03, "t": "Some of it goes through and part reflects back."}, {"s": 636.03, "e": 638.79, "t": "How much gets reflected depends on things like the angle,"}, {"s": 638.79, "e": 640.29, "t": "the light's polarization,"}, {"s": 640.29, "e": 642.12, "t": "and most importantly for us,"}, {"s": 642.12, "e": 644.16, "t": "the difference between the refractive indices"}, {"s": 644.16, "e": 645.33, "t": "of the two media."}, {"s": 645.33, "e": 648.48, "t": "The larger that difference, the more light is reflected."}, {"s": 648.48, "e": 651.3, "t": "And Underwood and Barbee used that principle."}, {"s": 651.3, "e": 653.52, "t": "They made a super thin layer of tungsten,"}, {"s": 653.52, "e": 655.47, "t": "less than one nanometer thick,"}, {"s": 655.47, "e": 657.48, "t": "thin enough that x-rays could pass through"}, {"s": 657.48, "e": 659.52, "t": "without immediately being absorbed."}, {"s": 659.52, "e": 662.25, "t": "When x-rays hit the layer at a specific angle,"}, {"s": 662.25, "e": 664.95, "t": "the tungsten reflected less than 1%."}, {"s": 664.95, "e": 667.38, "t": "Then, they carefully tuned the layer thickness"}, {"s": 667.38, "e": 669.9, "t": "so the path length of the transmitted x-rays was"}, {"s": 669.9, "e": 672.57, "t": "only one quarter of its wavelength."}, {"s": 672.57, "e": 675.87, "t": "Then they added another layer, this time out of carbon."}, {"s": 675.87, "e": 677.97, "t": "It has a higher refractive index than tungsten"}, {"s": 677.97, "e": 680.61, "t": "for wavelengths of 4.48 nanometers."}, {"s": 680.61, "e": 682.11, "t": "The x-rays hit the boundary"}, {"s": 682.11, "e": 684.54, "t": "and a little bit more reflects,"}, {"s": 684.54, "e": 686.52, "t": "but this time the phase is inverted"}, {"s": 686.52, "e": 688.86, "t": "or it's changed by half a wavelength."}, {"s": 688.86, "e": 690.69, "t": "This happens when any light moves"}, {"s": 690.69, "e": 693.75, "t": "from a lower refractive index to a higher one."}, {"s": 693.75, "e": 696.18, "t": "Now, by the time this new reflected wave reaches"}, {"s": 696.18, "e": 697.2, "t": "the tungsten boundary,"}, {"s": 697.2, "e": 699.66, "t": "it has traveled another quarter of its wavelength"}, {"s": 699.66, "e": 701.58, "t": "for a half wavelength in total."}, {"s": 701.58, "e": 703.23, "t": "So the two phases line up"}, {"s": 703.23, "e": 705.51, "t": "and the waves interfere constructively."}, {"s": 705.51, "e": 707.4, "t": "Underwood and Barbee kept doing this trick"}, {"s": 707.4, "e": 710.13, "t": "for a total of 76 alternating layers,"}, {"s": 710.13, "e": 712.14, "t": "so that in total they could reflect back"}, {"s": 712.14, "e": 714.03, "t": "much more of the x-rays."}, {"s": 715.56, "e": 717.0, "t": "Now, they only managed to reflect"}, {"s": 717.0, "e": 718.5, "t": "around 6% of the light,"}, {"s": 718.5, "e": 720.21, "t": "but it was a proof of principle"}, {"s": 720.21, "e": 722.1, "t": "that you could reflect x-rays."}, {"s": 723.15, "e": 725.61, "t": "- So Kinoshita saw the possibilities."}, {"s": 725.61, "e": 728.1, "t": "He got to work, and after around two years,"}, {"s": 728.1, "e": 729.45, "t": "his team designed and built"}, {"s": 729.45, "e": 732.57, "t": "three tungsten-carbon curved multi-layer mirrors"}, {"s": 732.57, "e": 734.76, "t": "to reflect 11 nanometer light."}, {"s": 734.76, "e": 736.59, "t": "And with it, he managed to print"}, {"s": 736.59, "e": 740.16, "t": "lines four microns or 4,000 nanometers thick,"}, {"s": 740.16, "e": 742.2, "t": "proving that at least in theory,"}, {"s": 742.2, "e": 744.45, "t": "x-ray lithography was possible."}, {"s": 745.41, "e": 747.3, "t": "A year later in 1986,"}, {"s": 747.3, "e": 748.77, "t": "he went to present his findings"}, {"s": 748.77, "e": 751.47, "t": "to the Japanese Society of Applied Physics."}, {"s": 751.47, "e": 753.27, "t": "Proud and excited, he explained his setup"}, {"s": 753.27, "e": 754.95, "t": "and showed his image."}, {"s": 754.95, "e": 758.31, "t": "But to his horror, the audience refused to believe it."}, {"s": 758.31, "e": 761.79, "t": "- [Kinoshita] Unfortunately, the audience was"}, {"s": 761.79, "e": 764.82, "t": "highly skeptical of my talk."}, {"s": 764.82, "e": 766.77, "t": "- [Casper] Kinoshita was devastated."}, {"s": 766.77, "e": 769.65, "t": "He later said, \"People seemed unwilling to believe"}, {"s": 769.65, "e": 772.8, "t": "that we had actually made an image by bending x-rays,"}, {"s": 772.8, "e": 774.72, "t": "and they tended to regard the whole thing"}, {"s": 774.72, "e": 776.16, "t": "as a big fish story.\""}, {"s": 777.27, "e": 780.45, "t": "- Nobody believed that this was a viable way forward,"}, {"s": 780.45, "e": 782.85, "t": "and unfortunately, the reaction was"}, {"s": 782.85, "e": 785.07, "t": "at least somewhat justified."}, {"s": 785.07, "e": 787.26, "t": "First, this light isn't naturally produced"}, {"s": 787.26, "e": 788.7, "t": "by anything on Earth."}, {"s": 788.7, "e": 791.49, "t": "The closest natural source is the Sun."}, {"s": 792.45, "e": 797.45, "t": "- We had to basically build an artificial sun here on Earth."}, {"s": 797.46, "e": 799.29, "t": "- [Derek] Most scientists, including Kinoshita,"}, {"s": 799.29, "e": 800.64, "t": "produced x-ray light using"}, {"s": 800.64, "e": 803.22, "t": "a particle accelerator or a synchrotron."}, {"s": 803.22, "e": 805.23, "t": "- [Jos] It gives an enormous amount of power."}, {"s": 805.23, "e": 806.91, "t": "It's as big as a soccer field."}, {"s": 806.91, "e": 808.41, "t": "You can fuel a whole fab."}, {"s": 808.41, "e": 810.09, "t": "The problem is if the light goes out,"}, {"s": 810.09, "e": 811.71, "t": "the whole fab goes out."}, {"s": 811.71, "e": 815.22, "t": "- So each machine needed its own power source."}, {"s": 815.22, "e": 817.05, "t": "But even if you could produce the light,"}, {"s": 817.05, "e": 819.48, "t": "you'd need to make incredibly smooth mirrors"}, {"s": 819.48, "e": 822.72, "t": "to actually focus and print those tiny features."}, {"s": 822.72, "e": 826.71, "t": "You would need the smoothest objects in the universe."}, {"s": 826.71, "e": 828.27, "t": "- Okay, so I got a football"}, {"s": 828.27, "e": 830.85, "t": "and I've got a bouncy ball and a cobblestone street."}, {"s": 830.85, "e": 833.36, "t": "Now what do you think is gonna happen when I drop them?"}, {"s": 834.63, "e": 836.55, "t": "The football basically bounces straight up,"}, {"s": 836.55, "e": 838.32, "t": "but for the bouncy ball,"}, {"s": 838.32, "e": 839.76, "t": "it just shoots off to the side."}, {"s": 839.76, "e": 842.22, "t": "And it's because the surface is relatively flat"}, {"s": 842.22, "e": 844.05, "t": "for the football, which is much larger,"}, {"s": 844.05, "e": 846.66, "t": "but it's super rough for the bouncy ball."}, {"s": 846.66, "e": 848.85, "t": "And a similar thing happens with mirrors."}, {"s": 848.85, "e": 850.65, "t": "If the surface is super rough"}, {"s": 850.65, "e": 852.3, "t": "compared to the size of the wavelength,"}, {"s": 852.3, "e": 854.67, "t": "then the light scatters randomly."}, {"s": 854.67, "e": 856.05, "t": "Now it might look smooth,"}, {"s": 856.05, "e": 857.31, "t": "but if you zoom into a mirror,"}, {"s": 857.31, "e": 859.44, "t": "you find something that looks like this,"}, {"s": 859.44, "e": 862.2, "t": "you find all these crazy bumps."}, {"s": 862.2, "e": 863.52, "t": "And now to measure the roughness,"}, {"s": 863.52, "e": 866.49, "t": "what you do is you take the average of these bumps"}, {"s": 866.49, "e": 868.2, "t": "and that will give you your mean line."}, {"s": 868.2, "e": 870.24, "t": "Now, for a normal household mirror,"}, {"s": 870.24, "e": 873.15, "t": "the average height is about 4,000 silicon atoms."}, {"s": 874.32, "e": 876.15, "t": "But for Kinoshita's mirrors,"}, {"s": 876.15, "e": 878.25, "t": "which not only needed to reflect x-ray light,"}, {"s": 878.25, "e": 880.41, "t": "which has 100 times shorter wavelength,"}, {"s": 880.41, "e": 882.36, "t": "but also needed to minimize scattering,"}, {"s": 882.36, "e": 885.06, "t": "you know, so that all the photons make it onto the wafer,"}, {"s": 885.06, "e": 887.19, "t": "it needed to be way more smooth."}, {"s": 887.19, "e": 889.17, "t": "It needed to be atomically smooth."}, {"s": 889.17, "e": 891.12, "t": "In fact, the average bump could only be"}, {"s": 891.12, "e": 894.27, "t": "about 2.3 silicon atoms thick."}, {"s": 894.27, "e": 896.79, "t": "- If one mirror would be the size of Germany,"}, {"s": 896.79, "e": 899.28, "t": "the biggest bump would be about a millimeter high."}, {"s": 899.28, "e": 901.68, "t": "- [Casper] But Kinoshita refused to give up."}, {"s": 901.68, "e": 904.02, "t": "- [Kinoshita] However, my belief did not change."}, {"s": 904.02, "e": 908.22, "t": "- [Casper] And soon help would come from an unlikely place."}, {"s": 908.22, "e": 909.15, "t": "- Across the Pacific,"}, {"s": 909.15, "e": 911.61, "t": "around 70 kilometers east of San Francisco is"}, {"s": 911.61, "e": 913.47, "t": "Lawrence Livermore National Lab,"}, {"s": 913.47, "e": 915.54, "t": "a lab that was born out of the Cold War,"}, {"s": 915.54, "e": 917.37, "t": "heavily funded by the US government,"}, {"s": 917.37, "e": 920.4, "t": "and built for one purpose and one purpose only,"}, {"s": 920.4, "e": 922.17, "t": "nuclear weapons."}, {"s": 922.17, "e": 924.93, "t": "The lab was founded by the inventor of the Cyclotron,"}, {"s": 924.93, "e": 926.01, "t": "Ernest Lawrence,"}, {"s": 926.01, "e": 928.68, "t": "and the father of the hydrogen bomb, Edward Teller."}, {"s": 928.68, "e": 930.45, "t": "And over its lifetime, they designed"}, {"s": 930.45, "e": 933.21, "t": "over 10 fusion-type nuclear warheads."}, {"s": 933.21, "e": 934.74, "t": "So part of their research focused"}, {"s": 934.74, "e": 938.46, "t": "on what happens inside nuclear fusion reactions."}, {"s": 938.46, "e": 941.07, "t": "Fusion reactions release a lot of x-ray light,"}, {"s": 941.07, "e": 944.55, "t": "light that they had never been able to capture and analyze."}, {"s": 944.55, "e": 947.67, "t": "But now, using those special multilayer mirrors,"}, {"s": 947.67, "e": 949.47, "t": "there was a chance."}, {"s": 949.47, "e": 950.97, "t": "- [Casper] One of the scientists tasked"}, {"s": 950.97, "e": 953.4, "t": "with making this work was Andrew Hawryluk."}, {"s": 953.4, "e": 954.84, "t": "And within a few years,"}, {"s": 954.84, "e": 957.45, "t": "he and his team used multilayer mirrors to reflect"}, {"s": 957.45, "e": 959.31, "t": "some x-ray light."}, {"s": 959.31, "e": 961.02, "t": "But then in 1987,"}, {"s": 961.02, "e": 964.02, "t": "Andy got a visit from a professor from Cornell."}, {"s": 964.02, "e": 965.94, "t": "- He was very impressed with the technologies"}, {"s": 965.94, "e": 966.77, "t": "that we developed."}, {"s": 966.77, "e": 968.68, "t": "And he looked at me at the end of the day and said,"}, {"s": 968.68, "e": 971.01, "t": "\"This is all very interesting and very neat and stuff,\""}, {"s": 971.01, "e": 974.71, "t": "but his words, and I'll remember it to the day I died, was,"}, {"s": 974.71, "e": 976.96, "t": "\"Can you do anything useful with this stuff?\""}, {"s": 978.28, "e": 982.29, "t": "And this was the day before a Christmas shutdown in 1987."}, {"s": 982.29, "e": 985.68, "t": "And I was so inflamed by that comment"}, {"s": 985.68, "e": 988.29, "t": "that I went home and for the next 10 days,"}, {"s": 988.29, "e": 991.14, "t": "I wrote up a multi-page white paper."}, {"s": 991.14, "e": 993.06, "t": "- [Casper] He applied these mirrors to lithography,"}, {"s": 993.06, "e": 995.1, "t": "to print chips using x-rays."}, {"s": 995.1, "e": 998.04, "t": "Around five months later, Andy presented his findings"}, {"s": 998.04, "e": 999.6, "t": "at a conference."}, {"s": 999.6, "e": 1002.06, "t": "But like Kinoshita, it was not the response"}, {"s": 1002.06, "e": 1003.2, "t": "he was hoping for."}, {"s": 1004.13, "e": 1007.04, "t": "- It was extremely negative."}, {"s": 1007.04, "e": 1008.87, "t": "That was the low point in my career."}, {"s": 1009.92, "e": 1012.32, "t": "I was literally laughed off the stage."}, {"s": 1012.32, "e": 1016.7, "t": "And I kid you not, every person who I looked up to"}, {"s": 1016.7, "e": 1017.53, "t": "in the field,"}, {"s": 1017.53, "e": 1018.62, "t": "they were listening to my talk"}, {"s": 1018.62, "e": 1020.75, "t": "and they came up to the microphone"}, {"s": 1020.75, "e": 1024.32, "t": "and told me basically why it wouldn't work,"}, {"s": 1024.32, "e": 1026.9, "t": "how stupid an idea it was."}, {"s": 1026.9, "e": 1029.78, "t": "Later that week, I flew back and the following Monday,"}, {"s": 1029.78, "e": 1031.76, "t": "my boss asked me, \"How did it go?\""}, {"s": 1032.66, "e": 1033.96, "t": "And I looked at him and I said,"}, {"s": 1033.96, "e": 1035.87, "t": "\"I will never speak of it again.\""}, {"s": 1036.76, "e": 1038.81, "t": "(uptempo music)"}, {"s": 1038.81, "e": 1040.4, "t": "- [Casper] But then three days later,"}, {"s": 1040.4, "e": 1043.7, "t": "he gets a phone call from someone named Bill Brinkman"}, {"s": 1043.7, "e": 1045.56, "t": "from Bell Labs."}, {"s": 1045.56, "e": 1047.28, "t": "- [Andy] And so I walked over to my boss and I said,"}, {"s": 1047.28, "e": 1049.37, "t": "\"Just got this phone call from a guy named Bill Brinkman."}, {"s": 1049.37, "e": 1050.54, "t": "Do you know who he is?\""}, {"s": 1050.54, "e": 1052.65, "t": "And my boss's eyes popped open and said,"}, {"s": 1052.65, "e": 1055.91, "t": "\"Yeah, he's the Executive Vice President of AT&T.\""}, {"s": 1055.91, "e": 1057.62, "t": "And I said, \"Well, he just called me"}, {"s": 1057.62, "e": 1061.22, "t": "and asked me to fly out to New Jersey and give a talk.\""}, {"s": 1061.22, "e": 1064.22, "t": "The response from my boss said it all."}, {"s": 1065.15, "e": 1067.28, "t": "He basically said, \"Well, you gotta go.\""}, {"s": 1068.36, "e": 1070.76, "t": "- [Casper] At Bell Labs, Andy found fellow believers"}, {"s": 1070.76, "e": 1073.22, "t": "and it couldn't have come at a better time."}, {"s": 1073.22, "e": 1074.51, "t": "Over the past 30 years,"}, {"s": 1074.51, "e": 1075.98, "t": "the US government had invested"}, {"s": 1075.98, "e": 1078.8, "t": "billions of dollars into national labs to maintain"}, {"s": 1078.8, "e": 1082.34, "t": "the country's technological edge during the Cold War."}, {"s": 1082.34, "e": 1083.93, "t": "But by the late 1980s,"}, {"s": 1083.93, "e": 1085.97, "t": "the Cold War was slowing down"}, {"s": 1085.97, "e": 1088.07, "t": "and all these labs were sitting on research"}, {"s": 1088.07, "e": 1089.93, "t": "that had commercial potential."}, {"s": 1089.93, "e": 1092.36, "t": "So the government encouraged the labs to partner"}, {"s": 1092.36, "e": 1093.98, "t": "with US companies"}, {"s": 1093.98, "e": 1095.84, "t": "to turn that research into products"}, {"s": 1095.84, "e": 1097.64, "t": "and to stimulate the economy."}, {"s": 1097.64, "e": 1100.22, "t": "And the government would then supply seed money."}, {"s": 1100.22, "e": 1103.58, "t": "And so Bell Labs partnered with Andy's labs and two others"}, {"s": 1103.58, "e": 1105.77, "t": "to keep developing x-ray lithography."}, {"s": 1107.18, "e": 1108.38, "t": "And by 1993,"}, {"s": 1108.38, "e": 1112.04, "t": "the first international conference for x-ray lithography was"}, {"s": 1112.04, "e": 1114.74, "t": "held in Japan, near Mount Fuji."}, {"s": 1114.74, "e": 1116.81, "t": "In the opening address, Kinoshita said"}, {"s": 1116.81, "e": 1119.6, "t": "that, \"As long as we do not lose the desire"}, {"s": 1119.6, "e": 1121.13, "t": "that has sprung from within us,"}, {"s": 1121.13, "e": 1122.9, "t": "technology will steadily advance"}, {"s": 1122.9, "e": 1126.56, "t": "from the micro to the nano to the pico.\""}, {"s": 1126.56, "e": 1128.72, "t": "They even gave the technology a new name,"}, {"s": 1128.72, "e": 1131.03, "t": "extreme ultraviolet lithography,"}, {"s": 1131.03, "e": 1132.5, "t": "or just EUV."}, {"s": 1133.85, "e": 1135.38, "t": "- But then in 1996,"}, {"s": 1135.38, "e": 1138.35, "t": "the US government cut funding for the project."}, {"s": 1138.35, "e": 1142.07, "t": "This spelled disaster for the big chip companies like Intel."}, {"s": 1142.07, "e": 1143.36, "t": "The industry estimated"}, {"s": 1143.36, "e": 1146.3, "t": "that the 193 nanometer lithography tools would fall"}, {"s": 1146.3, "e": 1149.33, "t": "behind Moore's Law by 2005,"}, {"s": 1149.33, "e": 1152.09, "t": "but there were no other alternatives."}, {"s": 1153.47, "e": 1156.86, "t": "So Intel, Motorola, AMD and other companies got together"}, {"s": 1156.86, "e": 1159.98, "t": "and invested $250 million to keep it going,"}, {"s": 1159.98, "e": 1161.93, "t": "making it the largest investment ever"}, {"s": 1161.93, "e": 1163.25, "t": "by private industry"}, {"s": 1163.25, "e": 1166.13, "t": "in a Department of Energy research project."}, {"s": 1166.13, "e": 1168.62, "t": "By the year 2000, the labs had produced this,"}, {"s": 1168.62, "e": 1170.45, "t": "the Engineering Test Stand."}, {"s": 1170.45, "e": 1173.66, "t": "It was the first fully functioning EUV prototype."}, {"s": 1173.66, "e": 1178.1, "t": "It produced 9.8 watts of 13.4 nanometer EUV light,"}, {"s": 1178.1, "e": 1180.14, "t": "which was then reflected by eight mirrors"}, {"s": 1180.14, "e": 1182.54, "t": "from the source to the mask to the wafer."}, {"s": 1182.54, "e": 1184.7, "t": "It could print 70 nanometer features"}, {"s": 1184.7, "e": 1187.28, "t": "and it proved that EUV could work."}, {"s": 1188.49, "e": 1189.32, "t": "- It was a milestone to get"}, {"s": 1189.32, "e": 1190.7, "t": "the Engineering Test Stand to work."}, {"s": 1190.7, "e": 1192.89, "t": "It demonstrated to people like Intel"}, {"s": 1192.89, "e": 1196.01, "t": "that, you know, good engineering will get us there."}, {"s": 1196.01, "e": 1198.95, "t": "- And then it seems like you've got the prototype,"}, {"s": 1198.95, "e": 1202.16, "t": "shouldn't be too hard to then commercialize it."}, {"s": 1203.0, "e": 1204.28, "t": "- That's what they thought."}, {"s": 1204.28, "e": 1205.55, "t": "(Andy and Casper laugh)"}, {"s": 1205.55, "e": 1207.56, "t": "- But the prototype had a major flaw."}, {"s": 1207.56, "e": 1210.2, "t": "It could only print about 10 wafers per hour."}, {"s": 1210.2, "e": 1212.54, "t": "And to make EUV economically viable,"}, {"s": 1212.54, "e": 1215.09, "t": "it would have to print hundreds of wafers per hour,"}, {"s": 1215.09, "e": 1218.57, "t": "24/7, 365 days a year."}, {"s": 1218.57, "e": 1220.88, "t": "The main reason output was so slow was"}, {"s": 1220.88, "e": 1223.13, "t": "because the light reflected off of eight mirrors"}, {"s": 1223.13, "e": 1224.03, "t": "and the reticle,"}, {"s": 1224.03, "e": 1227.48, "t": "which is also a mirror, just with the design imprinted."}, {"s": 1227.48, "e": 1229.82, "t": "Traditional masks that allow light to pass through"}, {"s": 1229.82, "e": 1232.42, "t": "don't work because, well, they absorb all the light."}, {"s": 1233.54, "e": 1236.3, "t": "Each mirror had a reflectivity of around 70%,"}, {"s": 1236.3, "e": 1237.83, "t": "which is close to the max,"}, {"s": 1237.83, "e": 1239.33, "t": "but after nine bounces,"}, {"s": 1239.33, "e": 1242.24, "t": "you are only left with 4% of the light,"}, {"s": 1242.24, "e": 1245.15, "t": "which means that out of every 100 photons,"}, {"s": 1245.15, "e": 1247.16, "t": "only four make it to the wafer."}, {"s": 1248.18, "e": 1251.51, "t": "So you might think just use way fewer mirrors,"}, {"s": 1251.51, "e": 1253.67, "t": "but that only works up to a point."}, {"s": 1253.67, "e": 1256.01, "t": "When you focus light with any optical system,"}, {"s": 1256.01, "e": 1258.14, "t": "you always get some distortion."}, {"s": 1258.14, "e": 1260.57, "t": "For example, rays that pass through the outer edges"}, {"s": 1260.57, "e": 1262.79, "t": "of most lenses focus light slightly different"}, {"s": 1262.79, "e": 1264.02, "t": "from those near the center."}, {"s": 1264.02, "e": 1266.06, "t": "This is called spherical aberration."}, {"s": 1266.06, "e": 1267.92, "t": "And normal cameras correct for this"}, {"s": 1267.92, "e": 1270.83, "t": "and other aberrations by using multiple lenses."}, {"s": 1270.83, "e": 1272.96, "t": "And a mirror system is no different."}, {"s": 1272.96, "e": 1276.05, "t": "- You need to have a certain amount of mirrors"}, {"s": 1276.05, "e": 1280.49, "t": "before you can say I have my aberrations under control."}, {"s": 1280.49, "e": 1284.51, "t": "In reality, the systems of today have six mirrors."}, {"s": 1284.51, "e": 1285.83, "t": "- That helps a little."}, {"s": 1285.83, "e": 1289.04, "t": "But after reflecting off six mirrors and the reticle,"}, {"s": 1289.04, "e": 1292.22, "t": "you are still only left with around 8% of your light."}, {"s": 1292.22, "e": 1294.23, "t": "So they needed to drastically increase"}, {"s": 1294.23, "e": 1296.81, "t": "the source power to at least 100 watts."}, {"s": 1296.81, "e": 1298.34, "t": "Now to most companies,"}, {"s": 1298.34, "e": 1301.01, "t": "that tenfold increase seemed impossible."}, {"s": 1301.01, "e": 1303.62, "t": "Even people who worked on the Engineering Test Stand noted"}, {"s": 1303.62, "e": 1307.19, "t": "that while EUV technology itself is a done deal,"}, {"s": 1307.19, "e": 1310.22, "t": "there were six zillion engineering challenges"}, {"s": 1310.22, "e": 1312.71, "t": "to make it a fab-line reality."}, {"s": 1312.71, "e": 1314.33, "t": "And so one by one,"}, {"s": 1314.33, "e": 1316.16, "t": "American companies walked away"}, {"s": 1316.16, "e": 1319.22, "t": "from developing a full EUV lithography machine."}, {"s": 1319.22, "e": 1322.37, "t": "That left just one company, ASML."}, {"s": 1323.61, "e": 1324.77, "t": "ASML, which used to stand for"}, {"s": 1324.77, "e": 1327.11, "t": "Advanced Semiconductor Materials Lithography,"}, {"s": 1327.11, "e": 1330.32, "t": "is located in a small, nondescript town in the Netherlands."}, {"s": 1330.32, "e": 1332.48, "t": "It spun off from Philips back in the '80s"}, {"s": 1332.48, "e": 1333.8, "t": "with little more than a shed"}, {"s": 1333.8, "e": 1336.68, "t": "and a barely working wafer stepper to its name."}, {"s": 1336.68, "e": 1338.97, "t": "But Philips also gave them people,"}, {"s": 1338.97, "e": 1341.12, "t": "Jos Benschop, ASML's first researcher,"}, {"s": 1341.12, "e": 1342.59, "t": "and Martin van den Brink,"}, {"s": 1342.59, "e": 1345.2, "t": "who would eventually become ASML's CTO,"}, {"s": 1345.2, "e": 1347.72, "t": "and EUV's greatest champion."}, {"s": 1347.72, "e": 1350.3, "t": "- And he is really like the Steve Jobs of lithography."}, {"s": 1350.3, "e": 1352.04, "t": "And he saw EUV coming."}, {"s": 1352.04, "e": 1355.07, "t": "- ASML had joined the US EUV consortium earlier"}, {"s": 1355.07, "e": 1357.95, "t": "and now it became their task to find a way"}, {"s": 1357.95, "e": 1359.48, "t": "to commercialize EUV."}, {"s": 1359.48, "e": 1362.06, "t": "They would work together with their German partner, Zeiss,"}, {"s": 1362.06, "e": 1363.83, "t": "where Zeiss would take care of the mirrors,"}, {"s": 1363.83, "e": 1367.25, "t": "and ASML would focus on the light source."}, {"s": 1367.25, "e": 1368.9, "t": "One of the first decisions when making"}, {"s": 1368.9, "e": 1372.89, "t": "any lithography system is deciding which wavelength to use."}, {"s": 1372.89, "e": 1374.42, "t": "- In the early days, anything between"}, {"s": 1374.42, "e": 1377.69, "t": "five and 14 nanometers was explored."}, {"s": 1377.69, "e": 1380.75, "t": "The thing is you need to find a source"}, {"s": 1380.75, "e": 1382.61, "t": "and you need to find optics that reflect"}, {"s": 1382.61, "e": 1383.63, "t": "the wavelengths. - Right."}, {"s": 1383.63, "e": 1385.37, "t": "- So you have to look for the combination."}, {"s": 1385.37, "e": 1387.08, "t": "- Underwood and Barbee had already made"}, {"s": 1387.08, "e": 1389.93, "t": "mirrors that could reflect light of around four nanometers."}, {"s": 1389.93, "e": 1391.94, "t": "And since that wavelength is so small,"}, {"s": 1391.94, "e": 1394.31, "t": "it seems like the obvious choice,"}, {"s": 1394.31, "e": 1396.71, "t": "but the maximum reflectivity for those mirrors was"}, {"s": 1396.71, "e": 1398.12, "t": "only around 20%."}, {"s": 1398.12, "e": 1401.33, "t": "So after hitting six mirrors and the reticle,"}, {"s": 1401.33, "e": 1406.33, "t": "you are just left with 0.00128% of the light,"}, {"s": 1406.7, "e": 1408.8, "t": "which is way too low."}, {"s": 1408.8, "e": 1410.9, "t": "Fortunately, further researchers also looked"}, {"s": 1410.9, "e": 1412.67, "t": "at two other pairs,"}, {"s": 1412.67, "e": 1414.14, "t": "silicon and molybdenum,"}, {"s": 1414.14, "e": 1417.8, "t": "which had a theoretical maximum reflectivity of 70%"}, {"s": 1417.8, "e": 1420.08, "t": "for wavelengths around 13 nanometers,"}, {"s": 1420.08, "e": 1422.48, "t": "and molybdenum and beryllium"}, {"s": 1422.48, "e": 1426.11, "t": "with a theoretical maximum reflectivity of 80%"}, {"s": 1426.11, "e": 1428.3, "t": "for wavelengths around 11 nanometers."}, {"s": 1428.3, "e": 1430.61, "t": "So the choice seemed obvious, right?"}, {"s": 1430.61, "e": 1432.26, "t": "I mean, pick the shorter wavelength"}, {"s": 1432.26, "e": 1433.76, "t": "and the higher reflectivity."}, {"s": 1433.76, "e": 1437.36, "t": "But it turns out that beryllium is extremely toxic"}, {"s": 1437.36, "e": 1439.31, "t": "and it's also difficult to handle."}, {"s": 1439.31, "e": 1443.72, "t": "So scientists focused on silicon and molybdenum instead."}, {"s": 1443.72, "e": 1447.11, "t": "To make the mirrors, Zeiss used a process called sputtering."}, {"s": 1447.11, "e": 1449.0, "t": "A target of coating material is"}, {"s": 1449.0, "e": 1451.79, "t": "bombarded with either plasma or ions,"}, {"s": 1451.79, "e": 1454.19, "t": "causing atoms to be ejected, fly off"}, {"s": 1454.19, "e": 1455.96, "t": "and stick to the mirror."}, {"s": 1455.96, "e": 1457.46, "t": "This is a messy process,"}, {"s": 1457.46, "e": 1460.76, "t": "so the layers end up having bumps and gaps."}, {"s": 1460.76, "e": 1462.95, "t": "- There was a nice trick that actually"}, {"s": 1462.95, "e": 1466.52, "t": "the team in the Netherlands perfected with ion beam."}, {"s": 1466.52, "e": 1468.32, "t": "You just shake it a little bit"}, {"s": 1468.32, "e": 1471.12, "t": "until the atoms falls in the hole where it needs to be"}, {"s": 1471.12, "e": 1472.46, "t": "and then it's all flat."}, {"s": 1472.46, "e": 1474.26, "t": "- [Casper] With the mirror design locked in,"}, {"s": 1474.26, "e": 1477.94, "t": "ASML needed a source for that specific wavelength."}, {"s": 1477.94, "e": 1480.26, "t": "- So it was 13.x. - Yeah."}, {"s": 1480.26, "e": 1483.07, "t": "- Okay, now the next good question is what's the x?"}, {"s": 1483.07, "e": 1485.39, "t": "Now you look for the source."}, {"s": 1485.39, "e": 1488.75, "t": "So there are basically three ways to generate EUV,"}, {"s": 1488.75, "e": 1492.09, "t": "to build a sun on Earth."}, {"s": 1492.09, "e": 1494.03, "t": "- [Casper] The first method which early researchers used"}, {"s": 1494.03, "e": 1495.2, "t": "was the Synchrotron,"}, {"s": 1495.2, "e": 1496.61, "t": "but it was quickly ruled out"}, {"s": 1496.61, "e": 1499.76, "t": "because each machine needed its own source."}, {"s": 1499.76, "e": 1502.31, "t": "The other two methods are based on the same principle."}, {"s": 1502.31, "e": 1504.8, "t": "When an electron recombines with an ion,"}, {"s": 1504.8, "e": 1507.29, "t": "the ion drops to a lower energy level"}, {"s": 1507.29, "e": 1510.08, "t": "and it releases that excess energy as a photon."}, {"s": 1510.08, "e": 1512.81, "t": "And if you choose the ion just right,"}, {"s": 1512.81, "e": 1516.38, "t": "then that photon will have exactly the wavelength you need."}, {"s": 1516.38, "e": 1519.2, "t": "Now, there are two ways you can create those ions."}, {"s": 1519.2, "e": 1520.73, "t": "The first is you take a metal,"}, {"s": 1520.73, "e": 1522.47, "t": "heat it up until you get a metal vapor,"}, {"s": 1522.47, "e": 1526.01, "t": "and then you apply a strong electric field across it."}, {"s": 1526.01, "e": 1528.83, "t": "This causes free electrons to knock into nearby atoms"}, {"s": 1528.83, "e": 1530.09, "t": "and ionize them."}, {"s": 1530.96, "e": 1532.88, "t": "If you then turn off the electric field,"}, {"s": 1532.88, "e": 1536.54, "t": "the electrons recombine with the ions and produce light."}, {"s": 1536.54, "e": 1539.36, "t": "This is discharge-produced plasma."}, {"s": 1539.36, "e": 1540.95, "t": "- [Jos] That's the concept we use first."}, {"s": 1540.95, "e": 1541.91, "t": "- [Casper] Yeah. - Because of its"}, {"s": 1541.91, "e": 1543.53, "t": "relative simplicity."}, {"s": 1543.53, "e": 1546.26, "t": "And we quickly got it to a few watts."}, {"s": 1546.26, "e": 1549.8, "t": "We wanted to get 100 watts and we struggled forever."}, {"s": 1549.8, "e": 1551.52, "t": "- So you couldn't scale it."}, {"s": 1551.52, "e": 1552.36, "t": "- We could not scale it."}, {"s": 1552.36, "e": 1554.3, "t": "- They needed a drastic change."}, {"s": 1554.3, "e": 1556.49, "t": "So they switched to the second method."}, {"s": 1556.49, "e": 1558.53, "t": "This method uses a high powered laser"}, {"s": 1558.53, "e": 1560.15, "t": "to hit a target material,"}, {"s": 1560.15, "e": 1561.17, "t": "creating a plasma"}, {"s": 1561.17, "e": 1564.98, "t": "that's more than 220,000 degrees Celsius hot."}, {"s": 1564.98, "e": 1566.75, "t": "The electrons have so much energy"}, {"s": 1566.75, "e": 1569.21, "t": "that the nucleus can't hold onto them anymore,"}, {"s": 1569.21, "e": 1572.75, "t": "and up to 14 electrons escape their orbits."}, {"s": 1572.75, "e": 1574.01, "t": "After the laser shuts off,"}, {"s": 1574.01, "e": 1577.61, "t": "the electrons and ions recombine to produce light."}, {"s": 1577.61, "e": 1579.44, "t": "This is laser-produced plasma"}, {"s": 1579.44, "e": 1582.02, "t": "and it was the only method that seemed scalable."}, {"s": 1583.67, "e": 1585.32, "t": "In fact, this was the same method"}, {"s": 1585.32, "e": 1586.97, "t": "that the Engineering Test Stand used,"}, {"s": 1586.97, "e": 1590.9, "t": "a 1,700 watt laser fired into a stream of xenon gas"}, {"s": 1590.9, "e": 1594.44, "t": "to produce 13.4 nanometer light."}, {"s": 1594.44, "e": 1596.57, "t": "But xenon had a big problem."}, {"s": 1596.57, "e": 1598.4, "t": "The conversion efficiency that is"}, {"s": 1598.4, "e": 1600.11, "t": "the ratio of usable light"}, {"s": 1600.11, "e": 1602.69, "t": "to the amount of power you put in was terrible."}, {"s": 1602.69, "e": 1604.3, "t": "It was only around 0.5%."}, {"s": 1605.61, "e": 1607.25, "t": "That's because while xenon does emit light"}, {"s": 1607.25, "e": 1609.56, "t": "in the 13 to 14 nanometer range,"}, {"s": 1609.56, "e": 1612.59, "t": "there's much more light released around 11 nanometers."}, {"s": 1612.59, "e": 1614.99, "t": "So most of the energy went into making light"}, {"s": 1614.99, "e": 1617.06, "t": "that the mirrors couldn't reflect."}, {"s": 1617.06, "e": 1619.55, "t": "Plus, the laser didn't ionize all the atoms."}, {"s": 1619.55, "e": 1621.89, "t": "So, leftover neutral xenon atoms would"}, {"s": 1621.89, "e": 1625.55, "t": "strongly reabsorb some of that 13.4 nanometer light."}, {"s": 1626.63, "e": 1630.56, "t": "So ASML started looking at another material, tin."}, {"s": 1630.56, "e": 1632.66, "t": "Now, tin has a much higher emission peak,"}, {"s": 1632.66, "e": 1634.43, "t": "around 13.5 nanometers,"}, {"s": 1634.43, "e": 1637.1, "t": "which results in a five to 10 times higher"}, {"s": 1637.1, "e": 1639.08, "t": "conversion efficiency than xenon."}, {"s": 1639.08, "e": 1641.87, "t": "But just like xenon, neutral tin atoms also absorb"}, {"s": 1641.87, "e": 1642.89, "t": "EUV light."}, {"s": 1642.89, "e": 1645.47, "t": "So they came up with a crazy idea,"}, {"s": 1645.47, "e": 1649.01, "t": "to shoot one tiny tin droplet at a time."}, {"s": 1649.01, "e": 1650.33, "t": "But to get the required power,"}, {"s": 1650.33, "e": 1651.8, "t": "you would have to make and hit"}, {"s": 1651.8, "e": 1654.56, "t": "thousands of droplets every second,"}, {"s": 1654.56, "e": 1657.92, "t": "all of which have to be the exact same shape and size."}, {"s": 1659.0, "e": 1661.49, "t": "But it turns out that you can't instantly make"}, {"s": 1661.49, "e": 1664.37, "t": "thousands of tin droplets that are the exact same."}, {"s": 1664.37, "e": 1666.71, "t": "So, they found a workaround."}, {"s": 1666.71, "e": 1669.89, "t": "To make the droplets, extremely pure tin is melted"}, {"s": 1669.89, "e": 1671.93, "t": "and pushed through a microscopic nozzle"}, {"s": 1671.93, "e": 1673.55, "t": "by high pressure nitrogen."}, {"s": 1673.55, "e": 1675.74, "t": "This nozzle vibrates at a high frequency,"}, {"s": 1675.74, "e": 1678.47, "t": "breaking the stream into tiny droplets."}, {"s": 1678.47, "e": 1681.05, "t": "These droplets are irregular in size, shape,"}, {"s": 1681.05, "e": 1682.25, "t": "velocity and distance,"}, {"s": 1682.25, "e": 1684.98, "t": "and the whole process is chaotic."}, {"s": 1684.98, "e": 1686.51, "t": "- That's like our magic sauce,"}, {"s": 1686.51, "e": 1690.05, "t": "is how do you modulate that tin jet"}, {"s": 1690.05, "e": 1691.43, "t": "so that it forms the droplets we want"}, {"s": 1691.43, "e": 1692.26, "t": "and that they're stable?"}, {"s": 1692.26, "e": 1696.56, "t": "- I think we found some paper that describe this process"}, {"s": 1696.56, "e": 1699.08, "t": "and it was sort of eyeopening to me"}, {"s": 1699.08, "e": 1700.94, "t": "that it seems like all the droplets"}, {"s": 1700.94, "e": 1703.88, "t": "actually come out irregular out of the nozzle,"}, {"s": 1703.88, "e": 1706.01, "t": "but then before they reach the side"}, {"s": 1706.01, "e": 1707.51, "t": "where they get hit by the laser,"}, {"s": 1707.51, "e": 1709.97, "t": "like the little irregular droplets come together"}, {"s": 1709.97, "e": 1712.28, "t": "to form these perfectly spaced,"}, {"s": 1712.28, "e": 1713.66, "t": "perfectly regular droplets"}, {"s": 1713.66, "e": 1716.36, "t": "that are about the same size and shape"}, {"s": 1716.36, "e": 1718.73, "t": "and all traveling at the same velocity."}, {"s": 1718.73, "e": 1720.74, "t": "That feels like magic to me, Jayson."}, {"s": 1720.74, "e": 1722.21, "t": "- Yeah, it's exactly that."}, {"s": 1722.21, "e": 1725.61, "t": "It's how do you take a long stream of a tin jet"}, {"s": 1726.47, "e": 1729.38, "t": "that wants to break up into all these irregular droplets"}, {"s": 1729.38, "e": 1731.72, "t": "and like force onto it"}, {"s": 1731.72, "e": 1733.88, "t": "that it's gonna collapse into a single droplet"}, {"s": 1733.88, "e": 1736.31, "t": "and then happen again and again and again?"}, {"s": 1736.31, "e": 1737.96, "t": "- [Casper] You also don't have that many variables"}, {"s": 1737.96, "e": 1738.79, "t": "to play with."}, {"s": 1738.79, "e": 1739.94, "t": "You've got the pressure"}, {"s": 1739.94, "e": 1741.38, "t": "with which you push out the tin"}, {"s": 1741.38, "e": 1743.48, "t": "and at the frequency of the nozzle."}, {"s": 1743.48, "e": 1745.88, "t": "Yeah, it seems like a hard problem to solve."}, {"s": 1745.88, "e": 1747.98, "t": "- There's not a whole lot of variables to play with."}, {"s": 1747.98, "e": 1752.78, "t": "And so mastering that modulation of the jet is"}, {"s": 1752.78, "e": 1754.03, "t": "how we make the droplets."}, {"s": 1755.18, "e": 1757.85, "t": "- [Casper] But these droplets not only have to be identical,"}, {"s": 1757.85, "e": 1760.73, "t": "they have to be moving incredibly fast."}, {"s": 1761.66, "e": 1764.03, "t": "- What will happen is if the next droplet"}, {"s": 1764.03, "e": 1766.25, "t": "that's coming down the line is too close,"}, {"s": 1766.25, "e": 1768.83, "t": "then it'll actually get like disturbed"}, {"s": 1768.83, "e": 1771.56, "t": "and mess up the next plasma event."}, {"s": 1771.56, "e": 1773.63, "t": "So we have a requirement"}, {"s": 1773.63, "e": 1776.15, "t": "which is both that we make 50,000 droplets per second,"}, {"s": 1776.15, "e": 1779.81, "t": "but also that they're traveling extremely fast."}, {"s": 1779.81, "e": 1782.72, "t": "- [Casper] By 2011, their laser-produced plasma source"}, {"s": 1782.72, "e": 1784.31, "t": "reached 11 watts,"}, {"s": 1784.31, "e": 1786.32, "t": "which was more than double what they managed"}, {"s": 1786.32, "e": 1787.94, "t": "with their previous source."}, {"s": 1787.94, "e": 1791.03, "t": "But they were still limited to just five wafers per hour."}, {"s": 1791.03, "e": 1794.21, "t": "So, they needed to increase the power and fast,"}, {"s": 1794.21, "e": 1796.85, "t": "because they promised they'd hit 60 wafers per hour"}, {"s": 1796.85, "e": 1799.28, "t": "by the end of 2011."}, {"s": 1799.28, "e": 1802.79, "t": "Unfortunately, this new method had a major flaw."}, {"s": 1802.79, "e": 1805.16, "t": "- Now the problem with the tin issue, you hit the droplet,"}, {"s": 1805.16, "e": 1808.94, "t": "you generate EUV with a very decent conversion efficiency."}, {"s": 1808.94, "e": 1810.11, "t": "Where does the tin go?"}, {"s": 1810.11, "e": 1813.05, "t": "Because like, you know, 30 centimeters away,"}, {"s": 1813.05, "e": 1815.48, "t": "you have this atomically flat,"}, {"s": 1815.48, "e": 1818.12, "t": "very beautiful, very expensive mirror"}, {"s": 1818.12, "e": 1819.92, "t": "from our friends at Zeiss. - [Casper] Yeah."}, {"s": 1819.92, "e": 1821.6, "t": "- And in the early days,"}, {"s": 1821.6, "e": 1823.46, "t": "we would coat a thing within."}, {"s": 1823.46, "e": 1824.29, "t": "(Jos clicks fingers)"}, {"s": 1824.29, "e": 1825.35, "t": "Like this. - These machines need"}, {"s": 1825.35, "e": 1826.76, "t": "to run for a year."}, {"s": 1826.76, "e": 1831.76, "t": "You're putting liters of tin through this plasma event"}, {"s": 1831.89, "e": 1833.69, "t": "and a single nanometer of tin,"}, {"s": 1833.69, "e": 1835.67, "t": "if it was to land on that collector mirror,"}, {"s": 1835.67, "e": 1837.71, "t": "you'd have to take the collector outta commission."}, {"s": 1837.71, "e": 1842.03, "t": "We need to keep it almost perfectly clean for a year."}, {"s": 1842.03, "e": 1843.83, "t": "- Yeah, how do you even approach that?"}, {"s": 1843.83, "e": 1847.55, "t": "- So our main tool here is the hydrogen gas, actually."}, {"s": 1847.55, "e": 1848.69, "t": "- [Casper] They fill the chamber"}, {"s": 1848.69, "e": 1850.19, "t": "with low pressure hydrogen."}, {"s": 1850.19, "e": 1852.98, "t": "This slows and cools the tin particles down."}, {"s": 1852.98, "e": 1855.44, "t": "And even if something makes it to the collector,"}, {"s": 1855.44, "e": 1859.07, "t": "the hydrogen pulls it off to form a gas called stannane."}, {"s": 1859.07, "e": 1861.23, "t": "This way, the machine cleans the collectors"}, {"s": 1861.23, "e": 1862.52, "t": "while it's running,"}, {"s": 1862.52, "e": 1864.62, "t": "but that hydrogen gas also gets hot"}, {"s": 1864.62, "e": 1866.48, "t": "from all those tin explosions."}, {"s": 1866.48, "e": 1869.27, "t": "So they need to keep flushing new, cooler hydrogen"}, {"s": 1869.27, "e": 1871.82, "t": "into the system while flushing out the stannane"}, {"s": 1871.82, "e": 1873.35, "t": "and hotter gas."}, {"s": 1873.35, "e": 1875.48, "t": "But they have to get the pressure and the flow rate"}, {"s": 1875.48, "e": 1876.41, "t": "just right."}, {"s": 1876.41, "e": 1877.97, "t": "I mean, too little hydrogen"}, {"s": 1877.97, "e": 1879.86, "t": "and the mirrors would get too dirty,"}, {"s": 1879.86, "e": 1881.96, "t": "but too much hydrogen would not only absorb"}, {"s": 1881.96, "e": 1883.34, "t": "too much EUV light,"}, {"s": 1883.34, "e": 1886.16, "t": "but it would also cause the system to overheat."}, {"s": 1886.16, "e": 1888.71, "t": "- The question is how much heat is there?"}, {"s": 1888.71, "e": 1891.56, "t": "How much energy is being deposited into the gas?"}, {"s": 1891.56, "e": 1893.63, "t": "And we were stumped for quite some time."}, {"s": 1893.63, "e": 1895.61, "t": "If you look at a EUV light source,"}, {"s": 1895.61, "e": 1899.03, "t": "what you'll see is that it's kinda like a globe"}, {"s": 1899.03, "e": 1901.52, "t": "of like purple-ish red light"}, {"s": 1901.52, "e": 1903.92, "t": "and you kinda ask yourself like, why is that happening?"}, {"s": 1903.92, "e": 1906.65, "t": "So we bought an ultra-fast camera."}, {"s": 1906.65, "e": 1909.2, "t": "What we realized is that after every plasma event,"}, {"s": 1909.2, "e": 1911.81, "t": "there's a shockwave that goes"}, {"s": 1911.81, "e": 1914.45, "t": "propagating out into the hydrogen gas"}, {"s": 1914.45, "e": 1917.33, "t": "and it's extremely repeatable."}, {"s": 1917.33, "e": 1918.16, "t": "And you think to yourself,"}, {"s": 1918.16, "e": 1920.42, "t": "there must be like an explanation for this."}, {"s": 1920.42, "e": 1922.94, "t": "And there's this formula,"}, {"s": 1922.94, "e": 1926.0, "t": "the Taylor-von Neumann-Sedov formula that explains"}, {"s": 1926.0, "e": 1927.92, "t": "point source explosions in an environment,"}, {"s": 1927.92, "e": 1931.52, "t": "in like, say, a nuclear blast out to like supernova."}, {"s": 1931.52, "e": 1932.84, "t": "So I took this formula,"}, {"s": 1932.84, "e": 1934.97, "t": "it like exactly describes the data."}, {"s": 1934.97, "e": 1937.55, "t": "It's just fantastic that we're seeing"}, {"s": 1937.55, "e": 1939.95, "t": "these, like, tiny little supernovas happening"}, {"s": 1939.95, "e": 1942.44, "t": "in our vessel 50,000 times a second."}, {"s": 1942.44, "e": 1944.39, "t": "- And is that a fair way to think about this,"}, {"s": 1944.39, "e": 1947.09, "t": "like creating mini supernova?"}, {"s": 1947.09, "e": 1948.65, "t": "- Yeah, it's actually pretty similar."}, {"s": 1948.65, "e": 1950.3, "t": "It's almost like very similar to a,"}, {"s": 1950.3, "e": 1952.16, "t": "like a type 1A supernova, it turns out,"}, {"s": 1952.16, "e": 1953.48, "t": "where you kind of have an object"}, {"s": 1953.48, "e": 1956.12, "t": "that just fully evaporates and explodes apart."}, {"s": 1956.12, "e": 1959.39, "t": "And when all that energy goes into the hydrogen gas,"}, {"s": 1959.39, "e": 1961.52, "t": "it produces a shock wave, a blast wave"}, {"s": 1961.52, "e": 1962.66, "t": "that comes flying out,"}, {"s": 1962.66, "e": 1964.65, "t": "which is basically the same thing."}, {"s": 1964.65, "e": 1965.57, "t": "If you look up in the night sky,"}, {"s": 1965.57, "e": 1967.25, "t": "there are these like remnant supernovas"}, {"s": 1967.25, "e": 1969.44, "t": "that you can see coming from space."}, {"s": 1969.44, "e": 1971.12, "t": "- [Casper] Using those energy calculations,"}, {"s": 1971.12, "e": 1972.68, "t": "they discovered they needed to flush"}, {"s": 1972.68, "e": 1974.9, "t": "the hydrogen at incredibly high speeds,"}, {"s": 1974.9, "e": 1977.45, "t": "around 360 kilometers per hour."}, {"s": 1977.45, "e": 1979.52, "t": "That's more than a Category 5 hurricane,"}, {"s": 1979.52, "e": 1982.76, "t": "even if, you know, those speeds are at low density."}, {"s": 1982.76, "e": 1984.5, "t": "But 2012 came and went"}, {"s": 1984.5, "e": 1986.9, "t": "and they still didn't have enough power."}, {"s": 1986.9, "e": 1990.41, "t": "In fact, by 2013, ASML just reached 50 watts"}, {"s": 1990.41, "e": 1993.32, "t": "by shooting 50,000 tin droplets per second."}, {"s": 1993.32, "e": 1995.6, "t": "But this increased power came at a price"}, {"s": 1995.6, "e": 1998.33, "t": "because more power means more heat,"}, {"s": 1998.33, "e": 2001.18, "t": "heat that ends up slightly shifting the mirrors,"}, {"s": 2001.18, "e": 2005.11, "t": "resulting in misaligned light and misaligned chip layers."}, {"s": 2005.11, "e": 2007.27, "t": "So Zeiss built a nervous system"}, {"s": 2007.27, "e": 2009.01, "t": "directly into the optics,"}, {"s": 2009.01, "e": 2011.53, "t": "robot-guided sensors that constantly measure"}, {"s": 2011.53, "e": 2014.41, "t": "the exact position and angle of each mirror"}, {"s": 2014.41, "e": 2017.14, "t": "down to the nanometer at the pico-radian,"}, {"s": 2017.14, "e": 2019.57, "t": "which is absolutely insane."}, {"s": 2019.57, "e": 2022.6, "t": "- So how accurate do we need to control this mirror?"}, {"s": 2022.6, "e": 2025.51, "t": "Now one of the things, you can do a thought experiment."}, {"s": 2025.51, "e": 2027.88, "t": "- [Casper] Okay. - And I can place"}, {"s": 2027.88, "e": 2031.66, "t": "a little laser on the side of this mirror."}, {"s": 2031.66, "e": 2033.7, "t": "Then we go all the way to the Moon"}, {"s": 2033.7, "e": 2036.4, "t": "and we put a dime here."}, {"s": 2036.4, "e": 2038.26, "t": "So then this light travels"}, {"s": 2038.26, "e": 2041.29, "t": "all the way here and then with the accuracy,"}, {"s": 2041.29, "e": 2042.88, "t": "I can control this mirror."}, {"s": 2042.88, "e": 2044.53, "t": "- Yes. - I can decide"}, {"s": 2044.53, "e": 2047.83, "t": "whether I point to this side of the dime"}, {"s": 2047.83, "e": 2049.54, "t": "or whether I point. - That's insane."}, {"s": 2049.54, "e": 2050.7, "t": "- To this side of the dime."}, {"s": 2050.7, "e": 2052.93, "t": "- What, that's crazy."}, {"s": 2052.93, "e": 2056.5, "t": "- So you can see that the pointing accuracy is"}, {"s": 2056.5, "e": 2058.58, "t": "that's also in pico-radians."}, {"s": 2059.69, "e": 2061.24, "t": "That is something very extreme."}, {"s": 2062.08, "e": 2063.76, "t": "- This allowed them to control the light"}, {"s": 2063.76, "e": 2066.04, "t": "even when the power increased."}, {"s": 2066.04, "e": 2068.5, "t": "While Zeiss was doing a stellar job with the optics,"}, {"s": 2068.5, "e": 2071.71, "t": "ASML was still struggling with the power source."}, {"s": 2071.71, "e": 2074.8, "t": "The problem was that the tin droplets were too dense,"}, {"s": 2074.8, "e": 2077.62, "t": "meaning that most of the emitted EUV light was"}, {"s": 2077.62, "e": 2079.03, "t": "still getting reabsorbed"}, {"s": 2079.03, "e": 2081.49, "t": "by the neutral atoms before it could ever reach"}, {"s": 2081.49, "e": 2082.57, "t": "the collector mirror."}, {"s": 2082.57, "e": 2084.79, "t": "- The way we blasted the droplet was"}, {"s": 2084.79, "e": 2087.46, "t": "so not enough light, too much debris."}, {"s": 2087.46, "e": 2088.96, "t": "- To make matters worse,"}, {"s": 2088.96, "e": 2091.21, "t": "they could see that about 10 years from now,"}, {"s": 2091.21, "e": 2093.61, "t": "they would need a new generation of machine,"}, {"s": 2093.61, "e": 2095.71, "t": "a high NA EUV machine,"}, {"s": 2095.71, "e": 2098.29, "t": "essentially one with a larger optic system"}, {"s": 2098.29, "e": 2099.91, "t": "that could print smaller features."}, {"s": 2099.91, "e": 2102.07, "t": "So what did they do?"}, {"s": 2102.07, "e": 2104.68, "t": "They decided to double down and invest"}, {"s": 2104.68, "e": 2106.27, "t": "in the next generation"}, {"s": 2106.27, "e": 2108.85, "t": "before they even got the current one to work."}, {"s": 2108.85, "e": 2111.16, "t": "- The most doubtful period was in the beginning."}, {"s": 2111.16, "e": 2114.13, "t": "So I started to work on this in 2012."}, {"s": 2114.13, "e": 2117.08, "t": "By that time, EUV was not working"}, {"s": 2117.08, "e": 2119.11, "t": "and there was this crazy idiot"}, {"s": 2119.11, "e": 2121.22, "t": "working on the next generation"}, {"s": 2122.14, "e": 2123.55, "t": "where we could not even make"}, {"s": 2123.55, "e": 2125.44, "t": "the EUV light in the first place."}, {"s": 2125.44, "e": 2127.69, "t": "- Not only are you all in on EUV,"}, {"s": 2127.69, "e": 2129.34, "t": "you're doubling down even before you know"}, {"s": 2129.34, "e": 2131.53, "t": "if EUV is gonna work. - Yes, yes."}, {"s": 2131.53, "e": 2133.18, "t": "- But to keep funding the development,"}, {"s": 2133.18, "e": 2135.61, "t": "they needed money and lots of it."}, {"s": 2135.61, "e": 2137.74, "t": "So, they turned to the very people who needed"}, {"s": 2137.74, "e": 2138.67, "t": "this technology."}, {"s": 2139.69, "e": 2141.97, "t": "- ASML reached out to its main customers,"}, {"s": 2141.97, "e": 2144.7, "t": "okay, you want this technology"}, {"s": 2144.7, "e": 2146.44, "t": "for the next generation of chips?"}, {"s": 2146.44, "e": 2148.69, "t": "Well, you need to make us able"}, {"s": 2148.69, "e": 2152.11, "t": "to invest more by investing in us."}, {"s": 2152.11, "e": 2155.32, "t": "- Intel invested around $4.1 billion"}, {"s": 2155.32, "e": 2160.06, "t": "and Samsung and TSMC invested another 1.3 billion combined."}, {"s": 2160.06, "e": 2161.95, "t": "So they can keep the research going,"}, {"s": 2161.95, "e": 2164.08, "t": "but with no product to show,"}, {"s": 2164.08, "e": 2166.39, "t": "customers were running out of patience."}, {"s": 2166.39, "e": 2169.54, "t": "- We were crucified at every conference"}, {"s": 2169.54, "e": 2171.55, "t": "that the promises we made last year,"}, {"s": 2171.55, "e": 2173.68, "t": "we were unable to live up to."}, {"s": 2173.68, "e": 2174.62, "t": "- Yeah. - And they said,"}, {"s": 2174.62, "e": 2176.08, "t": "\"This is what you showed two years ago."}, {"s": 2176.08, "e": 2177.31, "t": "This is what you showed last year"}, {"s": 2177.31, "e": 2178.75, "t": "and this is what you're telling me this year."}, {"s": 2178.75, "e": 2180.28, "t": "So why would I believe you?\""}, {"s": 2180.28, "e": 2182.14, "t": "- They were getting desperate."}, {"s": 2182.14, "e": 2187.14, "t": "- But this was, I think, about 2012 or '13,"}, {"s": 2187.18, "e": 2189.7, "t": "we were struggling to get the EUV power up"}, {"s": 2189.7, "e": 2191.2, "t": "and Kinoshita visited us."}, {"s": 2191.2, "e": 2193.57, "t": "I took him to dinner in a small town nearby"}, {"s": 2193.57, "e": 2197.5, "t": "and across from the restaurant was a Maria Chapel."}, {"s": 2197.5, "e": 2199.21, "t": "And now, you know, science,"}, {"s": 2199.21, "e": 2201.46, "t": "we have come to the limits of science."}, {"s": 2201.46, "e": 2203.32, "t": "Hey, let's go for Divine intervention."}, {"s": 2203.32, "e": 2204.88, "t": "So we went to the chapel,"}, {"s": 2204.88, "e": 2209.11, "t": "so Kinoshita just to be safe lit three candles"}, {"s": 2209.11, "e": 2212.17, "t": "for the three suppliers that were pursuing EUV technology"}, {"s": 2212.17, "e": 2213.1, "t": "at the time."}, {"s": 2213.1, "e": 2216.4, "t": "And lo and behold, and I have the data to prove it,"}, {"s": 2216.4, "e": 2218.86, "t": "there is a very strong correlation"}, {"s": 2218.86, "e": 2222.94, "t": "between us lighting the candle and power going up."}, {"s": 2223.96, "e": 2227.5, "t": "It's not a causal effect, but there is a strong correlation."}, {"s": 2227.5, "e": 2230.38, "t": "- The big idea was instead of hitting the droplet once,"}, {"s": 2230.38, "e": 2231.67, "t": "hit it twice."}, {"s": 2231.67, "e": 2234.13, "t": "- [Jos] One shot to hit the droplet"}, {"s": 2234.13, "e": 2236.83, "t": "and it expands in like a pancake shape."}, {"s": 2236.83, "e": 2238.06, "t": "- [Casper] Yep. - And then,"}, {"s": 2238.06, "e": 2239.98, "t": "only then have the second shot,"}, {"s": 2239.98, "e": 2241.99, "t": "the more powerful main pulse"}, {"s": 2241.99, "e": 2243.91, "t": "where you evaporate the pancake"}, {"s": 2243.91, "e": 2245.47, "t": "and turn it into a plasma."}, {"s": 2245.47, "e": 2246.3, "t": "- [Casper] Yeah. - This was"}, {"s": 2246.3, "e": 2247.63, "t": "a major breakthrough."}, {"s": 2247.63, "e": 2248.89, "t": "- [Casper] By changing the target"}, {"s": 2248.89, "e": 2250.48, "t": "from a droplet to a pancake,"}, {"s": 2250.48, "e": 2253.66, "t": "you got a larger surface area for the laser to vaporize,"}, {"s": 2253.66, "e": 2257.17, "t": "but without the cost of adding more debris or neutral atoms"}, {"s": 2257.17, "e": 2260.71, "t": "because now the tin is vaporized all at once."}, {"s": 2260.71, "e": 2263.44, "t": "By 2014, they finally managed to hit"}, {"s": 2263.44, "e": 2265.75, "t": "that coveted 100 watts mark."}, {"s": 2265.75, "e": 2267.58, "t": "But improvements in multi patterning"}, {"s": 2267.58, "e": 2269.41, "t": "with 193 nanometers"}, {"s": 2269.41, "e": 2271.93, "t": "now meant that EUV would only be useful"}, {"s": 2271.93, "e": 2274.21, "t": "if the source reached at least 200 watts"}, {"s": 2274.21, "e": 2276.85, "t": "and made 125 wafers per hour."}, {"s": 2276.85, "e": 2278.55, "t": "- The source went from 100 to 200,"}, {"s": 2278.55, "e": 2281.29, "t": "but as the industry moved on, nobody waits for you."}, {"s": 2281.29, "e": 2283.6, "t": "You know, they find other solutions."}, {"s": 2283.6, "e": 2285.04, "t": "We had to catch up."}, {"s": 2285.04, "e": 2287.05, "t": "So, it was a moving goalpost."}, {"s": 2287.05, "e": 2289.33, "t": "- One of the problems was how do you perfectly time"}, {"s": 2289.33, "e": 2292.18, "t": "the laser so you hit each of these droplets?"}, {"s": 2292.18, "e": 2294.94, "t": "- So the analogy is a bit like a golf ball"}, {"s": 2294.94, "e": 2298.96, "t": "that you need to land in the hole 200 meters away,"}, {"s": 2298.96, "e": 2300.16, "t": "not like land on the green,"}, {"s": 2300.16, "e": 2301.3, "t": "not bouncing and get in the hole,"}, {"s": 2301.3, "e": 2303.64, "t": "but like land in the hole every time."}, {"s": 2303.64, "e": 2305.08, "t": "That's the level of precision that we need"}, {"s": 2305.08, "e": 2306.88, "t": "to deliver the droplets."}, {"s": 2306.88, "e": 2308.05, "t": "Those droplets are traveling"}, {"s": 2308.05, "e": 2310.72, "t": "through this like maelstrom of hydrogen flow."}, {"s": 2310.72, "e": 2312.58, "t": "The speeds are tremendously high,"}, {"s": 2312.58, "e": 2314.5, "t": "like shooting golf balls through a tornado,"}, {"s": 2314.5, "e": 2316.75, "t": "and then right when it lands at the hole,"}, {"s": 2316.75, "e": 2318.61, "t": "that's when it needs to get hit by the laser."}, {"s": 2318.61, "e": 2321.73, "t": "So in order to basically track the droplets for that,"}, {"s": 2321.73, "e": 2324.64, "t": "we use laser curtains and we can sort of look at"}, {"s": 2324.64, "e": 2326.77, "t": "when does the droplet pass through a laser curtain."}, {"s": 2326.77, "e": 2330.22, "t": "Those scattered photons tell us basically when and where is"}, {"s": 2330.22, "e": 2331.05, "t": "the droplet,"}, {"s": 2331.05, "e": 2333.07, "t": "and then importantly tells us when to fire the laser."}, {"s": 2333.07, "e": 2334.87, "t": "So we actually have to take into account"}, {"s": 2334.87, "e": 2337.09, "t": "how long will it take for the light pulse to hit"}, {"s": 2337.09, "e": 2338.89, "t": "the droplet after we send the pulse."}, {"s": 2339.85, "e": 2341.32, "t": "- Now by 2015,"}, {"s": 2341.32, "e": 2343.24, "t": "they were getting closer and closer"}, {"s": 2343.24, "e": 2345.49, "t": "to that coveted 200 watt mark,"}, {"s": 2345.49, "e": 2349.42, "t": "when all of a sudden the ASML board members got summoned."}, {"s": 2349.42, "e": 2352.09, "t": "- This was one of these decisive moments"}, {"s": 2352.09, "e": 2355.36, "t": "where our customers were really thin on patience"}, {"s": 2355.36, "e": 2356.92, "t": "and Martin and all the board members were"}, {"s": 2356.92, "e": 2359.59, "t": "summoned to Korea to show"}, {"s": 2359.59, "e": 2362.56, "t": "200 watt and they were really fed up with it."}, {"s": 2362.56, "e": 2366.46, "t": "You know, you either show it now or you go away."}, {"s": 2366.46, "e": 2368.02, "t": "And when they entered the plane,"}, {"s": 2368.02, "e": 2368.99, "t": "the experiment was still running."}, {"s": 2368.99, "e": 2371.41, "t": "- [Casper] Okay. - When they exited"}, {"s": 2371.41, "e": 2372.73, "t": "the plane,"}, {"s": 2372.73, "e": 2374.88, "t": "they had the first result demonstrating 200 watt."}, {"s": 2374.88, "e": 2376.96, "t": "This is how close we came."}, {"s": 2376.96, "e": 2378.19, "t": "- With the source power up,"}, {"s": 2378.19, "e": 2381.34, "t": "there was one final problem that had to be solved"}, {"s": 2381.34, "e": 2384.31, "t": "before they could begin manufacturing their machine."}, {"s": 2384.31, "e": 2386.35, "t": "See, while the hydrogen gas did protect"}, {"s": 2386.35, "e": 2388.18, "t": "the collector mirror from debris,"}, {"s": 2388.18, "e": 2389.71, "t": "it wasn't perfect."}, {"s": 2389.71, "e": 2391.87, "t": "All the intense, high energy photons"}, {"s": 2391.87, "e": 2394.15, "t": "and hydrogen ions zipping around"}, {"s": 2394.15, "e": 2397.84, "t": "deteriorated a very special top coating on the collector."}, {"s": 2397.84, "e": 2401.26, "t": "So they still had to clean the mirrors every 10 hours,"}, {"s": 2401.26, "e": 2404.05, "t": "which, you know, is terrible for productivity."}, {"s": 2404.05, "e": 2406.33, "t": "Martin van den Brink asked for updates every day"}, {"s": 2406.33, "e": 2407.26, "t": "on their progress."}, {"s": 2407.26, "e": 2409.24, "t": "But then one of the engineers noticed"}, {"s": 2409.24, "e": 2411.67, "t": "that every time they opened up the machine,"}, {"s": 2411.67, "e": 2414.4, "t": "the mirrors suddenly seemed cleaner."}, {"s": 2414.4, "e": 2416.03, "t": "- That he kind of chimed in and said,"}, {"s": 2416.03, "e": 2418.09, "t": "\"Oh, wait a second."}, {"s": 2418.09, "e": 2420.16, "t": "Whenever we opened up the machine,"}, {"s": 2420.16, "e": 2422.8,
